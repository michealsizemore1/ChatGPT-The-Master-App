function formatLeaderValue(athlete,labels){
 if(athlete.displayValue)return String(athlete.displayValue);
 const stats=athlete.stats??[];
 if(!labels||!labels.length)return stats.slice(0,3).join(' · ');
 const parts=[];
 if(stats[0]!=null)parts.push(`${labels[0]??''} ${stats[0]}`.trim());

function standingFor(team){
 const value=(candidate)=>{const own=find(candidate.id)?.competitions?.[0]?.competitors?.find(x=>String(x.team?.id)===candidate.id);const parts=String(own?.records?.[0]?.summary||'0-0-0').split('-').map(Number);const wins=parts[0]||0,losses=parts[1]||0,ties=parts[2]||0,total=wins+losses+ties;return total?((wins+ties*.5)/total)*100000+wins*100-losses:0};

 const c=g.competitions?.[0]||{};
 const st=g.status?.type?.state;
 return `<button class="score-card ${st==='in'?'live':''}" data-score-select="${g.id}"><div class="score-meta"><span>${st==='in'?'LIVE':st==='post'?'FINAL':esc(day(g.date))}</span><small>${esc(c.broadcasts?.[0]?.names?.[0]||g.status?.type?.shortDetail||'')}</small></div>${(c.competitors||[]).map(t=>`<div><b>${esc(t.team?.abbreviation||'')}</b><strong>${st==='pre'?'—':esc(t.score)}</strong></div>`).join('')}<small class="game-status">${st==='pre'?`${esc(mt(g.date))} MT`:esc(g.status?.type?.shortDetail||'')}</small></button>`;
}
const gameStateOrder={in:0,post:1,pre:2};
function renderScoreStrip(){
 const sorted=[...state.games].sort((a,b)=>(gameStateOrder[a.status?.type?.state]??3)-(gameStateOrder[b.status?.type?.state]??3)||new Date(a.date)-new Date(b.date));
 return `<section class="score-strip" id="scores">${sorted.map(renderScore).join('')}</section>`;
}
function renderHero(){
 return `<section class="hero"><div><p class="eyebrow">ALL 32 TEAMS · LIVE WEEKLY DATA</p><h1>The whole NFL.<br><em>One dashboard.</em></h1><p class="lede">Scores, schedules, Mountain Time kickoffs, networks, round logos, completed-game statistics, scoring checks, player leaders and highlights.</p></div></section>`;
}
function renderLiveCenter(){
 if(!state.selectedGameId&&!state.detailsLoading)return '';
 const d=state.gameDetails;
 const leadersFor=(teamId)=>(d?.leaders??[]).filter(l=>l.teamId===String(teamId));
 const leadersColumn=(t)=>{
  const items=leadersFor(t.team?.id);
  const body=items.length?items.map(l=>`<div class="live-leader-row"><span><small>${esc(l.category)}</small>${esc(l.name)}</span><b>${esc(l.value)}</b></div>`).join(''):'<p class="live-leaders-empty">Player leaders have not been posted by the provider.</p>';
  return `<div><p class="live-leaders-head">${esc(t.team?.abbreviation)} LEADERS</p>${body}</div>`;
 };
 return `<section class="live-center" aria-live="polite"><div class="live-center-head"><div><p class="eyebrow">LIVE GAME CENTER</p><h2>${state.detailsLoading?'Loading game statistics…':esc(d?.headline||'Game details unavailable')}</h2></div><button data-close-live>Close &times;</button></div>${d?`${d.drive?renderDriveTracker(d,{status:d.headline}):`<div class="live-matchup">${d.teams.map(t=>`<div><span style="background:#${t.team?.color||'333'}">${esc((t.team?.abbreviation||'?')[0])}</span><b>${esc(t.team?.displayName||t.team?.shortDisplayName||'')}${String(t.team?.id)===d.possessionTeamId?' <span class="poss-icon" title="Has the ball">&#127944;</span>':''}</b><strong>${esc(t.score)}</strong></div>`).join('')}</div>`}${d.lastPlay?`<p class="last-play"><b>LATEST:</b> ${esc(d.lastPlay)}</p>`:''}<div class="boxscore"><div class="boxscore-head"><span>TEAM STAT</span><b>${esc(d.teams[0]?.team?.abbreviation)}</b><b>${esc(d.teams[1]?.team?.abbreviation)}</b></div>${d.stats.length?d.stats.map(stat=>`<div><span>${esc(stat.name)}</span><b>${esc(stat.away)}</b><b>${esc(stat.home)}</b></div>`).join(''):'<p>Detailed team statistics will populate after the game begins.</p>'}</div><div class="live-leaders"><div class="live-leaders-grid">${d.teams.map(leadersColumn).join('')}</div></div>${renderHighlights(d.highlights)}`:''}</section>`;
}
function renderTeamRow(t){
 const g=find(t.id);
 const standing=standingFor(t);
 const c=g?.competitions?.[0]||{};
 const own=c.competitors?.find(x=>String(x.team?.id)===t.id);
 const opp=c.competitors?.find(x=>String(x.team?.id)!==t.id);
 const st=g?.status?.type?.state;
 const network=c.broadcasts?.[0]?.names?.[0]||'TV TBD';
 const weekly=!g?'NO GAME THIS WEEK':st==='pre'?`${thisWeek(g.date)?'THIS WEEK':'NEXT GAME'} · ${own?.homeAway==='away'?'AT':'VS'} ${opp?.team?.abbreviation} · ${mt(g.date)} MT · ${network}`:`${own?.score}–${opp?.score} ${st==='post'?'FINAL':'LIVE'}`;
 const expanded=state.open===t.abbr;
 const scoreCol=g?(st==='pre'?`vs ${esc(opp?.team?.abbreviation||'')}`:`${esc(own?.score)}–${esc(opp?.score)}`):'—';
 const timeCol=g&&st==='pre'?`${esc(mt(g.date))} MT`:esc(g?.status?.type?.shortDetail||'—');
 const row=`<button class="team-row" data-team-click="${t.abbr}"><b class="standing-ranks"><small>NFL</small><span>${esc(standing.league)}</span></b><span class="team-name"><i class="team-logo"><span>${esc(t.abbr)}</span><img class="espn-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png" alt="${esc(t.name)} logo"></i><span><strong>${esc(t.name)}</strong><small>${esc(t.abbr)} · ${esc(t.division)}</small><small class="weekly-score">${esc(weekly)}</small></span></span><span>${scoreCol}</span><strong>${timeCol}</strong><span class="schedule-cta">${esc(c.broadcasts?.[0]?.names?.[0]||'View')} ${expanded?'↑':'↓'}</span></button>`;
 const schedule=expanded?renderSchedule(t):'';
 return `<div class="team-entry">${row}${schedule}</div>`;
}
function renderTeamsSection(){
 const list=visibleTeams();
 const rows=list.map((t,i)=>{
  const heading=(state.sort==='division'&&(i===0||list[i-1].division!==t.division))?`<div class="division-heading">${esc(t.division)}</div>`:'';
  return heading+renderTeamRow(t);
 }).join('');
 return `<section class="panel" id="teams">
  <div class="panel-title"><div><p class="eyebrow">LEAGUE DIRECTORY</p><h2>NFL teams</h2></div>
   <div class="team-controls">
    <select class="team-sort" id="sort-select" aria-label="Sort NFL teams">
     <option value="division" ${state.sort==='division'?'selected':''}>Division</option>
     <option value="alphabetical" ${state.sort==='alphabetical'?'selected':''}>Alphabetical</option>
     <option value="record" ${state.sort==='record'?'selected':''}>Record</option>
     <option value="kickoff" ${state.sort==='kickoff'?'selected':''}>Next kickoff</option>
     <option value="status" ${state.sort==='status'?'selected':''}>Live/Final first</option>
    </select>
    <label class="team-search">&#8981; <input id="team-search-input" value="${esc(state.query)}" placeholder="Search teams"></label>
   </div>
  </div>
  <div class="table-head"><span>#</span><span>TEAM</span><span>WEEK</span><span>TIME</span><span>TV</span></div>
  ${rows}
 </section>`;
}
function renderScheduleGame(g,t){
 const preseason=new Date(g.date).getMonth()===7;
 const isOpen=state.openGame===g.id;
 return `<div class="schedule-game-wrap"><button class="schedule-game" data-game-id="${g.id}" data-team-abbr="${t.abbr}"><time>${esc(day(g.date))}</time><span>${esc(g.venue)} <b>${esc(g.opponent)}</b><em class="season-label">${preseason?'PRESEASON':'REGULAR SEASON'}</em></span><small>${esc(mt(g.date))} MT · ${esc(g.network||g.status)} ${isOpen?'↑':'↓'}</small></button>${isOpen?renderGameDetailPanel(g):''}</div>`;
}
function renderSchedule(t){
 const games=state.schedules[t.abbr]??[];
 const loading=state.loading===t.abbr;
 const view=state.scheduleViewCurrent||'all';
 const filtered=games.filter(g=>view==='all'||(view==='preseason'?new Date(g.date).getMonth()===7:new Date(g.date).getMonth()!==7));
 const gamesHtml=filtered.map(g=>renderScheduleGame(g,t)).join('');
 return `<div class="schedule-panel">
  <div class="schedule-head"><b>2026 SCHEDULE</b><small>${loading?'LOADING…':`${games.length} GAMES`}</small></div>
  <div class="season-tabs">
   <button class="${view==='all'?'active':''}" data-schedule-view="all">All</button>
   <button class="${view==='preseason'?'active':''}" data-schedule-view="preseason">Preseason</button>
   <button class="${view==='regular'?'active':''}" data-schedule-view="regular">Regular season</button>
  </div>
  ${gamesHtml}
 </div>`;
}
function renderGameDetailPanel(g){
 if(g.state==='pre'){
  return `<div class="legacy-game-panel"><p class="schedule-message"><b>${esc(g.status)}</b> · ${esc(mt(g.date))} MT${g.network?` · ${esc(g.network)}`:''}<br>Game statistics will appear after completion.</p></div>`;
 }
 if(state.loading===g.id){
  return `<div class="legacy-game-panel"><p class="schedule-message">${g.state==='in'?'Loading live game statistics…':'Loading completed-game statistics…'}</p></div>`;
 }
 const d=state.details[g.id];
 if(!d){
  return `<div class="legacy-game-panel"><p class="schedule-message">${g.state==='in'?'Live statistics have not been posted yet.':'Statistics are not available yet.'}</p></div>`;
 }
 return `<div class="legacy-game-panel">${renderArchive(d,g)}</div>`;
}
function renderDriveTracker(d,g){
 if(!d.drive||!d.drive.situation)return '';
 const sit=d.drive.situation;
 const offenseTeam=d.teams.find(t=>String(t.team?.id)===sit.offenseTeamId);
 const defenseTeam=d.teams.find(t=>String(t.team?.id)!==sit.offenseTeamId);
 const homeTeam=d.teams.find(t=>t.homeAway==='home');
 const awayTeam=d.teams.find(t=>t.homeAway==='away');
 const yardsToGo=sit.yardsToEndzone??50;
 const ballPct=Math.max(2,Math.min(98,100-yardsToGo));
 const firstDownPct=Math.max(2,Math.min(98,ballPct+(sit.distance||0)));
 const startYardsToGo=sit.startYardsToEndzone??yardsToGo;
 const startPct=Math.max(2,Math.min(98,100-startYardsToGo));
 const isRedZone=yardsToGo<=20;
 const participantsHtml=(sit.participants||[]).filter(p=>p.name).map(p=>`<div class="play-participant">${p.headshot?`<img class="player-headshot" src="${esc(p.headshot)}" alt="">`:'<div class="participant-placeholder"></div>'}<span><b>${esc(p.name)}</b><small>${[p.position,p.jersey?`#${p.jersey}`:''].filter(Boolean).map(esc).join(' · ')}</small></span></div>`).join('');
 const wp=d.drive.winProb;
 let winProbHtml='';
 if(wp){
  const homePct=Math.round(wp.home*1000)/10;
  const awayPct=Math.round((1-wp.home-(wp.tie||0))*1000)/10;
  winProbHtml=`<div class="win-prob"><div class="win-prob-bar"><div class="wp-fill" style="width:${awayPct}%;background:#${awayTeam?.team?.color||'666'}"></div><div class="wp-fill" style="width:${homePct}%;background:#${homeTeam?.team?.color||'333'}"></div></div><div class="win-prob-labels"><span>${esc(awayTeam?.team?.abbreviation)} ${awayPct}%</span><span>WIN PROBABILITY</span><span>${esc(homeTeam?.team?.abbreviation)} ${homePct}%</span></div></div>`;
 }
 const timeoutDots=(count)=>count==null?'':`<div class="dt-timeouts">${[0,1,2].map(i=>`<span class="dt-timeout-dot${i<count?'':' used'}"></span>`).join('')}</div>`;
 const teamBlock=(t,timeouts,align)=>{
  const logo=t?.team?.logo||d.drive.logoFor?.(t?.team?.id)||'';
  return `<div class="dt-team ${align}">${logo?`<img class="espn-logo dt-team-logo" src="${esc(logo)}" alt="">`:''}<div class="dt-team-meta"><div class="dt-team-score-row">${t&&String(t.team?.id)===sit.offenseTeamId?'<span class="poss-icon" title="Has the ball">&#127944;</span>':''}<span class="dt-team-score">${esc(t?.score??'—')}</span></div><span class="dt-team-sub">${esc(d.drive.recordFor?.(t?.team?.id)??'')}</span>${timeoutDots(timeouts)}</div></div>`;
 };
 const arrowLeft=Math.min(startPct,ballPct);
 const arrowWidth=Math.max(1,Math.abs(ballPct-startPct));
 const arrowReversed=ballPct<startPct;
 const yardMarks=[10,20,30,40,50,40,30,20,10].map((n,i)=>`<span class="yard-label" style="left:${(i+1)*10}%">${n}</span>`).join('');
 return `<div class="drive-tracker"><div class="drive-tracker-head"><span>${isRedZone?'RED ZONE':'LIVE DRIVE'}</span>${d.drive.description?`<small>${esc(d.drive.description)}</small>`:''}</div>
  <div class="dt-scorebar">
   ${teamBlock(awayTeam,d.drive.awayTimeouts,'away')}
   <div class="dt-center"><div class="dt-clock">${esc(d.drive.clockText||g.status||'')}</div>${sit.shortDownDistanceText||sit.downDistanceText?`<div class="dt-downdistance">${esc(sit.shortDownDistanceText||sit.downDistanceText)}</div>`:''}${sit.possessionText?`<div class="dt-yardline">on the ${esc(sit.possessionText)}</div>`:''}</div>
   ${teamBlock(homeTeam,d.drive.homeTimeouts,'home')}
  </div>
  <div class="field-bar"><div class="field-endzone" style="background:#${offenseTeam?.team?.color||'333'}"><span>${esc(offenseTeam?.team?.abbreviation||'')}</span></div><div class="field-track">${yardMarks}<div class="drive-progress" style="left:${arrowLeft}%;width:${arrowWidth}%"><span class="drive-progress-arrow ${arrowReversed?'reversed':''}"></span></div><div class="first-down-marker" style="left:${firstDownPct}%"></div><div class="ball-marker" style="left:${ballPct}%">&#127944;</div></div><div class="field-endzone" style="background:#${defenseTeam?.team?.color||'333'}"><span>${esc(defenseTeam?.team?.abbreviation||'')}</span></div></div>
  ${sit.downDistanceText?`<p class="down-distance">${esc(sit.downDistanceText)}</p>`:''}
  ${sit.text?`<p class="last-play-detail">${esc(sit.text)}</p>`:''}
  ${participantsHtml?`<div class="play-participants">${participantsHtml}</div>`:''}
  ${winProbHtml}
 </div>`;
}
function renderArchive(d,g){
 const teamArchives=d.teams.map((t,n)=>{
  const stats=d.stats.map(s=>`<div><span>${esc(s.name)}</span><b>${n?esc(s.home):esc(s.away)}</b></div>`).join('');
  const scoringRows=['Touchdowns','Field goals','Extra points','2-point conversions','Safeties'].map((x,i)=>`<div><span>${x}</span><b>${d.scoring[n]?.[i]||0}</b></div>`).join('');
  const checkRow=`<div><span>Scoring check</span><b>${g.state==='in'?'● Live — game in progress':(d.verified[n]?'✓ Matches':'⚠ Review')}</b></div>`;
  const leaders=d.leaders.filter(x=>x.teamId===String(t.team?.id));
  const leadersHtml=leaders.length?leaders.map(x=>`<div><span><small>${esc(x.category)}</small>${esc(x.name)}</span><b>${esc(x.value)}</b></div>`).join(''):'<small class="leaders-pending">Player leaders have not been posted by the provider.</small>';
  return `<section class="team-archive"><header><span><small>${t.homeAway==='home'?'HOME TEAM':'AWAY TEAM'}</small><b>${esc(t.team?.displayName)}</b></span><strong>${esc(t.score)}</strong></header><div class="team-stat-list">${stats}${scoringRows}${checkRow}</div><div class="team-leaders"><p>PLAYER LEADERS</p>${leadersHtml}</div></section>`;
 }).join('');
 const lastPlay=d.lastPlay?`<p class="last-play"><b>LAST PLAY:</b> ${esc(d.lastPlay)}</p>`:'';
 return `${g.state==='in'?renderDriveTracker(d,g):''}<p class="archive-label">${g.state==='in'?'LIVE STATS':'GAME ARCHIVE'} · ${esc(d.headline)}</p><div class="team-archive-grid">${teamArchives}</div>${renderHighlights(d.highlights)}${lastPlay}`;
}
function renderHighlights(highlights){
 if(!highlights||!highlights.length)return '';
 return `<div class="highlights"><p class="archive-label">GAME HIGHLIGHTS</p><div class="highlights-grid">${highlights.map(item=>`<figure class="highlight-clip"><video controls preload="metadata" playsinline ${item.thumbnail?`poster="${esc(item.thumbnail)}"`:''}><source src="${esc(item.src)}" type="video/mp4"></video><figcaption>${esc(item.headline)}</figcaption></figure>`).join('')}</div></div>`;
}
function renderMetrics(){
 const list=state.metricView==='team'?teamMetrics:playerMetrics;
 const items=list.map((m,i)=>`<article class="metric-item"><span>${String(i+1).padStart(2,'0')}</span><div><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p><small class="metric-feed">Waiting for season statistics</small></div></article>`).join('');
 return `<section class="panel metrics-section" id="standings">
  <div class="panel-title"><div><p class="eyebrow">THE STAT BOARD</p><h2>Essential metrics</h2></div><div class="metric-tabs"><button class="${state.metricView==='team'?'active':''}" data-metric-view="team">Team</button><button class="${state.metricView==='player'?'active':''}" data-metric-view="player">Player</button></div></div>
  <p class="metrics-intro">Live season values refresh automatically as games are completed. A dash means the provider has not posted that metric yet.</p>
  <div class="metrics-grid">${items}</div>
 </section>`;
}
function renderNews(){
 return `<section class="panel news"><div class="panel-title"><div><p class="eyebrow">FIELD NOTES</p><h2>Top stories</h2></div></div>${nflStories.map((s,i)=>`<article class="story"><b>${String(i+1).padStart(2,'0')}</b><span><small>${esc(s[0])}</small><strong>${esc(s[1])}</strong></span></article>`).join('')}</section>`;
}
function renderPlayoff(){
 return `<section class="panel playoff-panel" id="playoffs"><div class="panel-title"><h2>Playoff race</h2></div><p>Standings and playoff positions will update automatically as the season progresses.</p></section>`;
}
function render(){
 document.getElementById('app').innerHTML=`
  ${renderTopbar()}
  ${renderScoreStrip()}
  <div class="page">
   ${renderHero()}
   ${renderLiveCenter()}
   ${renderTeamsSection()}
   ${renderMetrics()}
   ${renderNews()}
   ${renderPlayoff()}
   <footer><span>NFL</span><p>All displayed times are Mountain Time.</p><small>My Life Master App</small></footer>
  </div>
 `;
}

document.getElementById('app').addEventListener('click',e=>{
 const scrollBtn=e.target.closest('[data-scroll-to]');
 if(scrollBtn){document.getElementById(scrollBtn.dataset.scrollTo)?.scrollIntoView({behavior:'smooth'});return}
 const closeLiveBtn=e.target.closest('[data-close-live]');
 if(closeLiveBtn){state.selectedGameId=null;state.gameDetails=null;render();return}
 const scoreSelectBtn=e.target.closest('[data-score-select]');
 if(scoreSelectBtn){state.selectedGameId=scoreSelectBtn.dataset.scoreSelect;loadGameDetails();return}
 const teamBtn=e.target.closest('[data-team-click]');
 if(teamBtn){teamClick(teamBtn.dataset.teamClick);return}
 const scheduleViewBtn=e.target.closest('[data-schedule-view]');
 if(scheduleViewBtn){state.scheduleViewCurrent=scheduleViewBtn.dataset.scheduleView;render();return}
 const gameBtn=e.target.closest('[data-game-id]');
 if(gameBtn){
  const abbr=gameBtn.dataset.teamAbbr;
  const game=(state.schedules[abbr]||[]).find(g=>g.id===gameBtn.dataset.gameId);
  if(game)gameClick(game,abbr);
  return;
 }
 const metricBtn=e.target.closest('[data-metric-view]');
 if(metricBtn){state.metricView=metricBtn.dataset.metricView;render();return}
});
document.getElementById('app').addEventListener('input',e=>{
 if(e.target.id==='team-search-input'){
  const pos=e.target.selectionStart;
  state.query=e.target.value;
  render();
  const el=document.getElementById('team-search-input');
  if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}
 }
});
document.getElementById('app').addEventListener('change',e=>{
 if(e.target.id==='sort-select'){state.sort=e.target.value;render()}
});
document.addEventListener('error',e=>{
 if(e.target&&e.target.classList&&(e.target.classList.contains('espn-logo')||e.target.classList.contains('player-headshot')))e.target.style.display='none';
},true);

render();
loadScores();
setInterval(loadScores,120000);
setInterval(livePollTick,90000);
setInterval(()=>{if(state.selectedGameId)loadGameDetails()},120000);
</script>
</body>
</html>

const normalizeGame=(event)=>{
 const competition=event.competitions?.[0]??{};
 const competitors=[...(competition.competitors??[])].sort((a,b)=>a.homeAway==='away'?-1:b.homeAway==='away'?1:0);
 return {id:event.id,date:event.date,status:event.status?.type?.shortDetail??'Scheduled',state:event.status?.type?.state??'pre',network:competition.broadcasts?.[0]?.names?.[0]??'',teams:competitors.map((entry)=>({id:entry.team?.id,name:entry.team?.shortDisplayName??entry.team?.displayName,abbr:entry.team?.abbreviation??'',rank:entry.curatedRank?.current<99?entry.curatedRank.current:undefined,score:String(entry.score?.displayValue??entry.score?.value??entry.score??'0'),color:`#${entry.team?.color??'10231d'}`,logo:entry.team?.logo,homeAway:entry.homeAway,record:entry.records?.find((record)=>record.type==='total'||record.name==='overall')?.summary}))};
};
const normalizeScheduleGame=(event,team)=>{
 const competition=event.competitions?.[0]??{};
 const own=competition.competitors?.find((entry)=>String(entry.team?.id)===team.espnId);
 const opponent=competition.competitors?.find((entry)=>String(entry.team?.id)!==team.espnId);
 const gameStatus=competition.status??event.status;
 const providerState=gameStatus?.type?.state??'pre';
 const hasPostedScore=(competition.competitors??[]).some((entry)=>Number(entry.score?.value??entry.score)>0);
 const inferredComplete=providerState==='post'||(hasPostedScore&&new Date(event.date).getTime()<Date.now());
 return {id:String(event.id),date:event.date,opponent:opponent?.team?.shortDisplayName??'Opponent TBD',venue:own?.homeAway==='away'?'at':'vs',neutral:Boolean(competition.neutralSite),state:inferredComplete?'post':providerState,status:inferredComplete?'Final':gameStatus?.type?.shortDetail??'Scheduled',network:competition.broadcasts?.[0]?.names?.[0]??competition.broadcasts?.[0]?.media?.shortName??'',ownScore:String(own?.score?.displayValue??own?.score?.value??own?.score??'—'),opponentScore:String(opponent?.score?.displayValue??opponent?.score?.value??opponent?.score??'—')};
};

function currentRecords(){const result={};state.weeklyGames.forEach(game=>game.teams.forEach(team=>{if(team.record)result[team.id]=team.record.replace('-','–')}));return result}
function metricSummary(name){const hint=name.toLowerCase().split(' ')[0];const rows=Object.entries(state.metricValues).map(([abbr,values])=>{const match=Object.entries(values).find(([key])=>key.includes(hint));return match?`${abbr} ${match[1]}`:null}).filter(Boolean).slice(0,3);return rows.length?rows.join(' · '):'Waiting for season statistics'}

async function loadScores(){

  const response=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=100',{cache:'no-store'});
  if(!response.ok)throw new Error('Scores unavailable');

  state.liveGames=games;state.liveError=false;state.lastUpdated=new Date();
 }catch{state.liveError=true}

}

async function loadWeek(){

 const stamp=(date)=>`${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
 try{
  const dates=`${stamp(start)}-${stamp(end)}`;
  const response=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=200&dates=${dates}`,{cache:'no-store'});

}

async function loadTeamStats(){

   if(direct.ok){
    const data=await direct.json();const stats=data.results??data.statistics??data.stats??[];const values={};
    (Array.isArray(stats)?stats:Object.values(stats).flat()).forEach(stat=>{const value=stat.displayValue??stat.value??stat.perGame??stat.percentage;if(value!=null)values[String(stat.name??stat.label??'').toLowerCase()]=String(value)});
    if(Object.keys(values).length)return [team.abbr,values];
   }
   const completed=state.liveGames.find(game=>game.state==='post'&&game.teams.some(entry=>entry.id===team.espnId));
   if(completed){
    const summary=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=${completed.id}`,{cache:'no-store'});
    if(summary.ok){
     const data=await summary.json();const values={};
     (data.boxscore?.teams??[]).filter(entry=>entry.team?.id===team.espnId).flatMap(entry=>entry.statistics??[]).forEach(stat=>{const value=stat.displayValue??stat.value;if(value!=null)values[String(stat.name??stat.label??'').toLowerCase()]=String(value)});
     if(Object.keys(values).length)return [team.abbr,values];
    }
   }

  }catch{return null}
 }));
 state.metricValues=Object.fromEntries(entries.filter(Boolean));

async function toggleGame(game,teamAbbr,force=false,silent=false){
 if(!force&&state.expandedGameId===game.id){state.expandedGameId=null;render();return}
 state.expandedGameId=game.id;
 if(game.state==='pre'){state.legacyLoading=null;render();return}
 if(state.legacyDetails[game.id]&&!force&&game.state!=='in'){render();return}
 if(!silent)state.legacyLoading=game.id;
 render();
 try{
  const response=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=${encodeURIComponent(game.id)}`,{cache:'no-store'});
  if(!response.ok)throw new Error('Unavailable');
  const data=await response.json();const boxTeams=data.boxscore?.teams??[];const normalizedTeams=normalizeGame(data.header).teams;const rows=new Map();
  boxTeams.forEach(boxTeam=>{const index=normalizedTeams.findIndex(team=>team.id===boxTeam.team?.id);(boxTeam.statistics??[]).forEach(stat=>{const row=rows.get(stat.name)??{name:stat.label??stat.name,away:'—',home:'—'};if(index===0)row.away=stat.displayValue??'—';if(index===1)row.home=stat.displayValue??'—';rows.set(stat.name,row)})});
  const touchdowns=[0,0],fieldGoals=[0,0],extraPoints=[0,0],twoPointConversions=[0,0],safeties=[0,0];const seenPlays=new Set();
  [...(data.scoringPlays??[]),...(data.plays??[])].forEach(play=>{const playKey=String(play.id??`${play.clock?.displayValue}-${play.text}`);if(seenPlays.has(playKey))return;seenPlays.add(playKey);const teamId=String(play.team?.id??play.team?.uid?.split('~').pop()??'');const index=normalizedTeams.findIndex(entry=>entry.id===teamId);if(index<0)return;const text=String(play.text??play.type?.text??'').toLowerCase();if(text.includes('touchdown'))touchdowns[index]++;if(text.includes('field goal')&&!text.includes('missed'))fieldGoals[index]++});
  normalizedTeams.forEach((team,index)=>{if(touchdowns[index]===0&&fieldGoals[index]===0){const points=Number(team.score)||0;fieldGoals[index]=points%7===3?1:0;touchdowns[index]=Math.max(0,Math.floor((points-fieldGoals[index]*3)/7))}});
  const scoringTotal=(index)=>touchdowns[index]*6+fieldGoals[index]*3+extraPoints[index]+twoPointConversions[index]*2+safeties[index]*2;
  const scoringSource=game.state==='in'?'ESPN (live)':'ESPN';
  const scoringVerified=normalizedTeams.map((team,index)=>scoringTotal(index)===(Number(team.score)||0));
  const leaders=[];(data.boxscore?.players??[]).forEach(teamBlock=>{const teamId=String(teamBlock.team?.id??'');(teamBlock.statistics??[]).slice(0,4).forEach(category=>{const athlete=(category.athletes??[])[0];if(!athlete)return;const stats=athlete.stats??[];leaders.push({teamId,category:category.displayName??category.name??'Leader',name:athlete.athlete?.displayName??athlete.athlete?.shortName??'Team leader',value:String(athlete.displayValue??stats.slice(0,3).join(' · ')??'—')})})});
  const important=/first down|third down|fourth down|total yards|passing|comp|yards per pass|rushing|turnover|sack|penalt|red zone|possession/i;
  const stats=[...rows.values()].filter(stat=>important.test(stat.name)).slice(0,14);
  const highlights=(data.videos??[]).slice(0,3).map(video=>({headline:String(video.headline??video.title??'Official game highlights'),url:String(video.links?.web?.href??video.links?.self?.href??'')})).filter(video=>video.url);
  const lastPlay=[highlights.length?`HIGHLIGHTS AVAILABLE: ${highlights.map(item=>`${item.headline} — ${item.url}`).join(' · ')}`:'',data.plays?.at?.(-1)?.text].filter(Boolean).join(' | ');
  state.legacyDetails[game.id]={headline:data.header?.competitions?.[0]?.status?.type?.detail??'Final',teams:normalizedTeams,stats:stats.length?stats:[...rows.values()].slice(0,8),touchdowns,fieldGoals,extraPoints,twoPointConversions,safeties,scoringVerified,scoringSource,highlights,leaders,lastPlay};
 }catch{}
 if(!silent)state.legacyLoading=null;
 render();
}

 if(!state.selectedGameId&&!state.detailsLoading)return '';
 const d=state.gameDetails;
 return `<section class="live-center" aria-live="polite"><div class="live-center-head"><div><p class="eyebrow">LIVE GAME CENTER</p><h2>${state.detailsLoading?'Loading game statistics…':esc(d?.headline||'Game details unavailable')}</h2></div><button data-close-live>Close &times;</button></div>${d?`<div class="live-matchup">${d.teams.map(team=>`<div><span style="background:${team.color}">${team.logo?`<img class="espn-logo" src="${esc(team.logo)}" alt="">`:esc((team.abbr||'?')[0])}</span><b>${team.rank?`#${team.rank} `:''}${esc(team.name)}</b><strong>${esc(team.score)}</strong></div>`).join('')}</div>${d.lastPlay?`<p class="last-play"><b>LATEST:</b> ${esc(d.lastPlay)}</p>`:''}<div class="boxscore"><div class="boxscore-head"><span>TEAM STAT</span><b>${esc(d.teams[0]?.abbr)}</b><b>${esc(d.teams[1]?.abbr)}</b></div>${d.stats.length?d.stats.map(stat=>`<div><span>${esc(stat.name)}</span><b>${esc(stat.away)}</b><b>${esc(stat.home)}</b></div>`).join(''):'<p>Detailed team statistics will populate after the game begins.</p>'}</div>`:''}</section>`;
}
function renderLegacyGamePanel(game,t){
 if(game.state==='pre'){
  return `<div class="legacy-game-panel"><p class="schedule-message"><b>${esc(game.status)}</b> · ${esc(mountainTime(new Date(game.date)))} MT${game.network?` · ${esc(game.network)}`:''}<br>Game statistics will appear once the game starts.</p></div>`;
 }
 if(state.legacyLoading===game.id){
  return `<div class="legacy-game-panel"><p class="schedule-message">${game.state==='in'?'Loading live game statistics…':'Loading archived game statistics…'}</p></div>`;
 }
 const d=state.legacyDetails[game.id];
 if(!d){
  return `<div class="legacy-game-panel"><p class="schedule-message">${game.state==='in'?'Live statistics have not been posted yet.':'No archived statistics are available for this game yet.'}</p></div>`;
 }
 const teamArchives=d.teams.map((team,index)=>{
  const stats=d.stats.map(stat=>`<div><span>${esc(stat.name)}</span><b>${index===0?esc(stat.away):esc(stat.home)}</b></div>`).join('');
  const extra=[
   d.touchdowns?`<div><span>Touchdowns</span><b>${d.touchdowns[index]}</b></div>`:'',
   d.fieldGoals?`<div><span>Field goals</span><b>${d.fieldGoals[index]}</b></div>`:'',
   d.extraPoints?`<div><span>Extra points</span><b>${d.extraPoints[index]}</b></div>`:'',
   d.twoPointConversions?`<div><span>2-point conversions</span><b>${d.twoPointConversions[index]}</b></div>`:'',
   d.safeties?`<div><span>Safeties</span><b>${d.safeties[index]}</b></div>`:'',
   `<div><span>Scoring check</span><b>${game.state==='in'?'● Live — game in progress':(d.scoringVerified?.[index]?'✓ Matches':'⚠ Review')}</b></div>`
  ].join('');
  const leaders=(d.leaders??[]).filter(l=>l.teamId===team.id);
  const leadersHtml=leaders.length?leaders.map(l=>`<div><span><small>${esc(l.category)}</small>${esc(l.name)}</span><b>${esc(l.value)}</b></div>`).join(''):'<small class="leaders-pending">Player leaders have not been posted by the provider.</small>';
  return `<section class="team-archive"><header><span><small>${team.id===t.espnId?'SELECTED TEAM':'OPPONENT'}</small><b>${esc(team.name)}</b></span><strong>${esc(team.score)}</strong></header><div class="team-stat-list">${stats}${extra}</div><div class="team-leaders"><p>PLAYER LEADERS</p>${leadersHtml}</div></section>`;
 }).join('');
 return `<div class="legacy-game-panel"><p class="archive-label">${game.state==='in'?'LIVE STATS':'GAME ARCHIVE'} · ${esc(d.headline)}</p><div class="team-archive-grid">${teamArchives}</div><p class="archive-label">SCORING SOURCE · ${esc(d.scoringSource??'ESPN')}</p>${d.lastPlay?`<p class="last-play"><b>LAST PLAY:</b> ${esc(d.lastPlay)}</p>`:''}</div>`;
}
function renderScheduleGame(game,t){
 const isExpanded=state.expandedGameId===game.id;
 const detail=isExpanded?renderLegacyGamePanel(game,t):'';
 return `<div class="schedule-game-wrap"><button class="schedule-game" data-game-id="${game.id}" data-team-abbr="${t.abbr}" aria-expanded="${isExpanded}"><time datetime="${game.date}">${esc(new Date(game.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}))}</time><span>${game.neutral?'vs':game.venue} <b>${esc(game.opponent)}</b></span><small>${esc(mountainTime(new Date(game.date)))} MT · ${isExpanded?'Close':game.state==='post'?'Stats':'Details'} ${isExpanded?'↑':'↓'}</small></button>${detail}</div>`;
}
function renderSchedulePanel(t){
 const games=state.schedules[t.abbr]??[];
 const loading=state.scheduleLoading===t.abbr;
 const errored=state.scheduleError===t.abbr;
 const gamesHtml=loading?'<p class="schedule-message">Loading the latest schedule…</p>':errored?'<p class="schedule-message">Schedule could not be loaded. Close and try again.</p>':games.map(game=>renderScheduleGame(game,t)).join('');
 return `<div class="schedule-panel" id="schedule-${t.abbr}"><div class="schedule-head"><span><b>${esc(t.name)}</b> · 2026 SCHEDULE</span><small>${loading?'LOADING…':`${games.length} GAMES`}</small></div>${gamesHtml}</div>`;
}
function renderRankings(){
 const filtered=filteredTeams();
 const weekly=weeklyScores();
 const records=currentRecords();
 const rows=filtered.map((t,i)=>{
  const confHeading=(i===0||conferenceOf(filtered[i-1])!==conferenceOf(t))?`<div class="conference-heading">${esc(conferenceOf(t))}</div>`:'';
  const isExpanded=state.expanded===t.abbr;
  const schedulePanel=isExpanded?renderSchedulePanel(t):'';
  return `<div class="team-entry">${confHeading}
   <button data-team-toggle="${t.abbr}" aria-expanded="${isExpanded}" aria-controls="schedule-${t.abbr}" class="team-row ${state.selected===t.abbr?'selected':''}">
    <b>${t.rank}</b>
    <span class="team-name"><i class="team-logo" style="background:${t.color}"><span>${esc(t.abbr)}</span><img class="espn-logo" src="https://a.espncdn.com/i/teamlogos/ncaa/500/${t.espnId}.png" alt="${esc(t.name)} logo"></i><span><strong>${esc(t.name)}</strong><small>${esc(t.abbr)}</small><small class="weekly-score">${weekly[t.espnId]?`THIS WEEK · ${esc(weekly[t.espnId])}`:'NO GAME THIS WEEK'}</small></span></span>
    <span class="team-record">${esc(records[t.espnId]??t.record)}</span>
    <strong>${t.points.toLocaleString()}</strong>
    <span class="schedule-cta">${isExpanded?'Close':'View'} <i>${isExpanded?'↑':'↓'}</i></span>
   </button>
   ${schedulePanel}
  </div>`;
 }).join('');
 return `<article class="rankings panel anchor" id="rankings">
  <div class="panel-title"><div><p class="eyebrow">AP PRESEASON POLL · ALL 25 TEAMS</p><h2>Top 25 rankings</h2></div><button data-nav="Scores">Season status ↑</button></div>
  <div class="table-head"><span>RK</span><span>TEAM</span><span>REC</span><span>PTS</span><span>SCHEDULE</span></div>
  ${rows}
 </article>`;
}
function renderSidebar(){
 const active=activeTeam();
 const storiesHtml=stories.map(([tag,title],i)=>`<div class="story"><b>0${i+1}</b><span><small>${esc(tag)}</small><strong>${esc(title)}</strong></span></div>`).join('');
 return `<aside class="sidebar">
  <article class="team-card panel anchor" id="teams">
   <div class="team-card-head" style="background:${active.color}"><span>${esc(active.abbr[0])}</span><div><p>TEAM SNAPSHOT</p><h2>${esc(active.name)}</h2><small>#${active.rank} · ${esc(active.record)}</small></div></div>
   <div class="metric-grid"><div><small>POINTS / GAME</small><strong>${active.pf}</strong><span>PRESEASON — NO GAMES YET</span></div><div><small>YARDS / GAME</small><strong>${active.ypg}</strong><span>PRESEASON — NO GAMES YET</span></div><div><small>POINTS ALLOWED</small><strong>${active.pa}</strong><span>PRESEASON — NO GAMES YET</span></div><div><small>AP POINTS</small><strong>${active.points}</strong><span>2026 PRESEASON POLL</span></div></div>
   <button class="primary" data-nav="Rankings">Choose another team</button>
  </article>
  <article class="news panel"><div class="panel-title"><div><p class="eyebrow">FIELD NOTES</p><h2>Top stories</h2></div></div>${storiesHtml}</article>
 </aside>`;
}
function renderMetrics(){
 const list=state.metricView==='team'?teamStats:playerStats;
 const items=list.map(([name,description],index)=>`<article class="metric-item"><span>${String(index+1).padStart(2,'0')}</span><div><h3>${esc(name)}</h3><p>${esc(description)}</p><small class="metric-feed">${state.metricView==='team'?`${esc(metricSummary(name))}${Object.keys(state.metricValues).length?` · ${Object.keys(state.metricValues).length}/25 teams reporting`:''}`:'Waiting for season statistics'}</small></div></article>`).join('');
 return `<section class="metrics-section panel anchor" id="metrics">
  <div class="panel-title"><div><p class="eyebrow">THE STAT BOARD</p><h2>Essential metrics</h2></div><div class="metric-tabs" role="tablist" aria-label="Metric category"><button class="${state.metricView==='team'?'active':''}" data-metric-view="team" role="tab" aria-selected="${state.metricView==='team'}">Team</button><button class="${state.metricView==='player'?'active':''}" data-metric-view="player" role="tab" aria-selected="${state.metricView==='player'}">Player</button></div></div>
  <p class="metrics-intro">Live season values refresh automatically as games are completed. A dash means the provider has not posted that metric yet.</p>
  <div class="metrics-grid">${items}</div>
 </section>`;
}
function render(){
 document.getElementById('app').innerHTML=`
  ${renderTopbar()}
  ${renderScoreStrip()}
  <div class="page" id="top">
   ${renderHero()}
   ${renderLiveCenter()}
   <section class="content-grid">
    ${renderRankings()}
    ${renderSidebar()}
   </section>
   ${renderMetrics()}
   <footer><span>TOP 25</span><p>2026 AP preseason rankings · Poll released August 17, 2026</p><small>Built for My Life Master App</small></footer>
  </div>
 `;
}

document.getElementById('app').addEventListener('click',e=>{
 const navEl=e.target.closest('[data-nav]');
 if(navEl){e.preventDefault();navigate(navEl.dataset.nav);return}
 if(e.target.closest('[data-close-live]')){state.selectedGameId=null;state.gameDetails=null;render();return}
 const scoreEl=e.target.closest('[data-score-select]');
 if(scoreEl){state.selectedGameId=scoreEl.dataset.scoreSelect;loadGameDetails();return}
 const teamEl=e.target.closest('[data-team-toggle]');
 if(teamEl){toggleSchedule(teamEl.dataset.teamToggle);return}
 const gameEl=e.target.closest('[data-game-id]');
 if(gameEl){
  const abbr=gameEl.dataset.teamAbbr;
  const game=(state.schedules[abbr]||[]).find(g=>g.id===gameEl.dataset.gameId);
  if(game)toggleGame(game,abbr);
  return;
 }
 const metricEl=e.target.closest('[data-metric-view]');
 if(metricEl){state.metricView=metricEl.dataset.metricView;render();return}
});
document.getElementById('app').addEventListener('input',e=>{
 if(e.target.id==='search-input'){
  const pos=e.target.selectionStart;
  state.query=e.target.value;
  render();
  const el=document.getElementById('search-input');
  if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}
 }
});
document.addEventListener('error',e=>{
 if(e.target&&e.target.classList&&e.target.classList.contains('espn-logo'))e.target.style.display='none';
},true);

render();
loadScores();
loadAllSchedules();
loadWeek();
loadTeamStats();
setInterval(loadScores,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadScores()});
setInterval(loadWeek,120000);
setInterval(()=>{if(state.selectedGameId)loadGameDetails()},120000);
setInterval(loadTeamStats,300000);
setInterval(livePollTick,90000);
</script>
</body>
</html>

function formatLeaderValue(athlete,labels){
 if(athlete.displayValue)return String(athlete.displayValue);
 const stats=athlete.stats??[];
 if(!labels||!labels.length)return stats.slice(0,3).join(' · ');
 const parts=[];
 if(stats[0]!=null)parts.push(`${labels[0]??''} ${stats[0]}`.trim());
 const ydsIndex=labels.findIndex(l=>/^yds$/i.test(l));
 if(ydsIndex>=0&&stats[ydsIndex]!=null)parts.push(`${stats[ydsIndex]} YDS`);
 const tdIndex=labels.findIndex(l=>/^td$/i.test(l));
 if(tdIndex>=0&&stats[tdIndex]!=null)parts.push(`${stats[tdIndex]} TD`);
 return parts.length?parts.join(', '):stats.slice(0,3).join(' · ');
}

const conferenceOf=(team)=>conferenceById[team.espnId]??'Independent';
const normalizeGame=(event)=>{
 const competition=event.competitions?.[0]??{};
 const competitors=[...(competition.competitors??[])].sort((a,b)=>a.homeAway==='away'?-1:b.homeAway==='away'?1:0);
 return {id:event.id,date:event.date,status:event.status?.type?.shortDetail??'Scheduled',state:event.status?.type?.state??'pre',network:competition.broadcasts?.[0]?.names?.[0]??'',situation:competition.situation??null,teams:competitors.map((entry)=>({id:entry.team?.id,name:entry.team?.shortDisplayName??entry.team?.displayName,abbr:entry.team?.abbreviation??'',rank:entry.curatedRank?.current<99?entry.curatedRank.current:undefined,score:String(entry.score?.displayValue??entry.score?.value??entry.score??'0'),color:`#${entry.team?.color??'10231d'}`,logo:entry.team?.logo,homeAway:entry.homeAway,record:entry.records?.find((record)=>record.type==='total'||record.name==='overall')?.summary,linescores:(entry.linescores??[]).map(l=>String(l.displayValue??l.value??'-'))}))};
};
const normalizeScheduleGame=(event,team)=>{
 const competition=event.competitions?.[0]??{};
 const own=competition.competitors?.find((entry)=>String(entry.team?.id)===team.espnId);
 const opponent=competition.competitors?.find((entry)=>String(entry.team?.id)!==team.espnId);
 const gameStatus=competition.status??event.status;
 const providerState=gameStatus?.type?.state??'pre';
 const hasPostedScore=(competition.competitors??[]).some((entry)=>Number(entry.score?.value??entry.score)>0);
 const inferredComplete=providerState==='post'||(hasPostedScore&&new Date(event.date).getTime()<Date.now());
 return {id:String(event.id),date:event.date,opponent:opponent?.team?.shortDisplayName??'Opponent TBD',venue:own?.homeAway==='away'?'at':'vs',neutral:Boolean(competition.neutralSite),state:inferredComplete?'post':providerState,status:inferredComplete?'Final':gameStatus?.type?.shortDetail??'Scheduled',network:competition.broadcasts?.[0]?.names?.[0]??competition.broadcasts?.[0]?.media?.shortName??'',ownScore:String(own?.score?.displayValue??own?.score?.value??own?.score??'—'),opponentScore:String(opponent?.score?.displayValue??opponent?.score?.value??opponent?.score??'—')};
};

async function loadScores(){
 try{
  const response=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=100',{cache:'no-store'});
  if(!response.ok)throw new Error('Scores unavailable');
  const data=await response.json();
  const games=(data.events??[]).map(normalizeGame).sort((a,b)=>a.state==='in'?-1:b.state==='in'?1:new Date(a.date)-new Date(b.date));
  state.liveGames=games;state.liveError=false;state.lastUpdated=new Date();
 }catch{state.liveError=true}
 render();
}
async function loadAllSchedules(){
 const entries=await Promise.all(teams.map(async team=>{
  try{
   const response=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/${team.espnId}/schedule?season=2026&fresh=${Date.now()}`,{cache:'no-store'});
   if(!response.ok)return null;
   const data=await response.json();
   return [team.abbr,(data.events??[]).map(event=>normalizeScheduleGame(event,team))];
  }catch{return null}
 }));
 entries.filter(Boolean).forEach(([abbr,games])=>{if(!state.schedules[abbr])state.schedules[abbr]=games});
 render();
}
async function loadWeek(){
 const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);
 const stamp=(date)=>`${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
 try{
  const dates=`${stamp(start)}-${stamp(end)}`;
  const response=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=200&dates=${dates}`,{cache:'no-store'});
  if(!response.ok)throw new Error('Week unavailable');
  const data=await response.json();
  state.weeklyGames=(data.events??[]).map(normalizeGame);
 }catch{state.weeklyGames=[]}
 render();
}

  if(!response.ok)throw new Error('Details unavailable');
  const data=await response.json();
  const rawTeams=normalizeGame(data.header).teams;
  const liveMeta=state.liveGames.find(entry=>entry.id===state.selectedGameId);
  const normalizedTeams=rawTeams.map(team=>{
   const meta=liveMeta?.teams?.find(m=>m.id===team.id);
   return meta?{...team,logo:team.logo??meta.logo,rank:team.rank??meta.rank,record:team.record??meta.record}:team;
  });
  const rows=new Map();
  (data.boxscore?.teams??[]).forEach(teamBlock=>{
   const index=normalizedTeams.findIndex(team=>team.id===teamBlock.team?.id);
   (teamBlock.statistics??[]).forEach(stat=>{
    const row=rows.get(stat.name)??{name:stat.label??stat.name,away:'—',home:'—'};
    if(index===0)row.away=stat.displayValue??'—';if(index===1)row.home=stat.displayValue??'—';rows.set(stat.name,row);
   });
  });
  const leaders=[];(data.boxscore?.players??[]).forEach(teamBlock=>{const teamId=String(teamBlock.team?.id??'');(teamBlock.statistics??[]).slice(0,4).forEach(category=>{const athlete=(category.athletes??[])[0];if(!athlete)return;leaders.push({teamId,category:category.displayName??category.name??'Leader',name:athlete.athlete?.displayName??athlete.athlete?.shortName??'Team leader',value:formatLeaderValue(athlete,category.labels)})})});
  const drivePlays=data.drives?.current?.plays??[];
  const lastDrivePlay=drivePlays[drivePlays.length-1];
  const possessionTeamId=lastDrivePlay?String(lastDrivePlay.teamParticipants?.find(p=>p.type==='offense')?.id??lastDrivePlay.end?.team?.id??lastDrivePlay.team?.id??'')||null:null;
  const highlights=(data.videos??[]).slice(0,3).map(video=>({headline:String(video.headline??video.title??'Official game highlights'),thumbnail:String(video.thumbnail??''),src:String(video.links?.source?.HD?.href??video.links?.source?.full?.href??'')})).filter(video=>video.src);
  let drive=null;
  if(liveMeta?.state==='in'&&lastDrivePlay){
   const offenseTeamId=String(lastDrivePlay.teamParticipants?.find(p=>p.type==='offense')?.id??lastDrivePlay.end?.team?.id??lastDrivePlay.team?.id??'');
   const situation={downDistanceText:lastDrivePlay.end?.downDistanceText??lastDrivePlay.end?.shortDownDistanceText??'',shortDownDistanceText:lastDrivePlay.end?.shortDownDistanceText??'',possessionText:lastDrivePlay.end?.possessionText??'',yardsToEndzone:lastDrivePlay.end?.yardsToEndzone,startYardsToEndzone:drivePlays[0]?.start?.yardsToEndzone??lastDrivePlay.end?.yardsToEndzone,distance:lastDrivePlay.end?.distance??10,offenseTeamId,text:lastDrivePlay.text??'',participants:(lastDrivePlay.participants??[]).slice(0,2).map(p=>({name:p.athlete?.displayName??p.athlete?.shortName??'',position:p.athlete?.position?.abbreviation??'',jersey:p.athlete?.jersey??'',headshot:p.athlete?.headshot?.href??''}))};

  const stats=d.stats.map(stat=>`<div><span>${esc(stat.name)}</span><b>${index===0?esc(stat.away):esc(stat.home)}</b></div>`).join('');
  const extra=[
   d.touchdowns?`<div><span>Touchdowns</span><b>${d.touchdowns[index]}</b></div>`:'',
   d.fieldGoals?`<div><span>Field goals</span><b>${d.fieldGoals[index]}</b></div>`:'',
   d.extraPoints?`<div><span>Extra points</span><b>${d.extraPoints[index]}</b></div>`:'',
   d.twoPointConversions?`<div><span>2-point conversions</span><b>${d.twoPointConversions[index]}</b></div>`:'',
   d.safeties?`<div><span>Safeties</span><b>${d.safeties[index]}</b></div>`:'',
   `<div><span>Scoring check</span><b>${game.state==='in'?'● Live — game in progress':(d.scoringVerified?.[index]?'✓ Matches':'⚠ Review')}</b></div>`
  ].join('');
  const leaders=(d.leaders??[]).filter(l=>l.teamId===team.id);
  const leadersHtml=leaders.length?leaders.map(l=>`<div><span><small>${esc(l.category)}</small>${esc(l.name)}</span><b>${esc(l.value)}</b></div>`).join(''):'<small class="leaders-pending">Player leaders have not been posted by the provider.</small>';
  return `<section class="team-archive"><header><span><small>${team.id===t.espnId?'SELECTED TEAM':'OPPONENT'}</small><b>${esc(team.name)}</b></span><strong>${esc(team.score)}</strong></header><div class="team-stat-list">${stats}${extra}</div><div class="team-leaders"><p>PLAYER LEADERS</p>${leadersHtml}</div></section>`;
 }).join('');
 const driveHtml=game.state==='in'?renderDriveTracker(d,game):'';
 const [legAwayTeam,legHomeTeam]=awayHomeTeams(d.teams);
 return `<div class="legacy-game-panel">${driveHtml}${!driveHtml?renderLinescore(legAwayTeam,legHomeTeam):''}<p class="archive-label">${game.state==='in'?'LIVE STATS':'GAME ARCHIVE'} · ${esc(d.headline)}</p><div class="team-archive-grid">${teamArchives}</div>${renderHighlights(d.highlights)}<p class="archive-label">SCORING SOURCE · ${esc(d.scoringSource??'ESPN')}</p>${d.lastPlay?`<p class="last-play"><b>LAST PLAY:</b> ${esc(d.lastPlay)}</p>`:''}</div>`;
}
function renderHighlights(highlights){
 if(!highlights||!highlights.length)return '';
 return `<div class="highlights"><p class="archive-label">GAME HIGHLIGHTS</p><div class="highlights-grid">${highlights.map(item=>`<figure class="highlight-clip"><video controls preload="metadata" playsinline ${item.thumbnail?`poster="${esc(item.thumbnail)}"`:''}><source src="${esc(item.src)}" type="video/mp4"></video><figcaption>${esc(item.headline)}</figcaption></figure>`).join('')}</div></div>`;
}
function renderScheduleGame(game,t){
 const isExpanded=state.expandedGameId===game.id;
 const detail=isExpanded?renderLegacyGamePanel(game,t):'';
 return `<div class="schedule-game-wrap"><button class="schedule-game" data-game-id="${game.id}" data-team-abbr="${t.abbr}" aria-expanded="${isExpanded}"><time datetime="${game.date}">${esc(new Date(game.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}))}</time><span>${game.neutral?'vs':game.venue} <b>${esc(game.opponent)}</b></span><small>${esc(mountainTime(new Date(game.date)))} MT · ${isExpanded?'Close':game.state==='post'?'Stats':'Details'} ${isExpanded?'↑':'↓'}</small></button>${detail}</div>`;
}
function renderSchedulePanel(t){
 const games=state.schedules[t.abbr]??[];
 const loading=state.scheduleLoading===t.abbr;
 const errored=state.scheduleError===t.abbr;
 const gamesHtml=loading?'<p class="schedule-message">Loading the latest schedule…</p>':errored?'<p class="schedule-message">Schedule could not be loaded. Close and try again.</p>':games.map(game=>renderScheduleGame(game,t)).join('');
 return `<div class="schedule-panel" id="schedule-${t.abbr}"><div class="schedule-head"><span><b>${esc(t.name)}</b> · 2026 SCHEDULE</span><small>${loading?'LOADING…':`${games.length} GAMES`}</small></div>${gamesHtml}</div>`;
}
// Shared row markup for both the flat Rankings list and the by-conference Standings list --
// only the sort order and (optionally) conference dividers differ between the two.
function rankingRow(t,records,confHeading){
 const isExpanded=state.expanded===t.abbr;
 const schedulePanel=isExpanded?renderSchedulePanel(t):'';
 return `<div class="team-entry">${confHeading||''}
  <button data-team-toggle="${t.abbr}" aria-expanded="${isExpanded}" aria-controls="schedule-${t.abbr}" class="team-row ${state.selected===t.abbr?'selected':''}">
   <b>${t.rank}</b>
   <span class="team-name"><i class="team-logo" style="background:${t.color}"><span>${esc(t.abbr)}</span><img class="espn-logo" src="https://a.espncdn.com/i/teamlogos/ncaa/500/${t.espnId}.png" alt="${esc(t.name)} logo"></i><span><strong>${esc(t.name)}</strong><small>${esc(t.abbr)}</small></span></span>
   <span class="team-record">${esc(records[t.espnId]??t.record)}</span>
   <strong>${t.points.toLocaleString()}</strong>
   <span class="schedule-cta">${isExpanded?'Close':'View'} <i>${isExpanded?'↑':'↓'}</i></span>
  </button>
  ${schedulePanel}
 </div>`;
}
// Rankings tab: plain 1-25 poll order, no conference grouping.
function renderRankingsList(){
 const filtered=filteredTeamsByRank();
 const records=currentRecords();
 const rows=filtered.map(t=>rankingRow(t,records)).join('');
 return `<article class="rankings panel" id="rankings">
  <div class="panel-title"><div><p class="eyebrow">AP PRESEASON POLL · ALL 25 TEAMS</p><h2>Rankings</h2></div><button data-nav="Scores">Season status ↑</button></div>
  <div class="table-head"><span>RK</span><span>TEAM</span><span>REC</span><span>PTS</span><span>SCHEDULE</span></div>
  ${rows}
 </article>`;
}
// Standings tab: grouped by conference only -- no scores, no schedule bleed from other tabs.
function renderStandingsList(){
 const filtered=filteredTeams();
 const records=currentRecords();
 const rows=filtered.map((t,i)=>{
  const confHeading=(i===0||conferenceOf(filtered[i-1])!==conferenceOf(t))?`<div class="conference-heading">${esc(conferenceOf(t))}</div>`:'';
  return rankingRow(t,records,confHeading);
 }).join('');
 return `<article class="rankings panel" id="standings-list">
  <div class="panel-title"><div><p class="eyebrow">AP PRESEASON POLL · BY CONFERENCE</p><h2>Standings</h2></div></div>
  <div class="table-head"><span>RK</span><span>TEAM</span><span>REC</span><span>PTS</span><span>SCHEDULE</span></div>
  ${rows}
 </article>`;
}
function renderSidebar(){
 const active=activeTeam();
 const storiesHtml=stories.map(([tag,title],i)=>`<div class="story"><b>0${i+1}</b><span><small>${esc(tag)}</small><strong>${esc(title)}</strong></span></div>`).join('');
 return `<aside class="sidebar">
  <article class="team-card panel" id="teams">
   <div class="team-card-head" style="background:${active.color}"><span>${esc(active.abbr[0])}</span><div><p>TEAM SNAPSHOT</p><h2>${esc(active.name)}</h2><small>#${active.rank} · ${esc(active.record)}</small></div></div>
   <div class="metric-grid"><div><small>POINTS / GAME</small><strong>${active.pf}</strong><span>PRESEASON — NO GAMES YET</span></div><div><small>YARDS / GAME</small><strong>${active.ypg}</strong><span>PRESEASON — NO GAMES YET</span></div><div><small>POINTS ALLOWED</small><strong>${active.pa}</strong><span>PRESEASON — NO GAMES YET</span></div><div><small>AP POINTS</small><strong>${active.points}</strong><span>2026 PRESEASON POLL</span></div></div>
   <button class="primary" data-nav="Rankings">Choose another team</button>
  </article>
  <article class="news panel"><div class="panel-title"><div><p class="eyebrow">FIELD NOTES</p><h2>Top stories</h2></div></div>${storiesHtml}</article>
 </aside>`;
}
function renderMetrics(){
 const list=state.metricView==='team'?teamStats:playerStats;
 const items=list.map(([name,description],index)=>`<article class="metric-item"><span>${String(index+1).padStart(2,'0')}</span><div><h3>${esc(name)}</h3><p>${esc(description)}</p><small class="metric-feed">${state.metricView==='team'?`${esc(metricSummary(name))}${Object.keys(state.metricValues).length?` · ${Object.keys(state.metricValues).length}/25 teams reporting`:''}`:'Waiting for season statistics'}</small></div></article>`).join('');
 return `<section class="metrics-section panel" id="metrics">
  <div class="panel-title"><div><p class="eyebrow">THE STAT BOARD</p><h2>Essential metrics</h2></div><div class="metric-tabs" role="tablist" aria-label="Metric category"><button class="${state.metricView==='team'?'active':''}" data-metric-view="team" role="tab" aria-selected="${state.metricView==='team'}">Team</button><button class="${state.metricView==='player'?'active':''}" data-metric-view="player" role="tab" aria-selected="${state.metricView==='player'}">Player</button></div></div>
  <p class="metrics-intro">Live season values refresh automatically as games are completed. A dash means the provider has not posted that metric yet.</p>
  <div class="metrics-grid">${items}</div>
 </section>`;
}
function renderFooter(){
 return `<footer><span>TOP 25</span><p>2026 AP preseason rankings · Poll released August 17, 2026</p><small>Built for My Life Master App</small></footer>`;
}
// Each tab renders its own self-contained page -- nothing from another tab (in particular,
// no score content) ever appears alongside it.
function renderOverviewPage(){
 return `<div class="page" id="top">${renderHero()}${renderFooter()}</div>`;
}
function renderRankingsPage(){
 return `<div class="page">${renderRankingsList()}${renderFooter()}</div>`;
}
function renderStandingsPage(){
 return `<div class="page">${renderStandingsList()}${renderFooter()}</div>`;
}
function renderScoresPage(){
 return `${renderScoreStrip()}<div class="page">${renderLiveCenter()}${renderFooter()}</div>`;
}
function renderTeamsPage(){
 return `<div class="page"><div class="teams-page-layout">${renderSidebar()}</div>${renderMetrics()}${renderFooter()}</div>`;
}
function render(){
 const pages={Overview:renderOverviewPage,Rankings:renderRankingsPage,Standings:renderStandingsPage,Scores:renderScoresPage,Teams:renderTeamsPage};
 const page=pages[state.section]||renderOverviewPage;
 document.getElementById('app').innerHTML=`
  ${renderTopbar()}
  ${page()}
 `;
}

document.getElementById('app').addEventListener('click',e=>{
 const navEl=e.target.closest('[data-nav]');
 if(navEl){e.preventDefault();navigate(navEl.dataset.nav);return}
 if(e.target.closest('[data-close-live]')){state.selectedGameId=null;state.gameDetails=null;render();return}
 const scoreEl=e.target.closest('[data-score-select]');
 if(scoreEl){state.selectedGameId=scoreEl.dataset.scoreSelect;loadGameDetails();requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector('.live-center')?.scrollIntoView({behavior:'smooth',block:'start'})));return}
 const teamEl=e.target.closest('[data-team-toggle]');
 if(teamEl){toggleSchedule(teamEl.dataset.teamToggle);return}
 const gameEl=e.target.closest('[data-game-id]');
 if(gameEl){
  const abbr=gameEl.dataset.teamAbbr;
  const game=(state.schedules[abbr]||[]).find(g=>g.id===gameEl.dataset.gameId);
  if(game)toggleGame(game,abbr);
  return;
 }
 const metricEl=e.target.closest('[data-metric-view]');
 if(metricEl){state.metricView=metricEl.dataset.metricView;render();return}
});
document.getElementById('app').addEventListener('input',e=>{
 if(e.target.id==='search-input'){
  const pos=e.target.selectionStart;
  state.query=e.target.value;
  render();
  const el=document.getElementById('search-input');
  if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}
 }
});
document.addEventListener('error',e=>{
 if(e.target&&e.target.classList&&(e.target.classList.contains('espn-logo')||e.target.classList.contains('player-headshot')))e.target.style.display='none';
},true);

render();
loadScores();
loadAllSchedules();
loadWeek();
loadTeamStats();
setInterval(loadScores,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadScores()});
setInterval(loadWeek,120000);
setInterval(()=>{if(state.selectedGameId)loadGameDetails()},120000);
setInterval(loadTeamStats,300000);
setInterval(livePollTick,90000);
</script>
</body>
</html>

to taste Worcestershire sauce to taste Soy sauce to taste"}, {"type": "text", "text": "Prepare the turkey for roasting…remove all the inside junk and throw it away. Cut off the neck and the butt and all extra fat and skin. Rinse the turkey off and run water through the turkey. Pull out any nasty stuff in the holes in the turkey. Spray roasting pan down with cooking spray and place turkey in roasting pan. Add all seasoning to turkey…make sure to use a lot of seasoning but do not over do the seasoning either. Add all cream of soups to the turkey. Rub the turkey down inside and outside and front and back of turkey with the soups. Peel whole onion and rinse the onion off and place in the cavity of the turkey. Cut ends off celery and cut each stalk in half…place in turkey. Add chicken base with water or chicken broth in the turkey mixture. Make sure the broth is very strong chicken taste. Cover the turkey with lid and cook 275 to 325 degrees (depends how big of a turkey you are cooking) for 12 hours. Once the turkey is falling apart…the turkey is done. Taste the gravy if it needs more seasoning or chicken base you add it and let cook for about 30 minutes. After you get the taste right and turkey is falling apart…the turkey is done."}]}, {"id": "veal-stew", "title": "Veal Stew", "category": "Soups & Stews", "pages": [269, 270], "tags": [], "ingCount": 16, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ½ lbs veal shoulder, cut into 1 inch pieces", "1 ½ lbs veal breast, cut into 1 ½ inch pieces", "4 tbsp butter", "1 quart veal stock", "2 large onions, diced", "2 carrots, sliced", "4 stalks celery, diced", "1 clove garlic, minced", "¼ tsp cloves Salt and pepper to taste", "½ cup dry white wine", "2 cups whole mushrooms", "¼ cup butter", "¼ cup flour", "3 egg yolks, beaten", "½ cup heavy cream", "2 tbsp freshly squeezed lemon juice Buttered noodles Fresh parsley"]}, {"type": "text", "text": "Blanch veal shoulder and breast in salted water, drain and rinse under cold water. Melt butter in a large heavy saucepan, add stock, onions, carrots, celery, seasonings, and wine. Simmer uncovered, 1 ¼ to 1 ½ hours or until veal is tender. Add mushrooms during last 10 minutes of cooking. Remove vegetables from stock with a slotted spoon. In a small saucepan, melt butter, whisk in flour until absorbed. Whisk mixture into a boil, reduce heat and simmer, partially covered, until tender, about 15 minutes. Puree mixture and return to saucepan. Add remaining pepper. Simmer, stirring often, until soup is warm. Fold in cream and heat slowly. Sprinkle with fresh parsley and serve."}]}, {"id": "vegetable-beef-soup", "title": "Vegetable Beef Soup", "category": "Soups & Stews", "pages": [271, 272], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "1lb 93% ground beef Frozen mixed veggies Frozen broccoli Can of tomato sauce Can of cream of mushroom soup Onion powder Fresh garlic or garlic powder (either one) Season Salt Ground black pepper Cavender Greek Seasoning Creole Seasoning Parsley flakes Chopped chives Sweet Paprika Worcestershire Sauce Soy Sauce Beef Base"}, {"type": "text", "text": "Brown your ground beef in a little olive oil with all seasoning except beef base until done. Then add all your frozen veggies to the ground beef. (You can add any veggies you want and also fresh veggies with frozen veggies.) Add your tomato sauce and cream of mushroom soup. Fill up to the top of veggies with water. Add enough beef base to give it a nice rich beef flavor. You can always add more as you go so do not over do at first. Let cook until all veggies are hot and the flavor is the way you want it. Then serve."}]}, {"id": "veggie-lasagna-soup", "title": "Veggie Lasagna Soup", "category": "Soups & Stews", "pages": [273, 274], "tags": [], "ingCount": 21, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 Tbsp extra virgin olive oil", "½ cup diced onions", "1 ½ cup diced mushrooms", "1 whole zucchini diced const CATEGORY_ICONS = {
  "Breakfast & Brunch":"🍳",
  "Snacks & Appetizers":"🥨",
  "Salads":"🥗",
  "Soups & Stews":"🍲",
  "Poultry Mains":"🍗",
  "Meat Mains":"🥩",
  "Seafood Mains":"🦐",
  "Pasta, Rice & Grains":"🍝",
  "Vegetables & Sides":"🥔",
  "Breads & Rolls":"🥖",
  "Sauces, Dressings & Condiments":"🧂",
  "Cakes & Cheesecakes":"🎂",
  "Pies & Tarts":"🥧",
  "Cookies & Bars":"🍪",
  "Candy & Confections":"🍬",
  "Other Desserts":"🍨",
  "Beverages":"🥤"
};
const CATEGORY_ORDER = Object.keys(CATEGORY_ICONS);

const FRACTIONS = {'¼':0.25,'½':0.5,'¾':0.75,'⅓':1/3,'⅔':2/3,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};

const LS_FAV='cindys_favorites', LS_CUSTOM='cindys_custom_recipes', LS_KEY='cindys_api_key', LS_MODEL='cindys_api_model';

let state = {
  view: 'all',
  category: null,
  query: '',
  sort: 'alpha',
  favorites: new Set(readJSON(LS_FAV, [])),
  customRecipes: readJSON(LS_CUSTOM, []),
  apiKey: localStorage.getItem(LS_KEY) || '',
  model: localStorage.getItem(LS_MODEL) || 'claude-sonnet-5',
  scale: 1,
  checked: new Set(),
  editorPhoto: null,
  editingId: null,
  importTab: 'paste',
  importResult: null,
};

function readJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function allRecipes(){ return RECIPES.concat(state.customRecipes); }

function saveFavorites(){ localStorage.setItem(LS_FAV, JSON.stringify([...state.favorites])); }

function saveCustom(){
  try{
    localStorage.setItem(LS_CUSTOM, JSON.stringify(state.customRecipes));
    updateStorageMeter();
    return true;
  }catch(e){
    alert("Your browser's storage is full — the recipe wasn't saved.\n\nPhotos take up the most room. Try removing a photo from an older recipe, or use “Back Up My Recipes” to save everything to a file first.");
    return false;
  }
}

function updateStorageMeter(){
  let bytes = 0;
  try{ for(const k in localStorage){ if(Object.prototype.hasOwnProperty.call(localStorage,k)) bytes += (localStorage[k].length + k.length) * 2; } }catch(e){}
  const limit = 5 * 1024 * 1024;
  const pct = Math.min(100, (bytes/limit)*100);
  const fill = document.getElementById('storeFill');
  const txt = document.getElementById('storeTxt');
  if(!fill) return;
  fill.style.width = pct.toFixed(1)+'%';
  fill.className = 'fill' + (pct>85?' full':(pct>60?' warn':''));
  txt.textContent = (bytes/1024/1024).toFixed(2)+' MB';
}

function updateAiIndicator(){
  const on = !!state.apiKey;
  const gear = document.getElementById('gearBtn');
  if(gear){
    gear.classList.toggle('needs-key', !on);
    gear.title = on ? 'AI Settings — AI is on' : 'AI Settings — AI is off';
  }
  const side = document.getElementById('sideAiBtn');
  if(side) side.textContent = on ? '⚙️ AI Settings — On' : '⚙️ AI Settings — Off';
}

function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-scrim').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-scrim').classList.remove('open'); }

function buildCatNav(){
  const counts = {};
  allRecipes().forEach(r => counts[r.category] = (counts[r.category]||0)+1);
  const el = document.getElementById('catNav');
  el.innerHTML = CATEGORY_ORDER.filter(c=>counts[c]).map(c => `
    <button class="nav-item" data-cat="${esc(c)}">
      <span class="ic">${CATEGORY_ICONS[c]||'🍴'}</span>${esc(c)}<span class="n">${counts[c]}</span>
    </button>`).join('');
}

function setActiveNav(){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  if(state.category){
    const b = [...document.querySelectorAll('.nav-item[data-cat]')].find(x=>x.dataset.cat===state.category);
    if(b) b.classList.add('active');
  } else {
    const b = document.querySelector('.nav-item[data-view="'+state.view+'"]');
    if(b) b.classList.add('active');
  }
}

function matchesQuery(r, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(r.title.toLowerCase().includes(q)) return true;
  if(r.category.toLowerCase().includes(q)) return true;
  for(const s of r.sections){
    if(s.type==='ingredients' && s.items.some(i=>i.toLowerCase().includes(q))) return true;
    if(s.type==='steps' && s.items.some(i=>i.toLowerCase().includes(q))) return true;
    if((s.type==='text'||s.type==='header') && (s.text||'').toLowerCase().includes(q)) return true;
  }
  return false;
}

function getFiltered(){
  let list = allRecipes();
  if(state.category){
    list = list.filter(r=>r.category===state.category);
  } else if(state.view === 'favorites'){
    list = list.filter(r=>state.favorites.has(r.id));
  } else if(state.view === 'michael'){
    list = list.filter(r=>(r.tags||[]).includes("Michael's Recipe"));
  } else if(state.view === 'copycat'){
    list = list.filter(r=>(r.tags||[]).includes('Copycat & Adapted'));
  } else if(state.view === 'mine'){
    list = list.filter(r=>r.custom);
  }
  if(state.query) list = list.filter(r=>matchesQuery(r, state.query));

  switch(state.sort){
    case 'category': list.sort((a,b)=> a.category.localeCompare(b.category) || a.title.localeCompare(b.title)); break;
    case 'ingCount': list.sort((a,b)=> a.ingCount-b.ingCount); break;
    case 'stepCount': list.sort((a,b)=> a.stepCount-b.stepCount); break;
    case 'newest': list.sort((a,b)=> (b.created||0)-(a.created||0) || a.title.localeCompare(b.title)); break;
    default: list.sort((a,b)=> a.title.localeCompare(b.title));
  }
  return list;
}

function render(){
  buildCatNav();
  buildCounts();
  setActiveNav();
  updateStorageMeter();
  updateAiIndicator();

  const grid = document.getElementById('grid');
  const idxView = document.getElementById('indexView');
  const empty = document.getElementById('emptyState');
  const titleMap = {all:'All Recipes', favorites:'Favorites', michael:"Michael's Recipes", copycat:'Copycat & Adapted', mine:'My Additions', index:'Index (A–Z)'};
  document.getElementById('viewTitle').textContent = state.category || titleMap[state.view] || 'All Recipes';

  if(state.view==='index' && !state.category){
    grid.style.display='none'; empty.style.display='none';
    idxView.classList.add('show');
    renderIndex();
    return;
  }
  idxView.classList.remove('show');
  grid.style.display='grid';

  const list = getFiltered();
  document.getElementById('resultsMeta').textContent = list.length + ' recipe' + (list.length===1?'':'s');

  if(list.length===0){
    grid.innerHTML=''; empty.style.display='block';
    document.getElementById('emptyMsg').innerHTML = state.view==='mine'
      ? 'You haven\'t added any recipes yet.<br><button class="btn" style="margin-top:16px" onclick="openEditor()">✚ Add your first recipe</button>'
      : 'No recipes match your search. Try another ingredient or category.';
  } else {
    empty.style.display='none';
    grid.innerHTML = list.map(cardHtml).join('');
  }
}

function cardHtml(r){
  const fav = state.favorites.has(r.id);
  let tags = (r.tags||[]).slice();
  if(r.custom) tags = tags.concat(['Added by you']);
  const tagsHtml = tags.map(t=>`<span class="tag ${t==='Added by you'?'mine':''}">${esc(t)}</span>`).join('');
  const thumb = r.photo ? `<img class="thumb" src="${esc(r.photo)}" alt="${esc(r.title)}">` : '';
  return `
  <div class="card" onclick="openDetail('${esc(r.id)}')">
    <button class="fav-btn ${fav?'active':''}" onclick="event.stopPropagation(); toggleFav('${esc(r.id)}')" title="Favorite">${fav?'★':'☆'}</button>
    ${thumb}
    <div class="body">
      <span class="cat-tag">${CATEGORY_ICONS[r.category]||''} ${esc(r.category)}</span>
      <h3>${esc(r.title)}</h3>
      <div class="meta"><span>🧾 ${r.ingCount} ingredients</span><span>👣 ${r.stepCount} steps</span></div>
      ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
    </div>
  </div>`;
}

function buildCounts(){
  const all = allRecipes();
  document.getElementById('totalCount').textContent = all.length + ' recipes';
  document.getElementById('cnt-all').textContent = all.length;
  document.getElementById('cnt-fav').textContent = state.favorites.size;
  document.getElementById('cnt-mine').textContent = state.customRecipes.length;
  document.getElementById('cnt-michael').textContent = all.filter(r=>(r.tags||[]).includes("Michael's Recipe")).length;
  document.getElementById('cnt-copycat').textContent = all.filter(r=>(r.tags||[]).includes('Copycat & Adapted')).length;
}

/* ---------- Index (A–Z) ---------- */
function renderIndex(){
  const list = allRecipes().slice().sort((a,b)=>a.title.localeCompare(b.title));
  const groups = {};
  list.forEach(r=>{
    let L = r.title.replace(/^[^A-Za-z0-9]+/,'').charAt(0).toUpperCase();
    if(!/[A-Z]/.test(L)) L = '#';
    (groups[L] = groups[L] || []).push(r);
  });
  const letters = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const jump = letters.map(L=>`<a href="#idx-${L==='#'?'num':L}" class="${groups[L]?'':'off'}">${L}</a>`).join('');
  const body = letters.filter(L=>groups[L]).map(L=>`
    <div class="idx-group" id="idx-${L==='#'?'num':L}">
      <div class="idx-letter">${L}</div>
      ${groups[L].map(r=>`
        <div class="idx-row" onclick="openDetail('${esc(r.id)}')">
          <span>${esc(r.title)}</span>
          <span class="dots"></span>
          <span class="rcat">${esc(r.category)}</span>
          <span class="rpage">${r.custom ? 'yours' : (r.pages&&r.pages.length ? 'p.'+r.pages[0] : '—')}</span>
        </div>`).join('')}
    </div>`).join('');

  document.getElementById('resultsMeta').textContent = list.length + ' recipes, alphabetically';
  document.getElementById('indexView').innerHTML = `
    <div class="alpha-jump">${jump}
      <button class="icon-btn" style="margin-left:auto" onclick="printIndex()">🖨️ Print Index</button>
    </div>
    <div class="idx-cols">${body}</div>`;
}
function printIndex(){
  document.body.classList.add('printing-index');
  window.print();
  setTimeout(()=>document.body.classList.remove('printing-index'), 500);
}

function toggleFav(id){
  if(state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
  saveFavorites();
  render();
  const det = document.getElementById('detail');
  if(document.getElementById('overlay').classList.contains('open') && det.dataset.id===id){
    const btn = det.querySelector('.fav-inline');
    if(btn){
      const fav = state.favorites.has(id);
      btn.classList.toggle('active', fav);
      btn.textContent = fav ? '★ Favorited' : '☆ Add to Favorites';
    }
  }
}

/* ---------- quantity scaling ---------- */
function parseLeadingQty(str){
  str = str.trim();
  let m = str.match(/^(\d+)\s+([¼½¾⅓⅔⅛⅜⅝⅞])(\s|$)/);
  if(m) return {value: parseInt(m[1],10) + FRACTIONS[m[2]], len: m[1].length+1+m[2].length};
  m = str.match(/^([¼½¾⅓⅔⅛⅜⅝⅞])(\s|$)/);
  if(m) return {value: FRACTIONS[m[1]], len: m[1].length};
  m = str.match(/^(\d+)\s+(\d+)\/(\d+)(\s|$)/);
  if(m) return {value: parseInt(m[1],10)+parseInt(m[2],10)/parseInt(m[3],10), len: m[1].length+1+m[2].length+1+m[3].length};
  m = str.match(/^(\d+)\/(\d+)(\s|$)/);
  if(m) return {value: parseInt(m[1],10)/parseInt(m[2],10), len: m[1].length+1+m[2].length};
  m = str.match(/^(\d+\.\d+)(\s|$)/);
  if(m) return {value: parseFloat(m[1]), len: m[1].length};
  m = str.match(/^(\d+)(\s|$)/);
  if(m) return {value: parseInt(m[1],10), len: m[1].length};
  return null;
}
function formatQty(v){
  if(v<=0) return '0';
  let whole = Math.floor(v+1e-6);
  let frac = v - whole;
  if(frac < 0.02) return String(whole);
  let best=null, bestDiff=1;
  for(const ch in FRACTIONS){
    const diff = Math.abs(frac-FRACTIONS[ch]);
    if(diff<bestDiff){ bestDiff=diff; best=ch; }
  }
  if(best && bestDiff < 0.04) return whole>0 ? whole+' '+best : best;
  return String(Math.round(v*100)/100);
}
function scaleIngredient(str, factor){
  if(factor===1) return str;
  const q = parseLeadingQty(str);
  if(!q) return str;
  return formatQty(q.value*factor) + str.slice(q.len);
}

    } else if(s.type==='steps'){

}

/* ---------- text <-> sections ---------- */
function sectionsToText(sections, kind){
  const out = [];
  sections.forEach(s=>{
    if(s.type==='header'){ out.push('## '+s.text); }
    else if(kind==='ing' && s.type==='ingredients'){ s.items.forEach(i=>out.push(i)); }
    else if(kind==='steps' && (s.type==='steps')){ s.items.forEach(i=>out.push(i)); }
    else if(kind==='steps' && s.type==='text'){ out.push(s.text); }
  });
  // drop headers that ended up with nothing under them
  const cleaned = [];
  for(let i=0;i<out.length;i++){
    const isHdr = out[i].startsWith('## ');
    const nextIsContent = i+1<out.length && !out[i+1].startsWith('## ');
    if(!isHdr || nextIsContent) cleaned.push(out[i]);
  }
  return cleaned.join('\n');
}

function textToSections(ingText, stepText){
  const sections = [];
  function pushBlock(lines, type){
    if(!lines.length) return;
    sections.push(type==='ingredients' ? {type:'ingredients', items:lines.slice()} : {type:'steps', items:lines.slice()});
  }
  [[ingText,'ingredients'],[stepText,'steps']].forEach(([txt,type])=>{
    let buf = [];
    (txt||'').split('\n').forEach(raw=>{
      const line = raw.trim();
      if(!line) return;
      if(line.startsWith('## ')){
        pushBlock(buf, type); buf = [];
        sections.push({type:'header', text: line.slice(3).trim()});
      } else {
        buf.push(line.replace(/^\d+[.)]\s*/,''));
      }
    });
    pushBlock(buf, type);
  });
  return sections;
}

function countsFor(sections){
  let ing=0, steps=0;
  sections.forEach(s=>{
    if(s.type==='ingredients') ing += s.items.length;
    if(s.type==='steps') steps += s.items.length;
    if(s.type==='text') steps += 1;
  });
  return {ing, steps};
}

/* ---------- photo handling ---------- */
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1100; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')) return reject(new Error('That file doesn\'t look like an image.'));
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read that file.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not open that image.'));
      img.onload = ()=>{
        let {width:w, height:h} = img;
        if(w>maxDim || h>maxDim){
          const s = maxDim/Math.max(w,h);
          w = Math.round(w*s); h = Math.round(h*s);
        }
        const c = document.createElement('canvas');
        c.width=w; c.height=h;
        const ctx = c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function handlePhotoFile(file){
  if(!file) return;
  compressImage(file).then(dataUrl=>{
    state.editorPhoto = dataUrl;
    const slot = document.getElementById('photoSlot');
    if(slot) slot.innerHTML = photoSlotHtml();
  }).catch(err=>alert(err.message));
}

  if(state.editorPhoto){
    return `<div class="photo-preview">

      <button type="button" onclick="removePhoto()" title="Remove photo">✕</button>
    </div>
    <div class="hint">Photos are shrunk and compressed automatically so they don't fill up your browser's storage.</div>`;
  }
  return `<div class="photo-drop" id="photoDrop" onclick="document.getElementById('photoInput').click()">
      📷 Click to choose a photo — or drag one here
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none">`;
}
function removePhoto(){
  state.editorPhoto = null;
  document.getElementById('photoSlot').innerHTML = photoSlotHtml();

}
function wirePhotoInput(){
  const input = document.getElementById('photoInput');
  if(input) input.onchange = e => handlePhotoFile(e.target.files[0]);
  const drop = document.getElementById('photoDrop');
  if(drop){
    drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('drag'); };
    drop.ondragleave = ()=>drop.classList.remove('drag');
    drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('drag'); handlePhotoFile(e.dataTransfer.files[0]); };
  }
}

/* ---------- smart parser ---------- */
const UNIT_RE = /\b(cups?|c\.|tsp|teaspoons?|tbsp|tablespoons?|oz|ounces?|lbs?|pounds?|g|grams?|kg|ml|l|liters?|pints?|quarts?|gallons?|cloves?|cans?|jars?|packages?|pkg|sticks?|pinch|dash|slices?|heads?|bunch(es)?|sprigs?|stalks?)\b/i;
const JUNK_RE = /^(advertisement|jump to recipe|print recipe|pin recipe|save recipe|share|rate this recipe|leave a comment|prep time|cook time|total time|yield|servings?|course|cuisine|calories|nutrition|author|by\s+\S+|equipment|notes?)\s*:?\s*$/i;
// Bare metadata values that trail a "Prep Time" / "Servings" label, e.g. "10 mins", "Serves 6".
const META_VALUE_RE = /^(\d+\s*(mins?|minutes?|hrs?|hours?|d|days?)(\s+\d+\s*(mins?|minutes?|hrs?|hours?))?|serves?\s+\d+|\d+\s*(servings?|people|calories|kcal|cal))\s*$/i;
// Section markers are NOT junk — they tell us where the ingredient / step zones begin.
const MARK_ING_RE = /^ingredients?\s*:?\s*$/i;
const MARK_STEP_RE = /^(instructions?|directions?|method|steps?|preparation)\s*:?\s*$/i;
const HEADER_RE = /^(for the .{2,40}|.{2,30}(topping|filling|crust|glaze|frosting|sauce|dough|marinade|batter|icing|dressing|streusel))\s*:?\s*$/i;

function looksLikeIngredient(line){
  if(/^[\d¼½¾⅓⅔⅛⅜⅝⅞]/.test(line)) return true;
  if(UNIT_RE.test(line) && line.length < 110) return true;
  if(/^(a|an|one|two|three|four|five|six|salt|pepper|water|oil|butter)\b/i.test(line) && line.length < 60) return true;
  return false;
}

// A line that reads like prose rather than an ingredient — used to find where
// instructions start on pages that have no "Instructions" heading at all.
function looksLikeSentence(line){
  return /[.!?]$/.test(line) || line.split(/\s+/).length > 10;
}

function smartParse(text){
  // Build ONE classified array. (Working with both a filtered and an unfiltered
  // copy is how the title used to leak into the ingredient list.)
  const lines = [];
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const line = raw.trim();
    if(!line || META_VALUE_RE.test(line) || JUNK_RE.test(line)) return;
    if(MARK_ING_RE.test(line))  { lines.push({kind:'mark-ing',  text:line}); return; }
    if(MARK_STEP_RE.test(line)) { lines.push({kind:'mark-step', text:line}); return; }
    lines.push({kind:'content', text:line});
  });
  if(!lines.some(l=>l.kind==='content')) return null;

  // Title: first content line that isn't itself an ingredient or a section header.
  let title = '', titleIdx = -1;
  for(let i=0;i<Math.min(lines.length,8);i++){
    const l = lines[i];
    if(l.kind!=='content') continue;
    if(l.text.length>=3 && l.text.length<=95 && !looksLikeIngredient(l.text) && !HEADER_RE.test(l.text)){
      title = l.text.replace(/\s*[|–-]\s*(recipe|allrecipes|food network|the [a-z ]+kitchen).*$/i,'').trim();
      titleIdx = i; break;
    }
  }
  if(!title){
    titleIdx = lines.findIndex(l=>l.kind==='content');
    title = lines[titleIdx].text.slice(0,90);
  }

  // If the page has an explicit "Ingredients" heading, everything between the
  // title and that heading is preamble (times, yields, blurb) — skip it.
  let start = titleIdx + 1;
  const ingMark = lines.findIndex((l,i)=>i>titleIdx && l.kind==='mark-ing');
  if(ingMark >= 0) start = ingMark + 1;

  const sections = [];
  let ingBuf = [], stepBuf = [];
  const flushIng = ()=>{ if(ingBuf.length){ sections.push({type:'ingredients', items:ingBuf.slice()}); ingBuf=[]; } };
  const flushStep = ()=>{ if(stepBuf.length){ sections.push({type:'steps', items:stepBuf.slice()}); stepBuf=[]; } };

  let mode = 'ing';
  for(let i=start;i<lines.length;i++){
    const {kind, text:line} = lines[i];

    if(kind==='mark-step'){ flushIng(); mode='steps'; continue; }
    if(kind==='mark-ing'){ flushStep(); mode='ing'; continue; }

    if(HEADER_RE.test(line) && line.length<45){
      flushIng(); flushStep();
      sections.push({type:'header', text: line.replace(/:\s*$/,'')});
      continue;
    }

    if(/^\d+[.)]\s+/.test(line)){          // "1. Preheat the oven"
      flushIng(); mode='steps';
      stepBuf.push(line.replace(/^\d+[.)]\s*/,''));
      continue;
    }

    if(mode==='ing'){
      if(looksLikeIngredient(line) && line.length<130){
        ingBuf.push(line);
      } else if(looksLikeSentence(line)){
        // Prose in the ingredient zone means the instructions have begun.
        flushIng(); mode='steps'; stepBuf.push(line);
      } else {
        ingBuf.push(line);               // short odd line, e.g. "Cooking spray"
      }
    } else {
      stepBuf.push(line);
    }
  }
  flushIng(); flushStep();
  if(!sections.length) return null;
  return {title, category: guessCategory(title, sections), sections};
}

function guessCategory(title, sections){
  const hay = (title+' '+sections.map(s=>s.type==='header'?s.text:(s.items||[]).join(' ')).join(' ')).toLowerCase();
  // NOTE: trailing s? on each keyword — "Cookies"/"Pies" must match as readily as "Cookie"/"Pie".
  const rules = [
    ['Soups & Stews', /\b(soups?|stews?|chowders?|bisques?|gumbos?|chili|broths?)\b/],
    ['Salads', /\bsalads?\b/],
    ['Cakes & Cheesecakes', /\b(cakes?|cheesecakes?|cupcakes?|frostings?)\b/],
    ['Pies & Tarts', /\b(pies?|tarts?|galettes?)\b/],
    ['Cookies & Bars', /\b(cookies?|brownies?|blondies?|bars?|shortbread|biscotti)\b/],
    ['Candy & Confections', /\b(fudge|caramels?|toffee|truffles?|brittle|candy|candies|taffy)\b/],
    ['Breads & Rolls', /\b(breads?|rolls?|biscuits?|scones?|muffins?|bagels?|focaccia|dough|loaf|loaves)\b/],
    ['Breakfast & Brunch', /\b(pancakes?|waffles?|omelets?|frittatas?|granola|oatmeal|breakfast|french toast|quiches?|crepes?)\b/],
    ['Beverages', /\b(smoothies?|cocktails?|lattes?|lemonade|punch|tea|coffee|juice|drinks?)\b/],
    ['Seafood Mains', /\b(salmon|shrimp|tuna|cod|halibut|crab|lobster|scallops?|tilapia|fish)\b/],
    ['Poultry Mains', /\b(chicken|turkey|duck)\b/],
    ['Meat Mains', /\b(beef|steaks?|pork|lamb|bacon|sausages?|meatloaf|brisket|ham|burgers?)\b/],
    ['Pasta, Rice & Grains', /\b(pasta|spaghetti|lasagna|risotto|noodles?|rice|quinoa|macaroni)\b/],
    ['Snacks & Appetizers', /\b(dips?|appetizers?|snacks?|pizzas?|nachos|wings|bruschetta|hummus)\b/],
    ['Sauces, Dressings & Condiments', /\b(sauces?|dressings?|marinades?|salsa|gravy|glazes?|vinaigrettes?)\b/],
    ['Vegetables & Sides', /\b(roasted|casseroles?|potato(es)?|vegetables?|sides?|greens|slaw)\b/],
  ];
  for(const [cat, re] of rules){ if(re.test(hay)) return cat; }
  return 'Other Desserts';
}

  document.getElementById('importer').innerHTML = `
    <button class="closeBtn" onclick="closeImporter()">✕</button>
    <h2 class="form-title">Import a Recipe from the Web</h2>
    <div class="form-sub">Grab a recipe from any website and drop it straight into your cookbook.</div>

    <div class="tabs">
      <button class="${state.importTab==='paste'?'active':''}" onclick="setImportTab('paste')">📋 Paste the recipe</button>
      <button class="${state.importTab==='url'?'active':''}" onclick="setImportTab('url')">🔗 Try a link</button>
    </div>

    ${state.importTab==='paste' ? `
      <div class="callout">
        <strong>How it works:</strong> open the recipe page, select the ingredients and instructions, copy them, and paste below.
        Then press <em>Read the Recipe</em> and it'll be sorted into a proper recipe card for you to review.
      </div>
      <div class="field">
        <textarea id="pasteBox" rows="12" placeholder="Paste the recipe here — title, ingredients, instructions, however messy it is."></textarea>
      </div>` : `
      <div class="callout">
        <strong>Heads up:</strong> most recipe sites block other pages from reading them directly, so a link won't always work.
        If it fails, just switch to <em>Paste the recipe</em> — that always works.
      </div>
      <div class="field">
        <label for="urlBox">Recipe web address</label>
        <input type="text" id="urlBox" placeholder="https://www.example.com/best-banana-bread">
      </div>`}

    ${msg || ''}

    <div class="form-actions">
      <div class="spacer"></div>
      <button class="btn secondary" onclick="closeImporter()">Cancel</button>
      ${hasKey
        ? `<button class="btn secondary" id="parseBtn" onclick="runImport(false)">Read without AI</button>
           <button class="btn green" id="aiBtn" onclick="runImport(true)">✨ Read with AI</button>`
        : `<button class="btn secondary" id="aiBtn" onclick="offerAiKey()" title="Set up AI">🔒 Read with AI</button>
           <button class="btn green" id="parseBtn" onclick="runImport(false)">Read the Recipe</button>`}
    </div>
    <div class="hint" style="text-align:right; margin-top:10px">
      ${hasKey
        ? 'AI handles messy pages better. “Read without AI” always works offline.'
        : 'AI is locked until you add a key — <a href="#" onclick="offerAiKey();return false;">set it up</a>. Everything else works without it.'}
    </div>`;
}
function setImportTab(t){ state.importTab = t; renderImporter(); }

// Clicking the locked AI button should explain itself and take you straight to setup.
function offerAiKey(){
  closeImporter();
  openSettings();
}

function importMsg(kind, html){
  return `<div class="callout ${kind}">${html}</div>`;
}

async function runImport(useAI){
  const btn = document.getElementById(useAI?'aiBtn':'parseBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Reading…';
  let sourceUrl = '';

  try{
    let text = '';
    if(state.importTab==='paste'){
      text = document.getElementById('pasteBox').value.trim();
      if(!text) throw new Error('Paste the recipe text first.');
    } else {
      sourceUrl = document.getElementById('urlBox').value.trim();
      if(!sourceUrl) throw new Error('Enter a web address first.');
      if(!/^https?:\/\//i.test(sourceUrl)) sourceUrl = 'https://'+sourceUrl;
      const fetched = await fetchRecipePage(sourceUrl);
      if(fetched.structured){
        finishImport(fetched.structured, sourceUrl);
        return;
      }
      text = fetched.text;
    }

    let parsed;
    if(useAI){
      parsed = await aiParse(text);
    } else {
      parsed = smartParse(text);
      if(!parsed) throw new Error("Couldn't find a recipe in that text. Try including the ingredients and instructions.");
    }
    finishImport(parsed, sourceUrl);
  }catch(err){
    btn.disabled = false;
    btn.innerHTML = original;
    renderImporter(importMsg('err', '<strong>Didn\'t work:</strong> '+esc(err.message)));
  }
}

async function fetchRecipePage(url){
  let res;
  try{
    res = await fetch(url, {headers:{'Accept':'text/html'}});
  }catch(e){
    throw new Error('That site wouldn\'t let this page read it (browsers block that for security). Switch to the "Paste the recipe" tab — copy the recipe text and paste it in, and it\'ll work fine.');
  }
  if(!res.ok) throw new Error('The site returned an error ('+res.status+'). Try pasting the recipe text instead.');
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Best case: schema.org Recipe embedded as JSON-LD
  const structured = extractJsonLdRecipe(doc);
  if(structured) return {structured};

  doc.querySelectorAll('script,style,nav,header,footer,noscript,iframe,svg').forEach(n=>n.remove());
  const text = (doc.body ? doc.body.innerText || doc.body.textContent : '') || '';
  return {text: text.replace(/\n{3,}/g,'\n\n').trim()};
}

function extractJsonLdRecipe(doc){
  const blocks = [...doc.querySelectorAll('script[type="application/ld+json"]')];
  for(const b of blocks){
    let data;
    try{ data = JSON.parse(b.textContent); }catch(e){ continue; }
    const queue = Array.isArray(data) ? data.slice() : [data];
    while(queue.length){
      const node = queue.shift();
      if(!node || typeof node!=='object') continue;
      if(Array.isArray(node['@graph'])) queue.push(...node['@graph']);
      const type = node['@type'];
      const isRecipe = type==='Recipe' || (Array.isArray(type) && type.includes('Recipe'));
      if(!isRecipe) continue;

      const ings = (node.recipeIngredient || node.ingredients || []).map(s=>String(s).trim()).filter(Boolean);
      let steps = [];
      const ri = node.recipeInstructions;
      if(typeof ri === 'string'){
        steps = ri.split(/\n+|(?<=\.)\s{2,}/).map(s=>s.trim()).filter(Boolean);
      } else if(Array.isArray(ri)){
        ri.forEach(step=>{
          if(typeof step==='string') steps.push(step.trim());
          else if(step && step.text) steps.push(String(step.text).trim());
          else if(step && Array.isArray(step.itemListElement)){
            step.itemListElement.forEach(s=>{ if(s && s.text) steps.push(String(s.text).trim()); });
          }
        });
      }
      steps = steps.filter(Boolean);
      if(!ings.length && !steps.length) continue;

      const sections = [];
      if(ings.length) sections.push({type:'ingredients', items:ings});
      if(steps.length) sections.push({type:'steps', items:steps});
      const title = String(node.name || 'Imported Recipe').trim();
      let photo = null;
      const img = node.image;
      if(typeof img==='string') photo = img;
      else if(Array.isArray(img) && img.length) photo = typeof img[0]==='string'?img[0]:(img[0]&&img[0].url);
      else if(img && img.url) photo = img.url;
      return {title, category: guessCategory(title, sections), sections, remotePhoto: photo};
    }
  }
  return null;
}

async function aiParse(text){
  const prompt = `Convert this recipe into JSON. Return ONLY the JSON object, no explanation, no markdown fences.

Schema:
{"title": string,
 "category": one of ${JSON.stringify(CATEGORY_ORDER)},
 "sections": [ {"type":"header","text":string} | {"type":"ingredients","items":[string]} | {"type":"steps","items":[string]} ]}

Rules:
- Keep ingredient amounts exactly as written (e.g. "1 1/2 cups flour").
- Use a "header" section before an ingredient or step group when the recipe has parts (e.g. "For the Glaze").
- Steps must be individual actions, no leading numbers.
- Ignore ads, navigation, comments and nutrition tables.

Recipe text:
"""
${text.slice(0, 14000)}
"""`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: state.model,
      max_tokens: 4000,
      messages:[{role:'user', content: prompt}]
    })
  });

  if(!res.ok){
    let detail = '';
    try{ const e = await res.json(); detail = (e.error && e.error.message) || ''; }catch(_){}
    if(res.status===401) throw new Error('That API key was rejected. Check it in AI Settings.');
    if(res.status===429) throw new Error('The AI is rate-limited right now — wait a moment and try again, or use "Read the Recipe" instead.');
    throw new Error('AI request failed ('+res.status+'). '+detail+' You can still use "Read the Recipe".');
  }
  const data = await res.json();
  let raw = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  raw = raw.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const start = raw.indexOf('{'), end = raw.lastIndexOf('}');
  if(start<0 || end<0) throw new Error('The AI returned something unexpected. Try "Read the Recipe" instead.');
  let parsed;
  try{ parsed = JSON.parse(raw.slice(start, end+1)); }
  catch(e){ throw new Error('The AI reply couldn\'t be read as a recipe. Try again, or use "Read the Recipe".'); }
  if(!parsed.sections || !parsed.sections.length) throw new Error('The AI didn\'t find a recipe in that text.');
  if(!CATEGORY_ORDER.includes(parsed.category)) parsed.category = guessCategory(parsed.title||'', parsed.sections);
  return parsed;
}

function finishImport(parsed, sourceUrl){
  state.importResult = parsed;
  const c = countsFor(parsed.sections);
  const preview = `
    <div class="preview-box">
      <h4>${esc(parsed.title)}</h4>
      <div class="d-meta" style="margin-bottom:10px">${CATEGORY_ICONS[parsed.category]||''} ${esc(parsed.category)} · ${c.ing} ingredients · ${c.steps} steps</div>
      ${parsed.sections.map(s=>{
        if(s.type==='header') return `<div class="sec-header">${esc(s.text)}</div>`;
        if(s.type==='ingredients') return '<ul class="ing-list">'+s.items.map(i=>`<li><span>${esc(i)}</span></li>`).join('')+'</ul>';
        if(s.type==='steps') return '<ol class="steps">'+s.items.map(i=>`<li>${esc(i)}</li>`).join('')+'</ol>';
        return `<p class="d-text">${esc(s.text||'')}</p>`;
      }).join('')}
    </div>`;

  document.getElementById('importer').innerHTML = `
    <button class="closeBtn" onclick="closeImporter()">✕</button>
    <h2 class="form-title">Here's what I found</h2>
    <div class="form-sub">Give it a quick look. You can fix anything on the next screen before it's saved.</div>
    ${preview}
    ${parsed.remotePhoto ? `<div class="hint" style="margin-top:10px">📷 This recipe has a photo online. Photos aren't copied automatically — you can add your own on the next screen.</div>` : ''}
    <div class="form-actions">
      <div class="spacer"></div>
      <button class="btn secondary" onclick="renderImporter()">← Back</button>
      <button class="btn green" onclick="sendImportToEditor('${esc(sourceUrl||'')}')">Looks good — Review &amp; Save</button>
    </div>`;
}

function sendImportToEditor(sourceUrl){
  const p = state.importResult;
  if(!p) return;
  closeImporter();
  openEditor(null, {title:p.title, category:p.category, sections:p.sections, tags:[], photo:null, sourceUrl: sourceUrl||''});
}

/* ---------- settings ---------- */

    <button class="closeBtn" onclick="closeSettings()">✕</button>
    <h2 class="form-title">AI Settings</h2>
    <div class="form-sub">Optional. Everything in this cookbook works without it — an AI key just makes web imports handle messy pages better.</div>

    <div class="callout ${state.apiKey?'ok':''}">
      <strong>${state.apiKey ? 'AI is on.' : 'AI is off right now.'}</strong>
      ${state.apiKey
        ? 'The ✨ Read with AI button is available when you import a recipe.'
        : 'Paste a key below to switch it on. Until then, the importer\'s “Read the Recipe” button still works on its own.'}
    </div>

    <div class="callout">
      <strong>Where to get a key:</strong> <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> → Create Key → copy it here.
      This is a separate, pay-as-you-go account from a Claude subscription; each recipe import costs a fraction of a cent.
      <br><br>
      <strong>Your key stays on this computer.</strong> It's saved in this browser only and is sent straight to Anthropic when you import — never to anyone else.
    </div>

    <div class="field">
      <label for="sKey">Anthropic API key</label>
      <input type="text" id="sKey" value="${esc(state.apiKey)}" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="sModel">Model</label>
      <select id="sModel">
        <option value="claude-sonnet-5" ${state.model==='claude-sonnet-5'?'selected':''}>Claude Sonnet 5 — balanced (recommended)</option>
        <option value="claude-opus-5" ${state.model==='claude-opus-5'?'selected':''}>Claude Opus 5 — most capable</option>
        <option value="claude-haiku-4-5-20251001" ${state.model==='claude-haiku-4-5-20251001'?'selected':''}>Claude Haiku 4.5 — fastest &amp; cheapest</option>
      </select>
    </div>

    <div class="form-actions">
      <button class="btn secondary" onclick="clearKey()">Remove Key</button>
      <div class="spacer"></div>
      <button class="btn secondary" onclick="closeSettings()">Cancel</button>
      <button class="btn green" onclick="saveSettings()">Save</button>
    </div>`;
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsOverlay').classList.remove('open'); }
function saveSettings(){
  const key = document.getElementById('sKey').value.trim();
  if(key && !/^sk-ant-/.test(key)){
    if(!confirm('That doesn\'t look like an Anthropic key (they start with "sk-ant-").\n\nSave it anyway?')) return;
  }
  state.apiKey = key;
  state.model = document.getElementById('sModel').value;
  localStorage.setItem(LS_KEY, state.apiKey);
  localStorage.setItem(LS_MODEL, state.model);
  closeSettings();
  updateAiIndicator();
  if(key) alert('AI is on. Open “Import from the Web” and you\'ll see the ✨ Read with AI button.');
}
function clearKey(){
  state.apiKey='';
  localStorage.removeItem(LS_KEY);
  closeSettings();
  updateAiIndicator();
}

/* ---------- export / import backup ---------- */
function exportData(){
  const payload = {
    app:"Cindy's Magnificent Cookbook",
    version:2,
    exported:new Date().toISOString(),
    recipes: state.customRecipes,
    favorites: [...state.favorites],
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cindys-cookbook-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert("That file couldn't be read. Make sure it's a backup file created by this cookbook."); return; }
    const incoming = data.recipes || [];
    if(!Array.isArray(incoming)){ alert('That backup file looks damaged.'); return; }

    const existingIds = new Set(state.customRecipes.map(r=>r.id));
    let added=0, skipped=0;
    incoming.forEach(r=>{
      if(!r || !r.id || !r.title) return;
      if(existingIds.has(r.id)){ skipped++; return; }
      r.custom = true;
      if(!r.sections) r.sections = [];
      if(r.ingCount==null || r.stepCount==null){
        const c = countsFor(r.sections); r.ingCount=c.ing; r.stepCount=c.steps;
      }
      state.customRecipes.push(r); added++;
    });
    (data.favorites||[]).forEach(id=>state.favorites.add(id));
    if(saveCustom()){
      saveFavorites();
      render();
      alert('Restored '+added+' recipe'+(added===1?'':'s')+(skipped?' ('+skipped+' already in your cookbook)':'')+'.');
    }
  };
  reader.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', (e)=>{
  const navBtn = e.target.closest('.nav-item');
  if(navBtn){
    closeSidebar();
    if(navBtn.dataset.cat){ state.category = navBtn.dataset.cat; state.view='all'; }
    else { state.category = null; state.view = navBtn.dataset.view; }
    render();
    return;
  }
  const li = e.target.closest('.ing-list li');
  if(li && li.dataset.cid){
    const cid = li.dataset.cid;
    if(state.checked.has(cid)) state.checked.delete(cid); else state.checked.add(cid);
    li.classList.toggle('checked');
    const cb = li.querySelector('input[type=checkbox]');
    if(cb) cb.checked = state.checked.has(cid);
  }
});

document.getElementById('search').addEventListener('input', e=>{
  state.query = e.target.value;
  if(state.view==='index' && state.query) state.view='all';
  render();
});
document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });
document.getElementById('importFile').addEventListener('change', e=>{
  if(e.target.files[0]) importData(e.target.files[0]);
  e.target.value='';
});

document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); document.getElementById('search').focus();
  }
  if(e.key==='Escape'){
    closeDetail(); closeEditor(); closeImporter(); closeSettings(); closeSidebar();
  }
});

render();
</script>

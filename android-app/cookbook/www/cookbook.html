of rice."}]}, {"id": "chicken-noodle-soup", "title": "Chicken Noodle Soup", "category": "Soups & Stews", "pages": [64], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "2 boneless skinless chicken breasts cut into small pieces 4 ribs of celery chopped Small handful of shredded carrots chopped 3 cloves of garlic minced Onion powder to taste Cavender Greek seasoning to taste Season salt to taste Fresh ground pepper to taste Chicken base or chicken stock Uncooked small noodles"}, {"type": "text", "text": "Brown chicken in a dutch oven. Add celery and shredded carrots with all seasoning to meat. Cook until everything is done. Cover with water chicken base mixture or chicken broth just above the mixture. Bring to a boil and add noodles. Cook until noodles are done and then serve."}]}, {"id": "chicken-pasta-salad", "title": "Chicken Pasta Salad (Version 1)", "category": "Salads", "pages": [65], "tags": [], "ingCount": 9, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["8 oz. spiral pasta", "2 c. cubed cooked chicken breasts", "1 ( 8 oz. ) can sliced water chestnuts, drained", "1/3 c. thinly sliced green onions", "½ c. chopped celery", "1 ( 10 oz. ) box frozen snow peas, thawed Salt and pepper to taste"]}, {"type": "text", "text": "Cook pasta according to directions on package omitting oil. Cook and drain. Combine pasta with remaining ingredients and toss with dressing, ( see recipe below ). Refrigerate before serving. Serves: 6 servings. Great way to use leftover chicken. The sherry gives this salad a different flavor."}, {"type": "header", "text": "Dressing"}, {"type": "ingredients", "items": ["¼ c. nonfat yogurt", "3 tbsp light soy sauce", "1 tbsp sherry"]}, {"type": "text", "text": "Mix all ingredients together."}]}, {"id": "chicken-pasta-salad-2", "title": "Chicken Pasta Salad (Version 2)", "category": "Salads", "pages": [104], "tags": [], "ingCount": 9, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["8 oz. spiral pasta", "2 c. cubed cooked chicken breasts", "1 ( 8 oz. ) can sliced water chestnuts, drained", "1/3 c. thinly sliced green onions", "½ c. chopped celery", "1 ( 10 oz. ) box frozen snow peas, thawed Salt and pepper to taste"]}, {"type": "text", "text": "Cook pasta according to directions on package omitting oil. Cook and drain. Combine pasta with remaining ingredients and toss with dressing, ( see recipe below ). Refrigerate before serving. Serves: 6 servings. Great way to use leftover chicken. The sherry gives this salad a different flavor."}, {"type": "header", "text": "Dressing"}, {"type": "ingredients", "items": ["¼ c. nonfat yogurt", "3 tbsp light soy sauce", "1 tbsp sherry"]}, {"type": "text", "text": "Mix all ingredients together."}]}, {"id": "chicken-strips-in-garlic", "title": "Chicken Strips in Garlic", "category": "Poultry Mains", "pages": [66], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 lbs chicken strips", "1 cup butter", "½ cup flour Parsley", "3 cloves garlic", "1 can condensed chicken broth"]}, {"type": "text", "text": "Dredge chicken strips with flour, salt, and pepper. Melt ½ cup butter and 2 cloves chopped garlic. Sauté chicken in butter and garlic. In casserole dish, melt remaining butter and chopped garlic. Place chicken and drippings in dish. Sprinkle with parsley. Pour broth over all. Bake 325 degrees for 35 minutes, uncovered. Stir occasionally."}]}, {"id": "chicken-vegetable-soup", "title": "Chicken Vegetable Soup", "category": "Soups & Stews", "pages": [67], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 tbsp butter", "2 medium onions, thinly sliced", "1 green bell pepper, sliced", "1 large carrot, sliced", "2 stalks celery, sliced", "1 turnip, diced", "1 parsnip, sliced", "½ chicken, cut in pieces", "4 chicken bouillon cubes", "3 sprigs parsley, chopped Salt and pepper to taste"]}, {"type": "text", "text": "Melt butter in a stock pot, lightly sautee vegetables. Add remaining ingredients and 1 ½ quarts of water, bring to a boil over medium heat. Reduce heat and simmer, partially covered, stirring occasionally, for 1 ½ hours. Season with salt and pepper. Serve with warm noodles or rice."}]}, {"id": "chili", "title": "Chili", "category": "Soups & Stews", "pages": [69], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "1 lb 93% fat free hamburger meat 1 large can Bush’s beans in mild chili sauce 1 to 2 packets of Kroger brand chili packet ( has to be Kroger brand ) Onion powder to taste Fresh garlic to taste Cavender Greek Seasoning Creole seasoning Season salt to taste Parsley flakes to taste Chopped chives to taste Worcestershire sauce to taste Soy sauce to taste Fresh ground pepper to taste Shredded cheddar cheese"}, {"type": "text", "text": "Cook hamburger meat and seasoning except Kroger chili seasoning in large pot until done. Add chili beans and Kroger brand chili packet to seasoned meat. Cook for about 30 minutes. Serve with shredded cheese and corn chips."}]}, {"id": "chilled-cucumber-soup-with-shrimp", "title": "Chilled Cucumber Soup with Shrimp", "category": "Soups & Stews", "pages": [70], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 (17 ounce) containers Greek yogurt", "1 ½ cups half and half", "3 hothouse cucumbers unpeeled, seeded and chopped", "¾ cup chopped red onion", "9 scallions, white and green parts, chopped", "2 tbsp kosher salt", "1 tbsp freshly ground black pepper", "¼ cup chopped fresh dill", "¾ cup freshly squeezed lemon juice (6 lemons)", "¾ pound cooked large shrimp, halved Thin slices of lemon, halved, for garnish Fresh dill for garnish"]}, {"type": "text", "text": "In a large mixing bowl, stir together the yogurt, half and half, cucumbers, red onion, scallions, salt and pepper. Transfer the mixture in batches to the bowl of a food processor fitted with the steel blade. Process until the cucumbers are coarsely pureed and then pour into another bowl. Continue processing the soup until all of it is pureed. Fold in the dill, cover with plastic wrap and refrigerate for at least 2 hours, until very cold. Just before serving, stir in the lemon juice. Serve chilled, garnished with the shrimp, lemon, and fresh dill."}]}, {"id": "chocolate-cake-roll", "title": "Chocolate Cake Roll", "category": "Breads & Rolls", "pages": [71, 72, 73], "tags": [], "ingCount": 11, "stepCount": 5, "sections": [{"type": "header", "text": "For the Cake"}, {"type": "ingredients", "items": ["½ c. flour", "1/3 c. unsweetened cocoa powder", "2 tbsp cornstarch", "½ tsp baking powder", "½ tsp baking soda", "1/3 tsp salt", "4 large eggs", "1 c. granulated sugar, divided Confectioners sugar"]}, {"type": "header", "text": "For the Filling"}, {"type": "text", "text": "1 container ( 8 oz. frozen ) whipped topping, thawed or spread softened ice cream Roll as directed and wrap well. Freeze cake, until firm"}, {"type": "header", "text": "Making the Cake"}, {"type": "steps", "items": ["Preheat oven to 250 degrees. Line a 15x10 inch jelly roll pan with wax paper. Grease and flour lined pan; tap out the excess.", "In medium bowl, combine flour, cocoa powder, cornstarch, baking powder, baking soda, and salt. Mix well. In a separate bowl, using an electric mixer set on medium speed, beat egg yolks and ¼ cup sugar until fluffy.", "In a small bowl, using clean beaters, beat egg whites on high until foamy. Gradually add ½ cup sugar, beating until stiff, but not dry, peaks form.", "Fold 1/3 beaten egg whites into egg yolk mixture. Alternately fold in remaining whites and flour mixture. Pour batter in pan, smooth top. Bake until a toothpick inserted in center comes out clean, about 15 minutes."]}, {"type": "header", "text": "Rolling and Filling the Cake"}, {"type": "ingredients", "items": ["1. Dust a clean cheese cloth with remaining sugar. Turn cake out onto prepared cloth, remove wax paper. Trim the cake's edge.", "2. Start with a long side, tightly roll cake with cloth. Transfer cake, seam-side, to a wire rack to cool.", "3. Unroll cake, remove cloth. Spread whipped topping over cake to within ½ inch of edge. Re-roll cake; place seam-side down on a plate. Dust with confectioners sugar before serving."]}]}, {"id": "chocolate-chip-toffee-bars-makes-about-36-bars", "title": "Chocolate Chip Toffee Bars (Makes about 36 Bars)", "category": "Cookies & Bars", "pages": [74], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 1/3 c. all-purpose flour", "1 c. coarsely chopped nuts", "2/3 c. firmly packed brown sugar", "1 ( 14 oz. ) can sweetened condensed milk ( not evaporated milk )", "¾ c. margarine or butter", "1 egg, slightly beaten", "1 ( 12 oz. ) package semi-sweet chocolate chips", "1 ( 10 oz.) package toffee bits"]}, {"type": "text", "text": "Preheat oven to 350 degrees. In bowl, stir together flour and sugar. Cut margarine until mixture resembles coarse crumbs. Add egg mix well. Stir in 1 ½ cups of chocolate chips and nuts. Reserve 1 ½ cups mixture. Press remaining crumb mixture onto bottom of 13x9 inch greased baking pan. Bake 10 minutes. Pour sweetened condensed milk evenly over crust; top with 1 ½ cups chips over the top. Bake 25 minutes or until golden brown. Sprinkle with remaining ¼ cup toffee bits. Cool ; cut into bars."}]}, {"id": "chocolate-glazed-cheesecake", "title": "Chocolate Glazed Cheesecake (Version 1)", "category": "Sauces, Dressings & Condiments", "pages": [75, 76], "tags": [], "ingCount": 12, "stepCount": 5, "sections": [{"type": "header", "text": "Graham Cracker Crust"}, {"type": "ingredients", "items": ["1 c. graham cracker, crushed", "¼ c. butter", "7 tbsp sugar"]}, {"type": "text", "text": "Mix together and put in a spring form pan. Bake at 350 degrees for 8 minutes. Take out of oven and let cool."}, {"type": "header", "text": "Cheesecake"}, {"type": "ingredients", "items": ["3 blocks of cream cheese room temperature mixed until smooth", "1 c. sugar Beat until fluffy", "1 tsp vanilla Add to mixture", "3 eggs Add to mixture"]}, {"type": "text", "text": "Mix well. Pour batter into graham cracker crust. Put on sheet pan and bake at 350 degrees for 45 minutes. Take out and let cool for 8 hours."}, {"type": "header", "text": "Chocolate Glaze"}, {"type": "ingredients", "items": ["½ stick butter, melted", "2 oz. Semi-sweet chocolate chopped up", "½ c. heavy cream", "¾ c. sugar Pinch of salt", "¼ c. cocoa powder"]}, {"type": "text", "text": "Let everything melt together in a saucepan. Stirring constantly. Once melted add a touch of vanilla extract."}, {"type": "text", "text": "Drizzle chocolate glaze all over cooled cheesecake. Then serve."}, {"type": "text", "text": "Optional: powder sugar with fresh strawberries and raspberries as additional toppings with chocolate glaze."}]}, {"id": "chocolate-glazed-cheesecake-2", "title": "Chocolate Glazed Cheesecake (Version 2)", "category": "Sauces, Dressings & Condiments", "pages": [111, 112], "tags": [], "ingCount": 12, "stepCount": 5, "sections": [{"type": "header", "text": "Graham Cracker Crust"}, {"type": "ingredients", "items": ["1 c. graham cracker, crushed", "¼ c. butter", "7 tbsp sugar"]}, {"type": "text", "text": "Mix together and put in a spring form pan. Bake at 350 degrees for 8 minutes. Take out of oven and let cool."}, {"type": "header", "text": "Cheesecake"}, {"type": "ingredients", "items": ["3 blocks of cream cheese room temperature mixed until smooth", "1 c. sugar Beat until fluffy", "1 tsp vanilla Add to mixture", "3 eggs Add to mixture"]}, {"type": "text", "text": "Mix well. Pour batter into graham cracker crust. Put on sheet pan and bake at 350 degrees for 45 minutes. Take out and let cool for 8 hours."}, {"type": "header", "text": "Chocolate Glaze"}, {"type": "ingredients", "items": ["½ stick butter, melted", "2 oz. Semi-sweet chocolate chopped up", "½ c. heavy cream", "¾ c. sugar Pinch of salt", "¼ c. cocoa powder"]}, {"type": "text", "text": "Let everything melt together in a saucepan. Stirring constantly. Once melted add a touch of vanilla extract."}, {"type": "text", "text": "Drizzle chocolate glaze all over cooled cheesecake. Then serve."}, {"type": "text", "text": "Optional: powder sugar with fresh strawberries and raspberries as additional toppings with chocolate glaze."}]}, {"id": "chocolate-pecan-crispy-treats", "title": "Chocolate Pecan Crispy Treats", "category": "Candy & Confections", "pages": [77], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 tbsp salted butter, plus extra for greasing pan", "10 ounces large marshmallows", "1/8 tsp salt", "1/3 cup chocolate-hazelnut spread", "5 ounces semisweet chocolate", "6 cups crisped rice cereal", "1 ½ cups miniature marshmallows", "1 cup pecans, finely chopped"]}, {"type": "text", "text": "Thoroughly grease a 9 by 11 inch pan and set aside. Melt the butter in a large saucepan over medium- low heat. Add the marshmallows and salt and stir until melted. Halfway through the melting process, add the chocolate-hazelnut spread and stir until smooth. Meanwhile, melt the semisweet chocolate over a double boiler until smooth. Remove from the heat and let it cool quite a bit. Add the crisped rice cereal to a large bowl and fold in the marshmallows mixture. When it’s almost all combined, add the mini marshmallows and continue folding until everything’s combined. Immediately press the mixture into the prepared pan. Sprinkle with half the pecans. Drizzle the chocolate in zigzags all over the top of the treats. Sprinkle the remaining pecans on top. Allow to set, then cut into squares."}]}, {"id": "chocolate-stripe-krispies", "title": "Chocolate Stripe Krispies", "category": "Pies & Tarts", "pages": [78], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. softened butter", "1 c. sugar", "2 eggs", "1 tsp. vanilla", "1 tsp. baking soda", "½ tsp. salt", "1 ¾ c. flour", "3 c. corn flakes", "1 ( 6 oz. ) pkg. chocolate pieces"]}, {"type": "text", "text": "Cream butter and sugar until light and fluffy. Beat eggs 1 at a time and then add vanilla. Mix in soda and salt. Add flour. Crush corn flakes and add to mixture. Melt chocolate in double broiler. Swirl through batter leaving streaks. Then add chocolate to the corn flake mixture. Drop by spoon on ungreased cookie sheet. Bake at 375 degrees for 12 minutes or until done. Makes 4 dozen"}]}, {"id": "cinnamon-flop", "title": "Cinnamon Flop", "category": "Breads & Rolls", "pages": [79], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "header", "text": "Stir Together"}, {"type": "ingredients", "items": ["1 ½ c. sugar", "2 tbsp. soft butter", "1 beaten egg", "2 tsp. baking powder", "2 c. flour"]}, {"type": "text", "text": "Add to creamed mixture alternately with 1 cup of milk. Pour into greased square pan. Mix together until crumbly 1 cup sugar, 2 teaspoon cinnamon, and ½ cup butter. Sprinkle over top and bake 20 to 30 minutes at 425 degrees."}]}, {"id": "cioppino", "title": "Cioppino", "category": "Soups & Stews", "pages": [80, 81], "tags": [], "ingCount": 16, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["¼ c. olive oil", "3 tbsp butter", "2 onions, thinly sliced", "4 cloves of garlic, minced", "½ lb mushrooms, sliced", "1 green bell pepper, sliced", "1 can (28 oz.) plum tomatoes with juice", "1 can (6 oz.) tomato paste", "2 tbsp dried basil", "1 tbsp orange zest", "1 tbsp freshly ground pepper", "2 cups dry white wine", "2 lbs cod, red snapper, or halibut", "¾ lbs scallops", "1 lb mussels or clams debearded", "¾ lb medium shrimp, shelled and devained Orange slices Sliced sour dough bread"]}, {"type": "text", "text": "Heat olive oil and butter in a stock pot over medium heat, sauté onion and garlic until tender. Add mushrooms and green peppers, sauté until soft. Stir in tomatoes, tomato paste, spices, and wine, simmer, covered for 20 minutes. Stir in fish and scallops. Add additional wine to cover, if necessary, cook 10 minutes. Add mussels and shrimp. Cover and cook until clams open discard any unopened shells. Serve from soup tureen with orange slices and sour dough bread."}]}, {"id": "clam-chowder", "title": "Clam Chowder", "category": "Soups & Stews", "pages": [82], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 large onion, thinly sliced", "1 lb potatoes, diced", "1 pint fresh clams or 3 cans ( 6 ½ oz each ) minced clams with liquid", "1 pint half and half or milk", "3 tbsp butter Crackers"]}, {"type": "text", "text": "Cover vegetables with water in a large sauce pan. Cook over medium heat, partially covered, until vegetables are tender, stirring occasionally. Stir in clams and simmer 5 minutes. Add half and half, butter, and serve with crackers."}]}, {"id": "classic-pie-crust", "title": "Classic Pie Crust", "category": "Pies & Tarts", "pages": [83], "tags": [], "ingCount": 4, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["2 cups all purpose flour", "1 tsp salt", "¾ cup well chilled Crisco all vegetable shortening", "4 to 8 tbsp ice cold water"]}, {"type": "text", "text": "Blend flour and salt in large bowl. Cut shortening into flour mixture with pastry blender or fork until course crumbs form. Stir enough water with fork just until dough holds together. Divide dough in half. Shape into ½ inch thick disks. Wrap in plastic wrap. Chill 30 minutes. Roll out each disk. 2 inches large than pie plate on lightly floured surface. Line pie plate with 1 unbaked pie crust. Fill crust according to recipe directions. Top with remaining unbaked pie crust. Bake according to recipe directions. Makes 2 ( 9 inch ) single crusts or 1 ( 9 inch ) double crust pie."}, {"type": "text", "text": "The secret: Everything has to be ice cold. Do not let the ingredients get warm at all. The colder the pie crust ingredients the easier the dough is to work with."}]}, {"id": "country-style-chicken-kiev", "title": "Country Style Chicken Kiev", "category": "Poultry Mains", "pages": [84], "tags": [], "ingCount": 17, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["½ c. fine bread crumbs", "2 tbsp parmesan cheese", "1 tsp oregano", "1 tsp basil", "½ tsp garlic salt", "¼ tsp salt", "2/3 c. butter, melted", "4 chicken breasts, halved", "¼ c. white wine", "¼ c. chopped green onions", "1 tsp parsley"]}, {"type": "ingredients", "items": ["1. Preheat oven at 375 degrees.", "2. Combine first six ingredients.", "3. Dip chicken in butter, then bread crumbs mixture.", "4. Place prepared chicken in baking dish.", "5. Bake 50-60 minutes.", "6. To remaining butter, add wine, onion, and parsley when chicken is golden brown, pour butter over chicken. Continue baking 3-5 minutes."]}]}, {"id": "cowgirl-quiche", "title": "Cowgirl Quiche", "category": "Breakfast & Brunch", "pages": [85, 86, 87], "tags": [], "ingCount": 15, "stepCount": 9, "sections": [{"type": "header", "text": "Chive Pie Crust"}, {"type": "ingredients", "items": ["3 cups of all-purpose flour or pastry flour… plus more for rolling (comes later)", "1 tbsp chopped chives", "1 tsp salt", "¾ cup cold salted butter, cut into chunks", "¾ cup cold vegetable shortening, cut into chunks", "1 tbsp distilled white vinegar", "1 large egg, lightly beaten"]}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["2 leeks, tops and bottoms trimmed, cut in half lengthwise", "16 oz. white mushrooms, sliced", "2 tbsp salted butter", "1 cup heavy cream", "8 large eggs", "2 cups grated swiss cheese Salt and freshly ground pepper", "1 tbsp pesto", "8 thin slices prosciutto (or any good ham), chopped"]}, {"type": "text", "text": "Preheat oven to 400 degrees F."}, {"type": "text", "text": "For the chive pie crust: Mix the flour, chives, and salt in a bowl. Add the butter and vegetable shortening and work them into the flour using a pastry cutter until the mixture resembles tiny pebbles. Using a fork, stir in the vinegar, beaten egg and 5 tbsp of cold water. Stir the mixture until just combined. Shape the dough into 2 discs. (You’ll only be using 1 disc for this recipe. You can wrap the additional dough in plastic wrap for storage, it will keep up to a week in the fridge or up to 6 months in the freezer.)"}, {"type": "text", "text": "Have ready 2 sheets of parchment paper that are each at least 12 inches square. Place the disc of dough between them. (If the dough is sticky for any reason, don’t worry. Just sprinkle some flour on the parchment to get started. You shouldn’t have to add much for it to stop sticking.) Starting at the center, roll the pin out to the edge. Turn the dough and parchment as necessary and continue rolling, always for the center to the outer edge. After a couple of rolls, lift the parchment paper away for the dough to loosen and replace the parchment. Flip the whole thing and loosen the other paper sheet. Continue rolling until the dough is large enough for your pie pan."}, {"type": "text", "text": "For the filling: Slice the leeks thinly, and then soak them in cold water for about 10 minutes to remove any grit or dirt. Drain well."}, {"type": "text", "text": "Put mushrooms on a large baking sheet. Roast until golden brown, 15 to 20 minutes. Set aside."}, {"type": "text", "text": "Meanwhile, in a large skillet over medium heat, sautee the leeks in the butter until golden brown and beginning to caramelize, 8 to 10 minutes. Set aside."}, {"type": "text", "text": "For the quiche base: Add the cream and eggs to a medium bowl and whisk them to combine. Stir in the leeks, mushrooms, grated swiss cheese and some salt and pepper. Mix in the pesto and prosciutto. The mixture should be very thick."}, {"type": "text", "text": "Pour the mixture into the pie shell, then cover loosely with a sheet of aluminum foil to prevent it from getting to brown on top. Bake for 45 minutes, then remove the foil and bake for an additional 10 minutes. Remove from the oven and allow the quiche to sit for at least 10 minutes before serving."}, {"type": "text", "text": "Place quiche on a cutting board and slice wedges with a serrated knife."}]}, {"id": "crab-meat-salad", "title": "Crab Meat Salad", "category": "Salads", "pages": [88], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "1 package of crab meat 1 cup of mayo 1/2 to 1 sweet onion, chopped 3 to 4 stalks of celery, chopped Fresh parsley, chopped Fresh minced garlic Salt and Pepper to taste (You can even add cooked salad shrimp to this if you wanted to) Fresh lemon juice (1/2 to 2 lemons depends on how much you want)"}, {"type": "text", "text": "Mix everything together. Taste it to make sure it is not needing anything. Serve on a nice fresh roll or bread of your choice or serve over top of a salad."}]}, {"id": "cream-cheese-filled-banana-bread", "title": "Cream Cheese Filled Banana Bread", "category": "Breads & Rolls", "pages": [89, 90, 91], "tags": [], "ingCount": 18, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["9X5 inch loaf pan Cook Time: About 48 to 50 minutes"]}, {"type": "header", "text": "Ingredients"}, {"type": "header", "text": "Bread"}, {"type": "ingredients", "items": ["1 large egg", "½ cup light brown sugar packed", "¼ cup canola oil", "¼ cup sour cream", "2 tsp vanilla extract", "1 cup mashed ripe bananas ( about 2 large bananas )", "1 cup all-purpose flour", "½ tsp baking powder", "½ tsp baking soda Pinch of salt"]}, {"type": "header", "text": "Cream Cheese Filling"}, {"type": "ingredients", "items": ["1 large egg", "4 ounces softened brick style cream cheese", "¼ cup granulated sugar", "3 tbsp all-purpose flour"]}, {"type": "header", "text": "Directions"}, {"type": "ingredients", "items": ["1. Preheat oven to 350 degrees. Spray one 9x5 inch loaf pan with floured cooking spray or grease and flour the pan and set aside.", "2. Bread: In a large bowl add the egg, brown sugar, canola oil, sour cream, vanilla, and whisk to combine."]}, {"type": "ingredients", "items": ["3. Add the bananas and stir to incorporate.", "4. Add 1 cup flour, baking powder, baking soda, optional salt and fold with spatula or stir gently with a spoon until just combined, don't over mix, set aside."]}, {"type": "text", "text": "5. Turn about two-thirds of the batter out into the prepared pan, smoothing, the top lightly with a spatula and pushing it into corners and sides as necessary, set aside."}, {"type": "text", "text": "6. Cream cheese Filling: In a large bowl, add all ingredients and whisk to combine. Alternatively mix with a hand mixer. 7. Evenly pour filling mixture over the bread smoothing the top lightly with a spatula and pushing into corners and sides as necessary. 8. Top the remaining batter smoothing the top very lightly with a spatula as to not disturb cream cheese layer and pushing batter into corners and sides as necessary. 9. Bake for about 48 to 50 minutes or until the top is domed, golden and the center is set and a toothpick inserted in the center comes out clean or with a few moist crumbs but no batter. Note: This is tricky because the cream cheese never gets totally solid so the toothpick test isn't the most accurate. Tip: Tent the pan with a sheet of foil draped over it at the 30 minutes mark if you feel the top and sides will become to browned before center cooks through. Baking times will vary based on moisture content of bananas, cream cheese, climate and oven variances. Bake until done watch your bread not the clock."}, {"type": "text", "text": "10. Allow bread to cool in pan for about 15 minutes before turning out on a wire rack to cool completely before slicing and serving. Optionally serve bread with honey butter, cinnamon-sugar butter, blueberry butter, strawberry butter, or vanilla browned butter glaze. Bread will keep alright at room temperature for up to 1 week or in the freezer for up to 6 months."}]}, {"id": "cream-of-mushroom-soup", "title": "Cream of Mushroom Soup", "category": "Soups & Stews", "pages": [92], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["5 tbsp butter", "1 lb mushrooms, sliced", "1 quart chicken stock", "3 tbsp butter", "3 tbsp flour", "2 c. heavy cream or half and half", "½ tsp salt", "¼ tsp white pepper", "4 tbsp dry sherry", "¼ c. chopped chives"]}, {"type": "text", "text": "Melt butter in a saucepan; sautee mushrooms over medium heat, stirring often. Add stock and simmer, covered, for 15 minutes. Drain mushrooms, reserve stock. In a small saucepan, melt butter, whisk in flour until absorbed. Stir in 1 cup of the soup and cook until thickened, return to soup. Add cream and season to taste. Stir in sherry and sprinkle soup with chives."}]}, {"id": "cream-puffs", "title": "Cream Puffs", "category": "Other Desserts", "pages": [93], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ c. shortening", "¼ tsp. salt", "1 c. water", "1 c. sifted all-purpose flour", "4 large eggs or about 1 cup"]}, {"type": "text", "text": "Place shortening, salt, and water in 3 quart saucepan. Heat on high stirring until shortening is melted then bring to a rolling boil. Switch to low. Add flour all at once. Beat vigorously continuing to cook until mixture is thick and smooth and comes away from side of pan. Remove from heat and continue to beat until slightly cool 1 to 2 minutes. Add eggs one at a time. Beat until mixture is smooth and blended often the addition of each egg. Drop 18 mounds of batter 2 inches apart on greased baking sheets. Swirl the top of each mound. Bake at 375 degrees for 1 hour. Fill with chocolate or vanilla filling or ice cream topped with a chocolate sauce. Makes 18 puffs"}]}, {"id": "creamy-tomato-basil-soup", "title": "Creamy Tomato Basil Soup", "category": "Soups & Stews", "pages": [94], "tags": [], "ingCount": 7, "stepCount": 5, "sections": [{"type": "ingredients", "items": ["3 tbsp olive oil", "2 red onions chopped", "3 cloves garlic minced", "1 ( 28 oz ) can crushed tomatoes", "4 cups good quality chicken stock Kosher salt Freshly ground black pepper", "¾ - 1 cup heavy cream", "1 bunch basil torn into small bite – size pieces Parmesan cheese for garnish"]}, {"type": "steps", "items": ["Heat olive oil over medium-low heat in a dutch oven or large pot. Once hot add onions and season generously with Kosher salt. Cook the onions, stirring occasionally, until soft and starting to turn golden brown, about 15 minutes. Add the garlic and cook for 1 more minute, stirring to avoid burning the garlic.", "Stir in the tomatoes and chicken stock. Season generously with Kosher salt and freshly ground black pepper. Bring the soup to a boil, then lower heat to  maintain a simmer for at least 15 minutes.", "Puree mixture using an immersion blender or carefully transfer soup to a blender. If using a blender, return mixture to the pot.", "Stir in the cream and basil and let simmer for at least 15 minutes.", "Serve immediately, topped with freshly grated Parmesan cheese."]}]}, {"id": "crock-pot-lasagna", "title": "Crock Pot Lasagna", "category": "Pasta, Rice & Grains", "pages": [95, 96], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "½ lb 93% ground beef ½ lb Jimmy Dean regular sausage Fresh ground pepper Fresh garlic Onion Powder Italian seasoning Dried Basil Season Salt Cavender’s Greek seasoning Creole Seasoning Worcestershire sauce Soy sauce 29 oz. can tomato sauce 1 cup of water with little beef base mixed in 6 oz. tomato paste 8 oz. package lasagna noodles, uncooked 4 cups (16 oz.) shredded mozzarella cheese 1 ½ cups (12 oz.) small-curd cottage cheese ½ cup grated Parmesan cheese"}, {"type": "text", "text": "Cook ground beef and sausage with all seasoning. Stir in tomato sauce, water with beef base, tomato paste mix everything together. Set aside. Mix mozzarella cheese, cottage cheese, and parmesan cheese. Set aside. Spray your crock pot down with cooking spray. Spread one-fourth of the tomato sauce/meat mixture in the bottom of your crock pot. Arrange noodles to fit into crock pot. I break mine up and sometimes put the noodles over each other. Spoon one-third of the cheese mixture over noodles. Repeat this process twice. Make sure to end with the tomato/meat mixture on top. Cover. Cook on low for 4 to 5 hours."}]}, {"id": "crock-pot-sweet-potatoes", "title": "Crock Pot Sweet Potatoes", "category": "Vegetables & Sides", "pages": [97], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 -5 large sweet potatoes peeled cut into 1 inch pieces", "1 cup light brown sugar packed", "1 orange juiced and grated zest", "¼ cup honey", "4 tbsp of butter", "½ tsp vanilla", "1 ½ tsp cinnamon Dash of nutmeg ( I leave it out )"]}, {"type": "text", "text": "Lightly grease crock pot. Arrange sweet potatoes cubes in bottom of the crock pot. Microwave all ingredients in butter melted. Stir ingredients up and pour over sweet potatoes in crock pot. Cover and cook on low for 6-8 hours."}]}, {"id": "croque-monsieur", "title": "Croque Monsieur", "category": "Snacks & Appetizers", "pages": [98], "tags": [], "ingCount": 5, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["2 tbsp Dijon mustard", "8 slices sandwich bread", "4 oz. baked ham, thinly sliced", "2 ½ cups grated Gruyere cheese, divided", "4 tbsp butter softened"]}, {"type": "text", "text": "Preheat the broiler to the lowest heat setting. Evenly divide and spread the mustard on 4 slices of bread. Place a few slices of ham, followed by ½ cup Gruyere on the mustard – side of the bread. Cover the cheese with the remaining slices of bread and spread the butter on the outside surfaces of the sandwiches. Place the sandwiches on an ungreased baking sheet and broil for about 5 minutes, turn them over and cover with the remaining cheese and continue cooking until they are crispy and golden brown, about 5 additional minutes."}, {"type": "text", "text": "Recipe makes 4 sandwiches"}]}, {"id": "dads-chicken-pot-pie-makes-2-pot-pies", "title": "Dad’s Chicken Pot Pie (Makes 2 Pot Pies)", "category": "Poultry Mains", "pages": [99], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "2 Refrigerated pie crust boxes 4 Large Boneless Skinless Chicken Breasts 6 to 8 Cream of Chicken Soups Mixed Frozen Veggies Garlic powder or minced fresh Onion Powder Cavender’s Greeks Seasoning Creole Seasoning Lawry’s Season Salt Parsley Flakes Pepper"}, {"type": "text", "text": "This Makes to Pot Pies…if you only want 1 pot pie cut the ingredients in half."}, {"type": "text", "text": "Depends on how deep your pie pans are on how much cream of chicken soup to use. Cut up your chicken breasts and fry up in a little olive oil ( just enough to keep your chicken from sticking to your frying pan.) Add all your seasonings to the chicken while it is cooking. While chicken is cooking get your pie pans out and spray with cooking spray. Put one pie crust in each bottom of pie pan. When chicken is done add it to a big mixing bowl with all the soup. Rinse your mixed veggies and drain very well in colander and add to chicken mixture. Mix everything very well. Add mixture to the two pie crusts and try to make it even between the two pie pans. Once mixture is added to pie pans add top crust to each pie and smash edges together. Cut slits in top of crusts to vent the pies. Make sure to put it on a big cookie sheet or pizza pan to catch any spillage. Bake pies at 400 degrees for about 45 minutes to an hour. Serve when they are done. You can bake them both at the same time or one at a time and put the extra pie in frig covered and bake next day or second day. No longer than 2 days in frig for second uncooked pie."}]}, {"id": "dessert-pizza", "title": "Dessert Pizza", "category": "Other Desserts", "pages": [100], "tags": [], "ingCount": 5, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 ( 20 0z. ) package refrigerated cookie dough, any flavor", "1 ( 8 oz. ) package cream cheese, softened", "1 ( 14 oz. ) can sweetened condensed milk", "½ c. frozen orange juice concentrate, thawed", "1 tsp vanilla extract"]}, {"type": "header", "text": "Toppings"}, {"type": "text", "text": "Assorted fresh fruit or canned fruit, chopped candy bars, gummy candy, assorted candies, peanuts, or toasted coconut."}, {"type": "text", "text": "Preheat oven to 350 degrees. On lightly greased 14 inch pizza pan or baking pan, with floured hands, press cookie dough into a 14 inch circle, forming rim around edge. Bake 12-15 minutes or until golden brown. In small mixing bowl, beat cheese until fluffy. Gradually beat in sweetened condensed milk until smooth. Stir in juice concentrate and vanilla. Chill thoroughly. Just before serving, spoon filling evenly over crust. Top with desired toppings. Refrigerate leftovers."}]}, {"id": "dinner-rolls", "title": "Dinner Rolls", "category": "Breads & Rolls", "pages": [101], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1/3 cup sugar", "½ cup Crisco", "1 tsp salt", "1 cup boiling water", "1 ½ packages yeast", "4 cups flour", "2 beaten eggs", "½ stick of butter, melted"]}, {"type": "text", "text": "Pour water over the first three items. When this has cooled down to lukewarm, pour over yeast. Mix beaten eggs and flour together. Add the yeast mixture to the flour mixture. Let rise for 30 minutes before mashing down and rolling out. Roll ½ inch thick out. Dip in melted butter. Put in a greased pan. Let rise 1 ½ hours. Bake at 400 degrees F for 15 minutes."}]}, {"id": "dirty-rice", "title": "Dirty Rice", "category": "Pasta, Rice & Grains", "pages": [102, 103], "tags": [], "ingCount": 13, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 lb. extra lean ground beef", "2 cloves garlic, minced", "2 stalks celery, chopped", "1 onion, chopped", "1 tbsp chopped parsely", "1 green bell pepper, seeded and chopped", "1 red bell pepper, seeded and chopped", "1 tbsp worcestershire sauce", "¼ tsp red pepper", "¼ tsp pepper", "1 c. raw rice", "1 ( 14 ½ oz. ) can beef broth", "1 c. water"]}, {"type": "text", "text": "In a large skillet, add beef and vegetables cooking until beef is done and vegetables are tender. Add seasonings, stirring well. Add rice, broth and water, mixing well. Bring to a boil and reduce heat, cover, and cook for 25 to 30 minutes or until rice is done. Serves: 4 to 6 servings"}]}, {"id": "double-delicious-cookie-bars", "title": "Double Delicious Cookie Bars", "category": "Cookies & Bars", "pages": [121], "tags": [], "ingCount": 5, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["½ cup butter", "1 ½ cups graham cracker crumbs", "1 (14 oz) can Eagle Brand sweetened condensed milk", "2 cups (12 oz) semi-sweet chocolate chips", "1 cup peanut butter chips"]}, {"type": "text", "text": "Preheat oven to 350 degrees F (325 degrees for glass dish). In 13x9 inch baking pan, melt butter in oven. Sprinkle crumbs evenly over butter, pour sweetened condensed milk evenly over crumbs. Top with chips, press own firmly. Bake 25 to 30 minutes or until lightly browned. Cool. Garnish as desired. Cut into bars. Store loosely covered at room temperature."}, {"type": "text", "text": "For perfectly cut bars: line entire pan with a sheet of aluminum foil first. When bars are baked, cool, lift up edges of foil to remove from pan. Cut into individual squares. Lift off foil."}]}, {"id": "double-delicious-cookie-bars-eagle-brand-recipe", "title": "Double Delicious Cookie Bars (Eagle Brand Recipe)", "category": "Cookies & Bars", "pages": [120], "tags": ["Copycat & Adapted"], "ingCount": 5, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["½ cup margarine or butter", "1 ½ cups graham cracker crumbs", "1 ( 14 oz. ) can Eagle Brand Sweetened Condensed Milk ( NOT evaporated milk )", "2 cups ( 12 oz. ) semi-sweet chocolate chips", "1 cup peanut butter chips"]}, {"type": "text", "text": "Preheat oven to 350 degrees ( 325 degrees for glass dish ). In 13x9-inch baking pan, melt margarine in oven. Sprinkle crumbs evenly over margarine; pour sweetened condensed milk evenly over crumbs. Top with chips, press down firmly. Bake 25 to 30 minutes or until lightly browned. Cool. Garnish as desired. Cut into bars. Store loosely covered at room temperature."}, {"type": "text", "text": "For perfectly cut bars; line entire pan with a sheet of aluminum foil first. When bars are baked; cool, lift up edges of foil to remove from the pan. Cut into individual squares. Lift off foil."}]}, {"id": "dump-cake-94-fat-free", "title": "Dump Cake (94% Fat Free)", "category": "Cakes & Cheesecakes", "pages": [122], "tags": [], "ingCount": 3, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 box of white cake mix", "3 egg whites", "1 ½ water One 21 oz. can light strawberry refilling One 16 oz. can crushed pineapple packed in juice, drained"]}, {"type": "text", "text": "Preheat the oven to 350 degrees. In a medium bowl, combine the cake mix, egg whites, and water. Beat with an electric mixer on low speed for 30 seconds. Spray the inside of 9 x 11 inch baking dish with nonstick vegetable cooking spray. Pour in half of the cake batter, “ dump” in pie filling and pineapple. Spoon the remaining cake batter on top and bake for 35 minutes or until the cake tests done."}]}, {"id": "dumplings-for-chicken-and-dumplings", "title": "Dumplings for Chicken and Dumplings", "category": "Poultry Mains", "pages": [123], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. flour", "2 tsp. baking powder", "¼ tsp. salt", "½ c. skim milk", "2 tbsp. canola oil"]}, {"type": "text", "text": "Combine flour, baking powder, and salt. Mix together milk and oil. Add to dry ingredients, stir only until moistened. Drop by tablespoon into boiling broth. If desire a thinner dumpling, roll dough on floured surface and cut into pieces."}]}, {"id": "dutch-apple-pie", "title": "Dutch Apple Pie", "category": "Pies & Tarts", "pages": [124, 125], "tags": [], "ingCount": 10, "stepCount": 4, "sections": [{"type": "header", "text": "Crust and Topping"}, {"type": "ingredients", "items": ["2 cups all purpose flour", "1 cup light brown sugar packed", "¾ cup butter melted", "½ cup quick oats"]}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["2/3 cup white sugar", "3 tbsp cornstarch", "1 ¼ cups cold water", "3 cups Granny Smith apples diced and peeled", "1 ½ tsp vanilla extract", "½ tsp cinnamon"]}, {"type": "steps", "items": ["Preheat oven to 350 degrees.", "In a large mixing bowl, combine flour, brown sugar, butter, and oats. Measure out 1 cup of the mixture and set aside for later, press remaining crumb mixture into a 9” ungreased pie pan. Set pan aside.", "In a large saucepan over medium heat, mix together the sugar, cornstarch and water until smooth. Bring to a boil and let boil for 2 minutes ( or until mixture is thickened ) stirring the entire time. Remove saucepan from heat and stir in the diced apples and vanilla and cinnamon.", "Dump covered apples into the pie pan and top with the 1 cup of reserved crumb mixture. Place in oven and cook for 40-45 minutes ( the crust will be a golden brown when it’s done ). Let cool before serving."]}]}, {"id": "fantastic-focaccia-bread", "title": "Fantastic Focaccia Bread", "category": "Breads & Rolls", "pages": [126], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 package (10 oz.) refrigerated pizza crust", "2 cloves of garlic, pressed", "2 cups (8 oz.) shredded mozzarella cheese, divided", "2 oz. (approximately 2/3 cup) Romano cheese, grated, divided", "2 tsp dried oregano leaves, divided", "2 firm plum tomatoes, sliced"]}, {"type": "text", "text": "Preheat oven to 375 degrees F. Roll pizza crust into a 12 inch circle on 13 inch pizza pan or pizza stone. Spread pressed garlic evenly over crust. Spread 1/3 cup of Romano cheese onto crust. Toss 1 cup of mozzarella cheese with 1 tsp of the oregano together then sprinkle this over pizza crust. Add thinly sliced tomato over the cheese in a single layer. Mix the rest of the mozzarella and oregano together and spread over the top of the tomatoes. Add the remaining Romano cheese on top of the mozzarella. Bake for 30-35 minutes or until golden brown and bubbly. Cut into squares, serve hot."}]}, {"id": "fire-engine-cookies-michael-from-school", "title": "Fire Engine Cookies (Michael from School)", "category": "Cookies & Bars", "pages": [127], "tags": ["Michael's Recipe"], "ingCount": 0, "stepCount": 4, "sections": [{"type": "text", "text": "Graham crackers Red Frosting Oreos Black Licorice"}, {"type": "text", "text": "Break off one corner of a cracker (feel free to eat it) and frost the remaining piece. Add pieces of black licorice across the top of the cracker to make a ladder, or use the licorice to a make a fire hose."}, {"type": "text", "text": "Split a cookie apart and place one side on the front of the cracker and one side on the back for the wheels."}, {"type": "text", "text": "Enjoy!"}]}, {"id": "fool-proof-chocolate-fudge-makes-2-pounds", "title": "Fool-Proof Chocolate Fudge (Makes 2 Pounds)", "category": "Candy & Confections", "pages": [128], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 c. ( 18 oz. ) semi-sweet chocolate chips", "1 ( 14 oz. ) can sweetened condensed milk Dash salt", "½ to 1 c. chopped nuts", "1 ½ tsp vanilla extract"]}, {"type": "text", "text": "In heavy saucepan, over low heat melt chips with sweetened condensed milk and salt. Remove from heat, stir in nuts and vanilla. Spread evenly into wax paper lined 8 or 9 inch pan. Chill 2 hours or until firm. Turn fudge and cut into squares. Store covered at room temperature."}]}, {"id": "fresh-applesauce-michael-from-school", "title": "Fresh Applesauce (Michael from School)", "category": "Other Desserts", "pages": [129], "tags": ["Michael's Recipe"], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 apples peeled, sliced, and cored", "1 tsp cinnamon", "½ tsp nutmeg (optional)", "¼ cup sugar", "1 cup water"]}, {"type": "text", "text": "Place all ingredients in crock pot and cook until mushy. Serve warm or cold."}]}, {"id": "fresh-blueberry-cake", "title": "Fresh Blueberry Cake", "category": "Cakes & Cheesecakes", "pages": [130, 131], "tags": [], "ingCount": 20, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 ½ c. sifted all-purpose flour", "2 tsp. baking powder", "½ tsp salt", "1 c. sugar", "½ c. shortening", "1 tsp. vanilla extract", "1 egg", "2/3 c. milk", "1 ½ c. fresh blueberries", "2 tbsp. all-purpose flour", "1 tbsp. sugar Lemon sauce"]}, {"type": "text", "text": "Sift flour with baking powder and salt. Gradually blend sugar with shortening and vanilla. Beat in egg. Add flour mixture alternately with milk. Combine blueberries 2 tablespoon flour and 1 tablespoon sugar and fold into the batter. Turn into a well greased lightly floured cake pan. Bake at 350 degrees for 1 hour or toothpick comes out clean."}, {"type": "header", "text": "Lemon Sauce"}, {"type": "ingredients", "items": ["½ c. sugar", "1 tbsp. cornstarch", "¼ tsp. salt", "¼ c. cold water", "¾ c. boiling water", "3 tbsp. fresh lemon juice", "1 tsp. grated lemon rind", "½ tsp. vanilla extract", "2 tbsp. butter"]}, {"type": "text", "text": "Combine sugar, cornstarch, and salt. Gradually stir in cold water. Gradually stir in boiling water and cook for 3 minutes or until smooth, clear, and thickened slightly. Stir in remaining ingredients."}]}, {"id": "frozen-pink-angel-food-cake", "title": "Frozen Pink Angel Food Cake", "category": "Cakes & Cheesecakes", "pages": [132], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ( 16 oz. ) round angel food cake", "½ gallon nonfat frozen vanilla yogurt", "1 ( 6 oz. ) can frozen concentrated pink lemonade, thawed", "12 drops red food coloring"]}, {"type": "text", "text": "Split angel food cake horizontally into three layers with serrated knife. Let yogurt soften until it can be easily mixed with lemonade and food coloring. ( If you want pinker icing, just add more food coloring ). Lay bottom layer and inside hole with yogurt mixture. Repeat with next layer making sure to ice hole in center. Ice filled cake with the yogurt. Immediately put in freezer. Serves: 16 servings"}]}, {"id": "fruit-cake", "title": "Fruit Cake", "category": "Cakes & Cheesecakes", "pages": [133], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 pound box of graham crackers crushed", "1 can sweetened condensed milk Some raisins Chopped nuts", "1 can well drained pineapple tidbits Miniature marshmellos", "1 jar marichino cherries chopped"]}, {"type": "text", "text": "Mix it all up and roll it up in some wax paper and refrigerate. Once chilled serve."}]}, {"id": "glazed-cake-doughnuts-makes-12-doughnuts", "title": "Glazed Cake Doughnuts (Makes 12 Doughnuts)", "category": "Breakfast & Brunch", "pages": [134, 135], "tags": [], "ingCount": 13, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["½ c. sugar", "¼ c. evaporated skim milk", "¼ c. reduced calorie margarine", "1 egg", "2 egg whites", "2 ½ c. flour", "2 tsp. baking powder", "1 tsp. vanilla extract", "½ tsp. ground apple pie spice", "¼ tsp. salt"]}, {"type": "header", "text": "For the Glaze"}, {"type": "ingredients", "items": ["¼ c. water", "1/8 tsp. imitation butter", "1/8 tsp. ground apple pie spice"]}, {"type": "text", "text": "Preheat oven to 350 degrees. In medium bowl, combine sugar, milk, margarine, egg, and egg whites. Beat with an electric mixer on low speed for 2 minutes or until creamy. Add the remaining ingredients and continue beating until the flour is well incorporated. Increase the mixer speed to medium and beat 2 minutes longer. Cover the bowl and chill the dough for 30 minutes."}, {"type": "text", "text": "Place the dough on a clean, floured surface and roll out to a ½ inch thickness. Cut out doughnuts with a doughnut cutter. ( You can roll out any leftover dough into any shape you like, this is fun and prevents waste ). Spray the inside of a baking sheet with non-stick vegetable cooking spray. Arrange the doughnuts on the sheet and bake for 20 minutes."}, {"type": "header", "text": "To prepare glaze"}, {"type": "text", "text": "Combine all ingredients in a medium bowl and mix well. Dip each doughnut in the glaze while it is still hot. Place the doughnuts back on the baking sheet to cool."}]}, {"id": "granmamas-uncooked-no-bake-no-cook-fruitcake", "title": "Granmama's Uncooked (No Bake, No Cook Fruitcake)", "category": "Cakes & Cheesecakes", "pages": [136, 137], "tags": [], "ingCount": 6, "stepCount": 7, "sections": [{"type": "ingredients", "items": ["1 lb. graham cracker", "1 lb. raisins", "½ lb. pecans", "1 ( 16 oz. ) jar maraschino cherries", "24 big marshmallows", "1 ( 14 oz ) can condensed milk"]}, {"type": "header", "text": "Directions"}, {"type": "text", "text": "Crush graham crackers into fine crumbs."}, {"type": "text", "text": "Granmama's recipe calls for “puffed” raisins. To puff them, soak in hot water for 30 minutes."}, {"type": "text", "text": "Chop the nuts; drain and cut cherries in half ( if they are whole )."}, {"type": "text", "text": "Melt marshmallows in milk."}, {"type": "text", "text": "Mix all ingredients together."}, {"type": "text", "text": "Pack into regular sized loaf pan."}, {"type": "text", "text": "Refrigerated overnight and cut with a hot knife"}]}, {"id": "granny-thompsons-homemade-dressing-this-is-for-1-regular-pan-of-dressing", "title": "Granny Thompson’s Homemade Dressing (This is for 1 Regular Pan of Dressing)", "category": "Vegetables & Sides", "pages": [138, 139], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "Southern Cornbread ( Already Cooked and Cooled ) Celery Chopped Onion Chopped Pecans Chopped Finely 1 Apple Finely Chopped 4 Eggs Chicken Base Poultry Seasoning or Sage ( Prefer Poultry Seasoning ) Pepper Fresh Minced Garlic Cavender’s Greek Seasoning Creole Seasoning Onion Powder Parsley Flakes Chopped Chives Lawry’s Seasoning Salt Turkey Gravy ( this is from your cooked turkey you made )"}, {"type": "text", "text": "Cornbread can be cooked ahead overnight or couple days before the dressing or day of needing it just needs to be cooled. The dressing HAS to sit OVERNIGHT in frig before cooking. Crumble the cornbread up without a lot of lumps. Then chop all your veggies up. Finely chop your pecans. Add everything to the crumbled up cornbread. Add all your seasonings. Add your chicken base water. Make sure it is very soupy looking (just like what it looked like when mixing up your cornbread to cook). Your will need to taste it to make sure there is enough chicken base and seasonings to your mixture. Once the taste is right add your 4 eggs. Mix everything together very well and let sit in frig overnight."}, {"type": "text", "text": "Next morning finely chop your apple and add to mixture and mix it up. Add your turkey gravy to mixture and add enough to make it soupy again. Try to get a baking dish that keeps it more level out then heaped up ( cooks more evenly this way. ) Bake at 400 degrees until it is no longer jiggly and solid in the middle. This can take up to 1 and ½ hours depends on how much you are cooking and your oven. Just keep an eye on it. Once done take it out and serve."}]}, {"id": "greek-pasta-salad", "title": "Greek Pasta Salad", "category": "Salads", "pages": [140, 141], "tags": [], "ingCount": 13, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ lb small shrimp, cooked and peeled", "1 lb bay scallops, cooked", "1 ( 8 oz. ) package tri-colored rotini", "15 cherry tomatoes, halved", "¼ c. thinly sliced black olives", "3 oz. feta cheese, crumbled"]}, {"type": "text", "text": "Toss shrimp and scallops with a ¼ cup dressing. ( see recipe below ) Refrigerate 4 hours or overnight. Refrigerate remaining dressing. Cook pasta according to directions on package omitting salt and oil. Drain well. In large bowl, toss pasta with marinated seafood and remaining ingredients. Add reserved seafood and remaining ingredients. Add reserved dressing as needed. Serves: 4 servings"}, {"type": "header", "text": "Dressing"}, {"type": "ingredients", "items": ["½ tsp dried dill weed", "3 cloves garlic, minced", "½ c. chopped red onion", "3 tbsp fresh lemon juice", "½ c. olive oil Salt and pepper to taste"]}, {"type": "ingredients", "items": ["Combine all ingredients in food processor until well combined. For those really watching fat content, use", "1/3 cup olive oil."]}]}, {"id": "green-bean-casserole", "title": "Green Bean Casserole", "category": "Vegetables & Sides", "pages": [142], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 cans drained green beans", "1 can cream of mushroom soup", "1 tsp. lemon juice", "1 can french- fried green onions"]}, {"type": "text", "text": "Mix all of above but ½ can onions. Bake at 350 degrees for 30 minutes. Sprinkle ½ can onions over top and heat this up."}]}, {"id": "halibut-and-chickpea-soup", "title": "Halibut and Chickpea Soup", "category": "Soups & Stews", "pages": [143], "tags": [], "ingCount": 12, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 tsp. olive oil, plus more for drizzling", "¾ cup chopped onion", "1 tsp fennel seeds, crushed", "1 small sprig of rosemary (about 4 inches)", "4 tomatoes (about 1 pound), roughly chopped", "1 can (14 oz.) chickpeas, drained", "½ cup dry white wine", "6 cups reduced- sodium chicken broth", "1 lb white fish fillets such as Pacific halibut or Pacific cod", "1 tsp salt", "1 tsp freshly ground black pepper", "½ cup chopped flat leaf parsley"]}, {"type": "steps", "items": ["Heat 1 tsp. oil in a large saucepan over medium heat. Add onion and cook until softened, about 3 minutes. Add fennel seeds, rosemary, tomatoes, chickpeas, wine, and broth; cover and bring to a boil.", "Meanwhile, cut fish into 1 inch chunks and add to boiling broth. Reduce heat and simmer until fish is cooked through and pulls apart when poked with a fork, about 3 minutes. Remove rosemary sprig, season with salt and pepper and spoon into bowls. Drizzle with oil and sprinkle with parsley. Serve with a crusty bread."]}]}, {"id": "happy-trails-granola", "title": "Happy Trails Granola", "category": "Breakfast & Brunch", "pages": [144], "tags": [], "ingCount": 11, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ cup maple syrup", "¼ cup vegetable oil", "1 tsp cinnamon", "3 cups rolled oats", "1 cup chopped walnuts", "1 cup sunflower seeds", "¼ cup firmly packed dark brown sugar Pinch of salt", "2 egg whites", "1 cup shredded sweetened coconut flakes", "1 cup dried cranberries", "½ cup candy coated chocolates ( M&M )"]}, {"type": "text", "text": "Preheat the oven to 325 degrees. Line a baking sheet with parchment paper. In small pot over medium heat, whisk together the syrup, oil, and cinnamon. Cook until it just bubbles. Remove from the heat and cool slightly. In large bowl add the oats, walnuts, sunflower seeds, brown sugar, and pinch of salt. Pour in the syrup mixture and toss well. In a small bowl, whisk the egg whites to combine. Pour over the granola and toss well. Evenly spread the mixture onto a sheet tray. Bake until golden, turning several times about 35 to 40 minutes. Remove from the oven to a serving bowl and cool. When cool add remaining ingredients and serve."}]}, {"id": "hawaiian-pork-burgers", "title": "Hawaiian Pork Burgers", "category": "Meat Mains", "pages": [145], "tags": [], "ingCount": 12, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["1 can (8 oz.) crushed pineapple, drained", "1/3 cup barbecue sauce", "1 tbsp soy sauce", "1 lb ground pork", "¼ cup plain dried bread crumbs", "2 tbsp minced onion", "1 tbsp minced fresh ginger", "1 tbsp packed light brown sugar", "1/8 tsp cayenne pepper", "1/8 tsp salt", "4 English muffins, split and toasted", "8 large fresh basil leaves"]}, {"type": "steps", "items": ["Prepare a grill for medium heat. In a small bowl, combine pineapple, barbecue sauce, and soy sauce. Set bowl aside.", "In medium bowl, combine pork, bread crumbs, onion, ginger, sugar, cayenne, and salt. Shape mixture into 4 patties. Grill turning once, until slightly charred a nd cooked the way you like them.", "Put each burger on muffin half. Top each with 2 basil leaves, about 2 tbsp. sauce and the muffin top."]}]}, {"id": "homemade-bread", "title": "Homemade Bread", "category": "Breads & Rolls", "pages": [146], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 ¼ c. warm liquid ( water, milk, or potato water )", "3 tbsp sugar", "1 tbsp salt", "2 tbap softened shortening or cooking oil", "2 cakes or 2 packages of dry yeast", "7 to 7 ½ c. all-purpose flour ( sifted )"]}, {"type": "text", "text": "In large bowl add warm liquid ( if milk used scalded and cooled milk ) sprinkle yeast in add sugar, salt, and shortening. Stir in flour about one cup at a time, enough to make dough easy to handle. Turn out on floured cloth or board and kneed until dough is smooth and blistered appearance. About 5 minutes. This kneeding is important. Grease a large bowl and add dough, turn over grease top. Cover with a damp cloth and rise in warm ( 80 degrees ) oven to double in bulk. Punch down. Cover and let rise again. Divide into half. Round up each part and mold into loaves. Kneed, pressing out all the air. Place in 2 greased loaf pans. Cover with a damp cloth and let rise to double size. Bake at 350 degrees for 35-40 minutes."}]}, {"id": "homemade-hot-chocolate", "title": "Homemade Hot Chocolate", "category": "Beverages", "pages": [147], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["8 cups whole milk", "16 oz. Semisweet Chocolate or chips", "¼ cup sugar", "6 cinnamon sticks", "1 tsp vanilla extract"]}, {"type": "text", "text": "Constantly stirring bring the mixture to a simmer. Remove the cinnamon sticks. Serve."}]}, {"id": "homemade-ice-cream", "title": "Homemade Ice Cream", "category": "Other Desserts", "pages": [148], "tags": [], "ingCount": 2, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 cups heavy whipping cream", "14 oz. Sweetened condensed milk Add anything you want to this"]}, {"type": "text", "text": "Whip heavy whipping cream and sweetened condensed milk together until thick and creamy. Add anything you want to this at this time. Example... 3 tbsp cocoa powder when whipping this the cream and condensed milk together for chocolate ice cream. Example...1 cup Dulce De Leche mixed in by hand. Freeze for 3 or 4 hours. Then serve."}]}, {"id": "homemade-pizza", "title": "Homemade Pizza", "category": "Snacks & Appetizers", "pages": [149, 150], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "1 box of Chef Boyardee pizza kit ½lb of 93% fat free ground beef Jimmy Dean’s breakfast sausage: cooked ½ bag to whole bag or uncooked about ¼ to ½ roll of sausage 1 bag of Hormel pepperoni 2lbs bag of shredded Mozzarella cheese Shredded Parmesan cheese (optional) (You can add any meat or veggies to this pizza) Olive Oil Worcestershire sauce Soy Sauce Onion powder Garlic powder or minced fresh garlic Cavender’s Greek Seasoning Creole seasoning Dried parsley flakes Dried chives Dried basil Italian Seasoning Pepper"}, {"type": "text", "text": "(For Veggie Pizza do everything the same except no meat. Just make sure the veggies are fresh and NOT frozen. Sautee your veggies up just enough to get the seasoning on them before putting on pizza do not over cook them. You still want a crunch to them. If your veggies need a little extra flavor add just a touch of chicken base without water just the base itself to this mixture while cooking. Do all the same steps.)"}, {"type": "text", "text": "In a skillet add olive oil and brown your ground beef and sausage (if you are using uncooked sausage). Add all your seasonings to this mixture while cooking. While the meat is cooking or before you start cooking the meat follow instructions on box and mix up the dough mixture. Once dough is mixed add olive oil to the dough and give it a quick turn in olive oil. This is so it does not stick to the bowl. It needs to rise some before you place it in the baking dish for pizza. Once meat is done. Sit it off to the side. If your pizza dough is ready place in baking dish that has been sprayed with nonstick cooking spray. Do not use oil to coat baking dish…you need cooking spray…gives a crunchier dough. Spread dough out in baking dish and make the dough as even as possible in the dish. Add tomato sauce from kit and spread evenly. Add your ground beef mixture to this. At this time…then layer your toppings if you are adding anything else. Make sure the pepperoni is the last layer to go on pizza before your cheese. Add your packet of parmesan cheese that comes with the kit evenly on top of this. Then if you are adding extra parmesan cheese add it now. Then add mozzarella cheese. This is going to take about majority of the bag. Depends on your taste and your baking dish. Make sure you tuck the cheese down on the all four sides of the pizza some so it is not sticking up. Cook as instructions of the box says at 425 degrees. I cook until the top of the pizza is golden brown. Once top is golden brown take it out and serve."}]}, {"id": "homemade-salsa-and-chips", "title": "Homemade Salsa and Chips", "category": "Snacks & Appetizers", "pages": [151, 152], "tags": [], "ingCount": 7, "stepCount": 3, "sections": [{"type": "header", "text": "Salsa"}, {"type": "ingredients", "items": ["5 Ripe tomatoes (juicy and freshly ripened)", "½ green bell pepper", "½ red bell pepper", "½ yellow bell pepper", "½ orange bell pepper", "1 poblano chili pepper", "1 jalapeno pepper Salt to taste Fresh ground pepper to taste The juice of one lime Cilantro sliced up A little vinegar to taste Taco Bell mild sauce"]}, {"type": "header", "text": "Chips"}, {"type": "text", "text": "Soft corn tortillas (small round ones)"}, {"type": "text", "text": "Salsa: Make sure to get all seeds and white membranes out of jalapeno pepper. Chop everything up very finely. Mix everything together and let it marinate in the frig for at least an hour."}, {"type": "header", "text": "Chips"}, {"type": "text", "text": "Slice tortillas up like chips then deep fry only do a little up at time. Pull out before completely done or they will burn. Then salt and serve."}]}, {"id": "honey-ham-glaze", "title": "Honey Ham Glaze", "category": "Sauces, Dressings & Condiments", "pages": [153], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Ham ( bone in or boneless does not matter ) Brown Sugar Fresh Orange Juice Fresh Zest of Orange Honey Brewed Coffee ( do not use kpods coffee needs to be from a pot of coffee ) 1 to 2 small cups or to taste Liquid Smoke You can change this to pineapple instead of orange…Just omit the orange and do rings of pineapple and pineapple juice instead of orange juice Everything else stays the same…everything is to your taste."}, {"type": "text", "text": "Put your ham in roasting pan with a lid. Get a bowl and add your ingredients mix together and taste. Once it is to liking add to ham. Make sure there in enough juice to not let it burn. You can either slow cook it on low temperature or cook faster on higher temperature. Depends on how you want to do it. Depending on the size of ham is your cooking time too."}]}, {"id": "italian-grilled-sandwich", "title": "Italian Grilled Sandwich", "category": "Snacks & Appetizers", "pages": [156], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Croissant sliced in half Smoked Gouda shredded Parmesan cheese Hard salami Arugula (fresh)"}, {"type": "text", "text": "Build the sandwiches. Get a skillet nice and hot. Put sandwiches in the skillet then put another heavy skillet on top of the sandwiches that are being cooked. Once each side is nice and brown and sandwiches smashed nicely. They are ready to serve."}]}, {"id": "italian-pasta-stir-fry", "title": "Italian Pasta Stir Fry", "category": "Pasta, Rice & Grains", "pages": [157], "tags": [], "ingCount": 9, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["8 oz. linguine, uncooked", "1 medium zucchini, sliced", "1 medium onion, chopped", "2 medium tomatoes, seeded and chopped", "¼ cup fresh parsley, snipped with kitchen shears", "1 tbsp olive oil", "2 large garlic cloves, pressed", "1 tsp each salt and ground black pepper", "1 oz. (1/4 cup) fresh Parmesan cheese, grated"]}, {"type": "text", "text": "Cook pasta according to package directions, keep warm."}, {"type": "text", "text": "Heat oil in stir fry skillet or large skillet is fine. Add garlic to hot oil and stir for 15 seconds. Add zucchini and onion stir fry for 2-3 minutes until crisp and tender. Add tomatoes, parsley, and seasonings. Heat 1- 2 minutes, stirring gently until heated through. Remove from heat. Stir in warm pasta, grate Parmesan cheese over the pasta. Toss lightly and serve immediately."}]}, {"id": "lemon-meringue-pie", "title": "Lemon Meringue Pie", "category": "Pies & Tarts", "pages": [158, 159], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["3 cups sugar", "14 tbsp corn starch Pinch of salt", "3 cups water", "6 eggs beaten yolks only", "2 tbsp butter", "1 cup lemon juice"]}, {"type": "header", "text": "Meringue"}, {"type": "ingredients", "items": ["6 egg whites", "2 tsp lemon juice", "12 tbsp sugar", "½ tsp cream of tartar Cook the filling on the stove until the filling gets really thick. Spoon the filling into the already cooked pie crust."]}, {"type": "text", "text": "Beat the egg whites, lemon juice, and sugar with an electric mixer in a bowl on high until thickens. Once you are able to hold the mixture up without running everywhere, spoon onto filling. Stick in oven and let brown on top."}]}, {"id": "lemon-squares", "title": "Lemon Squares", "category": "Cookies & Bars", "pages": [160], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "header", "text": "Crust"}, {"type": "ingredients", "items": ["2 c. flour", "½ c. powdered sugar", "4 oz. light cream cheese", "2 tbsp. light margarine"]}, {"type": "text", "text": "In bowl, stir together flour and powdered sugar. Cut in cream cheese and margarine with pastry blender until crumbly. Press into bottom of a 13x9x2 inch baking pan coated with no stick cooking spray and dusted with flour. Bake at 350 degrees for 20 minutes. Pour lemon filling ( use recipe below ) over hot pastry and continue baking for 20 minutes longer or until top is light golden and set. Cool and cut into bars. Serves: 4 dozen bars"}, {"type": "header", "text": "Lemon Filling"}, {"type": "ingredients", "items": ["5 eggs whites", "1 ½ c. sugar", "1 ½ tbsp. grated lemon rind", "1/3 c. flour", "1 tsp. baking powder", "½ c. fresh lemon juice In mixing bowl, beat egg whites and sugar. Combine lemon rind, flour and baking powder. Stir into egg mixture. Add lemon juice, mixed well."]}]}, {"id": "lentil-sausage-soup", "title": "Lentil Sausage Soup", "category": "Soups & Stews", "pages": [161, 162], "tags": [], "ingCount": 15, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 lb French green lentils", "¼ cup olive oil, plus extra for serving", "4 cups diced yellow onions (3 large)", "4 cups chopped leeks, white and light green parts only (2 leeks)", "1 tbsp minced garlic (2 cloves)", "1 tbsp kosher salt", "1 ½ tsp freshly ground black pepper", "1 tbsp minced thyme leaves", "1 tsp ground cumin", "3 cups medium diced celery (8 stalks)", "3 cups medium diced carrots (4 to 6 carrots)", "3 quarts Homemade Chicken Stock or canned broth", "¼ cup tomato paste", "1 lb kielbasa, cut in ½ lengthwise and sliced 1/3 inch thick", "2 tbsp dry red wine or red wine vinegar Freshly grated Parmesan, for serving"]}, {"type": "text", "text": "In a large bowl, cover the lentils with boiling water and allow to sit for 15 minutes. Drain."}, {"type": "text", "text": "In a large stockpot over medium heat, heat the olive oil and saute the onions, leeks, garlic, salt, pepper, thyme, and cumin for 20 minutes, or until the vegetables are translucent and tender. Add the celery and carrots and saute for another 10 minutes. Add the chicken stock, tomato paste, and drained lentils, cover, and bring to a boil. Reduce the heat and simmer uncovered for 1 hour or until the lentils are cooked thrugh and tender. Check the seasonings. Add the kielbasa and red wine and simmer until the kielbasa is hot. Serve drizzled with olive oil and sprinkled with grated Parmesan."}]}, {"id": "lentil-stew-with-capers-olive-garden-recipe", "title": "Lentil Stew with Capers (Olive Garden Recipe) (Version 1)", "category": "Soups & Stews", "pages": [109, 110], "tags": ["Copycat & Adapted"], "ingCount": 13, "stepCount": 4, "sections": [{"type": "ingredients", "items": ["1 lb bag Italian dried lentils", "¼ c. olive oil", "1 small yellow onion, minced", "1 medium carrot, minced", "1 rib of celery, minced", "1 clove fresh garlic, chopped", "1 sprig fresh rosemary Pinch fresh thyme, chopped", "4 c. chicken stock Sea salt to taste", "2 tbsp plus ½ c. chopped tomatoes", "1 tbsp capers", "4 tbsp extra virgin olive oil", "2 tbsp parsley, chopped", "4 pinches of ground black pepper"]}, {"type": "header", "text": "Procedures"}, {"type": "steps", "items": ["Soak lentils for 2 hours in cool water. Then drain.", "Combine extra virgin olive oil, onions, carrots, celery, and garlic in heavy sauce pot. Cook on medium heat until vegetables are tender ( about 7 minutes ). Do not brown garlic and onions. Add lentils, rosemary sprig, and thyme. Cook for 2 minutes. Add chicken stock. Reduce heat and simmer until lentils are soft, approximately 30-45 minutes. Turn off heat. Season with sea salt to taste.", "Allow soup to stand for 2 hours to combine flavors. ( This soup is better the next day! )", "Serve reheated soup garnished with chopped tomatoes and capers. Add fresh black pepper and chopped parsley. Serve immediately."]}]}, {"id": "lentil-stew-with-capers-olive-garden-recipe-2", "title": "Lentil Stew with Capers (Olive Garden Recipe) (Version 2)", "category": "Soups & Stews", "pages": [163, 164], "tags": ["Copycat & Adapted"], "ingCount": 13, "stepCount": 4, "sections": [{"type": "ingredients", "items": ["1 lb bag Italian dried lentils", "¼ c. olive oil", "1 small yellow onion, minced", "1 medium carrot, minced", "1 rib of celery, minced", "1 clove fresh garlic, chopped", "1 sprig fresh rosemary Pinch fresh thyme, chopped", "4 c. chicken stock Sea salt to taste", "2 tbsp plus ½ c. chopped tomatoes", "1 tbsp capers", "4 tbsp extra virgin olive oil", "2 tbsp parsley, chopped", "4 pinches of ground black pepper"]}, {"type": "header", "text": "Procedures"}, {"type": "steps", "items": ["Soak lentils for 2 hours in cool water. Then drain.", "Combine extra virgin olive oil, onions, carrots, celery, and garlic in heavy sauce pot. Cook on medium heat until vegetables are tender ( about 7 minutes ). Do not brown garlic and onions. Add lentils, rosemary sprig, and thyme. Cook for 2 minutes. Add chicken stock. Reduce heat and simmer until lentils are soft, approximately 30-45 minutes. Turn off heat. Season with sea salt to taste.", "Allow soup to stand for 2 hours to combine flavors. ( This soup is better the next day! )", "Serve reheated soup garnished with chopped tomatoes and capers. Add fresh black pepper and chopped parsley. Serve immediately."]}]}, {"id": "libbys-spiced-pumpkin-nut-bread", "title": "Libby’s Spiced Pumpkin Nut Bread", "category": "Breads & Rolls", "pages": [165], "tags": [], "ingCount": 12, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 cups all-purpose flour", "1 tbsp pumpkin pie spice", "2 tsp baking powder", "½ tsp baking soda", "¾ tsp salt", "1 can (15 oz.) pumpkin", "2 cups packed brown sugar", "1 cup apple juice", "4 large eggs", "¼ cup vegetable oil", "2 tsp vanilla extract", "1 cup chopped nuts, divided"]}, {"type": "text", "text": "Mix flour, spice, baking soda, baking powder, and salt in medium bowl. Mix pumpkin, brown sugar, juice, eggs, oil, and vanilla in a large bowl. Mix well. Stir in flour mixture and ¾ cup nuts. Spoon into two greased loaf pans. Sprinkle remaining nuts over top of loaves. Bake in preheated 350 degrees F oven for 60 to 70 minutes or until wooden toothpick inserted in center comes out clean. Cool in pans for 10 minutes and remove and place on wire racks."}]}, {"id": "log-cabin-cheddar", "title": "Log Cabin Cheddar", "category": "Snacks & Appetizers", "pages": [166], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. grated cheddar cheese", "¼ c. soft butter", "¼ c. milk", "¼ tsp. salt A dash of cayenne, tabasco, and paprika", "¾ c. sifted all-purpose flour", "½ c. fine soft bread crumbs"]}, {"type": "text", "text": "Soften butter to a creamy state and blend in cheese, milk, salt, tabasco, paprika and cayenne. Combine flour and bread crumbs thoroughly an add to mixture. Divide the mixture in half and refrigerate overnight for several hours. After it is chilled, roll at ½ of the dough at a time between 2 pieces of waxed paper until very thin. This rich pastry will soften rapidly so work it quickly. Take a knife or pastry wheel and cut pastry into stripes about 2 inches long and 1 inch wide. Put the strips on a cookie sheet and top with either coarse salt, grated parmesan cheese, or sesame seeds. Bake at 350 degrees for about 15 minutes or until golden brown. Peel log cabin fashion on a platter. Makes about 40 sticks."}]}, {"id": "mango-smoothies", "title": "Mango Smoothies", "category": "Beverages", "pages": [167], "tags": [], "ingCount": 3, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["4 mangos diced"]}, {"type": "text", "text": "Cookie sheet cover with parchment paper put diced mangos on cookie sheet. Cover with foil and freeze over night."}, {"type": "ingredients", "items": ["½ c. water", "½ c. honey"]}, {"type": "text", "text": "Add diced mangos, water, and honey in food processor. Puree until smooth."}, {"type": "text", "text": "Put in loaf pan and smooth out. Freeze for 1 hour and serve."}]}, {"id": "maple-pecan-scones", "title": "Maple Pecan Scones", "category": "Breads & Rolls", "pages": [168, 169], "tags": [], "ingCount": 12, "stepCount": 5, "sections": [{"type": "header", "text": "For Scones"}, {"type": "ingredients", "items": ["3 cups all-purpose flour", "1/3 cup granulated sugar", "1 tbsp baking powder", "½ tsp salt", "½ lb (2 sticks) unsalted butter, chilled", "¼ cup pecans, plus more for sprinkling", "1 large egg", "¾ cup heavy cream"]}, {"type": "header", "text": "For Icing"}, {"type": "ingredients", "items": ["1 lb confectioners’ sugar", "¼ cup whole milk", "4 tbsp (1/2 stick) unsalted butter, melted Splash of strongly brewed coffee Dash of salt", "2 tsp maple flavoring or maple extract"]}, {"type": "text", "text": "Preheat oven to 350 degrees F. In a large bowl, stir together the flour, granulated sugar, baking powder, and salt. Cut cold butter into small pieces. Cut the butter into the flour until the mixture resembles crumbs. Now finely chop pecans and stir them into the flour mixture. Mix the egg and cream together. Add the mixture to the bowl and stir until just combined."}, {"type": "text", "text": "Turn the mixture onto cutting board. The dough will be very crumbly, but do not worry…with your hands push the mixture together into a large ball. Do not knead or press too much, you want to leave that gluten alone."}, {"type": "text", "text": "With a rolling pin, very gently roll out the dough into a 10 inch round, about ¾ inch thick. With a sharp knife, cut the round into 8 equal size wedges."}, {"type": "text", "text": "Transfer the wedges to a baking sheet lined with a Silpat baking mat. (Or just spray the pan with cooking spray, either one will work) Bake the scones for 22 to 26 minutes, until they’re just barely starting to brown. Do not allow the edges to become dark. Allow the scones to cool completely."}, {"type": "text", "text": "In medium bowl, stir the icing ingredients until smooth. Pour generously over the scones and sprinkle with pecans. Allow icing to set before serving."}]}, {"id": "marshmallow-fudge", "title": "Marshmallow Fudge", "category": "Candy & Confections", "pages": [170], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 ½ c. sugar", "1 large can carnation milk", "¾ stick butter"]}, {"type": "text", "text": "Mix this together and boil 6 or 7 minutes. Stirring constantly."}, {"type": "ingredients", "items": ["Add:", "1 tsp vanilla Pour above mixture over following:", "3 packages of chocolate chips", "1 lb shelled pecans", "1 pint jar of marshmallow creme"]}]}, {"id": "marys-fruit-salad", "title": "Mary’s Fruit Salad", "category": "Salads", "pages": [171], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "1 can mandarin orange light syrup 1 can pineapple bits with juice 1 can Freestone peaches heavy syrup Quarter cut bananas Quarter cut strawberries Cut in half purple seedless grapes Cut in half green seedless grapes Small pieces of watermelon Small pieces cantaloupe"}, {"type": "text", "text": "Mix all together. Let sit overnight in frig. Serve the next day."}]}, {"id": "mashed-potatoes", "title": "Mashed Potatoes", "category": "Vegetables & Sides", "pages": [172], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Peel your potatoes (You decide on how many to peel for the amount you are going to need) Milk Butter Salt Pepper"}, {"type": "text", "text": "Peel your potatoes and then rinse them off. Cut up into chunks. Cover potatoes with water and bring to boil. Once you can stick a fork and break it apart they are done. Drain potatoes with colander. Put back into the pan let butter sit inside potatoes. This makes it easier to smash the butter into the potatoes. I use 1 stick of butter for a very large pot of potatoes if I have gravy to go with it or 2 sticks for potatoes without gravy, like I said this is for large amounts of potatoes. Add salt and pepper to taste. Add your milk very small amount at this time. Either you can use a potato masher or electric mixer for mashing. If your potatoes need more milk add some more until you get the right constancy of mashed potatoes you are looking for by either mashing or whipping the potatoes at this time. Once you have the potatoes you want and the taste is good for you. They are ready to serve."}]}, {"id": "meatloaf", "title": "Meatloaf", "category": "Meat Mains", "pages": [173, 174], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "1lb to 2lbs of 93% ground beef or 97% ground turkey Bread crumbs or crushed crackers (using crushed crackers… break crackers up in cracker sleeve first then get gallon size ziplock bag and rolling pin or heavy pan and smash the crackers up with out busting the ziplock bag open. You want very find cracker dust. Depends on how much meat you have… will depend on how much cracker crumbs you will need…you may need to do more than one cracker sleeve) Chopped Celery Chopped onion 2 to 3 eggs Beef base or Chicken base (depending on which meat your are using) About 1 cup or 2 cups water with base mixed into this (make sure it is a strong flavor and not watery) Dried parsley flakes Dried chives Onion powder Garlic powder or fresh minced garlic Worcest

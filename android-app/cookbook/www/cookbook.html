ershire sauce Soy sauce Creole seasoning Cavender’s Greek seasoning Lawry’s Season Salt Smoked sweet paprika Smoked hot paprika Liquid smoke Olive oil"}, {"type": "text", "text": "(if you add crackers instead of bread crumbs be careful not to get to salty)"}, {"type": "text", "text": "Chop up your celery into small bits not to fine but not to large. Finely chop your onion. You will need to sauté your celery and onion up with seasoning. Once onions are translucent…mixture is done. Sit off to the side so it can cool. Get a large mixing bowl and add your meat and seasoning. Make sure your celery and onions are cool so you can add it into this mixture. Add your bread crumbs or crackers. Add your eggs to this too. You will need about a cup of beef or chicken base broth Mix everything very well together. You are looking for a nice sticky mixture not to dry and not to wet where it is not able to hold a loaf shape. Spray your pan done with a nonstick cooking spray. You can make patties or loaves out of this mixture. Make sure your baking dish is deep enough to hold any liquid from meat being baked. Cook on 400 degrees until the middle of the meat is not pink. You want this meat to be completely cooked through. Once COMPLETELY done. Serve."}]}, {"id": "mexican-wedding-cakes-actually-cookies", "title": "Mexican Wedding Cakes (Actually Cookies)", "category": "Cookies & Bars", "pages": [175], "tags": [], "ingCount": 10, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["1 c. butter, softened", "¼ c. confectioners sugar", "2 tsp vanilla", "2 ¼ c. sifted all-purpose flour", "1/8 tsp salt", "½ c. finely chopped nuts"]}, {"type": "ingredients", "items": ["1. Beat butter, sugar, and vanilla in a medium bowl until fluffy. Stir in flour and salt gradually until blended. Stir in nuts.", "2. Shape dough, 2 level tsp. At time into small balls, place 1 ½ in apart on lightly greased cookie sheet.", "3. Bake for 15 minutes or until edges are slightly browned, but top of cookie is still pale.", "4. Cool for 5 minutes. Remove from cookie sheet carefully. Roll in more confectioners sugar in pie plate while still warm to make generous white coating."]}]}, {"id": "mint-wafers", "title": "Mint Wafers", "category": "Cookies & Bars", "pages": [176], "tags": [], "ingCount": 3, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 tbsp. butter", "3 tbsp. milk", "1 - 14 oz. package white creamy type frosting mix Several drops peppermint oil"]}, {"type": "text", "text": "Melt butter with milk in top of double broiler. Add frosting mix, stir till smooth cook over rapidly boiling water for 5 minutes, stirring occasionally. Add flavoring and drop desired food coloring from teaspoon. Onto waxed paper, swirling tops of candies with teaspoon. Keep candy over hot water while dropping wafers. If mixture thickens, add few drops hot water. Cool till firm. Makes 5 dozen"}]}, {"id": "miss-nolas-cream-cake", "title": "Miss Nola’s Cream Cake", "category": "Cakes & Cheesecakes", "pages": [177], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["5 eggs", "3 cups sugar", "2 cups cream", "1 cup butter", "3 cups flour"]}, {"type": "text", "text": "Preheat oven to 350 degrees F. Mix eggs, butter, and sugar together. Then add cream mix. Add flour and mix together. Bake for 30-35 minutes."}]}, {"id": "mississippi-mud-cake", "title": "Mississippi Mud Cake", "category": "Cakes & Cheesecakes", "pages": [178, 179], "tags": [], "ingCount": 14, "stepCount": 2, "sections": [{"type": "header", "text": "Mix"}, {"type": "ingredients", "items": ["2 c. sugar", "2 c. flour"]}, {"type": "header", "text": "Bring to a Boil"}, {"type": "ingredients", "items": ["1 c. water", "½ c. Crisco oil", "½ c. buttermilk", "1 stick of butter", "3 tbsp. cocoa powder"]}, {"type": "header", "text": "Beat"}, {"type": "ingredients", "items": ["2 eggs", "1 tsp. soda", "1 tsp. cinnamon", "1 tsp. vanilla"]}, {"type": "text", "text": "Mix all above together. Bake in an oblong pan at 350 degrees for 30 minutes. Remove from oven and add a layer of marshmallows and return to oven until melted. Frost with icing while still hot."}, {"type": "header", "text": "Icing"}, {"type": "header", "text": "Melt"}, {"type": "ingredients", "items": ["1 stick butter", "6 tbsp. milk ( use more if needed )", "4 tbsp. cocoa powder"]}, {"type": "text", "text": "Bring to a boil. Remove from heat. Add 1 box powdered sugar. 1 teaspoon vanilla and 1 cup walnuts."}]}, {"id": "monkey-bread", "title": "Monkey Bread", "category": "Breads & Rolls", "pages": [180], "tags": [], "ingCount": 12, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["¼ cup sugar", "1 tsp cinnamon", "1 pkg. refrigerator biscuits", "2 tbsp butter", "1/3 cup brown sugar packed"]}, {"type": "ingredients", "items": ["1. Mix sugar and cinnamon in a bowl. Set aside.", "2. Cut each refrigerator biscuits into 4 pieces.", "3. Place biscuits pieces in the cinnamon and sugar mixture and toss until well coated.", "4. Place biscuit pieces in a greased, round cake pan. You may layer on top if each other if needed.", "5. Melt butter in a saucepan over low medium heat.", "6. Stir in brown sugar.", "7. Put the butter and brown sugar mixture over the biscuits."]}, {"type": "text", "text": "Bake at 350 degrees for 10-15 minutes."}]}, {"id": "mrs-grooms-chocolate-chip-cookies-michael-from-school", "title": "Mrs. Groom’s Chocolate Chip Cookies (Michael from School)", "category": "Cookies & Bars", "pages": [181], "tags": ["Michael's Recipe"], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ cup shortening, butter, or margarine (room temperature)", "½ cup sugar", "½ cup brown sugar", "1 egg (room temperature)", "¼ tsp salt", "¼ tsp baking soda", "1 tsp vanilla", "1 ½ cup flour", "1 cup chocolate chips"]}, {"type": "text", "text": "Preheat oven to 350 degrees F. Mix together shortening, butter, or margarine (which ever one you choose to use) both sugars, and egg until creamy. Add salt, baking soda, and vanilla. Beat until smooth. Gradually add flour to the mixture until dough is no longer sticky. Fold in chocolate chips. Spoon dough unto cookie sheet. Bake cookies 10 to 12 minutes or until light golden brown. Do not over bake. Place cookies unto a cooling rack. After they cool complete…serve."}]}, {"id": "no-knead-yeast-rolls", "title": "No Knead Yeast Rolls", "category": "Breads & Rolls", "pages": [182], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 c. all-purpose flour", "1 pkg. active dry yeast", "1 ¼ c. milk", "½ c. butter", "¼ c. sugar", "1 tsp. salt", "1 egg", "1 ¼ c. all-purpose flour or whole wheat Shortening"]}, {"type": "text", "text": "In large bowl mix 2 cups flour and yeast. Put milk, butter, sugar, and salt into saucepan. Cook over mild heat until butter melts. Pour warm mixture over flour mixture. Add egg. Beat this at slow speed for 30 seconds. Beat at high speed 3 minutes. Gradually stir in 1 ¼ cup all-purpose flour or whole wheat. Beat with wooden spoon till smooth. Grease waxed paper with shortening. Cover dough in bowl with waxed paper. Put in warm place to rise for 1 hour. Beat dough with wooden spoon. Let rest 5 minutes. Grease pans cover with greased waxed paper and let rise for 30 minutes. Bake oven at 400 degrees for 12 to 15 minutes."}]}, {"id": "non-alcoholic-wine-cooler", "title": "Non-Alcoholic Wine Cooler (Version 1)", "category": "Beverages", "pages": [115], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 ( 12 oz. ) cans carbonated lemon-lime drink", "1 ( 12 oz. ) ginger ale", "1 tbsp apple cider vinegar", "1 lime or lemon, thinly sliced"]}, {"type": "text", "text": "Combine all ingredients. Refrigerate and serve. Yield: Approximately 36 oz., or 6 ( 6 oz. ) servings"}]}, {"id": "non-alcoholic-wine-cooler-2", "title": "Non-Alcoholic Wine Cooler (Version 2)", "category": "Beverages", "pages": [183], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 ( 12 oz. ) cans carbonated lemon-lime drink", "1 ( 12 oz. ) ginger ale", "1 tbsp apple cider vinegar", "1 lime or lemon, thinly sliced"]}, {"type": "text", "text": "Combine all ingredients. Refrigerate and serve. Yield: Approximately 36 oz., or 6 ( 6 oz. ) servings"}]}, {"id": "oatmeal-cake", "title": "Oatmeal Cake", "category": "Cakes & Cheesecakes", "pages": [184, 185], "tags": [], "ingCount": 13, "stepCount": 2, "sections": [{"type": "header", "text": "Cake"}, {"type": "ingredients", "items": ["½ cup quick oats", "¾ cup boiling water", "½ cup sugar", "½ cup brown sugar", "2/3 cup flour", "½ tsp salt", "½ tsp baking soda", "1 egg", "¼ cup shortening"]}, {"type": "text", "text": "Mix oatmeal in boiling water and cover and set aside. Mix rest then add to oatmeal. Bake at 350 degrees F for 23 to 25 minutes."}, {"type": "header", "text": "Frosting"}, {"type": "ingredients", "items": ["3 tbsp melted butter", "1/3 cup brown sugar", "2 tbsp milk", "½ tsp vanilla"]}, {"type": "text", "text": "Mix all ingredients together. Spread on cake. Put in oven and toast the topping. Let cool and serve."}]}, {"id": "oatmeal-peanut-butter-cookies", "title": "Oatmeal Peanut Butter Cookies", "category": "Cookies & Bars", "pages": [186], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 c. sugar", "½ c. cocoa powder", "½ c. milk", "1 stick butter", "1 tsp vanilla", "½ c. peanut butter", "½ c. nuts", "2 c. quick oatmeal"]}, {"type": "text", "text": "Boil sugar, cocoa powder, milk, and butter for 1 minute. Add vanilla, peanut butter, nuts and oatmeal mix well. Drop on wax paper flatten with fork."}]}, {"id": "old-family-bread-recipe", "title": "Old Family Bread Recipe", "category": "Breads & Rolls", "pages": [187], "tags": [], "ingCount": 6, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 package of yeast", "1 tsp salt", "1/3 cup sugar", "1 ½ cup warm water", "6 tbsp vegetable oil", "4 cup all purpose flour"]}, {"type": "text", "text": "Put yeast and water together first so yeast will dissolve. Bake at 350 degrees until golden brown."}, {"type": "text", "text": "This is the bread that Paw Paw’s grandmother used to make."}]}, {"id": "olive-garden-alfredo-sauce", "title": "Olive Garden Alfredo Sauce", "category": "Sauces, Dressings & Condiments", "pages": [188], "tags": ["Copycat & Adapted"], "ingCount": 4, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["½ cup or 1 stick of butter", "2 cloves of garlic, minced", "2 cups of heavy cream Salt and pepper"]}, {"type": "text", "text": "Melt the butter in medium sauce pan over medium/low heat. Add the rest and bring it to a simmer. You do not want it to boil but just simmer you may have to turn heat down some."}, {"type": "ingredients", "items": ["½ cup of parmesan cheese"]}, {"type": "text", "text": "Now add the cheese to this mixture and continue to simmer until mixture thickens. It may take 8 minutes or so. Now when the pasta is done this sauce should be done. You can add any type of meat or veggies to this sauce."}]}, {"id": "olive-garden-bruschetta", "title": "Olive Garden Bruschetta", "category": "Snacks & Appetizers", "pages": [189, 190], "tags": ["Copycat & Adapted"], "ingCount": 10, "stepCount": 7, "sections": [{"type": "ingredients", "items": ["3 firm Roma tomatoes, finely diced (about 1 ½ cup)", "¼ tsp salt", "1 tbsp minced fresh basil", "2 tsp minced garlic", "1 tbsp grated Parmesan cheese", "2 tsp diced marinated sun-dried tomatoes", "1 pinch of dried parsley flakes", "2 tsp extra virgin olive oil", "1 tsp balsamic vinegar", "9 to 10 slices ciabatta bread (or Italian bread) fresh bread is the key"]}, {"type": "text", "text": "Toss diced tomatoes with basil, garlic, sun-dried tomatoes, olive oil, vinegar, and salt in a medium bowl. Cover and chill 1 hour."}, {"type": "text", "text": "When you are ready to serve the dish, preheat oven to 450 degrees F."}, {"type": "text", "text": "Combine Parmesan cheese with dried parsley flakes in a small bowl. Arrange the bread slices on a baking sheet."}, {"type": "text", "text": "Sprinkle a couple of pinches of the parmesan cheese mixture over each bread slice. Bake for 5 minutes or until the bread starts to crisp."}, {"type": "text", "text": "Pour tomato mixture into a serving dish (strain off the liquid) and serve it up alongside the toasted bread slices."}, {"type": "text", "text": "You can also just mix everything together and set in the frig while you cook the bread."}, {"type": "text", "text": "(You get a big pan and heat it up with some olive oil. Slice your bread. Once the oil is hot put your bread slices in it and let each side get golden brown. Once both sides are golden brown they are ready to serve. Pull your bruschetta out of frig and serve with bread.)"}]}, {"id": "olive-garden-chicken-scampi", "title": "Olive Garden Chicken Scampi", "category": "Poultry Mains", "pages": [191, 192], "tags": ["Copycat & Adapted"], "ingCount": 10, "stepCount": 2, "sections": [{"type": "header", "text": "Scampi sauce"}, {"type": "ingredients", "items": ["3 tbsp butter", "2 tbsp garlic", "½ tsp crushed red pepper flakes", "2 tsp Italian seasoning Black pepper", "1 cup chicken broth"]}, {"type": "header", "text": "White sauce substitute"}, {"type": "ingredients", "items": ["1 ½ cup chicken broth", "½ cup half and half to scampi sauce (bring to boil)"]}, {"type": "header", "text": "Chicken, Veggies, and Pasta"}, {"type": "ingredients", "items": ["½ lb angel hair pasta (cooked and drained)", "2 bell peppers, thinly sliced", "1 red onions, thinly sliced Chicken tenders (regular) Olive oil"]}, {"type": "header", "text": "Scampi Sauce"}, {"type": "text", "text": "Heat butter over low heat. Add the garlic, Italian seasoning, crushed red pepper flakes, and black pepper cook for about 2 minutes on low heat. Add the chicken broth, stir until combined. When you determine it is done and thick. Then add half and half and the chicken broth and just cook until combined."}, {"type": "header", "text": "Chicken, veggies, and pasta"}, {"type": "text", "text": "In large skillet saute chicken tenders that have been rolled in flour, cook until chicken is almost done then add veggies. Saute everything until done. Add sauce saute until everything is warm. Serve over angel hair pasta."}]}, {"id": "one-hour-rolls", "title": "One Hour Rolls", "category": "Breads & Rolls", "pages": [193], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 cups all-purpose flour", "1 tsp baking powder", "2 tbsp sugar", "½ tsp salt", "¼ tsp baking soda", "¼ cup shortening", "1 package of cake yeast", "¼ cup water, barely warm plus buttermilk to equal 1 cup of liquid combined"]}, {"type": "text", "text": "Dissolve yeast in the water and buttermilk mixture and set aside. Sift all dry ingredients together. Add shortening to dry ingredients. You want to use a fork or pastry cutter to work shortening into flour mixture until pebbles form. Then add your liquid mixture knead just enough to make it combine. Place rolls in a lightly greased pan and let rise for exactly 1 hour in a warm place. Bake at 425 degrees F for 15 minutes."}]}, {"id": "onion-bread", "title": "Onion Bread", "category": "Breads & Rolls", "pages": [194], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 pkg. active dry yeast", "1 c. water", "2 tsp. sugar", "2 tsp. salt", "3 ¼ c. sifted all-purpose flour", "2 tbsp. melted butter", "½ c. coarsely chopped onion", "2 tsp. paprika"]}, {"type": "text", "text": "Use very warm water for dry yeast. Sprinkle yeast into water and stir until dissolved. Add sugar and 1 teaspoon salt and 2 cups flour. Stir then beat well. Stir in ½ cup more. Sprinkle about ¼ cup flour on pastry board. Turn dough out on flour and knead until smooth and satiny adding remaining flour as needed. Put in greased bowl, turn once, cover and let rise until doubled about 1 hour. Punch down and divide. Pat each half into a greased 8 inch square pan. Brush with butter and sprinkle with onions. Punch onion down into dough so surface looks dented. Let rise until doubled about 45 minutes. Sprinkle each with ½ teaspoon salt and 1 teaspoon paprika. Bake at 450 for 20 minutes."}]}, {"id": "orange-julius-michael-from-school", "title": "Orange Julius (Michael from School)", "category": "Beverages", "pages": [195], "tags": ["Michael's Recipe"], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["6 oz. of orange juice concentrate", "1 cup milk", "1 cup water", "1/3 cup powdered sugar", "1 tsp vanilla", "12 ice cubes"]}, {"type": "text", "text": "Place all ingredients in a pitcher. Mix. Pour into a blender. Blend on highest speed until smooth. Makes 4 servings."}]}, {"id": "orange-mandarin-salad", "title": "Orange Mandarin Salad", "category": "Salads", "pages": [196], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 ( 3 oz. ) packages orange flavored gelatin", "2 c. boiling water", "1 pint orange sherbet", "2 ( 11 oz. ) can mandarin oranges, use juice from one can only"]}, {"type": "text", "text": "Dissolve orange gelatin in boiling water in bowl. Stir until gelatin is dissolved, add orange sherbet, stirring until melted. Add oranges and juice from one can. Pour into mold and refrigerate. Serves: 10 servings"}]}, {"id": "ortega-chicken-taco-bake", "title": "Ortega Chicken Taco Bake", "category": "Poultry Mains", "pages": [197], "tags": [], "ingCount": 11, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 box (12 count) Ortega yellow corn or whole grain corn taco shells, broken into pieces", "1 bag (20 oz) cubed, cooked chicken", "1 packet Ortega taco seasoning", "1 jar (16 oz) Ortega thick and chunky medium salsa", "1 cup low sodium chicken broth", "¼ cup Ortega thick and smooth medium taco sauce", "1 cup sour cream", "1 can (4 oz) Ortega fire roasted diced green chiles", "1 cup pimento stuffed olives, rinsed", "½ cup cilantro chopped", "4 cups Mexican blend shredded cheese, divided use"]}, {"type": "text", "text": "Preheat oven to 350 degrees F. Cover inside of a 9x13 inch baking pan with cooking spray. Break up taco shells in bottom of the pan and set aside. In a large bowl, stir the chicken with the taco seasoning until thoroughly coating all pieces of the chicken. In a medium bowl, combine salsa, taco sauce and sour cream. Pour over the chicken and mix together thoroughly. Stir in chiles, chicken broth and olives, and cilantro and 3 cups of the shredded cheese. Pour the chicken mixture into the baking pan over the broken taco shells. Sprinkle on the remaining cup of cheese. Bake for 20-30 minutes or until bubbly."}]}, {"id": "pancakes-michael-from-school", "title": "Pancakes (Michael from School)", "category": "Breakfast & Brunch", "pages": [198], "tags": ["Michael's Recipe"], "ingCount": 7, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["2 cups flour", "¼ cup sugar", "1 tsp salt", "1 ½ tbsp baking powder", "1 egg", "2 cups milk", "2 tbsp melted butter"]}, {"type": "text", "text": "Mix dry ingredients, beat egg add and mix. Slowly pour milk into mixture and mix together thoroughly. Add butter and mix. Drop by spoonfuls on a greased hot griddle. Cook on each side. When puffed, full of bubbles, and cooked on edges, turn and cook on other side."}, {"type": "text", "text": "Serve with butter or maple syrup."}]}, {"id": "parker-house-rolls", "title": "Parker House Rolls", "category": "Breads & Rolls", "pages": [199], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 pkg. dry yeast", "½ c. water", "2/3 c. butter", "¼ c. sugar", "½ c. boiling water", "1 egg beaten", "3 c. all-purpose flour ( unsifted )", "1 tsp. salt"]}, {"type": "text", "text": "Use very warm water and sprinkle yeast in the water. Let stand for a few minutes then stir until dissolved. Put 2/3 cup butter, sugar, and boiling water in bowl and stir until butter is melted. Cool to luke warm then add yeast and egg. Add flour and salt, mix well. Cover and put in refrigerator for at least 24 hours. Roll lightly floured board to ¼ inch thickness and cut with floured 2 ½ inch cutter. With handle of wooden spoon make a crease in each circle to one side of center flatten smaller half of round slightly by rolling handle of spoon toward edge. Brush with melted butter fold thicken half over together. Put on cookie sheets and brush again with butter. Bake at 400 degrees for 12 to 15 minutes."}]}, {"id": "paula-deens-fresh-fruit-tart", "title": "Paula Deen’s Fresh Fruit Tart", "category": "Pies & Tarts", "pages": [200, 201], "tags": ["Copycat & Adapted"], "ingCount": 13, "stepCount": 4, "sections": [{"type": "ingredients", "items": ["Crust:", "½ cup confectioners’ sugar", "1 ½ cups all-purpose flour", "1 ½ sticks unsalted butter, softened and sliced"]}, {"type": "ingredients", "items": ["Filling:", "1 (8 ounce) package cream cheese, softened", "½ cup granulated sugar", "1 tsp vanilla extract"]}, {"type": "ingredients", "items": ["Glaze:", "1 (6 ounce) can frozen limeade concentrate, thawed", "1 tbsp cornstarch", "1 tbsp fresh lime juice", "¼ cup granulated sugar Whipped cream for garnish"]}, {"type": "text", "text": "Topping: Fresh strawberries Kiwi slices Blueberries Raspberries Preheat the oven to 350 degrees F. For the crust: In a food processor, combine the confectioners’ sugar, flour, and butter, and process until the mixture forms a ball. With your fingers, press the dough into a 12 inch tart pan with a removable bottom, taking care to push the crust into the indentations in the sides. Pat until the crust is even. Bake for 10 to 12 minutes, until very lightly browned. Set aside to cool."}, {"type": "text", "text": "For the filling and topping: Beat the cream cheese, sugar, and vanilla together until smooth. Spread over the cooled crust. Cut the strawberries into ¼ inch slices and arrange around the edge of the crust. For the next circle, use kiwi slices. Add another circle of strawberries, filling in any spaces with blueberries. Cluster the raspberries in the center of the tart."}, {"type": "text", "text": "For the glaze: Combine the limeade, cornstarch, lime juice, and sugar in a small saucepan and cook over medium heat until clear and thick, about 2 minutes. Let cool. With a pastry brush, glaze the entire tart. You will not use all of the glaze."}, {"type": "text", "text": "Keep the tart in the refrigerator. Remove about 15 minutes before serving. Slice into 8 wedges and serve with a dollop of whipped cream."}]}, {"id": "pea-soup", "title": "Pea Soup", "category": "Soups & Stews", "pages": [202], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 tbsp butter", "2 onions, minced", "3 potatoes, diced", "2 lbs fresh green peas, shelled and cooked or 3 packages (10 oz.) frozen peas cooked", "2 tbsp butter", "¼ tsp chopped mint leaves Salt and pepper to taste", "2 cups of milk Mint leaves"]}, {"type": "text", "text": "Melt butter in a large saucepan, sauté onions until tender. Add potatoes and 1 cup boiling water. Cover and cook until potatoes are tender, about 15 minutes. Remove and puree vegetables, return to saucepan with butter, mint, salt, and pepper. Stir in milk over low heat until soup is of desired consistency. Slowly add cream and heat gently, but do not boil. Serve warm garnished with mint leaves."}]}, {"id": "peach-cobbler", "title": "Peach Cobbler", "category": "Other Desserts", "pages": [203], "tags": [], "ingCount": 11, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1/3 c. sugar", "1 tbsp. cornstarch", "¾ c. orange juice", "3 c. sliced peaches ( peeled )", "½ c. flour", "½ c. whole wheat flour", "1 ½ tsp. baking powder", "1/3 c. skim milk", "3 tbsp. canola oil", "1 tsp. sugar", "¼ tsp. cinnamon"]}, {"type": "text", "text": "In small saucepan, stir 1/3 cup sugar and cornstarch, add orange juice. Cook until bubbly. Add peaches and cook until hot, keep warm. Stir together flours and baking powder. Add milk and oil, stir until mixture forms ball. On floured surface, pat into an 8 inch circle. Cut into 8 wedges. Spoon hot peach mixture into a 9 inch pie plate and top with pastry wedges. Combine sugar and cinnamon, sprinkle on top of pastry. Bake at 425 degrees for 25 to 30 minutes or until pastry is brown. Serves: 8 servings"}]}, {"id": "peach-soup", "title": "Peach Soup (Version 1)", "category": "Other Desserts", "pages": [119], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ½ lbs peaches peeled, sliced and pitted", "2 c. plain non-fat yogurt", "1 c. pineapple juice", "1 tbsp lemon juice", "2 tbsp sugar", "¼ c. sherry"]}, {"type": "text", "text": "Puree peaches in food processor until smooth. Add all remaining ingredients and blend well. Refrigerate to serve chilled. Makings 10 servings"}]}, {"id": "peach-soup-2", "title": "Peach Soup (Version 2)", "category": "Other Desserts", "pages": [204], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ½ lbs peaches peeled, pitted and sliced", "2 c. plain non-fat yogurt", "1 c. fresh orange juice", "1 c. pineapple juice", "1 tbsp lemon juice", "2 tbsp sugar", "¼ c. sherry"]}, {"type": "text", "text": "Puree peaches in food processor until smooth. Add all remaining ingredients and blend well. Refrigerate to serve chilled. Serves about 10 servings."}]}, {"id": "peanut-butter-cookies", "title": "Peanut Butter Cookies", "category": "Cookies & Bars", "pages": [205], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ c. shortening or butter", "½ c. peanut butter", "½ c. sugar", "½ c. brown sugar", "1 egg", "1 tsp. vanilla", "½ tsp. salt", "1 tsp. baking soda", "1 ½ c. flour"]}, {"type": "text", "text": "Cream together first 2 of the above. Gradually blend sugars until fluffy. Add next two ingredients and beat well. Drop rounded spoonful on ungreased cookie sheet. Flatten with fork. Bake about 10 minutes at 400 degrees."}]}, {"id": "peanut-butter-log-no-baking", "title": "Peanut Butter Log (No Baking)", "category": "Candy & Confections", "pages": [206], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. chunky style peanut butter", "2 tbsp butter", "1 ¼ c. sifted confectioner sugar", "3 c. rice crispy cereal Chopped peanuts"]}, {"type": "text", "text": "In a mixing bowl, blend together peanut butter and butter, stir in sugar. Add cereal, mixing well, crushing slightly. Shape into 3 logs, 7 by 1 ¼ inches. Pat peanuts over log. Wrap in foil or clear plastic wrap. Chill."}]}, {"id": "pecan-pie", "title": "Pecan Pie (Version 1)", "category": "Pies & Tarts", "pages": [207], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 eggs, beaten", "1 c. dark Karo syrup", "1/8 tsp. salt", "1 c. sugar", "1 tsp. vanilla", "2 tbsp. melted butter", "1 c. pecans"]}, {"type": "text", "text": "Blend well. Add pecans and pour into 9 inch uncooked pie shell and bake 400 degrees for 15 minutes. Reduce to 350 degrees for 30 to 35 minutes or until toothpick inserted into the center comes out clean."}]}, {"id": "pecan-pie-2", "title": "Pecan Pie (Version 2)", "category": "Pies & Tarts", "pages": [208], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ cup sugar", "½ stick butter", "1 cup white syrup", "½ tsp salt", "2 eggs", "1 cup pecans"]}, {"type": "text", "text": "Mix all ingredients together thoroughly. Pour in pie shell. Bake at 450 degrees for 15 minutes. Then turn oven down to 350 degrees for 30 minutes. Let cool and serve."}]}, {"id": "pie-crust-tarts-michael-from-school", "title": "Pie Crust Tarts (Michael from School)", "category": "Pies & Tarts", "pages": [209], "tags": ["Michael's Recipe"], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["3 cups flour", "¾ tsp salt", "1 cup shortening (needs to be extremely cold)", "2/3 cup ice water"]}, {"type": "text", "text": "Mix flour and salt together in a bowl. Cut in shortening using pastry cutter (2 knives cutting criss-cross work too). Add water. Mix with a fork until well blended. Generously flour counter. Using about a handful of pie crust at a time, roll out dough to about ¼ inch thick. Flour rolling pin generously before rolling pie crust. For Tarts: Using a small plate, cut around it with a butter knife and place a heaping tablespoon of pie filling or jam in the middle. Fold 1 side of crust over filling and flute the edges shut with a fork. Bake at 425 degrees F for 8 to 10 minutes."}]}, {"id": "pina-colada-cake", "title": "Pina Colada Cake", "category": "Cakes & Cheesecakes", "pages": [210], "tags": [], "ingCount": 11, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 pkg. white cake mix without pudding", "1 pkg. ( 4 oz. size ) coconut cream or vanilla instant pudding mix", "4 eggs", "½ c. water", "1/3 c. dark rum", "¼ c. oil"]}, {"type": "text", "text": "Blend all ingredients in large mixing bowl and beat 4 minutes at medium speed of electric mixer. Pour into pans and bake at 350 degrees for 25 to 30 minutes."}, {"type": "header", "text": "Pina Colada Frosting"}, {"type": "ingredients", "items": ["8 oz. can crushed pineapple in juice", "1 pkg. ( 4 serving Size ) coconut cream instant pudding", "1/3 c. dark rum", "9 oz. whipped topping", "1 c. flaked coconut"]}, {"type": "text", "text": "Combine first 3 ingredients in bowl and beat well blended. Fold in whipped topping. Frost cake and sprinkle with coconut"}]}, {"id": "pineapple-dragon-stir-fry", "title": "Pineapple Dragon Stir Fry", "category": "Poultry Mains", "pages": [211, 212], "tags": [], "ingCount": 13, "stepCount": 4, "sections": [{"type": "ingredients", "items": ["2 cups Minute white rice, uncooked", "1 can (20 oz) pineapple chunks", "½ cup water", "1/3 cup plus 1 tbsp soy sauce, divided", "2 tbsp cornstarch, divided", "¾ to 1 tsp crushed red pepper, optional", "¾ tsp garlic powder", "1 lb boneless, skinless chicken breast halves, cut into strips", "2 tbsp vegetable oil", "2 cups broccoli florets", "¾ cup red bell pepper chunks", "1 small carrot, thinly sliced diagonally", "1 tsp minced fresh ginger"]}, {"type": "text", "text": "Prepare rice according to package directions."}, {"type": "text", "text": "Drain pineapple, reserve ¼ cup juice."}, {"type": "text", "text": "Stir together, in small bowl, reserved juice, water, 1/3 cup soy sauce. 1 tbsp cornstarch, red pepper (if desired), and garlic powder, set aside."}, {"type": "text", "text": "Combine chicken with remaining 1 tbsp each cornstarch and soy sauce, in medium bowl. Heat oil in wok or large non stick skillet over medium heat. Add chicken and stir fry 4 to 5 minutes or until lightly browned. Add broccoli, bell pepper, carrot, and ginger, stir fry 4 minutes or until just tender. Add reserved soy sauce mixture, cook, stirring, 2 to 3 minutes or until sauce boils and thickens. Stir in pineapple chunks, and heat thoroughly. Serve over rice. Serves 4 to 6."}]}, {"id": "pineapple-drop-cookies", "title": "Pineapple Drop Cookies", "category": "Cookies & Bars", "pages": [213], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["¾ c. butter", "1 egg", "¼ c. pineapple preserves", "2 ¼ c. sifted all-purpose flour", "1 tsp. baking soda", "½ tsp. salt"]}, {"type": "text", "text": "Cream butter and sugar till light. Beat in egg and preserves. Sift together dry ingredients, mixing thoroughly. Drop from teaspoon 2 inches apart on ungreased cookie sheet. Bake at 375 degrees for 10 minutes. Cool 1 or 2 minutes remove from pan. Top with preserves and walnut halves just before serving."}]}, {"id": "pineapple-upside-down-cake", "title": "Pineapple Upside Down Cake", "category": "Cakes & Cheesecakes", "pages": [214, 215], "tags": [], "ingCount": 17, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["Bundt pan Pineapple rings cut in half Mashicino cherries", "½ cup butter, melted", "½ cup packed brown sugar", "1-20 oz. Can of pineapple slices, juice reserved", "1 jar mashicino cherries", "1 box yellow cake mix", "1- 3.4 oz. Box vanilla instant pudding mix", "3 eggs", "1/3 cup vegetable oil", "1/3 cup milk, plus more as needed"]}, {"type": "header", "text": "Directions"}, {"type": "ingredients", "items": ["1. Preheat oven to 350 degrees. Spray bundt pan with nonstick cooking spray.", "2. Evenly pour the melted butter into the bottom of the bundt pan and top with brown sugar.", "3. Place the half pineapple ring facing up in the bottom of pan with a cherry in between slices of pineapple in the butter and brown sugar mixture.", "4. In large bowl combine the cake and pudding mixtures together and give it a quick whisk. Add the reserved pineapple juice and milk and give it a quick stir. Add the eggs and vegetable oil and mix until fluffy and blended.", "5. Pour the batter evenly over the pineapples and cherries.", "6. Bake for about 30 minutes following the cake mix instructions for bundt pan or until a toothpick inserted in the middle of cake comes out clean.", "7. Cool cake for about 10 minutes before running knife around the edges and inner ring of the pan. Invert the bundt pan onto a plate. Cake should come off on the plate. Slice cake in between the pineapple rings to serve."]}, {"type": "header", "text": "Tip"}, {"type": "text", "text": "When you add the reserved pineapple juice and milk in step 4, they should equal 1 cup of liquid. If you like you can first pour the reserved pineapple juice into liquid measuring cup. Add enough milk until you have 1 cup of liquid. Add the liquid to the combined cake and pudding mix then proceed with the recipe."}]}, {"id": "pink-lemonade-sno-cones-makes-6", "title": "Pink Lemonade Sno-Cones (Makes 6)", "category": "Beverages", "pages": [216], "tags": [], "ingCount": 3, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 can ( 6 oz. ) frozen pink lemonade concentrate", "3 cups finely crushed ice", "6-3 oz. Paper cups"]}, {"type": "text", "text": "Defrost lemonade just until slushy. Quickly mix with crushed ice in small bowl. Pack into paper cups, mounding slightly. Place in freezer, freeze until firm. To serve, allow to defrost slightly, squeeze paper cup from bottom to bring flavored ice up to top of cone."}]}, {"id": "pistachio-sheet-cake", "title": "Pistachio Sheet Cake", "category": "Cakes & Cheesecakes", "pages": [217, 218], "tags": [], "ingCount": 10, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["1 pkg. white cake mix", "1 pkg. ( 4 servings size ) pistachio instant pudding mix", "¾ c. Crisco oil", "¾ c. plus 1 tbsp. water", "4 eggs", "½ c. nuts"]}, {"type": "text", "text": "Mix all of above until smooth with electric mixer. Pour into greased 9x13 inch pan or 2 8x8 inch pans. Sprinkle nuts on top. Bake at 350 degrees for 30 minutes. While cake is baking blend the following together for a topping."}, {"type": "header", "text": "Topping"}, {"type": "ingredients", "items": ["2 tbsp. soft butter", "¼ c. water", "2 c. powdered sugar", "½ tsp. vanilla"]}, {"type": "text", "text": "Pierce surface of warm cake with a fork and pour the topping onto the cake. Return to oven for 5 minutes."}]}, {"id": "potato-balls-deep-fried", "title": "Potato Balls – Deep Fried", "category": "Vegetables & Sides", "pages": [219], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. mashed potatoes", "1 c. flour not sifted", "1 tsp. baking powder", "1 tsp. salt", "1 egg, well beaten", "5 tbsp. milk"]}, {"type": "text", "text": "Mix the above ingredients in order given. Fry in deep fat, by dropping from a tablespoon. Fat is hot enough when a cube of bread browns in 1 minute. When potato balls are brown drain onto paper. Serve hot."}]}, {"id": "potato-bread", "title": "Potato Bread", "category": "Breads & Rolls", "pages": [220], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1/2 c. butter", "1 ½ c. cooked potatoes put through a sieve", "2 tbsp. sugar", "2 tsp. salt", "1 c. milk scalded", "2 pkgs. Active dry yeast", "1/3 c. water", "5 ½ c. sifted all- purpose flour", "1 egg white Sesame seeds ( optional )"]}, {"type": "text", "text": "Add butter and hot potatoes and stir until melted. Add sugar, salt and milk. Sprinkle yeast into water. Use very warm water for yeast. Let stand a few minutes, then stir until dissolved. Add to milk mixture. Stir in 3 cups of flour and beat until smooth. Gradually stir in remaining flour or enough to make a firm dough knead for 10 minutes. Put in a greased bowl, cover, and let rise again. Punch down and shape dough into a large braid or 2 small braids. Put on greased cookie sheet. Cover and let rise. Brush with egg whites which has been lightly beaten with 1 tablespoon water. Sprinkle heavily with sesame seeds. Bake at 400 degrees for 10 minutes. Lower 350 degrees for 30 to 35 minutes more"}]}, {"id": "pumpkin-muffin", "title": "Pumpkin Muffin", "category": "Breakfast & Brunch", "pages": [221], "tags": [], "ingCount": 7, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["1 spice cake mix", "1 can of pumpkin", "3 eggs", "¼ c. water"]}, {"type": "text", "text": "Mix all the ingredients together. Place in muffin tin. This makes about 18 muffins."}, {"type": "header", "text": "Streusel Topping Recipe"}, {"type": "ingredients", "items": ["½ c. flour", "½ c. brown sugar", "¼ c. butter"]}, {"type": "text", "text": "Mix flour and sugar together and cut in butter. Place a couple of spoonfuls of topping on each muffin."}, {"type": "text", "text": "Bake 350 degrees for 15-18 minutes."}]}, {"id": "pumpkin-sheet-cake", "title": "Pumpkin Sheet Cake", "category": "Cakes & Cheesecakes", "pages": [222, 223], "tags": [], "ingCount": 16, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["Small 16oz. can pumpkin", "2 cups sugar", "1 cup vegetable oil", "4 eggs beaten", "2 cups flour", "2 tsp baking soda", "2 tsp cinnamon", "¼ tsp nutmeg ( optional )", "½ tsp salt"]}, {"type": "ingredients", "items": ["Mix pumpkin, oil, and sugar together. Add beaten eggs. Mix the rest of the ingredients together. Bake at", "350 degrees for 25-35 minutes."]}, {"type": "text", "text": "Cream Cheese Icing"}, {"type": "ingredients", "items": ["5 tbsp softened butter", "3oz. cream cheese softened", "2 tsp vanilla", "1 ¾ cup powder sugar", "3 to 4 tsp milk just enough to mix"]}, {"type": "text", "text": "Mix all together. It is ready to use."}]}, {"id": "quick-and-easy-dessert", "title": "Quick and Easy Dessert", "category": "Other Desserts", "pages": [224], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1-20 oz. can pie filling", "2 c. flour", "1 c. sugar", "1 ½ tsp soda", "1 tsp salt", "2 eggs", "1 tsp vanilla", "2/3 c. cooking oil"]}, {"type": "text", "text": "Oven 350 degrees. Filling, eggs, vanilla, oil, and mix well. Then add dry ingredients mix well."}]}, {"id": "quick-cinnamon-rolls", "title": "Quick Cinnamon Rolls", "category": "Breads & Rolls", "pages": [225], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 c. sifted all-purpose flour", "2 tsp. baking powder", "½ tsp. salt", "4 tbsp. butter or shortening", "2/3 milk", "3 tbsp. butter", "1/3 c. sugar", "½ tsp. cinnamon", "½ c. raisins"]}, {"type": "text", "text": "Sift flour once add baking powder, salt, sift again. Cut in butter. Add milk gradually until soft dough is formed. Roll ¼ inch thick or slightly floured board. Cream butter, sugar, and cinnamon. Add raisins and sprinkle mixture over dough. Roll as for jelly roll. Cut in 1 inch slices. Dot pan generously with butter sprinkle with additional sugar. Place rolls on top cut side down. Bake at 425 degrees for 15 minutes then down to 350 degrees for 15 minutes. Remove from pan at once. Makes 10 rolls."}]}, {"id": "quick-ham-and-vegetable-chowder", "title": "Quick Ham and Vegetable Chowder", "category": "Soups & Stews", "pages": [226], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["Cream of mushroom soup Cream of celery soup", "2 ½ c. milk", "1 c. frozen peas", "¼ c. green onions, thinly sliced", "1 c. of 1 inch strips cut thin ham"]}, {"type": "text", "text": "Mix all of the above in 2 quart sauce pan and heat to simmering. Simmer 5 to 10 minutes or until vegetables are done."}]}, {"id": "quick-pineapple-cake", "title": "Quick Pineapple Cake", "category": "Cakes & Cheesecakes", "pages": [227], "tags": [], "ingCount": 8, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["1 ( 20 oz. ) can crushed pineapple in its own juice ( undrained )", "2 c. flour", "1 c. sugar", "1 tsp. baking soda"]}, {"type": "text", "text": "Mix all ingredients in a large bowl. Pour into a 13x9x2 inch baking pan coated with non stick cooking spray and dusted with flour. Bake at 350 degrees for 30 to 40 minutes. Frost with icing ( see recipe below ) while cake is hot."}, {"type": "text", "text": "Icing"}, {"type": "ingredients", "items": ["4 oz. light cream cheese", "1 tbsp. light margarine", "1 tsp. vanilla", "1 2/3 c. powdered sugar"]}, {"type": "text", "text": "In mixing bowl, combine cream cheese and margarine until light. Add vanilla and powdered sugar, mixing until well combined. Serves: 24 servings"}]}, {"id": "quick-rolls", "title": "Quick Rolls (Version 1)", "category": "Breads & Rolls", "pages": [228], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 package dry yeast", "¼ cup sugar", "1 egg", "2 cups warm water", "1 stick butter", "4 cups self- rising flour"]}, {"type": "text", "text": "Mix well. Then spoon into muffin tins. Let rise 30-45 minutes before baking. Bake at 350 degrees F. Will keep for 2 weeks in refrigerator if stored well."}]}, {"id": "quick-rolls-2", "title": "Quick Rolls (Version 2)", "category": "Breads & Rolls", "pages": [229], "tags": [], "ingCount": 8, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["1 package dry yeast", "2 cups warm water", "4 cups self-rising flour", "¼ cup sugar", "1 ½ sticks of butter", "1 egg"]}, {"type": "ingredients", "items": ["Mix all ingredients in mixing bowl. Drop into greased pan. Cover. Let rise 1 hour. Bake 375 degrees for", "30 minutes. Store in refrigerator what you don’t use. Will keep 1 week."]}]}, {"id": "raspberry-whoopie-pies", "title": "Raspberry Whoopie Pies", "category": "Other Desserts", "pages": [283, 284], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ cup (1 stick) butter, softened", "1 cup granulated sugar", "1 egg", "½ tsp vanilla extract", "2 ¼ cups cake flour, sifted", "1 ½ tsp baking powder", "¼ tsp salt", "2/3 cup milk", "1/3 cup seedless raspberry jam Whoopie Pie Filling (using food coloring option)"]}, {"type": "text", "text": "Preheat oven to 325 degrees F. Lightly spray Whoopie Pie Pan with nonstick cooking spray. In large mixing bowl, beat butter and sugar with electric mixer on medium speed until light and fluffy, about 3 minutes. Add egg and vanilla beat until well combined. In another bowl, sift together the flour baing powder and salt. Add half the dry ingredients into the butter mixture and mix on low speed. When dry ingredients are almost incorporated, stop the mixer and add the milk. Continue to mix on low speed until all ingredients are almost incorporated. Stop the mixer and add the remaining dry ingredients. Mix on low until just combined. Spoon 2 tablespoons of batter into each cavity, spread batter to the edges. Cavity should be about 2/3 full. Bake for 11 to 13 minutes or until the top of the cake springs back when touched. Allow the cakes to cool in pan 8 minutes. Cool completely before filling. To assemble pies, spread raspberry jam on one cake and filling on the other, sandwich together. Makes 12 whoopie pies (24 cakes total)"}]}, {"id": "ratatouilles-ratatouille", "title": "Ratatouille's Ratatouille (Version 1)", "category": "Vegetables & Sides", "pages": [113, 114], "tags": [], "ingCount": 8, "stepCount": 9, "sections": [{"type": "ingredients", "items": ["½ onion, finely chopped", "2 garlic cloves, very thinly sliced", "1 c. tomato puree", "2 tbsp olive oil, divided", "1 small eggplant", "1 small zucchini", "1 small yellow squash", "1 longish red bell pepper Few sprigs fresh thyme Salt and pepper Few tbsp soft goat cheese, for serving"]}, {"type": "text", "text": "Preheat oven to 375 degrees."}, {"type": "text", "text": "Pour tomato puree into bottom of an oval baking dish, approximately 10 inches across the long way. Drop the sliced garlic cloves and chopped onion into the sauce, stir in one tablespoon of the olive oil and season the sauce generously with salt and pepper."}, {"type": "text", "text": "Trim the ends off the eggplant, zucchini and yellow squash. As carefully as you can, trim the ends off the red pepper and remove the core, leaving the edges intact, like a tube."}, {"type": "text", "text": "On a mandoline, adjustable-blade slicer or with a very sharp knife, cut the eggplant, zucchini, yellow squash and red pepper into very thin slices approximately 1/16 inch thick."}, {"type": "text", "text": "Atop the tomato sauce arrange slices of prepared vegetables concentrically from the outer edge to the inside of the baking dish, overlapping so just a smidgen of each flat surface is visible, alternating vegetables. You may have a handful leftover that do not fit."}, {"type": "text", "text": "Drizzle the remaining tablespoon olive oil over the vegetables and season them generously with salt and pepper. Remove the leaves from the thyme sprigs with your fingertips, running them down the stem. Sprinkle the fresh thyme over the dish."}, {"type": "text", "text": "Cover dish with a piece of parchment paper cut fit inside."}, {"type": "text", "text": "Bake for approximately 45 to 55 minutes, until vegetables have released their liquid and are clearly cooked, but with some structure left so they are totally limp. They should not be brown at the edges, and you should see that the tomato sauce is bubbling up around them."}, {"type": "text", "text": "Serve with a dab of soft goat cheese on top, alone, or with some crusty French bread, atop polenta, couscous, or your choice grain."}]}, {"id": "ratatouilles-ratatouille-2", "title": "Ratatouille's Ratatouille (Version 2)", "category": "Vegetables & Sides", "pages": [230, 231], "tags": [], "ingCount": 8, "stepCount": 9, "sections": [{"type": "ingredients", "items": ["½ onion, finely chopped", "2 garlic cloves, very thinly sliced", "1 c. tomato puree", "2 tbsp olive oil, divided", "1 small eggplant", "1 small zucchini", "1 small yellow squash", "1 longish red bell pepper Few sprigs fresh thyme Salt and pepper Few tbsp soft goat cheese, for serving"]}, {"type": "text", "text": "Preheat oven to 375 degrees."}, {"type": "text", "text": "Pour tomato puree into bottom of an oval baking dish, approximately 10 inches across the long way. Drop the sliced garlic cloves and chopped onion into the sauce, stir in one tablespoon of the olive oil and season the sauce generously with salt and pepper."}, {"type": "text", "text": "Trim the ends off the eggplant, zucchini and yellow squash. As carefully as you can, trim the ends off the red pepper and remove the core, leaving the edges intact, like a tube."}, {"type": "text", "text": "On a mandoline, adjustable-blade slicer or with a very sharp knife, cut the eggplant, zucchini, yellow squash and red pepper into very thin slices approximately 1/16 inch thick."}, {"type": "text", "text": "Atop the tomato sauce arrange slices of prepared vegetables concentrically from the outer edge to the inside of the baking dish, overlapping so just a smidgen of each flat surface is visible, alternating vegetables. You may have a handful leftover that do not fit."}, {"type": "text", "text": "Drizzle the remaining tablespoon olive oil over the vegetables and season them generously with salt and pepper. Remove the leaves from the thyme sprigs with your fingertips, running them down the stem. Sprinkle the fresh thyme over the dish."}, {"type": "text", "text": "Cover dish with a piece of parchment paper cut fit inside."}, {"type": "text", "text": "Bake for approximately 45 to 55 minutes, until vegetables have released their liquid and are clearly cooked, but with some structure left so they are totally limp. They should not be brown at the edges, and you should see that the tomato sauce is bubbling up around them."}, {"type": "text", "text": "Serve with a dab of soft goat cheese on top, alone, or with some crusty French bread, atop polenta, couscous, or your choice grain."}]}, {"id": "red-potato-salad", "title": "Red Potato Salad", "category": "Salads", "pages": [232, 233], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["18 small new red potatoes", "2 cups mayo", "½ cup sour cream", "¼ cup white vinegar Celery seed to taste", "4 ribs of celery chopped Salt and pepper to taste", "2 cloves of garlic minced Onion powder to taste"]}, {"type": "text", "text": "Boil potatoes until they are done. Drain the potatoes. Mix everything together and chill. Serve when ready."}]}, {"id": "roast-with-or-without-veggies", "title": "Roast with or without Veggies", "category": "Meat Mains", "pages": [233, 234], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "1 nice size roast without hardly any fat on it Potatoes…red potatoes or just regular potatoes (peel these) or finger potatoes Baby carrots or regular carrots (peel these and chop in half) Fresh or frozen Broccoli Any other veggies you want to add just make sure everything fits into a turkey roaster or crock pot Fresh garlic Fresh ground pepper Onion powder Season salt Cavender’s Greek Seasoning Creole seasoning Sweet paprika Mild smoke paprika Spicy smoke paprika Parsley flakes Chopped chives Worcestershire sauce Soy sauce Liquid smoke 2 Brown Gravy packets 2 cans cream of mushroom soup 1 can cream of celery soup Beef base"}, {"type": "text", "text": "If cooking in oven preheat oven to 300 degrees F. Spray the turkey roaster down. Rinse the roast off and put in the roaster. Add all your seasoning to the roast. Add the cream of soups. Mix the gravy in 2 cups cold water. Add 1 cup of hot water mixed in with the beef base. Do not make it to watery but you do not want it to thick. Let this cook for about 3 hours…if you start smelling the roast check on it and stir it. If it is done you are ready to serve. If it is starting to look pretty close to being done add your potatoes and carrots. Let cook for about 1 to hours…depends how fast everything is cooking….you want to add the broccoli the last 30 minutes of the cooking process. Do not let your roast go to dry or to thick with the gravy. If either one happens add more water and let cook for about 30 minutes to an hour and taste for seasoning. Once everything is done and taste is right…you are ready to serve."}, {"type": "text", "text": "If doing in the crock pot add everything at once except broccoli…broccoli gets add 2 hours before serving. You let it cook on day on low. (Make sure to spray your crock pot and lid down with cooking spray."}]}, {"id": "roasted-chicken-with-gravy", "title": "Roasted Chicken with Gravy", "category": "Poultry Mains", "pages": [235, 236], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Defrost 1 to 2 whole chickens ½ to 1 whole onion 1 to 2 stalks of celery Chicken base or chicken broth 1 can of cream of celery soup 1 to 2 cans of cream of chicken soup 1 to 2 cans of cream of mushroom soup Fresh garlic to taste Onion powder to taste Fresh ground pepper to taste Cavender Greek seasoning to taste Creole seasoning to taste Season salt to taste Parsley flakes to taste Chopped chives to taste Worcestershire sauce to taste Soy sauce to taste"}, {"type": "text", "text": "Prepare the chicken for roasting….remove all the inside junk and throw it away. Cut off the neck and the butt and all extra fat and skin. Rinse the chicken off and run cold water through the chicken. Pull out any nasty stuff in the holes you see or feel in the chicken. Spray roasting pan down with cooking spray and place your chicken in the pan. Add all your seasoning to your chicken….make sure to use a lot of seasoning but do not over do the seasoning either. Add all your cream of soups to the chicken. Rub the chicken down inside and outside front and back of chicken with the soups and seasoning. Peel whole onion and rinse the onion off. Cut the onion in half…depends if using one chicken or two chickens if you will need both onion halves. Place what you will need of the onion into your chicken cavity. Cut ends off your celery and rinse thoroughly in water. Cut celery in half…put in your chicken. Add chicken base with water or chicken broth in chicken mixture. Make sure the broth is very strong with chicken taste. Cover the chicken and cook 275 and 300 degrees for about 3 to 4 hours…you want your chicken to fall apart from the bone with ease. Once your chicken is falling apart…chicken is done. Taste the gravy if it needs more seasoning or chicken base you add it and let cook for about another 30 minutes. After you get the taste right and chicken is falling apart…your chicken is ready to serve."}]}, {"id": "rolls-for-a-week", "title": "Rolls for a Week", "category": "Breads & Rolls", "pages": [237], "tags": [], "ingCount": 8, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["1 package dry yeast", "2 cups warm water (mix and cool)", "1 ½ sticks melted butter (cooled)", "¼ cup sugar", "1 beaten egg", "4 cups self-rising flour"]}, {"type": "ingredients", "items": ["Mix together and refrigerate in a large bowl. Batter will be thin. Take out and use as needed. Bake at", "350 degrees F for 20 minutes. Lasts a week in frig."]}]}, {"id": "salmon-with-dijon-sauce", "title": "Salmon with Dijon Sauce", "category": "Seafood Mains", "pages": [238], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 (6 oz) salmon fillets Salt and pepper to taste", "1/3 cup Dijon Mustard", "3 tbsp olive oil", "3 tbsp lemon juice", "1 tsp minced garlic"]}, {"type": "text", "text": "Season salmon with salt and pepper. Place into greased baking dish, skin side down. Mix remaining ingredients. Reserve 1/3 cup sauce. Spread remaining sauce over salmon. Bake salmon at 400 degrees F for 10 to 15 minutes until salmon is cooked through. Serve with the reserved mustard sauce."}]}, {"id": "salt-water-taffy", "title": "Salt Water Taffy", "category": "Candy & Confections", "pages": [239], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 c. sugar", "1 c. light corn syrup", "1 ½ c. water", "2 tbsp. butter", "¼ tsp. oil of peppermint", "7 drops of green food coloring"]}, {"type": "text", "text": "Combine sugar, syrup, water, and salt in 2 quart saucepan. Cook slowly, stirring constantly till sugar is dissolved. Continue to cook until hard ball stage at 260 degrees without stirring.. Remove from heat, stir in butter, peppermint oil, and food coloring. Pour into buttered pan. Cool until comfortable to handle. Butter hands, gather taffy into a ball and pull. When candy is light color and gets hard to pull, cut in fourths, pull each piece into long strand about ½ inch thick. With buttered scissors, quickly snip taffy in bite size pieces. Wrap each piece in clear plastic wrap. Makes 1 ¼ pounds"}, {"type": "header", "text": "Note"}, {"type": "ingredients", "items": ["2 quarts = 8 cups", "1 quart = 4 cups"]}]}, {"id": "seafood-gumbo", "title": "Seafood Gumbo (Version 1)", "category": "Soups & Stews", "pages": [116, 117], "tags": [], "ingCount": 16, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["¾ c. flour", "1 tbsp minced garlic", "2 onions, chopped", "2 green bell peppers, chopped", "2 stalks celery, chopped", "2 tbsp chopped parsley", "9 c. water", "1 ( 14 ½ oz. ) can whole tomatoes, crushed", "3 bay leaves Juice of half lemon", "1 tsp. Dried thyme", "¼ tsp red pepper", "4 whole cloves Salt and pepper to taste", "1 pint claw crabmeat", "2 lbs shrimp, peeled", "2 lbs trout, cut into pieces", "1 c. chopped green onions"]}, {"type": "text", "text": "Place flour on baking sheet and bake at 400 degrees for 20 to 30 minutes, stirring every 7 minutes, or until flour is brown ( color of pecan shells ). Works well in toaster oven. While flour is browning, coat a large pot with nonstick cooking spray and sautee garlic, onion, peppers, celery, and parsley until tender. Gradually stir in browned flour; stirring. Gradually add water, tomatoes, and seasonings. Bring to boil; lower heat and cook 15 minutes. Add crabmeat, shrimp, and fish. Cook until seafood is done. Discard bay leaf and cloves before serving. Serve over rice."}, {"type": "text", "text": "Makes about 10 to 12 servings"}]}, {"id": "seafood-gumbo-2", "title": "Seafood Gumbo (Version 2)", "category": "Soups & Stews", "pages": [240, 241], "tags": [], "ingCount": 16, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["¾ c. flour", "1 tbsp minced garlic", "2 onions, chopped", "2 green bell peppers, chopped", "2 stalks celery, chopped", "2 tbsp chopped parsley", "9 c. water", "1 ( 14 ½ oz. ) can whole tomatoes, crushed", "3 bay leaves Juice of half lemon", "1 tsp. Dried thyme", "¼ tsp red pepper", "4 whole cloves Salt and pepper to taste", "1 pint claw crabmeat", "2 lbs shrimp, peeled", "2 lbs trout, cut into pieces", "1 c. chopped green onions"]}, {"type": "text", "text": "Place flour on baking sheet and bake at 400 degrees for 20 to 30 minutes, stirring every 7 minutes, or until flour is brown ( color of pecan shells ). Works well in toaster oven. While flour is browning, coat a large pot with nonstick cooking spray and sautee garlic, onion, peppers, celery, and parsley until tender. Gradually stir in browned flour; stirring. Gradually add water, tomatoes, and seasonings. Bring to boil; lower heat and cook 15 minutes. Add crabmeat, shrimp, and fish. Cook until seafood is done. Discard bay leaf and cloves before serving. Serve over rice."}, {"type": "text", "text": "Makes about 10 to 12 servings"}]}, {"id": "shrimp-pasta-garden-salad", "title": "Shrimp Pasta Garden Salad", "category": "Salads", "pages": [242], "tags": [], "ingCount": 10, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["6 oz. small sea shell pasta", "1 ( 6oz. ) package frozen snow pea pods", "16 cherry tomatoes, halved", "1 medium cucumber, peeled and sliced", "½ c. shredded carrots", "1 bunch green onions, thinly sliced", "2-lbs shrimp, cooked and peeled"]}, {"type": "text", "text": "Cook sea shells according to directions on package omitting salt and oil, drain. Cook pea pods according to directions on package and drain. Combine all ingredients and toss with dressing. ( see recipe below ) Serves: 8 to 10 servings"}, {"type": "header", "text": "Dressing"}, {"type": "ingredients", "items": ["½ c. nonfat plain yogurt", "½ c. fat free Italian dressing", "3 cloves garlic, minced"]}, {"type": "text", "text": "Combine all ingredients and mix well."}]}, {"id": "shrimp-pasta-salad", "title": "Shrimp Pasta Salad", "category": "Salads", "pages": [243, 244], "tags": [], "ingCount": 10, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["8 oz. tubular pasta ( penne, ziti, ect. )", "1 tsp. garlic powder", "2 lbs. shrimp, cooked and peeled", "1 ( 10 oz. ) package frozen peas", "1 red bell pepper ( chopped )", "½ c. chopped red onion"]}, {"type": "text", "text": "Cook pasta according to directions on package omitting salt and oil drain. Toss with garlic powder. Combine remaining ingredients in bowl and add pasta. Pour basil dressing ( see recipe below ) over salad and toss thoroughly. Serves 8 to 10 servings."}, {"type": "header", "text": "Basil Dressing"}, {"type": "ingredients", "items": ["1 tbsp. dried basil", "3 cloves garlic, minced", "1/3 c. olive oil", "3 tbsp. fresh lemon juice"]}, {"type": "text", "text": "Combine all ingredients and pour over shrimp pasta mixture."}]}, {"id": "slower-cooker-chicken-cacciatore", "title": "Slower Cooker Chicken Cacciatore", "category": "Poultry Mains", "pages": [245, 246], "tags": [], "ingCount": 17, "stepCount": 4, "sections": [{"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["½ c. water", "1 tbsp. all-purpose flour", "2 c. chicken stock"]}, {"type": "ingredients", "items": ["Steps:", "1. ½ c. white wine", "2. ¼ c. chopped fresh oregano", "3. ¼ c. drained capers", "4. ½ tsp. kosher salt", "5. ½ tsp. crushed red pepper", "6. 8 garlic cloves, chopped", "7. 1 ( 28 oz. ) container diced tomatoes", "8. 1 ( 8 oz. ) pkg. cremini mushrooms, quartered", "8 ( 6 oz. ) bone-in chicken thighs, skinned", "2 tbsp. extra- virgin olive oil", "12 oz. uncooked spaghetti, broke in half", "5 oz. baby spinach fresh", "2 oz. parmesan cheese, grated ( about ½ cup )"]}, {"type": "header", "text": "How To Make It"}, {"type": "text", "text": "Step 1"}, {"type": "text", "text": "Combine ½ cup water and flour in a 6 quart electric slow cooker, stirring with a whisk. Stir in stock and next 8 ingredients. Add chicken thighs to stock mixture, submerge in liquid. Cover and cook on low 7 ½ hours. Remove chicken when cool enough to handle remove bones from chicken discard bones."}, {"type": "text", "text": "Step 2"}, {"type": "text", "text": "Add oil and pasta to slow cooker, cover and cook on high 15 minutes or until pasta is done. Stir in spinach until wilted. Divide pasta mixture among 8 shallow bowls, top evenly with chicken. Sprinkle with parmesan cheese."}]}, {"id": "snappy-party-mix", "title": "Snappy Party Mix", "category": "Snacks & Appetizers", "pages": [247], "tags": [], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 cups bite size shredded wheat cereal", "2 cups bite size rice cereal", "2 cups bite size corn cereal", "¾ cup roasted mixed nuts", "1 envelope dry Lipton onion soup mix", "6 tbsp melted butter"]}, {"type": "text", "text": "Preheat oven to 350 degrees. Combine cereals and nuts with onion soup mix. Add melted butter and mix. Bake 10 minutes in shallow pan."}]}, {"id": "snickerdoodles", "title": "Snickerdoodles", "category": "Cookies & Bars", "pages": [248], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. shortening", "1 ½ c. sugar", "2 eggs", "2 ¾ c. sifted flour", "2 tsp baking powder", "½ tsp salt", "2 tbsp sugar", "2 tsp cinnamon"]}, {"type": "text", "text": "Mix shortening, sugar, and eggs. Sift flour, baking powder, and salt together. Add this to the creamed mixture and mix thoroughly. Chill dough at least 1 hour. Roll dough into balls the size of walnuts. Roll balls in a mixture of the last two items. Place about 2 inches apart on ungreased cookie sheet. Bake until lightly browned but still soft. 8 to 10 minutes at 400 degrees."}]}, {"id": "sticky-buns-the-pioneer-woman", "title": "Sticky Buns (The Pioneer Woman)", "category": "Breads & Rolls", "pages": [249, 250, 251], "tags": ["Copycat & Adapted"], "ingCount": 15, "stepCount": 11, "sections": [{"type": "header", "text": "Ingredients"}, {"type": "header", "text": "Dough"}, {"type": "ingredients", "items": ["2 cups whole milk", "½ cup vegetable oil", "½ cup granulated sugar", "1 package active dry yeast ( 2 ¼ tsp )", "4 ½ cups all-purpose flour, plus more for dusting", "1 ½ tsp kosher salt Heaping ½ tsp baking powder Scant ½ tsp baking soda"]}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["1 stick ( ½ cup ) salted butter, melted plus more as needed", "1 cup granulated sugar, plus more as needed", "2 tbsp ground cinnamon"]}, {"type": "header", "text": "Smear and Base"}, {"type": "ingredients", "items": ["1 ½ cups packed light brown sugar", "2 sticks ( 1 cup ) salted butter, softened, plus more for the skillet", "2 tbsp honey Pinch of kosher salt", "1 tbsp whiskey, such as Jack Daniels", "1 tsp vanilla extract", "2 cups pecan pieces"]}, {"type": "header", "text": "Directions"}, {"type": "text", "text": "For the dough: Heat the milk, oil and granulated sugar in a medium saucepan over medium heat to just below a boil. Set aside and let cool to warm."}, {"type": "text", "text": "Sprinkle yeast on top and let it sit on the milk mixture for 1 minute. Add 4 cups of the flour. Stir until just combined, then cover with a clean kitchen towel and set aside in a relatively warm place for 1 hour."}, {"type": "text", "text": "After 1 hour remove the towel and add the salt, baking powder, baking soda and remaining ½ cup flour. Stir thoroughly to combine. Use the dough right away or place in a mixing bowl and refrigerate for up to 3 days, punching down the dough if it rises to the top of the bowl. ( The dough is easier to work with if it’s been chilled for at least an hour or so beforehand.)"}, {"type": "text", "text": "To assemble the rolls: On a floured baking surface, roll the dough into a large rectangle, about 30 inches by 10 inches. The dough should be very thin."}, {"type": "text", "text": "Preheat oven to 325 degrees."}, {"type": "text", "text": "For the filling: Pour the melted butter over the surface of the dough. Use your fingers to spread the butter evenly. Sprinkle over the granulated sugar and cinnamon. Don't be afraid to drizzle on more butter or more sugar! Gooey is the goal."}, {"type": "text", "text": "Now, beginning at the end farthest from you, roll the rectangle tightly towards you. Use both hands and work slowly, being careful to keep the roll tight. Don't worry if the filling oozes as you work; that just means the rolls are going to be divine. When you reach the end, pinch the seam together and flip the roll so that the seam is face down. You'll wind up with one long buttery, cinnamony, sugary, gooey log. Slip a cutting board underneath the log and with a sharp knife, make 16 equal slices."}, {"type": "text", "text": "For the smear and base: Cream together the brown sugar, butter, honey and salt until lightened, then slowly add the whiskey and vanilla while mixing."}, {"type": "text", "text": "Butter a 12-inch cast-iron skillet, layer the bottom with the pecan pieces and then scoop 5 large scoops of the smear on top. Heat in the oven until the smear is slightly foamy and bubbling, 10 to 15 minutes."}, {"type": "text", "text": "Remove the skillet from the oven and place the sliced rolls on top of the melted smear ( it's fine to put them on the hot smear ). Allow the rolls to rise 20 minutes."}, {"type": "text", "text": "Return the skillet to the oven and bake until the rolls are golden brown and the smear is brown and sticky, 20 to 30 minutes. Take another 12-inch skillet and place it on top of the hot skillet. Flip over quickly and carefully. All of the caramelly, boozy goodness will be on top."}]}, {"id": "stir-fry-garlic-chicken-noodles", "title": "Stir Fry Garlic Chicken & Noodles", "category": "Poultry Mains", "pages": [252], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["¾ lb boneless, skinless chicken tenders", "2 tsp corn starch", "2 tsp soy sauce", "2 tsp chopped garlic", "2 tbsp oil", "16 oz package frozen vegetable medley", "1/3 cup water", "¼ cup soy sauce Pasta: spaghetti, capellini, fettucine, or egg noodles"]}, {"type": "text", "text": "Coat chicken tenders in first three ingredients. Stir fry in the 2 tbsp oil for 2 minutes. Make sure oil is hot. Add 16 oz. package of frozen vegetable medley, stir fry for 3 minutes to heat through. Add mixture of 1/3 cup water, ¼ cup soy sauce and boil until it thickens. Pour over hot cooked spaghetti, capellini, fettucine, or egg noodles."}]}, {"id": "strawberry-custard-brulee", "title": "Strawberry Custard Brulee", "category": "Other Desserts", "pages": [253], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ½ c. fresh strawberries", "2 tbsp. sugar", "1 ½ tbsp. cornstarch", "1 egg, slightly beaten", "1 c. skim milk", "2 tbsp. non fat plain yogurt", "½ tsp. vanilla", "1 tbsp. light brown sugar"]}, {"type": "text", "text": "Gently rinse and drain strawberries. Divide among five 4 to 6 oz. ramekins or custard cups, set aside. In saucepan, combine sugar and cornstarch, stir well. Add egg and mix. Gradually stir in milk. Cook over low heat until thickened, stirring constantly Remove from heat, cool 5 minutes. Add yogurt and vanilla, mix well. Spoon custard mixture evenly over strawberries. Place ramekins on baking sheet. Sprinkle top with brown sugar. Broil 4 inches from heat about 2 minutes or until sugar melts. Serve immediately. Serves: 5 servings ( Raspberries or any fruit can be substituted in this recipe.)"}]}, {"id": "strawberry-dessert", "title": "Strawberry Dessert", "category": "Other Desserts", "pages": [254], "tags": [], "ingCount": 12, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["1 ¾ c. crushed graham crackers, crumbled", "4 tbsp. sugar, divided", "¼ c. light margarine, melted", "4 egg whites", "4 tbsp. sugar", "1 tsp. vanilla", "1 quart fresh strawberries, hulled and sliced", "1 ( 8 oz. ) container frozen light whipped topping"]}, {"type": "ingredients", "items": ["In bowl, combine crumbs, 2 tablespoons sugar, and margarine. Stir until well blended and press into a", "9x9x2 inch square baking pan. In large mixing bowl, beat egg whites until soft peaks form. Gradually add", "4 tablespoons sugar, beating until peaks form. Add vanilla. Spread meringue over crumbs layer. Bake at", "350 degrees for 15 minutes, cool completely. In another bowl, sprinkle strawberries with remaining 2 tablespoons sugar. Let stand 15 minutes and then drain. Top cooled meringue with whipped topping and top with strawberries. Refrigerate. Serves: 9 servings"]}]}, {"id": "strawberry-raspberry-soup", "title": "Strawberry Raspberry Soup", "category": "Other Desserts", "pages": [255], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 quart fresh strawberries", "3 c. fresh raspberries or 1 ( 12 oz. ) package frozen raspberries, drained", "½ c. apple juice plus 2/3 c. apple juice", "¼ c. sugar", "2 tbsp. cornstarch", "1 c. water", "1 tbsp. lemon juice", "½ c. non-fat yogurt", "1 tsp. powdered sugar", "½ tsp. vanilla"]}, {"type": "text", "text": "Cut strawberries in half. Place the strawberries, raspberries, ½ cup apple juice and sugar in a saucepan and let stand 15 minutes. Heat over low heat until boiling. Mix together the cornstarch and water, and stir fruit into mixture. Boil over low heat, stirring constantly, until fruits soften and soup is clear and thickened. Remove from heat and stir in the lemon juice. Chill. Before serving add 2/3 cup apple juice to make soup consistency or more if needed. In small bowl, combine yogurt, powdered sugar, and vanilla. Serve soup in small bowls and top with tablespoon of yogurt mixture. Serves 12 small servings."}]}, {"id": "strawberry-shortcake", "title": "Strawberry Shortcake", "category": "Cakes & Cheesecakes", "pages": [256, 257], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 cup sugar", "3 tbsp cornstarch Whisk this together…no clumps"]}, {"type": "ingredients", "items": ["3 tbsp strawberry gelatin", "1 cup water Cook until thickens. Becomes really thick after it cools."]}, {"type": "ingredients", "items": ["2 cups strawberries, fresh sliced Fold into gelatin mixture."]}, {"type": "ingredients", "items": ["1 package cream cheese, room temperature", "1 can sweetened condensed milk Mix together."]}, {"type": "ingredients", "items": ["1 (12 oz.) frozen container of cool whip Fold into cream cheese mixture."]}, {"type": "ingredients", "items": ["1 store bought angel food cake Cut into cubes."]}, {"type": "text", "text": "Lay cubed angel food cake in a large dish or can be done in individual containers. Then add strawberry mixture. Then add cream cheese mixture. Keep repeating until container is filled. End with cream cheese mixture on top…garnish with fresh sliced strawberries on top."}]}, {"id": "sugar-cookies", "title": "Sugar Cookies", "category": "Cookies & Bars", "pages": [258], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ c. butter", "1 c. sugar", "1 egg", "½ tsp vanilla", "1 tbsp milk", "½ tsp salt", "2 tsp baking powder", "1 ¾ c. and 2 tbsp flour"]}, {"type": "text", "text": "Cream butter and sugar until fluffy. Add vanilla and mix well. Sift flour, salt, and baking powder and mix in a little at a time. Roll into a ball and wrap in wax paper or plastic wrap. Chill at least 8 hours. For baking use desired amount of dough, roll out on lightly floured surface and cut with cookie cutters. Bake about 8 minutes at 375 degrees."}]}, {"id": "sweet-potato-pie", "title": "Sweet Potato Pie", "category": "Vegetables & Sides", "pages": [259, 260], "tags": [], "ingCount": 13, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["2 sweet potatoes", "1 1/3 cups granulated sugar", "4 oz. (1 stick) butter, softened and cut into 4 pieces", "3 large eggs", "½ cup canned sweetened condensed milk", "¼ tsp cinnamon", "¼ tsp ground cloves", "¼ tsp nutmeg", "¼ tsp vanilla extract", "1 (9 inch) unbaked pie crust Maple flavored whipped cream (recipe below)"]}, {"type": "header", "text": "Pie Filling"}, {"type": "text", "text": "Pierce sweet potatoes with fork and wrap in foil. Bake in jacket until soft (about 45 minutes) at 425 degrees F. When cool enough to handle, peel potatoes and slice crosswise to prevent strings. Reduce oven heat to 375 degrees F. Mash potatoes then add sugar, butter, eggs, condensed milk, and spices, including vanilla extract. Stir ingredients together then beat until well mixed, pour into 9 inch pie shell. Bake in the middle rack until brown and center of pie is set, about 50 minutes."}, {"type": "header", "text": "Maple Flavored Whipped Cream"}, {"type": "ingredients", "items": ["1 cup heavy cream", "1 tsp sugar", "4 tsp pure maple syrup"]}, {"type": "text", "text": "Whip all ingredients until stiff. Garnish pie with whipped cream."}]}, {"id": "tomato-bacon-squares", "title": "Tomato Bacon Squares", "category": "Snacks & Appetizers", "pages": [262, 263], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["8 slices bacon-crisply cooked and chopped", "1 medium tomato, seeded and chopped", "½ small onion, chopped", "¾ cup Swiss cheese, grated", "½ cup mayonnaise", "1 tsp dried basil leaves", "1 package (10 oz) refrigerated flaky biscuits"]}, {"type": "text", "text": "Preheat oven to 375 degrees F. Coarsely chop bacon, tomato, and onion. Mix all ingredients together except biscuits in bowl. Separate each biscuit into 2 thin halves. Place biscuit halves in bottom of a 9x13 inch baking dish, pressing biscuits to cover bottom completely. Spread bacon mixture over top. Bake 25- 30 minutes or until puffed and golden brown. Cut into 24 squares. Trisha Yearwood Baked Ham with Brown Sugar & Honey"}]}, {"id": "trisha-yearwoods-baked-ham-with-brown-sugar-honey-glaze", "title": "Trisha Yearwood's Baked Ham with Brown Sugar & Honey Glaze", "category": "Meat Mains", "pages": [263, 264], "tags": ["Copycat & Adapted"], "ingCount": 3, "stepCount": 4, "sections": [{"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["1 – 10 lbs. bone-in smoked ham ( with water added )", "1 ½ c. packed brown sugar", "½ c. clover honey ( I add the juice and zest of one naval orange )"]}, {"type": "header", "text": "Directions"}, {"type": "text", "text": "Adjust the oven racks to accommodate a large roasting pan. Fit the pan with a shallow roasting rack. Preheat the oven to 350 degrees."}, {"type": "text", "text": "Unwrap the ham and rinse it under cold water. Place it on the rack in the roasting pan. Cover with foil and bake 1 hour 40 minutes. Meanwhile, combine the brown sugar and honey in a saucepan and cook over medium heat until the mixture is smooth and the sugar has dissolved."}, {"type": "text", "text": "Pour the brown sugar glaze over the ham and continue roasting 1 hour and 40 minutes more, basting at least twice with drippings in the roaster. ( To adjust the total roasting time for a smaller or larger ham, calculate 20 minutes per pound. ) Check for doneness by inserting a meat thermometer into a meaty spot ( not into fat or touching the bone ) it should register 160 degrees."}, {"type": "text", "text": "Let the ham stand 15 minutes before slicing to allow the juices to set. ( You can make the ham up to 2 hours ahead , tent with foil and serve at room temperature."}]}, {"id": "trisha-yearwoods-angel-biscuits", "title": "Trisha Yearwood’s Angel Biscuits", "category": "Breads & Rolls", "pages": [265], "tags": ["Copycat & Adapted"], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["5 cups of all-purpose flour", "1 ½ tsp baking powder", "1 tsp kosher salt", "5 tbsp sugar", "¼ cup warm (90 to 110 degrees F) water", "½ ounce (2 packages) active dry yeast", "1 cup (2sticks) salted butter, cold, cut into small squares, plus 4 tbsp, melted", "2 cups buttermilk"]}, {"type": "text", "text": "Preheat the oven to 350 degrees F. In a large bowl, whisk together the flour, baking powder, baking soda, salt and 3tbsp of the sugar. In a small bowl, combine the warm water with the yeast and the remaining 2 tbsp sugar, stir until yeast is dissolved. Let stand until bubbles appear 2 to 3 minutes. Using your hands, mix the 1 cup cold butter into the flour, breaking the butter into small pebbles, until the mixture resembles coarse meal. Make a well in the center and add the buttermilk and the yeast mixture. Gently fold the flour into the wet ingredients. Keep mixing until a ball starts to form, then gently knead, 12 to 15 times to create a smooth dough. Cover with a cloth or plastic wrap and let rise in a warm place for approximately 1 hour. Transfer the dough to a lightly floured work surface and press out to 1 to 1 ½ inches thick. Fold the dough in half, press again to 1 to 1 ½ inches thick, and then fold again. Cut the dough using a 2 to 3 inches round biscuit cutter, depending personal preference. Brush the bottom of a cast iron skillet with some of the melted butter. Place the biscuits in the skillet, brush the tops with melted butter. Bake until golden brown, 18 to 22 minutes depending on size. Brush again with melted butter and serve immediately."}]}, {"id": "tuna-fish", "title": "Tuna Fish", "category": "Seafood Mains", "pages": [266], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Celery Chopped Claussen Pickles Fresh Minced Garlic Fresh Lemon Juice Salt Pepper Onion Powder Tuna Mayo"}, {"type": "text", "text": "Chop your celery and pickles up. Add all your other ingredients to bowl with a little of the pickle juice from your pickles. Mix well and serve. Everything is to your taste add or subtract anything from this."}]}, {"id": "turkey-with-gravy", "title": "Turkey with Gravy", "category": "Poultry Mains", "pages": [267, 268], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Defrosted Butterball Turkey 1 whole onion 4 stalks of celery Chicken base or chicken broth 3 cans of cream of celery 3 cans of cream of chicken 3 cans of cream of mushroom Fresh garlic to taste Onion powder to taste Fresh ground pepper to taste Cavender Greek Seasoning to taste Creole seasoning to taste Season salt to taste Parsley flakes to taste Chopped chives

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cindy's Magnificent Cookbook</title>
<style>
  :root{
    --cream:#fbf5ea;
    --cream-2:#f3e9d7;
    --paper:#fffdf8;
    --ink:#3a2b1e;
    --ink-soft:#6b5847;
    --accent:#a8342a;
    --accent-2:#7a9b6f;
    --accent-2-dark:#5c7d52;
    --gold:#c99a3a;
    --line:#e7d9c1;
    --shadow: 0 2px 10px rgba(58,43,30,0.08);
    --shadow-lg: 0 12px 40px rgba(58,43,30,0.25);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Iowan Old Style',Palatino,Georgia,serif; margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}

  #app{display:flex; min-height:100vh;}

  #sidebar{
    width:262px; flex:none;
    background:linear-gradient(180deg,#3a2b1e, #2c2015);
    color:#f2e6d3;
    padding:22px 16px 24px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  #sidebar .brand{
    font-size:1.5rem; line-height:1.15; margin-bottom:2px; letter-spacing:.2px;
    color:#f6ecd9;
  }
  #sidebar .brand small{display:block; font-size:.68rem; letter-spacing:2px; text-transform:uppercase; color:#c99a3a; margin-top:6px; font-family:Georgia,serif;}
  #sidebar .count-pill{
    display:inline-block; margin-top:10px; font-size:.72rem; padding:3px 10px; border-radius:99px;
    background:rgba(255,255,255,0.08); color:#e6d7bd;
  }
  .nav-section{margin-top:20px;}
  .nav-label{font-size:.68rem; text-transform:uppercase; letter-spacing:1.5px; color:#b39a72; margin:0 0 8px 8px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#efe3cd; padding:9px 10px; border-radius:9px;
    cursor:pointer; font-size:.92rem; margin-bottom:2px;
  }
  .nav-item .ic{width:1.3em; text-align:center; font-size:1.05em;}
  .nav-item .n{margin-left:auto; font-size:.75rem; color:#a98f68;}
  .nav-item:hover{background:rgba(255,255,255,0.07);}
  .nav-item.active{background:var(--accent); color:#fff; box-shadow:var(--shadow);}
  .nav-item.active .n{color:rgba(255,255,255,0.8);}

  .side-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--accent-2); color:#fff; border:none; padding:11px; border-radius:10px;
    cursor:pointer; font-size:.92rem; margin-top:14px; box-shadow:var(--shadow);
  }
  .side-btn:hover{background:var(--accent-2-dark);}
  .side-btn.ghost{background:rgba(255,255,255,0.09); color:#efe3cd; margin-top:8px;}
  .side-btn.ghost:hover{background:rgba(255,255,255,0.16);}

  .storage-meter{margin-top:18px; padding:0 8px;}
  .storage-meter .lbl{font-size:.66rem; color:#a98f68; display:flex; justify-content:space-between; margin-bottom:5px;}
  .storage-meter .bar{height:5px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden;}
  .storage-meter .fill{height:100%; background:var(--gold); border-radius:99px; transition:width .3s;}
  .storage-meter .fill.warn{background:#d9822b;}
  .storage-meter .fill.full{background:var(--accent);}

  #main{flex:1; min-width:0; padding:26px 34px 60px; max-width:1400px;}

  header.topbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  header.topbar h2{font-size:1.5rem; color:var(--ink); flex:none;}
  .search-wrap{position:relative; flex:1; min-width:200px; max-width:460px;}
  #search{
    width:100%; padding:11px 14px 11px 38px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-size:.95rem; color:var(--ink); box-shadow: var(--shadow);
  }
  #search:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .search-wrap .icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none;}
  #sortSelect{
    padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font-size:.88rem; box-shadow:var(--shadow);
  }
  #randomBtn{
    padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--accent-2);
    color:#fff; font-size:.88rem; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap;
  }
  #randomBtn:hover{background:var(--accent-2-dark);}
  /* Always-visible settings gear — the sidebar entry sits below 17 categories and gets missed. */
  #gearBtn{
    padding:10px 13px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font-size:.95rem; cursor:pointer; box-shadow:var(--shadow); line-height:1;
  }
  #gearBtn:hover{background:var(--cream-2);}
  #gearBtn.needs-key{border-color:var(--gold); background:#fdf4e2;}

  .results-meta{color:var(--ink-soft); font-size:.86rem; margin-bottom:14px;}

  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
  .card{
    background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow);
    cursor:pointer; border:1px solid var(--line);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .card .thumb{width:100%; height:132px; object-fit:cover; display:block; background:var(--cream-2);}
  .card .body{padding:15px 16px 14px; display:flex; flex-direction:column; gap:8px;}
  .card .cat-tag{
    align-self:flex-start; font-size:.66rem; text-transform:uppercase; letter-spacing:.6px;
    background:var(--cream-2); color:var(--ink-soft); padding:3px 9px; border-radius:99px;
  }
  .card h3{font-size:1.08rem; line-height:1.28; color:var(--ink); padding-right:22px;}
  .card .meta{font-size:.78rem; color:var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap;}
  .card .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .card .tag{font-size:.68rem; background:#f1e6cf; color:#8a6a2f; padding:2px 7px; border-radius:6px;}
  .card .tag.mine{background:#e2eddd; color:#4f7043;}
  .fav-btn{
    position:absolute; top:10px; right:10px; background:rgba(255,253,248,.86); border:none; cursor:pointer;
    font-size:1.1rem; color:#c0ad8c; line-height:1; width:30px; height:30px; border-radius:50%;
  }
  .fav-btn.active, .fav-btn:hover{color:var(--gold);}

  .empty-state{text-align:center; padding:70px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:2.4rem; margin-bottom:10px;}
  .empty-state button{margin-top:16px;}

  /* ---------- Index view ---------- */
  #indexView{display:none;}
  #indexView.show{display:block;}
  .alpha-jump{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:24px;}
  .alpha-jump a{
    display:inline-flex; align-items:center; justify-content:center; min-width:29px; height:29px;
    border-radius:7px; background:var(--paper); border:1px solid var(--line); text-decoration:none;
    font-size:.85rem; color:var(--ink);
  }
  .alpha-jump a:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .alpha-jump a.off{opacity:.3; pointer-events:none;}
  .idx-group{margin-bottom:26px; break-inside:avoid;}
  .idx-letter{
    font-size:1.3rem; color:var(--accent); border-bottom:2px solid var(--cream-2);
    padding-bottom:5px; margin-bottom:9px;
  }
  .idx-row{
    display:flex; align-items:baseline; gap:8px; padding:5px 2px; cursor:pointer; font-size:.94rem;
    border-bottom:1px dotted var(--line);
  }
  .idx-row:hover{background:var(--cream-2);}
  .idx-row .dots{flex:1; border-bottom:1px dotted #cbbb9c; margin:0 4px; transform:translateY(-3px);}
  .idx-row .rcat{color:var(--ink-soft); font-size:.8rem; white-space:nowrap;}
  .idx-row .rpage{color:var(--ink-soft); font-size:.8rem; white-space:nowrap; min-width:52px; text-align:right;}
  .idx-cols{column-count:2; column-gap:40px;}
  @media (max-width:900px){ .idx-cols{column-count:1;} }

  /* ---------- Modal shell ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(30,20,12,0.55); display:none;
    align-items:flex-start; justify-content:center; padding:32px 16px; z-index:50; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper); max-width:760px; width:100%; border-radius:18px; box-shadow:var(--shadow-lg);
    padding:34px 38px 44px; position:relative; animation:pop .16s ease;
  }
  @keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet .closeBtn{
    position:absolute; top:16px; right:18px; background:var(--cream-2); border:none; border-radius:50%;
    width:34px; height:34px; font-size:1.1rem; cursor:pointer; color:var(--ink-soft); z-index:2;
  }
  .sheet .closeBtn:hover{background:var(--line);}

  #detail .d-photo{width:100%; max-height:330px; object-fit:cover; border-radius:12px; margin-bottom:18px; display:block;}
  #detail .d-cat{font-size:.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent); font-weight:bold;}
  #detail h1{font-size:1.9rem; margin:6px 0 10px; padding-right:40px; color:var(--ink);}
  #detail .d-meta{font-size:.82rem; color:var(--ink-soft); margin-bottom:6px;}
  #detail .d-tags{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  #detail .d-tags .tag{font-size:.7rem; background:#f1e6cf; color:#8a6a2f; padding:3px 9px; border-radius:7px;}

  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:14px 0 22px;
    padding:12px 14px; background:var(--cream-2); border-radius:12px;
  }
  .toolbar .grp{display:flex; align-items:center; gap:6px;}
  .toolbar label{font-size:.78rem; color:var(--ink-soft);}
  .scale-btn{border:1px solid var(--line); background:var(--paper); padding:5px 11px; border-radius:8px; cursor:pointer; font-size:.82rem;}
  .scale-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .toolbar .spacer{flex:1;}
  .icon-btn{
    border:1px solid var(--line); background:var(--paper); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.82rem;
    display:flex; align-items:center; gap:6px; color:var(--ink);
  }
  .icon-btn:hover{background:var(--cream-2);}
  .icon-btn.active{background:var(--gold); color:#fff; border-color:var(--gold);}
  .icon-btn.danger{color:var(--accent); border-color:#e8c4bf;}
  .icon-btn.danger:hover{background:#f7e6e3;}

  .sec-header{
    font-size:.98rem; font-weight:bold; color:var(--accent); margin:22px 0 8px;
    padding-bottom:5px; border-bottom:2px solid var(--cream-2);
    text-transform:uppercase; letter-spacing:.5px; font-family:Georgia,serif;
  }
  .sec-header:first-of-type{margin-top:6px;}
  ul.ing-list{list-style:none; margin:0 0 4px; padding:0;}
  ul.ing-list li{
    display:flex; align-items:flex-start; gap:10px; padding:6px 2px; font-size:.96rem; line-height:1.4;
    border-bottom:1px dashed var(--line); cursor:pointer;
  }
  ul.ing-list li:last-child{border-bottom:none;}
  ul.ing-list input[type=checkbox]{margin-top:4px; accent-color:var(--accent-2); width:16px; height:16px; flex:none;}
  ul.ing-list li.checked span{text-decoration:line-through; color:#a99; opacity:.65;}
  ol.steps{margin:0 0 4px; padding-left:1.3em;}
  ol.steps li{margin-bottom:12px; line-height:1.55; font-size:.98rem; padding-left:4px;}
  .d-text{line-height:1.6; font-size:.98rem; margin:0 0 14px; color:var(--ink);}
  .d-footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  /* ---------- Forms ---------- */
  .sheet h2.form-title{font-size:1.55rem; margin-bottom:4px; padding-right:40px;}
  .sheet .form-sub{font-size:.86rem; color:var(--ink-soft); margin-bottom:20px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field > label{display:block; font-size:.8rem; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin-bottom:6px;}
  .field .hint{font-size:.76rem; color:var(--ink-soft); margin-top:5px; line-height:1.45;}
  .field input[type=text], .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    background:var(--paper); font-family:inherit; font-size:.95rem; color:var(--ink);
  }
  .field textarea{resize:vertical; line-height:1.5; font-size:.92rem;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .row2{display:flex; gap:14px; flex-wrap:wrap;}
  .row2 > .field{flex:1; min-width:190px;}

  .btn{
    padding:11px 20px; border-radius:10px; border:none; cursor:pointer; font-size:.92rem;
    background:var(--accent); color:#fff; box-shadow:var(--shadow);
  }
  .btn:hover{filter:brightness(1.07);}
  .btn.secondary{background:var(--paper); color:var(--ink); border:1px solid var(--line); box-shadow:none;}
  .btn.secondary:hover{background:var(--cream-2); filter:none;}
  .btn.green{background:var(--accent-2);}
  .btn:disabled{opacity:.5; cursor:not-allowed; filter:none;}
  .form-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:24px; padding-top:18px; border-top:1px solid var(--line);}
  .form-actions .spacer{flex:1;}

  .photo-drop{
    border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
    cursor:pointer; background:var(--cream); color:var(--ink-soft); font-size:.88rem;
  }
  .photo-drop:hover, .photo-drop.drag{border-color:var(--accent-2); background:#f2f7ef; color:var(--accent-2-dark);}
  .photo-preview{position:relative; display:inline-block; margin-top:10px;}
  .photo-preview img{max-width:100%; max-height:210px; border-radius:10px; display:block; box-shadow:var(--shadow);}
  .photo-preview button{
    position:absolute; top:8px; right:8px; background:rgba(255,255,255,.94); border:none; border-radius:50%;
    width:29px; height:29px; cursor:pointer; font-size:.9rem; color:var(--accent); box-shadow:var(--shadow);
  }

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .tabs button{
    background:none; border:none; padding:10px 15px; cursor:pointer; font-size:.92rem; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .tabs button.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:bold;}

  .callout{
    background:var(--cream-2); border-left:3px solid var(--gold); padding:12px 14px; border-radius:0 9px 9px 0;
    font-size:.85rem; line-height:1.55; color:var(--ink-soft); margin-bottom:16px;
  }
  .callout.err{background:#fbeae7; border-left-color:var(--accent); color:#8c3128;}
  .callout.ok{background:#eaf3e6; border-left-color:var(--accent-2); color:#4b6b40;}
  .callout strong{color:var(--ink);}

  .spinner{
    display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:7px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .preview-box{
    background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:18px 20px;
    max-height:340px; overflow-y:auto; margin-bottom:6px;
  }
  .preview-box h4{font-size:1.15rem; margin-bottom:8px;}

  .hamburger{display:none; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:8px 11px; cursor:pointer; box-shadow:var(--shadow);}
  @media (max-width:880px){
    #sidebar{position:fixed; left:-290px; top:0; z-index:60; transition:left .2s ease; width:260px; box-shadow:var(--shadow-lg);}
    #sidebar.open{left:0;}
    .hamburger{display:inline-flex;}
    #main{padding:18px 16px 50px;}
    .sheet{padding:26px 18px 34px;}
    #sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:55;}
    #sidebar-scrim.open{display:block;}
  }

  @media print{
    #sidebar, header.topbar, .results-meta, .toolbar, .fav-btn, .closeBtn, .alpha-jump, .form-actions{display:none !important;}
    #grid{display:none !important;}
    body.printing-index #indexView{display:block !important;}
    body.printing-index .overlay{display:none !important;}
    body.printing-index #grid{display:none !important;}
    .overlay{position:static; background:none; padding:0; display:block;}
    .sheet{box-shadow:none; max-width:100%; padding:0;}
    body{background:#fff;}
    .idx-cols{column-count:2;}
  }

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
</style>
</head>
<body>

<div id="app">
  <div id="sidebar-scrim" onclick="closeSidebar()"></div>
  <nav id="sidebar">
    <div class="brand">Cindy's Magnificent<br>Cookbook<small>A Family Recipe Collection</small></div>
    <div class="count-pill" id="totalCount">— recipes</div>

    <button class="side-btn" onclick="openEditor()">✚ Add a Recipe</button>
    <button class="side-btn ghost" onclick="openImporter()">🌐 Import from the Web</button>

    <div class="nav-section">
      <div class="nav-label">Browse</div>
      <button class="nav-item" data-view="all"><span class="ic">📖</span>All Recipes<span class="n" id="cnt-all"></span></button>
      <button class="nav-item" data-view="index"><span class="ic">🔤</span>Index (A–Z)<span class="n"></span></button>
      <button class="nav-item" data-view="favorites"><span class="ic">⭐</span>Favorites<span class="n" id="cnt-fav"></span></button>
      <button class="nav-item" data-view="mine"><span class="ic">✍️</span>My Additions<span class="n" id="cnt-mine"></span></button>
      <button class="nav-item" data-view="michael"><span class="ic">🎒</span>Michael's Recipes<span class="n" id="cnt-michael"></span></button>
      <button class="nav-item" data-view="copycat"><span class="ic">🍽️</span>Copycat &amp; Adapted<span class="n" id="cnt-copycat"></span></button>
    </div>

    <div class="nav-section">
      <div class="nav-label">Categories</div>
      <div id="catNav"></div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Settings &amp; Backup</div>
      <button class="side-btn ghost" id="sideAiBtn" onclick="openSettings()">⚙️ AI Settings</button>
      <button class="side-btn ghost" onclick="exportData()">⬇️ Back Up My Recipes</button>
      <button class="side-btn ghost" onclick="document.getElementById('importFile').click()">⬆️ Restore Backup</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      <div class="storage-meter">
        <div class="lbl"><span>Storage used</span><span id="storeTxt">—</span></div>
        <div class="bar"><div class="fill" id="storeFill" style="width:0%"></div></div>
      </div>
    </div>
  </nav>

  <main id="main">
    <header class="topbar">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <h2 id="viewTitle">All Recipes</h2>
      <div class="search-wrap">
        <span class="icon">🔎</span>
        <input id="search" type="text" placeholder="Search recipes, ingredients, categories… (press / )" autocomplete="off">
      </div>
      <select id="sortSelect">
        <option value="alpha">Sort: A → Z</option>
        <option value="category">Sort: Category</option>
        <option value="ingCount">Sort: Fewest Ingredients</option>
        <option value="stepCount">Sort: Quickest (Fewest Steps)</option>
        <option value="newest">Sort: Recently Added</option>
      </select>
      <button id="randomBtn" onclick="openRandom()">🎲 Surprise Me</button>
      <button id="gearBtn" onclick="openSettings()" title="AI Settings">⚙️</button>
    </header>

    <div class="results-meta" id="resultsMeta"></div>
    <div id="grid"></div>
    <div id="indexView"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="big">🍽️</div>
      <div id="emptyMsg">No recipes match your search. Try another ingredient or category.</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeDetail()">
  <div class="sheet" id="detail"></div>
</div>

<div class="overlay" id="editorOverlay" onclick="if(event.target===this) closeEditor()">
  <div class="sheet" id="editor"></div>
</div>

<div class="overlay" id="importOverlay" onclick="if(event.target===this) closeImporter()">
  <div class="sheet" id="importer"></div>
</div>

<div class="overlay" id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
  <div class="sheet" id="settings" style="max-width:600px;"></div>
</div>

<script>
const RECIPES = [{"id": "7-up-biscuits", "title": "7- UP Biscuits", "category": "Breads & Rolls", "pages": [2], "tags": [], "ingCount": 4, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 cups Bisquick", "1 cup sour cream", "1 cup 7-UP", "½ cup melted butter"]}, {"type": "text", "text": "Mix Bisquick, sour cream, and 7-UP. Dough will be very soft – don’t worry. Knead and fold dough until coated with baking mix. Pat dough out and cut biscuits using a round biscuit / cookie cutter. Melt butter in bottom of cookie sheet pan or 9x13 casserole dish. Place biscuits on top of melted butter and bake at 425 degrees for 12-15 minutes or until lightly brown."}]}, {"id": "a-recipe-for-another-pizza", "title": "A Recipe for Another Pizza", "category": "Snacks & Appetizers", "pages": [3, 4], "tags": [], "ingCount": 19, "stepCount": 3, "sections": [{"type": "header", "text": "Dough"}, {"type": "ingredients", "items": ["1 package granulated active dry yeast", "½ cup warm water", "1 ½ cups of flour", "½ tsp salt", "¼ cup of olive oil, plus extra for mixing bowl"]}, {"type": "header", "text": "Topping"}, {"type": "ingredients", "items": ["2 tbsp olive oil", "1 small onion, chopped", "2 cloves garlic, minced", "1 ½ cups of tomato paste (15 oz can)", "¼ tsp salt", "1 tsp sugar", "¼ tsp pepper", "¼ tsp basil", "1 tsp oregano", "3 cups shredded Monterey Jack cheese", "½ green onions thinly sliced", "¼ cup sliced black or green olives", "1 broccoli stalks cut into flowerets", "3-4 fresh mushrooms thinly sliced"]}, {"type": "header", "text": "Dough Instructions"}, {"type": "text", "text": "Place the water in a 2 quart mixing bowl and sprinkle the yeast over the top, mix gently until fully dissolved. Stir in half the flour, half the oil and the salt. Using a wooden spoon, combine well, then gradually add the rest of the flour and oil. Knead for 5 minutes. Place the ball of dough in a lightly greased 3 quart mixing bowl and cover the top of the bowl with plastic wrap. Let stand in a warm place for about 1 to 1 ½ hours or until doubled in size. Uncover the bowl and punch down the risen dough, expelling the gases. The dough is now ready to be used."}, {"type": "header", "text": "Topping Instructions"}, {"type": "text", "text": "Sauté the onion and garlic in olive oil until soft, about 5 minutes. Add in tomato puree. Stir in additional seasonings and simmer about 10 minutes."}, {"type": "header", "text": "Prep and Baking Instructions"}, {"type": "text", "text": "Preheat oven to 375 degrees F. Roll out dough on greased pizza pan. Pinching edges under to make crust slightly thicker on the outside. Prick the dough several times with a fork. Bake crust about 5 minutes on the middle rack of oven, then remove. Spread tomato mixture on top of dough. Cover with shredded cheese then rest of toppings. Sprinkle with additional oregano and basil as desired. Bake around 15 minutes on lowest rack in the oven. Serve immediately."}]}, {"id": "anzac-cookies", "title": "Anzac Cookies", "category": "Cookies & Bars", "pages": [5], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["½ c. melted butter", "1 c. flour", "¾ c. sugar", "1 c. oatmeal", "¾ c. coconut flakes", "1 tbsp maple sugar substitute for 1 tsp vanilla", "½ tsp. baking powder"]}, {"type": "text", "text": "Mix dry ingredients first then mix in butter. Bake at 325 degrees for 15 minutes. Greased cookie sheet. Make balls and flatten."}]}, {"id": "apple-crumble-pie", "title": "Apple Crumble Pie", "category": "Pies & Tarts", "pages": [6, 7], "tags": [], "ingCount": 12, "stepCount": 3, "sections": [{"type": "header", "text": "Crusts"}, {"type": "ingredients", "items": ["12 graham cracker squares, crushed", "¼ tsp cinnamon", "3 tbsp butter melted"]}, {"type": "text", "text": "Combine all ingredients, mixing until crumbs are moistened. Press crumbs onto bottom and sides of 9 inch pie plate."}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["5 cups tart apples peeled, cored, and sliced", "2/3 cup sugar", "¼ cup all purpose flour", "1 tsp vanilla"]}, {"type": "text", "text": "Combine all ingredients and mix well. Fill crust with filling ."}, {"type": "ingredients", "items": ["Topping:", "½ cup butter softened", "1 cup all purpose flour", "2/3 cup packed brown sugar", "1 tbsp granulated sugar"]}, {"type": "text", "text": "Mix butter, flour, and brown sugar together using a pastry cutter or fingers until a crumb forms. Sprinkle evenly over top of pie. Sprinkle granulated sugar on top of topping. Bake at 350 degrees for 1 hour until apples are done and pie is bubbly."}]}, {"id": "apple-dumplings", "title": "Apple Dumplings", "category": "Breads & Rolls", "pages": [8], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 Granny Smith apples", "1 lemon", "1 cup sugar", "½ cup (1 stick) butter", "¼ tsp vanilla extract", "8 canned buttermilk biscuits", "4 tsp ground cinnamon"]}, {"type": "text", "text": "Preheat the oven to 375 degrees F. Peel, core and slice the apples vertically into 8 slices each. Squeeze the lemon into a bowl of water and add the apple slices to keep from turning brown. In a medium saucepan, mix 1 cup water, ¾ cup of the sugar, the butter and vanilla. Bring the sugar mixture to a boil over medium heat. Separate each biscuit into 2 layers. Wrap a biscuit layer around a slice of apple, stretching the biscuit slightly to overlap and seal on the bottom. Place the wrapped slices, sealed-side down, in a 9 by 12 by 12 inch casserole dish. Pour the hot sugar mixture over the apple slices. Mix the remaining ¼ cup sugar with the cinnamon and sprinkle the mixture over the tops of the wrapped apples. Bake until golden brown, 35 minutes."}]}, {"id": "apple-pecan-cake-with-caramel-glaze", "title": "Apple Pecan Cake with Caramel Glaze", "category": "Sauces, Dressings & Condiments", "pages": [9, 10], "tags": [], "ingCount": 27, "stepCount": 0, "sections": [{"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["1 ½ cups of cooking oil", "2 cups sugar", "4 eggs", "3 cups of flour", "1 tsp baking soda", "½ tsp cinnamon", "1 tsp salt", "2 tsp vanilla", "3 ½ cups Granny Smith apples ( approximately 3-4 apples ) peeled and chopped", "1 cup of chopped pecans"]}, {"type": "header", "text": "Caramel Glaze"}, {"type": "ingredients", "items": ["¾ cups butter ( 1 ½ sticks )", "1 cup light brown sugar", "¼ cup milk", "1 tsp vanilla Instructions:"]}, {"type": "ingredients", "items": ["1. Preheat oven to 325 degrees.", "2. In a large mixing bowl, add oi, sugar and eggs, mix until nice and creamy.", "3. In medium mixing bowl, whisk together flour, baking soda, cinnamon and salt. Add to large bowl. Mix well.", "4. Add vanilla, mix well.", "5. Stir in apples and pecans.", "6. Pour into generously greased and floured tube pan ( you can use two loaf pans in a place of a tube pan ).", "7. Bake at 325 degrees for approximately 1 hour. Check using a tooth pick at about 50 minutes and if it comes out clean, then your cake is done. If using the loaf pans, make sure to check it at about 50 minutes as well."]}, {"type": "header", "text": "Making the Glaze"}, {"type": "ingredients", "items": ["1. In a small pan, melt butter over low heat.", "2. Stir in brown sugar and milk.", "3. Bring to a boil over low heat, then reduce to a simmer, stirring constantly.", "4. Let boil for 10 minutes, continue stirring.", "5. Remove from heat and add vanilla. Stir. Let cool.", "6. Once caramel glaze has cooled a bit, pour over the top of the cake."]}]}, {"id": "atlantic-coast-fish-stew", "title": "Atlantic Coast Fish Stew", "category": "Soups & Stews", "pages": [11], "tags": [], "ingCount": 14, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 tbsp butter", "2 tbsp olive oil", "2 medium onions, thinly sliced", "3 stalks celery, sliced", "2 carrots, sliced", "2 cloves garlic, minced", "2 cups clam juice", "1 can (16 oz.) tomatoes with juice, chopped", "2 bay leaves", "½ tsp salt", "½ tsp pepper", "1 ½ lbs haddock, hake scrod, or cod, cut into 1 ½ inch pieces", "½ lb scallops", "1 lb mussels, debearded Crusty garlic bread"]}, {"type": "text", "text": "Heat butter and oil in a stock pot, sauté vegetables and garlic over medium heat, stirring occasionally until vegetables are tender. Stir in juice, tomatoes, and seasonings. Cover and simmer for 4 or 5 minutes. Add fish, cover with water and simmer for 10 minutes or until fish is cooked. Add scallops and mussels and continue cooking, uncovered, until done about 6 to 10 minutes. Discard any unopened mussels. Serve in a deep bowl with crusty garlic bread."}]}, {"id": "autumn-apple-cakes-michael-from-school", "title": "Autumn Apple Cakes (Michael from School)", "category": "Breakfast & Brunch", "pages": [12], "tags": ["Michael's Recipe"], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 apples", "2 cups pancake mix", "2 eggs", "1 cup milk", "1 tsp cinnamon", "¼ cup brown sugar", "½ cup oil", "1 cup chunky applesauce (optional) Regular applesauce (optional)"]}, {"type": "text", "text": "Wash apples. Leaving skins on, either grate them or chop them finely. (If you wish, you may substitute 1 cup of chunky applesauce for the grated apples.) Mix all the ingredients except the oil. Mix until smooth. Children can help with the mixing process. Heat an electric skillet to about 325 degrees F. Coat the cooking surface with about 1 tsp of the oil. Drop two tbsp of batter for each apple cake into the skillet. Fry 2 minutes on each side, or until golden brown. Recoat cooking surface with oil and make the next batch. Drain apple cakes thoroughly on paper towels. They should be eaten while warm. Serve with applesauce, if desired."}]}, {"id": "bacardi-rum-cake", "title": "Bacardi Rum Cake", "category": "Cakes & Cheesecakes", "pages": [13, 14], "tags": [], "ingCount": 11, "stepCount": 2, "sections": [{"type": "header", "text": "Cake"}, {"type": "ingredients", "items": ["1 cup chopped pecans or walnuts", "1 (18 ½ oz.) package yellow cake mix", "1 (3 ¾ oz.) package yellow vanilla instant pudding", "4 eggs", "1 ½ cup cold water", "½ cup oil", "½ cup rum (80%) If cake mix has pudding in the mix already…use 3 eggs no extra pudding and 1/3 cup oil."]}, {"type": "header", "text": "Glaze"}, {"type": "ingredients", "items": ["¼ lb butter", "¼ cup water", "1 cup granulated sugar", "½ cup rum (80%)"]}, {"type": "text", "text": "Cake Cooking Instructions: Preheat oven to 325 degrees. Grease and flour cake pan. Sprinkle nuts over the bottom of pan. Mix all cake ingredients together. Pour batter over nuts. Bake for 1 hour. Cool. Invert on serving plate. Prick top. Spoon and brush the glaze evenly over top and sides. Allow cake to absorb glaze. Repeat until all glaze is used up."}, {"type": "header", "text": "Glaze Cooking Instructions"}, {"type": "text", "text": "Melt butter in saucepan. Stir in water and sugar. Boil 5 minutes stirring constantly. Remove from heat. Stir in rum."}]}, {"id": "baked-potato-soup", "title": "Baked Potato Soup", "category": "Soups & Stews", "pages": [15], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "4-5 Large potatoes already baked Bacon bits Onion powder to taste Fresh ground pepper to taste Salt to taste Parsley flakes to taste Chopped chives to taste Fresh garlic to taste Chicken base or chicken stock Heavy cream ( small container ) ½ to 1 stick of butter Shredded cheddar cheese"}, {"type": "text", "text": "Chop the already baked potatoes up and put into a large stock pot. Then add all the seasoning, bacon bits, and butter. If you use the chicken base cover the potatoes with barely water covering the top. You want the potatoes to be sticking out of the water some. If you use the chicken stock…no water added just the chicken stock and add it barely covering the top of the potatoes too. Let this come to a light simmer. Once it starts to simmer add your heavy cream. Let it cook for about 10 minutes to get cream and soup nice and warm. Serve with shredded cheddar on top."}]}, {"id": "banana-nut-bread", "title": "Banana Nut Bread", "category": "Breads & Rolls", "pages": [16], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1/3 c. margarine or butter, melted", "½ c. sugar", "2 eggs", "1 ¾ c. flour", "1 tsp baking powder", "½ tsp baking soda", "½ tsp salt", "1 c. mashed bananas", "½ c. black walnuts"]}, {"type": "text", "text": "Cream together shortening and sugar, add eggs. Add dry ingredients, add bananas. Blend well after each addition. Then add walnuts. Bake at 350 degrees for 40-45 minutes."}]}, {"id": "banana-spice-cake-makes-12-servings", "title": "Banana Spice Cake (Makes 12 Servings)", "category": "Cakes & Cheesecakes", "pages": [17, 18], "tags": [], "ingCount": 14, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 egg whites", "1 egg", "1 c. light brown sugar", "1 c. dark brown sugar", "¼ c. vegetable shortening", "½ tsp. vanilla extract", "2 c. cake flour", "1 tbsp. baking powder", "½ tsp. salt", "½ tsp. ground cinnamon", "½ tsp. ground allspice", "¼ tsp. ground nutmeg", "2 large bananas, peeled and mashed", "½ c. evaporated skim milk"]}, {"type": "text", "text": "Preheat the oven to 350 degrees. In medium bowel, combine the first 6 ingredients. Beat with an electric mixer on medium speed for 1 minute or until mixed well. In separate bowl, sift together the flour, baking powder, salt, cinnamon, allspice and nutmeg. Gradually add to the egg mixture along with the bananas and milk. Pour the batter into an 8 inch round cake pan that has been sprayed with nonstick vegetable cooking spray. Bake at 30 minutes or until the cake tests done."}]}, {"id": "beans-and-rice", "title": "Beans and Rice", "category": "Pasta, Rice & Grains", "pages": [19, 20], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "1 pound of dried pinto beans or red kidney beans (Either bean is fine to use in this) Set in water and put to the side while you prepare everything. 2 pounds of smoked Hillshire Farms Smoked beef or chicken or turkey (You pick the meat you want to use just make sure it is one of these three you use) ½ onion finely chopped 4 to 5 stalks of celery chopped Fresh garlic to taste Fresh ground pepper to taste 5 to 8 drops of Liquid smoke Onion powder to taste Spicy smoked paprika to taste (If you want spicy add more of this) Smokey sweet paprika to taste (If you like more smokey flavor add more) Cavender Greek seasoning to taste Creole seasoning to taste Season salt to taste Parsley Flakes to taste Worcestershire sauce to taste Soy sauce to taste Beef base or beef stock or chicken base or chicken broth (If you use beef sausage add your beef base or beef stock…if you use turkey or chicken use chicken base or chicken stock)"}, {"type": "text", "text": "In a stock pot heated with some olive oil in the bottom…add your celery and onions with all seasonings. Sautee until onions and celery turn lighter in color or appear to have soften. Add your meat and cook for a while longer. When meat is starting to cook. Drain your beans and rinse them again thoroughly. Add beans to meat and seasoning. Add water or your stock to cover completely. If you are using the base add 2 to 3 heaping spoon full of the base to the water in the stock pot. Bring to a boil. Once it is boiling drop heat down to a simmer add more water if you need to. This dish should have a lot of juice to it. Make sure to taste after you let cook for a while so you can see if you need to add anything to it. This has to cook for about 4 to 6 hours or until beans are tender. Once beans are done and seasoning is right for your taste…it is ready to eat. Serve over rice."}]}, {"id": "berried-delight", "title": "Berried Delight (Version 1)", "category": "Other Desserts", "pages": [21, 22], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "header", "text": "Crust"}, {"type": "ingredients", "items": ["1 ½ c. graham cracker crust", "¼ c. sugar", "1/3 c. butter"]}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["1 package ( 8 oz. ) cream cheese, softened", "¼ c. sugar", "2 tbsp milk"]}, {"type": "header", "text": "Topping"}, {"type": "ingredients", "items": ["3 ½ c. cool whip", "2 pints strawberries", "2 packages ( 4 serving size ) instant pudding", "3 ½ c. cold milk"]}, {"type": "text", "text": "Combine crumbs, sugar, and butter. Press firmly into bottom of pie plate. Beat cream cheese with ¼ cup of sugar and 2 tbsp milk until smooth. Folding half of the cool whip in cream cheese mixture. Spread over graham cracker crust. Use 3 ½ cups milk and mix pudding. Slice up strawberries and place over cream cheese mixture. Pour pudding over top of sliced strawberries that are already on top of cream cheese. Chill several hours or overnight. Before serving spread the rest of cool whip on top of dessert then slice and serve."}]}, {"id": "berried-delight-2", "title": "Berried Delight (Version 2)", "category": "Other Desserts", "pages": [106, 107], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "header", "text": "Crust"}, {"type": "ingredients", "items": ["1 ½ c. graham cracker crust", "¼ c. sugar", "1/3 c. butter"]}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["1 package ( 8 oz. ) cream cheese, softened", "¼ c. sugar", "2 tbsp milk"]}, {"type": "header", "text": "Topping"}, {"type": "ingredients", "items": ["3 ½ c. cool whip", "2 pints strawberries", "2 packages ( 4 serving size ) instant pudding", "3 ½ c. cold milk"]}, {"type": "text", "text": "Combine crumbs, sugar, and butter. Press firmly into bottom of pie plate. Beat cream cheese with ¼ cup of sugar and 2 tbsp milk until smooth. Folding half of the cool whip in cream cheese mixture. Spread over graham cracker crust. Use 3 ½ cups milk and mix pudding. Slice up strawberries and place over cream cheese mixture. Pour pudding over top of sliced strawberries that are already on top of cream cheese. Chill several hours or overnight. Before serving spread the rest of cool whip on top of dessert then slice and serve."}]}, {"id": "best-ever-doughnuts", "title": "Best Ever Doughnuts", "category": "Breakfast & Brunch", "pages": [23], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 ½ cups of sifted flour", "4 tsp baking powder", "1 ¼ tsp ground nutmeg (optional)", "½ tsp salt", "2 eggs well beaten", "1 cup sugar", "2 tbsp melted butter", "1 cup milk", "1 tsp vanilla extract"]}, {"type": "text", "text": "Sift together dry ingredients. Beat together eggs and sugar until light. Stir in butter, milk, and vanilla. Add dry ingredients, stirring until smooth. Knead dough lightly on floured surface. Roll out 3/8 inch thickness. Cut with floured doughnut cutter. Fry in deep hot oil turning once. Drain on paper towels. Roll in sugar or dip in a glaze made of powdered sugar and milk."}]}, {"id": "biscuits-and-gravy", "title": "Biscuits and Gravy", "category": "Breakfast & Brunch", "pages": [24], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "Jimmy Dean Sausage (one roll) Salt Fresh ground pepper All-purpose flour 1 to 2 sticks of butter Olive oil Milk"}, {"type": "text", "text": "Get a pot and heat up the olive oil in it. When oil is hot add the sausage in it. Cook the sausage all the way done. Add salt, pepper, and butter to the sausage. Melt the butter all the way then add your flour. Add enough flour to just make it not so runny. Cook for about 5 to 8 minutes just until you get the flour and butter mixture nice and bubbly. Then add milk and whisk it all constantly. Once you get it thick the way you like it…it is done."}, {"type": "text", "text": "Cook biscuits as directions tell you to."}]}, {"id": "bite-you-back-gingersnaps", "title": "Bite You Back Gingersnaps", "category": "Cookies & Bars", "pages": [25], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 ¼ cups of flour", "3 tsp ginger", "1 tsp baking soda", "1 tsp cinnamon", "½ tsp cloves", "¼ tsp nutmeg", "¾ cup softened butter", "1 cup brown sugar", "1 egg", "¼ cup brown molasses"]}, {"type": "text", "text": "Preheat oven to 350. In a large bowl, combine flour, ginger, baking soda, cinnamon, and cloves, nutmeg. Set aside the “flour mix”. In another bowl, beat butter until fluffy. Add 1 cup of brown sugar and combine to fluffy. Add the egg and molasses, beat well, gradually adding the “flour mix”. Shape dough into 1 ½ inch balls and roll in raw brown sugar. Imprint with fork. Bake for 10-12 minutes to preferred texture. I bake for 11 minutes. After resting on a cookie sheet for about 1 minute, drop each cookie onto a plate dusted with sugar cinnamon mix to spice cookie bottom."}]}, {"id": "black-bottom-peanut-butter-chip-pie", "title": "Black Bottom Peanut Butter Chip Pie (Version 1)", "category": "Pies & Tarts", "pages": [26], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ( 9 inch ) unbaked pastry shell, pricked", "1 c. ( 6 oz. ) semi-sweet chocolate chips", "1/3 c. half and half or coffee cream", "1 ( 14 oz. ) sweetened condensed milk", "1 c. peanut butter flavored chips", "2 c. ( 1 pint ) whipping cream, stiffly whipped", "½ c. chopped peanuts"]}, {"type": "text", "text": "Preheat oven to 425 degrees. Bake pastry shell 10 to 15 minutes. In 1-quart microwave safe bowl combine chocoate chips with half and half; cook on 100% power ( high ) 1 to 2 minutes stirring each minute until chips are melted and mixture is smooth. Spread chocolate chip mixture over the bottom of the pie crust. In a 2-quart microwave safe bowl combine sweetened condensed milk and peanut butter chips; cook on 100% ( high ) 2 to 3 minutes, stirring after each minute until chips are melted and mixture is smooth. Pour into large bowl; cool to room temperature. With mixer beat the peanut butter mixture until smooth. Fold in whipped cream and peanuts. Chill 30 minutes. Spoon the peanut butter mixture on top of chocolate layer in pie crust. Chill whole pie for 4 hours. Garnish as desired."}]}, {"id": "black-bottom-peanut-butter-chip-pie-2", "title": "Black Bottom Peanut Butter Chip Pie (Version 2)", "category": "Pies & Tarts", "pages": [108], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ( 9 inch ) unbaked pastry shell, pricked", "1 c. ( 6 oz. ) semi-sweet chocolate chips", "1/3 c. half and half or coffee cream", "1 ( 14 oz. ) sweetened condensed milk", "1 c. peanut butter flavored chips", "2 c. ( 1 pint ) whipping cream, stiffly whipped", "½ c. chopped peanuts"]}, {"type": "text", "text": "Preheat oven to 425 degrees. Bake pastry shell 10 to 15 minutes. In 1-quart microwave safe bowl combine chocoate chips with half and half; cook on 100% power ( high ) 1 to 2 minutes stirring each minute until chips are melted and mixture is smooth. Spread chocolate chip mixture over the bottom of the pie crust. In a 2-quart microwave safe bowl combine sweetened condensed milk and peanut butter chips; cook on 100% ( high ) 2 to 3 minutes, stirring after each minute until chips are melted and mixture is smooth. Pour into large bowl; cool to room temperature. With mixer beat the peanut butter mixture until smooth. Fold in whipped cream and peanuts. Chill 30 minutes. Spoon the peanut butter mixture on top of chocolate layer in pie crust. Chill whole pie for 4 hours. Garnish as desired."}]}, {"id": "black-pepper-beef-stir-fry", "title": "Black Pepper Beef Stir Fry", "category": "Meat Mains", "pages": [27], "tags": [], "ingCount": 7, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["¾ lb boneless beef sirloin", "4 tbsp Kikkoman stir- fry sauce, divided", "1 tsp oriental sesame oil", "¼ tsp ground black pepper", "3 tbsp vegetable oil, divided", "2 medium size bell pepper ( any color ) cut into 1 inch squares", "1 medium onion, cut into 1 inch squares Hot cooked rice"]}, {"type": "text", "text": "Cut beef into 1 inch squares. Coat with 1 tbsp stir-fry sauce. Set aside. Combine oil and pepper with remaining sauce. Heat 1 tbsp oil in wok or large skillet over high heat. Add beef and stir-fry 1 minute. Add vegetables; stir-fry 3 minutes sprinkling with water if needed. Add beef and vegetables are coated with sauce. Serve with rice."}]}, {"id": "blackberry-lime-rickeys", "title": "Blackberry Lime Rickeys", "category": "Beverages", "pages": [28], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["2 cups blackberries, divided", "¾ cup sugar", "½ cup fresh lime juice", "1 cup gin Ice cubes", "1 liter sparkling water", "6 to 12 very thin lime slices"]}, {"type": "ingredients", "items": ["1. In a blender, whirl 1 ½ cups blackberries, the sugar, lime juice until smooth. Rub through a fine- mesh sieve into a pitcher to extract juices. Stir in gin.", "2. Half- fill 6 glasses with ice. Pour gin mixture into them and fill with sparkling water. Garnish with remaining blackberries and lime slices."]}, {"type": "text", "text": "Serves: 6"}]}, {"id": "blueberry-cream-cheese-muffin-top-bread", "title": "Blueberry & Cream Cheese Muffin Top Bread", "category": "Breads & Rolls", "pages": [29, 30], "tags": [], "ingCount": 16, "stepCount": 8, "sections": [{"type": "ingredients", "items": ["2 Loaves = one 9x5 & one 8x4 pans Cook Time: 55 minutes"]}, {"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["8 oz. Cream cheese, well softened", "½ cup granulated sugar", "2 cups blueberries ( fresh or frozen )", "1 tbsp all-purpose flour", "½ cup butter melted", "¾ cup buttermilk", "¼ cup canola oil", "2 large eggs", "1 ½ cup granulated sugar", "¼ cup light brown sugar, packed", "1 tbsp vanilla extract", "2 cups all- purpose flour", "1 ½ tsp baking soda", "1 tsp baking powder Pinch of salt", "1 to 2 tsp lemon zest- optional"]}, {"type": "header", "text": "Directions"}, {"type": "steps", "items": ["Preheat oven to 350 degrees, spray loaf pans with floured cooking spray, set aside. I used one 9x5 inch pan and 8x4 inch loaf pan or two 9x5 inch pans, or 10 to 12 cup bundt or tube cake pan or 9 inch spring form pan and bake as a coffee cake or muffin pans. Do not use two 8x4 pans, batter will not all fit.", "In medium bowl, combine the cream cheese, ½ cup granulated sugar and whisk vigorously to combine. The softer the cream cheese is the easier this will be. If yours isn't quite soft enough heat in the microwave for 5 seconds. Set bowl aside.", "In another medium bowl, combine blueberries , 1 tbsp flour and toss gently to coat. This helps prevent the blueberries from sinking to the bottom of the pan while baking. If using frozen blueberries keep them frozen or very cold rather than thawing them in advance because they stay intact better and bleed less when still frozen or very cold.", "In a large microwave safe bowl, melt the butter about 1 minute on high power. Add the buttermilk, oil, eggs, 1 ½ cups granulated sugar, brown sugar, vanilla, and whisk vigorously until combined.", "Add 2 cups flour, baking soda, baking powder, optional salt and stir to incorporate, don't over mix. Gently fold in the blueberries. Do not pour all the batter into whatever pan you are choosing to pour batter into. You want the cream cheese mixture in the middle of the batter.", "Distribute the cream cheese mixture on top of the batter. Distribute remaining blueberry batter over the top of the cream cheese mixture. Smooth lightly with a spatula.", "Bake the two loaves ( 9x5 & 8x4 ) for 45 to 65 minutes or until top is set in the center and golden, a toothpick may or may not come out clean because it could hit a patch of cream cheese. Baking times will vary greatly by pan size used. I baked the 8x4 loaf for 48 minutes and the 9x5 for 60 minutes. Muffins or mini loaves could bake in as short as 20 minutes, a big bundt pan may need 60 to 65 minutes. Allow bread to cool in pans for at least 15 minutes before removing and transferring to a wire rack to finish cooling. If bread is browning fast on top before center is cooking through, tent with foil in last 15 minutes of cooking.", "Store bread that's leftover wrapped in a plastic wrap and placed inside a large ziplock plastic bag for up to one week at room temperature or freeze for up to 3 months. Freezing any bread you are not going to eat in a week is recommended."]}]}, {"id": "blueberry-cobbler", "title": "Blueberry Cobbler", "category": "Other Desserts", "pages": [31, 32], "tags": [], "ingCount": 11, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["¾ c. water", "2 tbsp. cornstarch", "½ c. sugar", "4 c. fresh blueberries"]}, {"type": "text", "text": "In saucepan, combine water, cornstarch, and sugar; bring to a boil. Cook for 1 minute, stirring constantly. Add berries and mix; remove from heat. Pour into a 10 inch pie plate. Cover with topping ( see recipe below ). Bake at 425 degrees for 25 to 30 minutes or until topping is lightly browned. Serves: 6 servings"}, {"type": "text", "text": "Topping"}, {"type": "ingredients", "items": ["1 c. flour", "½ tsp. salt", "1 ½ tsp. baking powder", "1/3 c. skim milk", "3 tbsp. canola oil", "1 tsp. sugar", "¼ tsp. cinnamon"]}, {"type": "text", "text": "Combine flour, salt, and baking powder. Mix milk with oil; add to flour. Using a fork, mix until dough forms a ball. Drop by spoonfuls onto cobbler. Combine sugar and cinnamon; sprinkle over dough."}]}, {"id": "blueberry-delight", "title": "Blueberry Delight", "category": "Other Desserts", "pages": [33], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 can of blueberry pie filling", "1 container cool whip thawed", "1 can of crushed pineapple drained", "1 bag small marshmellows", "1 container vanilla pudding ( instant or cooked ) already mixed and chilled ready to serve Some pecans chopped"]}, {"type": "text", "text": "Mix everything together and let chill. Ready to serve."}]}, {"id": "blueberry-meringue-pie", "title": "Blueberry Meringue Pie", "category": "Pies & Tarts", "pages": [34, 35], "tags": [], "ingCount": 12, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["½ c. water", "½ c. sugar", "2 tbsp. cornstarch", "¼ tsp. cinnamon", "4 c. blueberries, approximately ( 1 container )", "1 tbsp. lemon juice", "2 egg whites", "3 tbsp. sugar"]}, {"type": "text", "text": "Combine water, ½ cup sugar, cornstarch in saucepan, stirring well. Cook over medium heat, stirring constantly until smooth, thickened, and transparent. Add blueberries, and continue cooking over low heat about 15 minutes. Remove from heat, add lemon juice. Pour mixture into pastry ( see recipe below). In mixer, beat egg whites until stiff glossy peaks form. Spread meringue over blueberries in pie. Bake at 350 degrees for 10 to 15 minutes or until well browned. Serves: 8 servings"}, {"type": "header", "text": "Pastry"}, {"type": "ingredients", "items": ["1 c. flour", "1 tbsp. light brown sugar", "3 tbsp. canola oil", "2 tbsp. cold water"]}, {"type": "text", "text": "Combine flour and sugar in bowl. Add oil, stirring with fork until crumbly. Add cold water, stir until ingredients are moistened. Press dough evenly over bottom and up sides of a 9-inch pie plate. Bake at 350 degrees for 15 minutes."}]}, {"id": "blueberry-pound-cake", "title": "Blueberry Pound Cake", "category": "Cakes & Cheesecakes", "pages": [36], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 ( 18 ½ oz. ) package light yellow cake mix", "1 ( 8 oz. ) package light cream cheese", "2 eggs", "1 1/3 c. water", "1 ½ tsp vanilla", "2 c. blueberries", "2/3 c. chopped pecans ( optional )", "1 tbsp flour to coat blueberries"]}, {"type": "text", "text": "In a large mixing bowl, mix all ingredients together except blueberries and nuts. Toss the flour and blueberries together in a separate bowl. Fold in floured berries. Pour batter into 10 inch bundt pan coated with non-stick cooking spray and dusted with flour. Bake at 350 degrees for 40 minutes ( it usually takes longer ) or until done. Cool in pan for 20 minutes. Invert and sprinkle with powdered sugar, if desired. Do not over cook."}]}, {"id": "blueberry-streusel-cake", "title": "Blueberry Streusel Cake", "category": "Cakes & Cheesecakes", "pages": [37], "tags": [], "ingCount": 13, "stepCount": 3, "sections": [{"type": "ingredients", "items": ["1 c. blueberries", "1 tbsp. lemon juice", "1 c. flour", "1 ½ tsp. baking powder", "¼ tsp. salt", "½ c. sugar", "1 egg white", "½ c. skim milk", "¼ c. light margarine, melted"]}, {"type": "text", "text": "Sprinkle blueberries with lemon juice, set aside. Combine flour, baking powder, salt, and sugar in bowl. Add egg white, milk, and melted margarine to dry ingredients, mix well. Pour batter into and 8 inch square pan coated with no stick cooking spray and dusted with flour. Sprinkle blueberries over batter and sprinkle with topping ( see recipe below ). Bake at 375 degrees for 40 to 45 minutes. Serves: 9 servings"}, {"type": "text", "text": "Topping"}, {"type": "ingredients", "items": ["½ c. sugar", "¼ c. flour", "¼ tsp cinnamon", "2 tbsp light margarine, melted"]}, {"type": "text", "text": "Mix together all ingredients."}]}, {"id": "breakfast-burritos", "title": "Breakfast Burritos", "category": "Breakfast & Brunch", "pages": [38], "tags": [], "ingCount": 0, "stepCount": 1, "sections": [{"type": "text", "text": "Eggs ( depends on how many people are feeding ) Bacon Bits or Cooked Bacon Crumbled Up Sausage Crumbles Shredded Cheddar Cheese You can anything to this burrito you want other meat or veggies The only thing the meats have to be already cooked and ready to go when added to your eggs. Salt Pepper Flour Torts Taco Bell Mild Sauce Salsa Butter Preheat your oven to 400 degrees. Wrap your torts in foil nice and tight. As soon as oven is ready put torts in oven to get warmed up takes about 10 to 15 minutes depending on how many you have put in the oven could take longer. Mix your eggs and whatever you decide to add to burritos into a bowl an add salt and pepper to taste. In skillet add your butter and melt. Once butter is melted add egg mixture. Cook until done. Take torts out of oven. Build your burrito with starting with egg mixture first then cheese and then your salsa and/or Taco Bell Sauce. Then roll up and serve."}]}, {"id": "breakfast-pizza", "title": "Breakfast Pizza", "category": "Breakfast & Brunch", "pages": [39, 40], "tags": [], "ingCount": 9, "stepCount": 5, "sections": [{"type": "text", "text": "Prep Time: 15 minutes Cook Time: 25 minutes Ready In: 40 minutes"}, {"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["1 pound ground breakfast sausage", "1 ( 8oz. ) package refrigerated crescent rolls", "1 cup frozen hash brown potatoes, thawed", "1 cup shredded cheddar cheese", "5 eggs", "¼ cup milk", "½ tsp salt", "1/8 tsp ground black pepper", "¼ cup grated Parmesan cheese"]}, {"type": "text", "text": "Step 1: Place sausage in a large deep skillet. Cook over medium high heat until evenly brown. Drain crumble and set aside. Preheat oven to 350 degrees."}, {"type": "text", "text": "Step 2: Brown sausage and drain. Separate crescent roll dough into 8 triangles. Place in an ungreased 12 inch pizza pan with points toward the center. Bottom of crust should be sealed and outside edge should be slightly raised. Spoon sausage over crust. Sprinkle with hash browns and top with cheddar cheese."}, {"type": "text", "text": "Step 3: Beat together eggs, milk, salt and pepper and pour over crust. Sprinkle with parmesan cheese."}, {"type": "text", "text": "Step 4: Bake in preheated oven until eggs are set about 25 to 30 minutes."}]}, {"id": "broccoli-and-crab-bisque", "title": "Broccoli and Crab Bisque", "category": "Soups & Stews", "pages": [41], "tags": [], "ingCount": 13, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 bunch green onions, chopped", "1 lb fresh mushrooms, sliced", "2 c. fresh broccoli florets", "3 cloves garlic, minced", "3 tbsp butter", "½ c. flour", "½ tsp. dried thyme", "1/8 tsp. pepper Salt to taste", "1 bay leaf", "2 c. milk", "3 c. chicken broth", "1 ½ c. grated swiss cheese", "1 lb. crabmeat, picked from bones"]}, {"type": "text", "text": "In a large pot, sautee green onions, mushrooms, broccoli florets, and garlic in butter until tender. Blend in flour, thyme, salt and pepper and bay leaf. Add milk and broth all at once. Cook and stir until thickened and bubbly. Add cheese until melted. Gently fold in crab meat and heat through. Serves 8 servings."}]}, {"id": "brown-gravy-mix", "title": "Brown Gravy Mix", "category": "Sauces, Dressings & Condiments", "pages": [42], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "2 Packs of Brown Gravy Mix Creole seasoning Lawry’s Season Salt Creole seasoning Cavender’s Greek Seasoning Onion powder Garlic powder or fresh mince garlic Pepper Dried parsley flakes Dried chopped chives Smoked sweet paprika Smoke hot paprika Liquid smoke Worcestershire sauce Soy sauce Chicken base or beef base depending on which meat you are serving this with (do not add water to the base this base will be added directly to the liquid) 1 can of cream of mushroom soup"}, {"type": "text", "text": "Follow the instructions on packet for gravy. Just remember to add the powder gravy mix first into pan and then slowly add the water while you are whisking this mixture. Then add all your seasonings and base then whisk in cream of mushroom soup. Cook as the packet says. Once done serve."}]}, {"id": "butter-pecan-cookies", "title": "Butter Pecan Cookies", "category": "Cookies & Bars", "pages": [43], "tags": [], "ingCount": 8, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. butter", "¾ c. brown sugar", "2 eggs", "1 tsp. vanilla", "2 ¼ c. sifted all-purpose flour", "1 tsp. baking soda", "½ tsp. salt", "1 c. chopped pecans"]}, {"type": "text", "text": "Cream butter and sugars till light. Beat in eggs and vanilla. Sift together dry ingredients, blend into creamed mixture. Stir in nuts. Drop from teaspoon on ungreased cookie sheet. Bake in 375 degrees oven for about 10 minutes. Makes about 4 dozen."}]}, {"id": "buttermilk-biscuits", "title": "Buttermilk Biscuits", "category": "Breads & Rolls", "pages": [44], "tags": [], "ingCount": 3, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["2 ½ c. self-rising flour", "½ c. frozen butter grated Mix with fork Chill for 10 minutes Make well", "1 c. buttermilk"]}, {"type": "text", "text": "Stir 15 times. Scoop out on floured board. Roll out be gentle. Roll and fold 4 times. Flour biscuit cutters. Bake 475 degrees for 15 minutes. Brush melted butter over top when done."}]}, {"id": "caramel-pecan-turtle-bars", "title": "Caramel Pecan Turtle Bars", "category": "Cookies & Bars", "pages": [45, 46], "tags": [], "ingCount": 10, "stepCount": 4, "sections": [{"type": "header", "text": "Crust"}, {"type": "ingredients", "items": ["¾ cup all-purpose flour", "½ cup brown sugar", "2 tbsp corn starch", "¼ cup butter (softened)", "½ cup finely chopped pecans"]}, {"type": "header", "text": "Filling"}, {"type": "ingredients", "items": ["25 Chewy Caramels", "2 tbsp butter", "2 tbsp heavy cream", "2 tbsp light or dark corn syrup", "½ cup semi-sweet chocolate chips"]}, {"type": "text", "text": "Line an 8x8 inch pan with foil and spray with cooking spray, let foil overhang edge of pan by 2 inches."}, {"type": "text", "text": "Blend flour, brown sugar, and corn starch in a large bowl. Cut in butter with two forks or pastry blender until crumbly. Stir in pecans. Press into prepared pan. Bake in preheated 350 degrees F oven for 11 to 13 minutes or until crust is lightly browned. Remove from oven."}, {"type": "text", "text": "Heat unwrapped caramels, butter, cream and corn syrup in a large microwave-safe bowl on HIGH for 1 to 2 minutes, stirring frequently, until mixture is smooth. Carefully spread over baked crust. Bake for 11 to 13 minutes or until caramel is just starting to bubble. Remove from oven and place on wire rack."}, {"type": "text", "text": "Sprinkle bars with chocolate chips and let rest for 5 minutes until chocolate is melted. Carefully spread chocolate over the caramel using back of soon for swirl effect, leaving portions of caramel exposed. Refrigerate for 2 hours or until chocolate is set. Remove from pan by lifting opposite ends of foil. Plac on cutting board and peel away foil before cutting."}]}, {"id": "caramel-snappers", "title": "Caramel Snappers", "category": "Candy & Confections", "pages": [47], "tags": [], "ingCount": 3, "stepCount": 7, "sections": [{"type": "ingredients", "items": ["144 small pecan halves about 1 cup", "36 light caramels", "½ c. semi sweet chocolate pieces melted"]}, {"type": "text", "text": "Grease cookie sheet. On it arrange pecans, flat side down, in groups of 4. Place 1 caramel on each cluster of pecans. Heat in slow oven 325 degrees till caramels soften, about 4 to 8 minutes. Watch carefully various caramels melt at different rates. Remove from oven, with buttered spatula flatten caramel over pecans. Cool slightly remove from pan to waxed paper. Swirl melted chocolate on top. Makes 36"}, {"type": "header", "text": "Note"}, {"type": "text", "text": "Thread: Syrup dropped from spoon spins 2 inch thread."}, {"type": "text", "text": "Soft Ball: Syrup can be shaped into a ball but flattens when removed from water."}, {"type": "text", "text": "Firm Ball: Syrup forms ball till pressed between fingers."}, {"type": "text", "text": "Hard Ball: Syrup forms hard ball, although it is pliable"}, {"type": "text", "text": "Soft Crack: Syrup separates into threads that are not brittle."}, {"type": "text", "text": "Hard Crack: Syrup separates into hard brittle threads."}]}, {"id": "caramels", "title": "Caramels", "category": "Candy & Confections", "pages": [48], "tags": [], "ingCount": 5, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. butter", "1 lb. or 2 ¼ c. brown sugar Dash of salt", "1 c. light corn syrup", "1 – 12 oz. can sweetened condensed milk", "1 tsp. vanilla"]}, {"type": "text", "text": "Melt butter in heavy 3 quart saucepan. Add brown sugar, and salt, stir till thoroughly combined. Stir in light corn syrup, mix well. Gradually add milk, stirring constantly. Cook and stir over medium heat till candy reaches firm ball stage ( 245 degrees ) about 12 to 15 minutes. Remove from heat, stir in vanilla. Pour into buttered pan. Cool cut into squares. Makes 2 ½ pounds"}]}, {"id": "carrot-cake-with-cream-cheese-maple-pecan-frosting", "title": "Carrot Cake with Cream Cheese Maple Pecan Frosting", "category": "Cakes & Cheesecakes", "pages": [49, 50, 51, 52, 53], "tags": [], "ingCount": 42, "stepCount": 3, "sections": [{"type": "text", "text": "For the Cake"}, {"type": "header", "text": "Ingredients"}, {"type": "ingredients", "items": ["1 cup white sugar", "1 cup brown sugar", "1 cup vegetable oil", "¼ cup Greek yogurt ( or sour cream )", "2 tsp vanilla", "4 eggs", "8 ounces crushed pineapple, with juice"]}, {"type": "header", "text": "Whisk Together"}, {"type": "ingredients", "items": ["2 cups flour, spooned and leveled", "2 tsp baking soda", "2 tsp baking powder", "1 tsp salt", "2 tsp cinnamon", "½ tsp nutmeg Fold In:"]}, {"type": "ingredients", "items": ["3 cups grated carrots ( I used about 5 medium )", "1 cup chopped pecans, toasted ( optional )"]}, {"type": "header", "text": "For the Frosting"}, {"type": "ingredients", "items": ["1 cup finely chopped pecans, toasted", "¾ cup ( 1 ½ sticks ) salted butter, soft", "1 ½ ( 8 oz. ) packages cream cheese, soft ( 12 oz. total )", "4 ½ cups powdered sugar", "6 tbsp real maple syrup ( Grade A )", "1 ½ tsp maple extract", "¼ tsp salt, or to taste More pecans to garnish"]}, {"type": "header", "text": "Instructions"}, {"type": "ingredients", "items": ["1. Preheat oven to 325 degrees. Prepare 2- 9 inch cake pans: trace the bottom of each pan onto parchment paper, cut it out, and place in the bottom of the pan. Then generously spray the paper and the sides of the pans with nonstick spray.", "2. In a large bowl or stand mixer, beat together white sugar, brown sugar, oil, Greek yogurt or sour cream ( which ever you chose to use ), vanilla, 4 eggs, and pineapple with juice. ( Do not drain )", "3. In separate bowl, whisk together flour, ( do not pack your flour! Spoon it into the measuring cup.), baking soda, baking powder, salt, cinnamon, and nutmeg.", "4. Add dry ingredients to the wet ingredients and stir until combined.", "5. Use a box grater to shred the carrots. It’s annoying to do this by hand but if you use a food processor, the shredded pieces will be to big and won’t melt into the cake.", "6. If you are adding pecans to the cake, toast the chopped pecans in a small skillet for a few minutes on medium until they start to smell good and are lightly browned.", "7. Fold in the carrots and pecans.", "8. Pour the batter into the prepared pans, do your best to distribute evenly. If you have a kitchen scale you can weigh them.", "9. Bake at 325 degrees for 38 to 40 minutes or until a toothpick comes out clean.", "10. Wait about 20 to 30 minutes, then run a knife along the edge and flip the cakes onto cooling racks. Be careful. This cake is heavy but delicate. Eat as many crumbs and scraps that you can get your hands on.", "11. Let cool completely.", "12. At this point, you can either wrap you cakes in plastic wrap and freeze so that it is super easy to frost or just go ahead and frost at this point. Be careful cake may crumble some."]}, {"type": "header", "text": "For the Frosting"}, {"type": "ingredients", "items": ["1. Chop up the pecans. You can chop them with a knife or a food processor. You want them fine. So they mix well with cream cheese.", "2. Set a frying pan over medium heat. Add the pecans and stir occasionally until they start to smell delicious, or until they barely start to brown. Set aside and cool.", "3. In a large mixing bowl or stand mixer, cream the butter and cream cheese until it’s high and fluffy.", "4. Add half the powdered sugar, maple extract, and salt. Beat well.", "5. Add the rest of the powdered sugar and all the maple syrup. Beat well.", "6. Add the chopped pecans when they are completely cooled and beat well.", "7. Place one of the cake layers on your cake plate. Top with about 1 cup of frosting and spread. Top with the other cake. Frost the top and sides of the cake.", "8. Garnish with toasted pecans."]}, {"type": "text", "text": "Recipe Notes"}, {"type": "text", "text": "You can use half applesauce and half oil to cut calories. Using this mixture is pretty common in this cake."}]}, {"id": "cauliflower-soup", "title": "Cauliflower Soup", "category": "Soups & Stews", "pages": [53], "tags": [], "ingCount": 9, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 medium cauliflower, cut into florets, reserve ½ cup chopped for garnish", "2 c. half and half", "3 tbsp butter", "1 white onion, minced", "3 tbsp flour", "¼ tsp salt", "¼ tsp pepper", "1 egg yolk, slightly beaten", "½ c. heavy cream Grated Romano cheese"]}, {"type": "text", "text": "In a large pan, cover cauliflower with boiling salted water and cook uncovered until tender. Strain, reserve liquid. Puree cauliflower and return to cooking liquid. Stir in half and half. Melt butter in small saucepan. Sautee onion over medium heat; whisk in flour, salt, and pepper until flour is absorbed. Remove from heat, whisk in egg yolk. Add mixture to cauliflower and simmer until soup."}]}, {"id": "chewy-oatmeal-cookies", "title": "Chewy Oatmeal Cookies", "category": "Cookies & Bars", "pages": [54], "tags": [], "ingCount": 10, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 c. sifted all-purpose flour", "¾ tsp baking soda", "½ tsp salt", "1 tsp cinnamon", "¼ tsp nutmeg", "¾ c. shortening, soft", "1 1/3 c. firmly packed brown sugar", "2 eggs", "2 c. oats uncooked", "1 c. raisins"]}, {"type": "text", "text": "Sift flour, baking soda, salt, cinnamon, and nutmeg into a bowl. Add shortening, sugar, eggs, and vanilla beat until smooth about 2 minutes. Stir in oats and raisins. Drop by heaping teaspoonfuls into greased cookie sheets. Bake in the preheated oven 350 degrees for 12-15 minutes. Makes about 3 ½ dozen cookies."}]}, {"id": "chick-peas-like-nuts", "title": "Chick Peas like Nuts", "category": "Snacks & Appetizers", "pages": [55], "tags": [], "ingCount": 0, "stepCount": 2, "sections": [{"type": "text", "text": "Canned chick peas drained and patted dry Salt Olive oil"}, {"type": "text", "text": "Preheat oven at 350 degrees F. Getting a baking sheet and place parchment paper on it. Put the dry chick peas on the parchment paper. Drizzle olive oil and salt all over chick peas. Then bake until they are crispy."}]}, {"id": "chick-peas-crispiest-crunchiest", "title": "Chick Peas: Crispiest & Crunchiest", "category": "Snacks & Appetizers", "pages": [56], "tags": [], "ingCount": 4, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["1. Preheat oven to 450 degrees and place rimmed baking sheet in the oven while it preheats.", "2. Drain and rinse a 15.5 oz. can of chick peas, the pat dry very dry with a paper towel.", "3. When completely dry, toss the chick peas with tbsp olive oil and ¼ tsp kosher salt and freshly ground black pepper. Place chick peas on heated baking sheet in an even layer and return to the oven.", "4. Roast shaking the pan halfway through, until crispy. Approx. 20 to 25 minutes."]}]}, {"id": "chick-fil-a-carrot-and-raisin-salad", "title": "Chick-fil-A Carrot and Raisin Salad", "category": "Salads", "pages": [68], "tags": ["Copycat & Adapted"], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["4 ½ c. shredded carrots", "1 ( 8 oz. ) can or 2/3 c. crushed, unstrained pineapple", "¾ c. raisins", "½ c. mayonnaise", "½ c. and 2 tbsp. sugar", "1 ¼ tbsp. fresh, unstrained lemon juice ( no seeds )"]}, {"type": "text", "text": "Mix all ingredients together. Makes 13-14 servings"}]}, {"id": "chicken-dumplings", "title": "Chicken & Dumplings", "category": "Breads & Rolls", "pages": [57], "tags": [], "ingCount": 0, "stepCount": 3, "sections": [{"type": "text", "text": "2 Large Skinless Boneless Chicken Breasts Whatever Frozen or Fresh Veggies You Want to Add 1 to 2 cans of Biscuits ( Just regular biscuits not the grands biscuits ) Normal Seasoning I use Chicken base Olive Oil"}, {"type": "text", "text": "If you need to thicken… (Cornstarch mixture recipe…Heaping tablespoon of cornstarch to a cup of water. Mixture thoroughly and add to boiling mixture you need it to thicken. It will thicken up pretty fast once added.)"}, {"type": "text", "text": "Cut up your chicken breasts up into bite size pieces. Cook in olive oil. Cook chicken an add your veggies to chicken halfway through cooking. Once chicken and veggies are done add just enough water to cover the food. Add your chicken base to this water. Cut up your biscuits into fours. Add biscuits when the water comes to a boil. Cook until biscuits are done and mixture is thick. If you need to make it thicker add cornstarch water mixture to it and that will help it become thick."}]}, {"id": "chicken-and-sausage-gumbo", "title": "Chicken and Sausage Gumbo (Version 1)", "category": "Soups & Stews", "pages": [58], "tags": [], "ingCount": 12, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["2/3 c. flour", "3 onions, chopped", "4 cloves garlic, minced", "2 green bell peppers, chopped", "2 stalks celery, chopped", "10 c. water", "1 ( 14 ½ oz. ) can stewed tomatoes", "3 to 4 lbs skinless, boneless chicken breasts, cut in pieces", "½ tsp dried thyme", "¼ tsp red pepper", "1 lb lite sausage", "1 bunch green onions, chopped"]}, {"type": "text", "text": "Place flour on baking sheet and bake at 400 degrees for 20 minutes. Stir every 5 minutes. Flour should be very brown ( works well in toaster oven ). Set aside. In large, heavy pot coated with non stick cooking spray, sautee vegetables until tender. Add browned flour, stirring constantly. Gradually add water, tomatoes and chicken. Bring to boil. Lower heat, and simmer for 1 hour. While gumbo is cooking, boil sausage in water in a pot until done. Slice sausage in 1 inch slices and add to gumbo. Cook an additional 20 minutes. Add green onions cooking 10 minutes. Skim any fat from surface of gumbo. Serve over rice."}, {"type": "text", "text": "Makes 10 to 12 servings."}]}, {"id": "chicken-and-sausage-gumbo-2", "title": "Chicken and Sausage Gumbo (Version 2)", "category": "Soups & Stews", "pages": [59, 60], "tags": [], "ingCount": 11, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 lb smoked chicken or turkey sausage cut in pieces", "2 boneless skinless chicken breasts cut in pieces", "4 ribs of celery chopped", "1 onion chopped", "1 bell pepper chopped Handful for okra", "3 cloves of garlic minced Onion powder to taste Season salt to taste Fresh ground black pepper to taste Creole seasoning to taste Cavender greek seasoning to taste Worcestershire sauce to taste Soy sauce to taste", "1 can of cream of mushroom soup", "1 can of cream of chicken soup", "1 can of cream of celery soup", "1 can crushed tomatoes with peppers", "1 can tomato paste Chicken base to taste or chicken broth to make mixture not thick"]}, {"type": "text", "text": "Brown chicken and sausage in dutch oven. Add all chopped fresh veggies and to the meat mixture. Add all seasonings to this. When meat and veggies are done cooking add all tomatoes and paste with all cream of soups. Add enough water with chicken base or chicken broth to make it not thick. Let simmer for about 45 minutes."}]}, {"id": "chicken-and-sausage-gumbo-3", "title": "Chicken and Sausage Gumbo (Version 3)", "category": "Soups & Stews", "pages": [118], "tags": [], "ingCount": 12, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["2/3 c. flour", "3 onions, chopped", "4 cloves garlic, minced", "2 green bell peppers, chopped", "2 stalks celery, chopped", "10 c. water", "1 ( 14 ½ oz. ) can stewed tomatoes", "3 to 4 lbs skinless, boneless chicken breasts, cut in pieces", "½ tsp dried thyme", "¼ tsp red pepper", "1 lb lite sausage", "1 bunch green onions, chopped"]}, {"type": "text", "text": "Place flour on baking sheet and bake at 400 degrees for 20 minutes. Stir every 5 minutes. Flour should be very brown ( works well in toaster oven ). Set aside. In large, heavy pot coated with non stick cooking spray, sautee vegetables until tender. Add browned flour, stirring constantly. Gradually add water, tomatoes and chicken. Bring to boil. Lower heat, and simmer for 1 hour. While gumbo is cooking, boil sausage in water in a pot until done. Slice sausage in 1 inch slices and add to gumbo. Cook an additional 20 minutes. Add green onions cooking 10 minutes. Skim any fat from surface of gumbo. Serve over rice."}, {"type": "text", "text": "Makes 10 to 12 servings."}]}, {"id": "chicken-bake", "title": "Chicken Bake", "category": "Poultry Mains", "pages": [61], "tags": [], "ingCount": 7, "stepCount": 2, "sections": [{"type": "ingredients", "items": ["Chicken breasts (boiled for 30 minutes)", "2 stalks of celery", "1 tbsp salt", "2-3 cups water/chicken broth"]}, {"type": "text", "text": "Remove water and put in different pot. Cook other ingredients (not chicken) until tender. Shred chicken on bottom of pan mix in separate bowl."}, {"type": "ingredients", "items": ["1 can golden mushroom soup", "1 can celery soup", "1 can evaporated milk"]}, {"type": "text", "text": "Pour above ingredients over chicken. Melt 3 tbsp butter in the chicken broth. Pour over mixture. Top with croutons. Bake at 350 degrees for 1 hour."}]}, {"id": "chicken-cabbage-stir-fry", "title": "Chicken Cabbage Stir Fry", "category": "Poultry Mains", "pages": [62], "tags": [], "ingCount": 16, "stepCount": 0, "sections": [{"type": "ingredients", "items": ["3 Chicken breasts halved", "1 tsp vegetable oil", "3 c. green cabbage shredded", "1 tbsp cornstarch", "½ tsp ground ginger", "¼ tsp garlic powder", "½ c. water", "1 tbsp soy sauce"]}, {"type": "header", "text": "Directions"}, {"type": "ingredients", "items": ["1. Cut chicken breasts into strips.", "2. Heat oil in frying pan.", "3. Add chicken strips and stir fry over medium high heat turning constantly until done.", "4. Add cabbage and sautee 2 minutes until cabbage is crisp and tender.", "5. Mix cornstarch and seasonings add water and soy sauce and mix until smooth.", "6. Stir sauce into chicken and cabbage mixture.", "7. Cook until sauce has thickened and chicken is coated about 1 minute.", "8. Refrigerate leftovers within 2 hours."]}]}, {"id": "chicken-fried-rice-michael-from-school", "title": "Chicken Fried Rice (Michael from School)", "category": "Pasta, Rice & Grains", "pages": [63], "tags": ["Michael's Recipe"], "ingCount": 6, "stepCount": 1, "sections": [{"type": "ingredients", "items": ["1 lb boneless, skinless chicken breast", "2 cups rice", "5 slices of bacon", "1 cup frozen peas", "2 eggs scrambled", "3 tsp soy sauce"]}, {"type": "text", "text": "Cut chicken breast up into bite size pieces. Cook in oil until cooked thoroughly. There should be no pink left inside and chicken should be golden brown. Using equal parts water and rice, cook in microwave for 5 mins. Place cooked rice in Ziploc and freeze for 10 mins. While rice is cooking, chop bacon into bite size pieces and cook in skillet until done. Put cooled rice into big skillet or wok. Add bacon, peas, and soy sauce. After well mixed, push rice to the sides of the pan. Scramble eggs and place in the center of rice. Let cook for a few minutes. Mix in with rice. Add cooked chicken in pan or serve on top

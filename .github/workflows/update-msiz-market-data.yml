name: Update MSIZ market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 13-22 * * 1-5"
    - cron: "15 1 * * *"

permissions:
  contents: write

concurrency:
  group: msiz-market-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v5

      - name: Refresh market snapshot
        run: python3 scripts/update_market_data.py

      - name: Publish changed market data
        run: |
          if git diff --quiet -- data/market-quotes.json; then
            echo "Market data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-quotes.json
          git commit -m "Update MSIZ market data"
          git push

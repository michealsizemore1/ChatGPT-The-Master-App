name: Update MSIZ market data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13-22 * * 1-5"
    - cron: "15 1 * * *"

permissions:
  contents: write

concurrency:
  group: msiz-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v5

      - name: Refresh market snapshot (looped during market hours)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 13-22 * * 1-5" ]; then
            ITERATIONS=4   # hourly market-hours trigger: refresh every ~15 min for the hour
          else
            ITERATIONS=1   # manual dispatch or the once-daily off-hours run: single refresh
          fi

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Fetch $i of $ITERATIONS"
            python3 scripts/update_market_data.py
            if git diff --quiet -- data/market-quotes.json; then
              echo "Market data is unchanged."
            else
              git add data/market-quotes.json
              git commit -m "Update MSIZ market data"
              git pull --rebase origin main
              git push
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$ITERATIONS" ]; then
              sleep 900
            fi
          done

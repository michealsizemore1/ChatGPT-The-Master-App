# Builds "M&C Money" as a real Android app (APK) from budget-tracker.html.
# The whole app is packed inside the APK - it does not load anything from the website.
#
# One-time setup: Settings > Secrets and variables > Actions > New repository secret
#   Name:  APP_SIGNING_PASSWORD     Value: any password (6+ characters). Keep it forever.
#
# Every time the budget files change (or you press "Run workflow" on the Actions tab),
# a new APK appears under Releases (the latest one is always at the top). Install it over the old one; your data stays.
name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - budget-tracker.html
      - budget-app.js
      - receipt-scanner.js
      - master-backup-shared.js
      - vendor/**
      - android-app/java/**
      - android-app/www/**
      - android-app/icon/**
      - android-app/bundle-offline.sh
      - .github/workflows/android-app.yml

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          PW: ${{ secrets.APP_SIGNING_PASSWORD }}
        run: |
          if [ -z "$PW" ] || [ ${#PW} -lt 6 ]; then
            echo "::error::Add a repository secret named APP_SIGNING_PASSWORD (6+ characters) under Settings > Secrets and variables > Actions, then run this again."
            exit 1
          fi
          KS="$RUNNER_TEMP/app.keystore"
          if [ -f android-signing/key.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-signing/key.enc -out "$KS" -pass env:PW \
              || { echo "::error::APP_SIGNING_PASSWORD doesn't match the saved signing key."; exit 1; }
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias mcmoney -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=M&C Money, O=Personal"
            mkdir -p android-signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out android-signing/key.enc -pass env:PW
            git config user.name "github-actions[bot]"
            git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
            git add android-signing/key.enc
            git commit -m "Save encrypted Android signing key (needed for app updates)"
            git push
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          A=android-build/app/src/main
          mkdir -p $A/java/com/sizemore/mcmoney $A/assets/www $A/res/values $A/res/mipmap-anydpi-v26 \
                   $A/res/mipmap-xxxhdpi $A/res/drawable $A/res/drawable-nodpi
          cd android-build

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MCMoney"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sizemore.mcmoney'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.sizemore.mcmoney'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
                  versionName "1." + (System.getenv('VERSION_CODE') ?: '1')
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_FILE'))
                      storePassword System.getenv('APP_SIGNING_PASSWORD')
                      keyAlias 'mcmoney'
                      keyPassword System.getenv('APP_SIGNING_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <permission
                  android:name="com.sizemore.mcmoney.READ_SPENDING"
                  android:label="Read M&amp;C Money daily spending"
                  android:description="@string/read_spending_desc"
                  android:protectionLevel="dangerous" />
              <queries>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>
              </queries>
              <application
                  android:label="M&amp;C Money"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode|density"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name=".CaptureProvider"
                      android:authorities="com.sizemore.mcmoney.capture"
                      android:exported="false"
                      android:grantUriPermissions="true" />
                  <provider
                      android:name=".SpendingProvider"
                      android:authorities="com.sizemore.mcmoney.spending"
                      android:exported="true"
                      android:readPermission="com.sizemore.mcmoney.READ_SPENDING" />
                  <receiver
                      android:name=".UpdateReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_bg">#F5F7FB</color>
              <string name="read_spending_desc">See how much was spent each day (totals only) in M&amp;C Money.</string>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:navigationBarColor">#0F172A</item>
                  <item name="android:windowBackground">@color/app_bg</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="315" android:startColor="#065F46" android:endColor="#10B981" />
          </shape>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_mono" />
          </adaptive-icon>
          EOF

          cd ..
          cp android-app/java/com/sizemore/mcmoney/*.java $A/java/com/sizemore/mcmoney/
          cp android-app/www/android-bridge.js $A/assets/www/

      - name: Add app icons
        run: |
          R=android-build/app/src/main/res
          cp android-app/icon/ic_fg.xml android-app/icon/ic_mono.xml $R/drawable/
          cp android-app/icon/ic_launcher.png $R/mipmap-xxxhdpi/ic_launcher.png

      - name: Copy the budget app into the APK
        run: |
          python3 - <<'EOF'
          import os, re, shutil
          dst = "android-build/app/src/main/assets/www"
          html = open("budget-tracker.html", encoding="utf-8").read()
          html = re.sub(r'<link[^>]*rel="manifest"[^>]*>\s*', "", html)
          html = re.sub(r'<script[^>]*home-button\.js[^>]*>\s*</script>\s*', "", html)
          html = re.sub(r'(src="[^"?]+\.js)\?[^"]*"', r'\1"', html)
          html = html.replace("<head>", '<head>\n<script src="android-bridge.js"></script>', 1)
          for src in re.findall(r'<script[^>]*src="([^"]+)"', html):
              if src.startswith(("http:", "https:", "//")) or src == "android-bridge.js":
                  continue
              rel = os.path.normpath(src)
              os.makedirs(os.path.join(dst, os.path.dirname(rel)), exist_ok=True)
              shutil.copy(rel, os.path.join(dst, rel))
              print("bundled", rel)
          open(os.path.join(dst, "index.html"), "w", encoding="utf-8").write(html)
          EOF

      - name: Bundle receipt reader and font (works offline)
        run: bash android-app/bundle-offline.sh android-build/app/src/main/assets/www

      - name: Build APK
        env:
          APP_SIGNING_PASSWORD: ${{ secrets.APP_SIGNING_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android-build
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MC-Money.apk"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "money-app-${{ github.run_number }}" MC-Money.apk \
            --title "M&C Money app v1.${{ github.run_number }}" \
            --notes "Download MC-Money.apk on your phone and open it to install or update." \
            --latest --target "$(git rev-parse HEAD)"

      - name: Keep only the 5 newest app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("money-app-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --yes --cleanup-tag
            done

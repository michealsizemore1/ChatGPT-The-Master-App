<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveTrack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#f4f6f5;--card:#ffffff;--text:#121816;--muted:#5f6b66;--line:#dfe5e2;--live:#16a34a;--warn:#d97706;--bad:#dc2626;--route:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1110;--card:#171d1b;--text:#eef3f1;--muted:#93a19b;--line:#26302c;--route:#d4e635}}
:root[data-theme="dark"]{--bg:#0d1110;--card:#171d1b;--text:#eef3f1;--muted:#93a19b;--line:#26302c;--route:#d4e635}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 16px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0}
.badge{font-size:.75rem;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--muted);text-transform:uppercase}
.badge.running{background:var(--live);color:#fff}.badge.paused,.badge.stopped{background:var(--warn);color:#fff}.badge.alert{background:var(--bad);color:#fff}
.upd{color:var(--muted);font-size:.8rem;width:100%}
#alert{display:none;margin:0 16px 8px;padding:12px 14px;border-radius:12px;background:var(--bad);color:#fff;font-weight:700}
#map{height:55vh;min-height:280px;margin:0 16px;border-radius:14px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
#msg{padding:24px 16px;color:var(--muted)}
footer{padding:4px 16px 24px;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<header>
  <h1 id="title">LiveTrack</h1><span id="badge" class="badge">Loading</span>
  <div class="upd" id="upd"></div>
</header>
<div id="alert"></div>
<div id="map"></div>
<div class="stats" id="stats"></div>
<div id="msg"></div>
<footer>Updates about every 30 seconds while the run is going. Map © OpenStreetMap contributors.</footer>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1));
  var db=h.get('db')||'',id=h.get('id')||'';
  if(!db||!id){document.getElementById('msg').textContent='This link is missing its tracking code.';document.getElementById('map').style.display='none';return;}
  if(!/^https?:\/\//.test(db))db='https://'+db;
  var map=L.map('map',{zoomControl:true}).setView([43.61,-116.39],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  var line=L.polyline([],{color:getComputedStyle(document.documentElement).getPropertyValue('--route').trim()||'#0f766e',weight:5}).addTo(map);
  var me=null,fitted=false,lastStart=0;
  function pace(sec,m){if(!m||m<50)return '–';var s=Math.round(sec/(m/1609.344));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function clock(s){s=Math.round(s||0);var hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;return (hh?hh+':'+String(mm).padStart(2,'0'):mm)+':'+String(ss).padStart(2,'0');}
  function ago(t){var s=Math.round((Date.now()-t)/1000);if(s<60)return s+' s ago';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(t).toLocaleString();}
  function stat(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>';}
  function render(d){
    var n=(d&&d.now)||null;
    if(!n){document.getElementById('badge').textContent='No run yet';document.getElementById('msg').textContent='Nothing shared yet. This page fills in when a run starts.';return;}
    document.getElementById('msg').textContent='';
    document.getElementById('title').textContent=(n.name?n.name+"'s run":'LiveTrack')+(n.trail?' · '+n.trail:'');
    var stale=Date.now()-n.updated>3*60*1000;
    var st=n.state||'';
    var label={running:'Live',paused:'Paused',stopped:'Stopped',finished:'Finished',test:'Test'}[st]||st;
    if(st==='running'&&stale)label='Signal lost';
    var b=document.getElementById('badge');b.textContent=n.alert?'Alert':label;b.className='badge '+(n.alert?'alert':st);
    document.getElementById('upd').textContent=(n.start?'Started '+new Date(n.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' · ':'')+'Updated '+ago(n.updated);
    var al=document.getElementById('alert');
    if(n.alert){al.style.display='block';al.textContent='No movement for several minutes. Last known location is on the map.';}else al.style.display='none';
    var mi=(n.dist||0)/1609.344;
    document.getElementById('stats').innerHTML=stat(mi.toFixed(2),'miles')+stat(clock(n.moving),'moving time')+stat(pace(n.moving,n.dist),'avg pace /mi')+
      (n.hr?stat(n.hr,'heart rate'):'')+(n.power?stat(n.power+' W','power'):'')+(n.trailLeft!=null?stat((n.trailLeft/1609.344).toFixed(2),'trail mi left'):'');
    var pts=[];var p=d.pts;
    if(Array.isArray(p))p.forEach(function(x){if(x)pts.push([x[0],x[1]]);});
    else if(p&&typeof p==='object')Object.keys(p).sort(function(a,b){return a-b;}).forEach(function(k){pts.push([p[k][0],p[k][1]]);});
    if(n.start!==lastStart){fitted=false;lastStart=n.start;}
    line.setLatLngs(pts);
    var cur=(n.lat!=null&&n.lon!=null)?[n.lat,n.lon]:(pts.length?pts[pts.length-1]:null);
    if(cur){
      if(!me)me=L.circleMarker(cur,{radius:9,color:'#fff',weight:3,fillColor:n.alert?'#dc2626':'#16a34a',fillOpacity:1}).addTo(map);
      else{me.setLatLng(cur);me.setStyle({fillColor:n.alert?'#dc2626':(st==='running'?'#16a34a':'#d97706')});}
      if(!fitted){if(pts.length>1)map.fitBounds(line.getBounds(),{padding:[30,30]});else map.setView(cur,15);fitted=true;}
      else if(st==='running')map.panTo(cur,{animate:true});
    }
  }
  function load(){
    fetch(db.replace(/\/$/,'')+'/live/'+encodeURIComponent(id)+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(render).catch(function(e){document.getElementById('badge').textContent='Offline';document.getElementById('msg').textContent='Could not load ('+e.message+'). Retrying…';});
  }
  load();setInterval(load,10000);
})();
</script>
</body>
</html>

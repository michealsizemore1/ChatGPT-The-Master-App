<script>
const APP_VERSION='2026-10-03-1';

function gameToday(id){return state.games.find(g=>g.competitions?.[0]?.competitors?.some(x=>String(x.team?.id)===id))}
// Team records come from the league standings feed (not from today's scoreboard, which --
// unlike football's one-game-a-week slate -- only covers the handful of teams playing today).
// rankValue() mirrors the official NHL tiebreak: points percentage first, total points second.
function rankValue(candidate){
 const rec=state.standings[candidate.id];
 if(!rec||!rec.gamesPlayed)return 0;
 return rec.pointPct*100000+rec.points;
}
function recordFor(t){return state.standings[t.id]?.record||'0-0-0'}
function visibleTeams(){
 const list=teams.filter(t=>(t.name+t.abbr+t.division).toLowerCase().includes(state.query.toLowerCase()));
 if(state.sort==='rank')return [...list].sort((a,b)=>rankValue(b)-rankValue(a));
 if(state.sort==='alphabetical')return [...list].sort((a,b)=>a.name.localeCompare(b.name));
 if(state.sort==='status')return [...list].sort((a,b)=>({in:0,post:1,pre:2}[gameToday(a.id)?.status?.type?.state]??3)-({in:0,post:1,pre:2}[gameToday(b.id)?.status?.type?.state]??3));
 if(state.sort==='record')return [...list].sort((a,b)=>rankValue(b)-rankValue(a));
 return list;
}
function standingFor(team){
 const rank=(pool)=>{const score=rankValue(team);const better=pool.filter(candidate=>rankValue(candidate)>score).length;const tied=pool.filter(candidate=>rankValue(candidate)===score).length>1;return `${tied?'T':''}${better+1}`};
 return {division:rank(teams.filter(candidate=>candidate.division===team.division)),league:rank(teams)};
}

async function loadStandings(){

  const d=await res.json();
  const map={};
  (d.children||[]).forEach(conf=>{
   (conf.standings?.entries||[]).forEach(entry=>{
    const statVal=(name)=>entry.stats?.find(s=>s.name===name)?.value;
    const wins=statVal('wins')||0,losses=statVal('losses')||0,otLosses=statVal('otLosses')||0,points=statVal('points')||0,gamesPlayed=statVal('gamesPlayed')||0;
    map[String(entry.team.id)]={wins,losses,otLosses,points,gamesPlayed,record:`${wins}-${losses}-${otLosses}`,pointPct:gamesPlayed?points/(gamesPlayed*2):0};
   });
  });
  state.standings=map;
 }catch{}
 render();
}

function awayHomeTeams(teamsArr){return [teamsArr.find(t=>t.homeAway==='away'),teamsArr.find(t=>t.homeAway==='home')]}
function teamStatFilter(name){return /shot|hit|takeaway|powerplay|shorthanded|shootout|faceoff|giveaway|penalt/i.test(name)}
// Skater box-score rows are grouped by position (forwards/defenses), each athlete's stats array
// lined up against a shared `keys` list -- unlike football's one-leader-per-category shape, hockey
// needs the top performer picked out of a full roster, so this re-derives points per skater and
// the best goaltending line per team directly from the raw box score.
function computeHockeyLeaders(playersBlock){
 if(!playersBlock)return {skater:null,goalie:null};
 const cats=playersBlock.statistics||[];
 const skaterCats=cats.filter(c=>c.name==='forwards'||c.name==='defenses');
 let bestSkater=null;
 skaterCats.forEach(cat=>{
  const gi=cat.keys?.indexOf('goals')??-1,ai=cat.keys?.indexOf('assists')??-1;
  (cat.athletes||[]).forEach(a=>{
   const goals=Number(a.stats?.[gi]||0),assists=Number(a.stats?.[ai]||0),points=goals+assists;
   if(!bestSkater||points>bestSkater.points)bestSkater={name:a.athlete?.displayName||'',goals,assists,points};
  });
 });
 const goalieCat=cats.find(c=>c.name==='goalies');
 let bestGoalie=null;
 if(goalieCat){
  const si=goalieCat.keys?.indexOf('saves')??-1,sai=goalieCat.keys?.indexOf('shotsAgainst')??-1,svi=goalieCat.keys?.indexOf('savePct')??-1;
  (goalieCat.athletes||[]).forEach(a=>{
   const saves=Number(a.stats?.[si]||0);
   if(!bestGoalie||saves>bestGoalie.saves)bestGoalie={name:a.athlete?.displayName||'',saves,shotsAgainst:a.stats?.[sai],savePct:a.stats?.[svi]};
  });
 }
 return {skater:bestSkater,goalie:bestGoalie};
}

  const scoringPlays=(d.plays||[]).filter(p=>p.scoringPlay);

 }catch{}

const teamMetricFields=['powerPlayPct','penaltyKillPct','goalDiff','shotsPerGame','faceoffPct','scoringOff','scoringDef','savePct','shotsAgainstPerGame','penaltyMinutes'];
function formatMetricValue(field,value){
 if(value==null||!Number.isFinite(value))return null;
 if(field==='powerPlayPct'||field==='penaltyKillPct'||field==='faceoffPct')return `${value.toFixed(1)}%`;
 if(field==='goalDiff')return value>0?`+${value}`:`${value}`;
 if(field==='shotsPerGame'||field==='shotsAgainstPerGame')return `${value.toFixed(1)} SOG/GM`;
 if(field==='scoringOff'||field==='scoringDef')return `${value.toFixed(2)} GPG`;
 if(field==='savePct')return value.toFixed(3).replace(/^0/,'');
 if(field==='penaltyMinutes')return `${value.toFixed(1)}/GM`;
 return String(value);
}
async function loadEssentialMetrics(){
 if(state.metricsLoading)return;
 state.metricsLoading=true;
 render();
 try{
  const rows=await Promise.all(teams.map(async t=>{
   try{
    const [statsRes,teamRes]=await Promise.all([fetch(`${api}/teams/${encodeURIComponent(t.id)}/statistics?season=${CURRENT_SEASON}`,{cache:'no-store'}).then(r=>r.json()),fetch(`${api}/teams/${encodeURIComponent(t.id)}`,{cache:'no-store'}).then(r=>r.json())]);
    const cats=statsRes.results?.stats?.categories||[];
    const stat=(cat,name)=>cats.find(c=>c.name===cat)?.stats?.find(s=>s.name===name);
    const gamesPlayed=Number(stat('general','games')?.value||0);
    if(!gamesPlayed)return null;
    const goalsFor=Number(stat('offensive','goals')?.value||0);
    const goalsAgainstTotal=Number(stat('defensive','goalsAgainst')?.value||0);
    const recordTotal=(teamRes.team?.record?.items||[]).find(x=>x.type==='total');
    const recStat=(name)=>recordTotal?.stats?.find(s=>s.name===name)?.value;
    return{abbr:t.abbr,name:t.name,powerPlayPct:Number(recStat('powerPlayPct')),penaltyKillPct:Number(recStat('penaltyKillPct')),goalDiff:goalsFor-goalsAgainstTotal,shotsPerGame:Number(stat('offensive','shotsTotal')?.perGameValue),faceoffPct:Number(stat('offensive','faceoffPercent')?.value),scoringOff:Number(recStat('avgPointsFor')),scoringDef:Number(recStat('avgPointsAgainst')),savePct:Number(stat('defensive','savePct')?.value),shotsAgainstPerGame:Number(stat('defensive','shotsAgainst')?.perGameValue),penaltyMinutes:Number(stat('penalties','penaltyMinutes')?.perGameValue)};
   }catch(e){return null}
  }));
  const valid=rows.filter(Boolean);
  const lowerIsBetter=new Set(['scoringDef','shotsAgainstPerGame','penaltyMinutes']);
  const leaders={};
  teamMetricFields.forEach(field=>{
   const ranked=valid.filter(r=>Number.isFinite(r[field]));
   if(!ranked.length){leaders[field]=null;return}
   const best=ranked.reduce((a,b)=>(lowerIsBetter.has(field)?b[field]<a[field]:b[field]>a[field])?b:a);
   leaders[field]={abbr:best.abbr,name:best.name,value:best[field]};
  });
  state.metricsData=leaders;
 }catch(e){}
 finally{state.metricsLoading=false;render()}
}

 return suffix?`${displayValue} ${suffix}`:String(displayValue);
}

// Real 16-team Stanley Cup field: each conference sends the top three teams in each of its two
// divisions (seeded 1-3 by points) plus the next two best remaining teams in the conference as
// wild cards. The division winner with the better overall record draws the weaker wild card in
// Round 1, per the NHL's actual bracket rule. Round 1 stays within each division group through
// Round 2 (Second Round), then the two group winners meet in the Conference Final.
function computeNhlPlayoffField(){
 const seedConference=(conf)=>{
  const confTeams=teams.filter(t=>conferenceOf(t.division)===conf);
  const divisions=[...new Set(confTeams.map(t=>t.division))];
  const topThree=(div)=>[...confTeams.filter(t=>t.division===div)].sort((a,b)=>rankValue(b)-rankValue(a)).slice(0,3);
  const [divA,divB]=divisions;
  const aTop=topThree(divA),bTop=topThree(divB);
  const topIds=new Set([...aTop,...bTop].filter(Boolean).map(t=>t.id));
  const wildcards=confTeams.filter(t=>!topIds.has(t.id)).sort((a,b)=>rankValue(b)-rankValue(a)).slice(0,2);
  const [wc1,wc2]=wildcards;
  const aBetter=aTop[0]&&bTop[0]?rankValue(aTop[0])>=rankValue(bTop[0]):true;
  return {
   groupA:{division:divA,seeds:aTop,opponent:aBetter?wc2:wc1},
   groupB:{division:divB,seeds:bTop,opponent:aBetter?wc1:wc2}
  };
 };
 return {Eastern:seedConference('Eastern'),Western:seedConference('Western')};
}

 const gameBtn=e.target.closest('[data-game-id]');
 if(gameBtn){
  const abbr=gameBtn.dataset.teamAbbr;
  const game=(state.schedules[abbr]||[]).find(g=>g.id===gameBtn.dataset.gameId);
  if(game)gameClick(game,abbr);
  return;
 }
 const metricBtn=e.target.closest('[data-metric-view]');
 if(metricBtn){state.metricView=metricBtn.dataset.metricView;render();return}
});
document.getElementById('app').addEventListener('input',e=>{
 if(e.target.id==='team-search-input'){
  const pos=e.target.selectionStart;
  state.query=e.target.value;
  render();
  const el=document.getElementById('team-search-input');
  if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}
 }
});
document.getElementById('app').addEventListener('change',e=>{
 if(e.target.id==='sort-select'){state.sort=e.target.value;render()}
});
document.addEventListener('error',e=>{
 if(e.target&&e.target.classList&&(e.target.classList.contains('espn-logo')||e.target.classList.contains('player-headshot')))e.target.style.display='none';
},true);

render();
loadScores();
loadStandings();
loadEssentialMetrics();
loadPlayerLeaders();
setInterval(loadScores,120000);
setInterval(livePollTick,90000);
setInterval(loadStandings,300000);
setInterval(()=>{if(state.selectedGameId)loadGameDetails()},120000);
setInterval(loadEssentialMetrics,1800000);
setInterval(loadPlayerLeaders,1800000);
</script>
</body>
</html>

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
// The app treats "today" as a fixed date (2026-07-27) throughout — same convention used by
// useDerived() and the Cash Flow calendar — so newly-logged price history lines up with it.
function todayISO() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function fmtCurrency(n, opts) {
  const o = opts || {};
  const abs = Math.abs(n);
  const str = abs.toLocaleString("en-US", { minimumFractionDigits: o.decimals === false ? 0 : 2, maximumFractionDigits: o.decimals === false ? 0 : 2 });
  return (n < 0 ? "-$" : "$") + str;
}

function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function fmtDateShort(d) {
  const dt = new Date(d + "T00:00:00");

function monthKey(d) { return d.slice(0, 7); }
function nextMonthKey(month) {
  const [year, monthNumber] = String(month || "").split("-").map(Number);
  if (!year || !monthNumber) return month;
  const next = new Date(Date.UTC(year, monthNumber, 1));
  return next.toISOString().slice(0, 7);
}
function financialReviewMonth(transaction, data) {
  if (transaction.reviewMonth) return transaction.reviewMonth;
  const actualMonth = monthKey(transaction.date || "");
  const prefs = (data && data.financialReviewPrefs) || {};
  const day = Number(String(transaction.date || "").slice(8, 10));
  const isIncome = Number(transaction.amount) > 0 && transaction.category !== "Transfer";
  return prefs.earlyIncomeToNextMonth && isIncome && day >= 27 ? nextMonthKey(actualMonth) : actualMonth;
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }

function isoDate(y, m, day) { return `${y}-${pad(m)}-${pad(day)}`; }

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

/* ============================== STATEMENT IMPORT (CSV) ============================== */

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const s = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inQuotes) {
      if (c === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else {
      field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => String(cell).trim() !== ""));
}

const IMPORT_COLUMN_ALIASES = {

function guessColumnMapping(headers) {
  const mapping = { date: null, description: null, amount: null, debit: null, credit: null, category: null };
  const used = new Set();
  Object.keys(IMPORT_COLUMN_ALIASES).forEach(field => {
    const aliases = IMPORT_COLUMN_ALIASES[field];
    let foundIdx = -1;
    headers.forEach((h, idx) => {
      if (used.has(idx) || foundIdx !== -1) return;
      const hLower = String(h || "").trim().toLowerCase();
      if (aliases.some(a => hLower === a || hLower.includes(a))) foundIdx = idx;
    });
    if (foundIdx !== -1) { mapping[field] = foundIdx; used.add(foundIdx); }
  });
  return mapping;
}

function parseAmountCell(raw) {
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,]/g, "").trim();
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  else if (s.startsWith("+")) { s = s.slice(1); }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}

function parseDateCell(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [, mm, dd, yy] = m;
    if (yy.length === 2) yy = (parseInt(yy, 10) < 70 ? "20" : "19") + yy;
    const mi = parseInt(mm, 10), di = parseInt(dd, 10);
    if (mi >= 1 && mi <= 12 && di >= 1 && di <= 31) return `${yy}-${pad(mi)}-${pad(di)}`;
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) return isoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  return "";
}

function guessCategoryFromRules(merchant, rules, amount) {

function isDuplicateTx(candidate, existingTx, accountId) {
  return existingTx.some(t =>
    t.accountId === accountId &&
    t.date === candidate.date &&
    Math.abs(t.amount - candidate.amount) < 0.005 &&
    t.merchant.trim().toLowerCase() === candidate.merchant.trim().toLowerCase()
  );
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fileToCompressedDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function estimateMinPayment(account) {
  const enteredPayment = Number(account.monthlyPayment);
  if (Number.isFinite(enteredPayment) && enteredPayment > 0) return enteredPayment;
  if (account.type === "credit") return Math.max(35, Math.abs(account.balance) * 0.03);
  // Existing car-loan records predate the required-payment field. Use the
  // household's current payment as their migration fallback until edited.
  if (account.type === "loan") return 712.15;
  return 0;
}

function simulatePayoff(debtAccounts, extraMonthly, strategy) {
  let bals = debtAccounts.map(d => ({ id: d.id, name: d.name, balance: Math.abs(d.balance), apr: d.apr || 0, minPayment: estimateMinPayment(d) }));
  const order = strategy === "avalanche"
    ? [...bals].sort((a, b) => b.apr - a.apr).map(d => d.id)
    : [...bals].sort((a, b) => a.balance - b.balance).map(d => d.id);

  let months = 0, totalInterest = 0;
  const schedule = [bals.reduce((s, d) => s + d.balance, 0)];
  while (bals.some(d => d.balance > 0.01) && months < 480) {
    months++;
    bals.forEach(d => {
      if (d.balance <= 0) return;
      const interest = d.balance * (d.apr / 100 / 12);
      totalInterest += interest;
      d.balance += interest;
    });
    bals.forEach(d => {
      if (d.balance <= 0) return;
      d.balance -= Math.min(d.minPayment, d.balance);
    });
    let extra = extraMonthly;
    for (const id of order) {
      if (extra <= 0) break;
      const d = bals.find(x => x.id === id);
      if (!d || d.balance <= 0) continue;
      const pay = Math.min(extra, d.balance);
      d.balance -= pay;
      extra -= pay;
    }
    schedule.push(bals.reduce((s, d) => s + Math.max(0, d.balance), 0));
  }
  return { months, totalInterest, schedule, payoffOrder: order.map(id => bals.find(d => d.id === id).name) };
}

function buildInsights(data, derived) {
  const insights = [];
  const months = derived.trendMonths;

  if (months.length >= 2) {
    const cur = months[months.length - 1];
    const prev = months[months.length - 2];
    const curTotals = derived.monthlyCategoryTotals[cur] || {};
    const prevTotals = derived.monthlyCategoryTotals[prev] || {};
    let biggest = null;
    Object.keys(curTotals).forEach(cat => {
      const prevAmt = prevTotals[cat] || 0;
      const curAmt = curTotals[cat];
      if (prevAmt > 20) {
        const pctChange = ((curAmt - prevAmt) / prevAmt) * 100;
        if (!biggest || Math.abs(pctChange) > Math.abs(biggest.pctChange)) biggest = { cat, pctChange, curAmt, prevAmt };
      }
    });
    if (biggest && Math.abs(biggest.pctChange) >= 10) {
      insights.push({
        icon: biggest.pctChange > 0 ? "📈" : "📉",
        text: `${biggest.cat} spending is ${biggest.pctChange > 0 ? "up" : "down"} ${Math.abs(biggest.pctChange).toFixed(0)}% vs last month (${fmtCurrency(biggest.curAmt, { decimals: false })} vs ${fmtCurrency(biggest.prevAmt, { decimals: false })}).`,
      });
    }
  }

  if (derived.budgetAlerts.length > 0) {
    const worst = [...derived.budgetAlerts].sort((a, b) => b.pct - a.pct)[0];
    const daysLeft = daysInMonth(2026, 7) - 27;
    insights.push({ icon: "⚠️", text: `${worst.cat} is ${worst.over ? "over budget" : `at ${worst.pct.toFixed(0)}% of budget`} with ${daysLeft} days left in the month.` });
  }

  data.goals.forEach(g => {
    const pct = g.target > 0 ? (g.current / g.target) * 100 : 0;
    if (pct >= 90 && pct < 100) insights.push({ icon: "🏆", text: `You're ${pct.toFixed(0)}% of the way to "${g.name}" — almost there!` });
  });

  const cancelledSubs = (data.subscriptions || []).filter(s => !s.active);
  if (cancelledSubs.length > 0) {
    const saved = cancelledSubs.reduce((s, x) => s + x.amount, 0);
    insights.push({ icon: "💸", text: `Cancelling ${cancelledSubs.length} subscription${cancelledSubs.length > 1 ? "s" : ""} is saving you ${fmtCurrency(saved, { decimals: false })}/mo (${fmtCurrency(saved * 12, { decimals: false })}/yr).` });
  }

  if (derived.savingsRate >= 20) {
    insights.push({ icon: "🎉", text: `Nice work — you're saving ${derived.savingsRate.toFixed(0)}% of income this month, above the 20% benchmark.` });
  } else if (derived.savingsRate < 5 && derived.monthIncome > 0) {
    insights.push({ icon: "🔍", text: `Savings rate is ${derived.savingsRate.toFixed(0)}% this month — below the 20% benchmark most planners recommend.` });
  }

  return insights.slice(0, 5);
}

/* ---- Recurring-charge / unknown-subscription detector -----------------
   Groups expense transactions by merchant, then flags groups that recur
   across at least 2 different months at a fairly consistent dollar amount
   (the signature of a subscription or fixed bill) and aren't already
   tracked in data.subscriptions. Deliberately ignores day-to-day spending
   like coffee or groceries, where the amount varies trip to trip. */
function normalizeMerchantName(name) {
  return (name || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function detectUnknownSubscriptions(data) {
  const known = (data.subscriptions || []).map(s => normalizeMerchantName(s.merchant));
  const isKnown = (norm) => known.some(k => k && (norm.includes(k) || k.includes(norm)));

  const groups = {};
  (data.transactions || []).forEach(t => {
    if (t.amount >= 0) return; // only charges/expenses
    if (t.category === "Transfer" || t.category === "Income") return;
    const norm = normalizeMerchantName(t.merchant);
    if (!norm) return;
    if (isKnown(norm)) return;
    groups[norm] = groups[norm] || { merchant: t.merchant, category: t.category, txns: [] };
    groups[norm].txns.push(t);
  });

  const candidates = [];
  Object.values(groups).forEach(g => {
    if (g.txns.length < 2) return;
    const months = new Set(g.txns.map(t => monthKey(t.date)));
    if (months.size < 2) return; // must recur across at least 2 different months

    const amounts = g.txns.map(t => Math.abs(t.amount));
    const avg = amounts.reduce((s, a) => s + a, 0) / amounts.length;
    const maxDiff = Math.max(...amounts.map(a => Math.abs(a - avg)));
    const consistent = maxDiff <= Math.max(1.5, avg * 0.08); // within 8% or $1.50, whichever is larger
    if (!consistent) return;

    // Require a roughly monthly cadence (20-45 days between charges on average) so we don't
    // flag coincidentally-similar one-off purchases (e.g. two unrelated Sephora trips).
    const sorted = [...g.txns].sort((a, b) => (a.date < b.date ? -1 : 1));
    const firstDate = new Date(sorted[0].date + "T00:00:00");
    const lastDateObj = new Date(sorted[sorted.length - 1].date + "T00:00:00");
    const spanDays = (lastDateObj - firstDate) / 86400000;
    const avgGapDays = spanDays / (sorted.length - 1);
    if (avgGapDays < 20 || avgGapDays > 45) return;

    const desc = [...g.txns].sort((a, b) => (a.date < b.date ? 1 : -1));
    const dayOfMonth = new Date(desc[0].date + "T00:00:00").getDate();

    candidates.push({
      id: "cand_" + normalizeMerchantName(g.merchant).replace(/\s+/g, "_"),
      merchant: g.merchant,
      category: g.category,
      amount: Math.round(avg * 100) / 100,
      dayOfMonth,
      occurrences: g.txns.length,
      months: months.size,
      lastDate: desc[0].date,
      person: desc[0].person || "Joint",
    });
  });

  return candidates.sort((a, b) => b.occurrences - a.occurrences);
}

// Recognize ordinary household bills from transaction history. This is intentionally
// narrower than general recurring-charge detection so groceries and routine shopping
// never become scheduled bills simply because the same store was visited twice.
function detectRecurringHouseholdBills(data) {
  const billCategories = new Set(["Housing", "Utilities", "Insurance", "Service", "Credit Cards and Loans", "Transportation", "Health & Fitness", "Personal Care", "Pets"]);
  const billWords = /\b(rent|mortgage|loan|electric|power|energy|gas|water|sewer|utility|utilities|internet|phone|wireless|insurance|hoa|trash|garbage)\b/i;
  const knownNames = [...(data.subscriptions || []), ...(data.recurringBills || [])].map(item => normalizeMerchantName(item.merchant));
  const isKnown = name => knownNames.some(known => known && (name.includes(known) || known.includes(name)));
  const groups = {};
  (data.transactions || []).forEach(transaction => {
    if (transaction.amount >= 0 || transaction.category === "Transfer" || transaction.category === "Income" || transaction.category === "Subscriptions") return;
    if (!billCategories.has(transaction.category) && !billWords.test(transaction.merchant || "")) return;
    const normalized = normalizeMerchantName(transaction.merchant);
    if (!normalized || isKnown(normalized)) return;
    groups[normalized] = groups[normalized] || [];
    groups[normalized].push(transaction);
  });
  return Object.entries(groups).flatMap(([normalized, transactions]) => {
    const sorted = [...transactions].sort((a, b) => a.date.localeCompare(b.date));
    const distinctMonths = new Set(sorted.map(item => monthKey(item.date)));
    if (sorted.length < 2 || distinctMonths.size < 2) return [];
    const gaps = sorted.slice(1).map((item, index) => (new Date(item.date + "T00:00:00") - new Date(sorted[index].date + "T00:00:00")) / 86400000);
    const typicalGap = median(gaps);
    if (typicalGap < 20 || typicalGap > 45) return [];
    const latest = sorted[sorted.length - 1];
    return [{
      id: "detected_bill_" + normalized.replace(/\s+/g, "_"),
      merchant: latest.merchant,
      category: latest.category,
      amount: Math.abs(Number(latest.amount || 0)),
      dayOfMonth: new Date(latest.date + "T00:00:00").getDate(),
      detected: true,
    }];
  });
}

  };

  const freqDays = { "Groceries": 4, "Dining & Coffee": 2, "Transportation": 5, "Shopping": 6, "Entertainment": 9, "Personal Care": 19, "Other": 14 };

  const personWeights = {
    "Groceries":       { Joint: 0.8, Michael: 0.1, Cynthia: 0.1 },
    "Dining & Coffee": { Joint: 0.34, Michael: 0.33, Cynthia: 0.33 },
    "Transportation":  { Joint: 0.1, Michael: 0.5, Cynthia: 0.4 },
    "Shopping":        { Joint: 0.2, Michael: 0.35, Cynthia: 0.45 },
    "Entertainment":   { Joint: 0.6, Michael: 0.2, Cynthia: 0.2 },
    "Personal Care":   { Joint: 0, Michael: 0.4, Cynthia: 0.6 },
    "Other":           { Joint: 0.7, Michael: 0.15, Cynthia: 0.15 },
  };
  const weightedPerson = (weights) => {
    const r = rng(); let acc = 0;
    for (const [k, w] of Object.entries(weights)) { acc += w; if (r < acc) return k; }
    return "Joint";
  };

  const transactions = [];
  const start = new Date("2026-04-01T00:00:00");
  const end = new Date("2026-07-27T00:00:00");

  // Variable day-to-day spending
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const iso = d.toISOString().slice(0, 10);
    Object.keys(freqDays).forEach((cat) => {
      if (rng() < 1 / freqDays[cat]) {
        const pool = merchantPools[cat];
        const amt = -range(pool.min, pool.max);
        transactions.push({
          id: uid(), date: iso, accountId: rng() < 0.55 ? "acc_credit" : "acc_checking",
          merchant: pick(pool.m), category: cat, amount: amt, notes: "", person: weightedPerson(personWeights[cat]),

  // Fixed monthly bills + subscriptions across each month in range
  const months = [];
  for (let d = new Date(start.getFullYear(), start.getMonth(), 1); d <= end; d.setMonth(d.getMonth() + 1)) {
    months.push({ y: d.getFullYear(), m: d.getMonth() + 1 });

  ];

  months.forEach(({ y, m }) => {
    fixedBills.forEach((b) => {
      const day = Math.min(b.day, daysInMonth(y, m));
      const iso = isoDate(y, m, day);
      if (new Date(iso) > end) return;
      const amt = b.amount != null ? b.amount : range(b.min, b.max);
      transactions.push({ id: uid(), date: iso, accountId: b.accountId, merchant: b.merchant, category: b.category, amount: -amt, notes: "", person: b.person });
    });

  const recurringBills = fixedBills.map((b) => ({

    dayOfMonth: b.day, person: b.person, variable: b.amount == null,
  }));

  // Subscriptions (tracked separately too)
  const subDefs = [

    { merchant: "Amazon Prime", category: "Subscriptions", day: 20, accountId: "acc_credit", person: "Joint", history: [{ date: "2026-01-20", amount: 14.99 }] },
    { merchant: "The New York Times", category: "Subscriptions", day: 15, accountId: "acc_credit", person: "Cynthia", history: [{ date: "2026-03-15", amount: 17.00 }] },
  ];

  months.forEach(({ y, m }) => {
    subDefs.forEach((s) => {
      const day = Math.min(s.day, daysInMonth(y, m));
      const iso = isoDate(y, m, day);
      if (new Date(iso) > end) return;
      let amt = s.history[0].amount;
      for (const h of s.history) if (iso >= h.date) amt = h.amount;
      transactions.push({ id: uid(), date: iso, accountId: s.accountId, merchant: s.merchant, category: s.category, amount: -amt, notes: "", person: s.person });
    });
  });

  const subscriptions = subDefs.map((s) => ({
    id: uid(), merchant: s.merchant, category: s.category, cadence: "Monthly",
    amount: s.history[s.history.length - 1].amount, dayOfMonth: s.day, active: true, priceHistory: s.history, person: s.person,
  }));

  // Biweekly paychecks — Michael and Cynthia each have their own income stream
  let payDateM = new Date("2026-04-03T00:00:00");
  while (payDateM <= end) {
    transactions.push({
      id: uid(), date: payDateM.toISOString().slice(0, 10), accountId: "acc_checking",
      merchant: "Acme Corp Payroll", category: "Income", amount: 2850.00, notes: "Biweekly paycheck", person: "Michael",
    });
    payDateM = new Date(payDateM.getTime() + 14 * 86400000);
  }
  let payDateC = new Date("2026-04-10T00:00:00");
  while (payDateC <= end) {
    transactions.push({
      id: uid(), date: payDateC.toISOString().slice(0, 10), accountId: "acc_checking",
      merchant: "BrightPath Consulting", category: "Income", amount: 2200.00, notes: "Biweekly paycheck", person: "Cynthia",
    });

  }

  // Occasional transfer to savings
  ["2026-04-15", "2026-05-15", "2026-06-15", "2026-07-15"].forEach((iso) => {
    if (new Date(iso) <= end) {
      transactions.push({ id: uid(), date: iso, accountId: "acc_checking", merchant: "Transfer to Savings", category: "Transfer", amount: -500, notes: "", person: "Joint" });
      transactions.push({ id: uid(), date: iso, accountId: "acc_savings", merchant: "Transfer from Checking", category: "Transfer", amount: 500, notes: "", person: "Joint" });
    }
  });

  const rules = [
    { id: uid(), keyword: "Starbucks", category: "Dining & Coffee" },
    { id: uid(), keyword: "Whole Foods", category: "Groceries" },
    { id: uid(), keyword: "Amazon", category: "Shopping" },
    { id: uid(), keyword: "Shell", category: "Transportation" },
  ];

  transactions.sort((a, b) => (a.date < b.date ? 1 : -1));

  const netWorthHistory = [
    { month: "2026-01", netWorth: 28950 },
    { month: "2026-02", netWorth: 29680 },
    { month: "2026-03", netWorth: 30420 },
    { month: "2026-04", netWorth: 31150 },
    { month: "2026-05", netWorth: 32080 },
    { month: "2026-06", netWorth: 33240 },
    { month: "2026-07", netWorth: accounts.filter(a => a.type !== "checking").reduce((s, a) => s + a.balance, 0) },
  ];

  const goals = [
    { id: uid(), name: "Emergency Fund", icon: "🛟", target: 15000, current: 9200, deadline: "2026-12-31", color: "#4f46e5" },
    { id: uid(), name: "Hawaii Trip", icon: "🌺", target: 4000, current: 1450, deadline: "2027-03-01", color: "#0ea5e9" },

    { id: uid(), name: "Pay Off Credit Card", icon: "💳", target: 1284, current: 380, deadline: "2026-11-01", color: "#ec4899" },

  return { accounts, transactions, budgets: { ...DEFAULT_BUDGETS }, subscriptions, goals, netWorthHistory, recurringBills, rules, investments, paidBills: {}, customCategories: [], trips: [] };
}

  if (!account) return false;
  const label = `${account.name || ""} ${account.institution || ""}`.toLowerCase();
  return account.id === CINDY_CC_ACCOUNT_ID
    || account.name === CINDY_CC_ACCOUNT_NAME
    || label.includes("iccu credit")
    || label.includes("cindy's credit")
    || label.includes("cynthia's credit");
}

  if (!transaction) return false;
  if (transaction.accountId === CINDY_CC_ACCOUNT_ID) return true;
  return isIccuCreditAccount((accounts || []).find(account => account.id === transaction.accountId));

function ensureCindyRegister(data) { return data; }
function ensureHouseholdRegisters(data) { return data; }

function normalizeBudgetData(data) {
  const normalizedSubscriptions = (data.subscriptions || []).map(subscription => {
    if (/sirius\s*xm/i.test(String(subscription.merchant || ""))) {
      return {
        ...subscription,
        cadence: "Semi-Annual",
        dayOfMonth: 6,
        billingDates: [{ month: 1, day: 6 }, { month: 7, day: 7 }],
      };
    }
    if (!/experian/i.test(String(subscription.merchant || ""))) return subscription;
    const now = new Date(todayISO() + "T00:00:00");
    let anchorYear = now.getFullYear();
    if (now < new Date(anchorYear, 9, 2)) anchorYear -= 1;
    const anchorDate = `${anchorYear}-10-02`;
    const history = Array.isArray(subscription.priceHistory) && subscription.priceHistory.length
      ? subscription.priceHistory.map((entry, index, list) => index === list.length - 1 ? { ...entry, date: anchorDate } : entry)
      : [{ date: anchorDate, amount: Number(subscription.amount) || 0 }];
    return { ...subscription, cadence: "Annual", dayOfMonth: 2, priceHistory: history };
  });
  return {
    ...data,
    accounts: data.accounts || [],
    transactions: data.transactions || [],
    budgets: data.budgets || {},
    budgetPlans: data.budgetPlans || {},
    subscriptions: normalizedSubscriptions,
    goals: data.goals || [],
    recurringBills: data.recurringBills || [],
    rules: data.rules || [],
    investments: data.investments || [],
    netWorthHistory: data.netWorthHistory || [],

}

function loadData() {
  let data = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data) data = generateSeedData();
  data = ensureCindyRegister(data);
  data = ensureHouseholdRegisters(data);
  data = ensureDiscoverRegister(data);
  data = ensureUserNamedSubscriptions(data);
  data = normalizeBudgetData(data);
  data = applySharedInvestmentsToBudget(data);
  data = syncPaidBillsFromClearedTransactions(data);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}

function readSharedInvestments() {
  try { return JSON.parse(localStorage.getItem(SHARED_INVESTMENT_KEY) || "null"); } catch (e) { return null; }
}

function applySharedInvestmentsToBudget(data, suppliedShared) {
  const shared = suppliedShared || readSharedInvestments();
  if (!shared || !shared.balances || !shared.holdings) return data;
  const investments = [...(data.investments || [])];
  const upsertInvestment = (name, value, category, aliases = []) => {
    const names = [name, ...aliases].map(v => v.toLowerCase());
    const index = investments.findIndex(item => names.includes(String(item.name || "").toLowerCase()));
    const next = { ...(index >= 0 ? investments[index] : {}), id: index >= 0 ? investments[index].id : uid(), name, category, value: Number(value) || 0 };
    if (index >= 0) investments[index] = next; else investments.push(next);
  };
  upsertInvestment("Traditional TSP", shared.balances.traditionalTsp, "US Stocks");
  upsertInvestment("Roth TSP", shared.balances.rothTsp, "US Stocks");
  upsertInvestment("SCHD", shared.holdings.SCHD, "US Stocks", ["Schwab US Dividend ETF"]);
  upsertInvestment("QQQM", shared.holdings.QQQM, "US Stocks", ["Invesco Nasdaq 100 ETF"]);
  upsertInvestment("IBIT", shared.holdings.IBIT, "US Stocks", ["iShares Bitcoin Trust"]);
  upsertInvestment("SGOV", shared.holdings.SGOV, "Bonds", ["iShares 0-3M T-Bond ETF"]);
  const accounts = [...(data.accounts || [])];
  const hysaIndex = accounts.findIndex(account => /\bhysa\b|high.?yield savings/i.test(String(account.name || "")));
  const hysaAccount = { ...(hysaIndex >= 0 ? accounts[hysaIndex] : {}), id: hysaIndex >= 0 ? accounts[hysaIndex].id : "acc_shared_hysa", name: hysaIndex >= 0 ? accounts[hysaIndex].name : "Household HYSA", institution: hysaIndex >= 0 ? accounts[hysaIndex].institution : "ICCU", type: "savings", balance: Number(shared.balances.hysa) || 0 };
  if (hysaIndex >= 0) accounts[hysaIndex] = hysaAccount; else accounts.push(hysaAccount);
  return { ...data, accounts, investments };
}

function Modal({ open, onClose, title, children, wide, size }) {

}

function AddCategoryButton({ data, actions, onAdded, onDeleted, showLabel, allowDelete }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [error, setError] = useState("");

  const openModal = () => { setName(""); setError(""); setOpen(true); };
  const close = () => setOpen(false);

  const save = () => {
    const trimmed = name.trim();
    if (!trimmed) { setError("Enter a category name."); return; }
    const existing = allExpenseCategories(data).map(c => c.toLowerCase());
    if (existing.includes(trimmed.toLowerCase())) { setError("That category already exists."); return; }
    actions.addCategory(trimmed);
    setOpen(false);
    if (onAdded) onAdded(trimmed);
  };

  const remove = (category) => {
    if (!window.confirm(`Delete the category "${category}"? Transactions using it will be moved to Other.`)) return;
    actions.deleteCategory(category);
    if (onDeleted) onDeleted(category);
  };

  return (
    <React.Fragment>
      <button
        type="button"
        title="Add a new category"
        onClick={openModal}
        className={(showLabel ? "h-9 px-3 gap-1.5 " : "w-8 h-8 ") + "shrink-0 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-indigo-600 inline-flex items-center justify-center text-sm font-bold"}
      ><span>+</span>{showLabel && <span>Add Category</span>}</button>
      <Modal open={open} onClose={close} title="Add Category">
        <Field label="Category name">
          <input
            autoFocus
            placeholder="e.g. Kids' Activities"
            className={inputClass}
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") save(); }}
          />
        </Field>
        {error && <p className="text-sm text-rose-600 mb-3">{error}</p>}
        {allowDelete && (data.customCategories || []).length > 0 && (
          <div className="mb-4 border border-slate-200 rounded-xl overflow-hidden">
            <div className="px-3 py-2 bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500">Your custom categories</div>
            <div className="divide-y divide-slate-100 max-h-56 overflow-y-auto">
              {[...(data.customCategories || [])].sort((a, b) => a.localeCompare(b)).map(category => (
                <div key={category} className="flex items-center justify-between gap-3 px-3 py-2.5">
                  <span className="text-sm text-slate-700 truncate">{category}</span>
                  <button type="button" onClick={() => remove(category)} className="text-xs font-semibold text-rose-600 hover:text-rose-700 shrink-0">Delete</button>
                </div>
              ))}
            </div>
          </div>
        )}
        <div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={close}>Cancel</Button>
          <Button onClick={save}>Add Category</Button>
        </div>
      </Modal>
    </React.Fragment>
  );
}

/* ============================== CHARTS ============================== */

function LineChartCanvas({ labels, values, height }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "line",
      data: {
        labels,
        datasets: [{
          data: values, borderColor: "#4f46e5", backgroundColor: "rgba(79,70,229,0.08)",
          borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: "#4f46e5", tension: 0.35, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => "$" + ctx.parsed.y.toLocaleString() } } },
        scales: {
          y: { ticks: { callback: (v) => "$" + (v / 1000) + "k", color: "#94a3b8" }, grid: { color: "#f1f5f9" } },
          x: { ticks: { color: "#94a3b8" }, grid: { display: false } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(values)]);

  return <div style={{ height: height || 260 }}><canvas ref={ref}></canvas></div>;
}

function DoughnutChartCanvas({ labels, values, colors, height, onSliceClick }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "doughnut",
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: "#fff" }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "68%",
        onClick: (event, elements) => {
          if (elements && elements.length && onSliceClick) {
            const index = elements[0].index;
            onSliceClick(labels[index]);
          }
        },
        onHover: (event, elements) => {
          if (event && event.native && event.native.target) {
            event.native.target.style.cursor = elements && elements.length && onSliceClick ? "pointer" : "default";
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => ctx.label + ": $" + ctx.parsed.toLocaleString() } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(values), onSliceClick]);

  return <div style={{ height: height || 220 }}><canvas ref={ref}></canvas></div>;
}

function BarChartCanvas({ labels, values, color, height }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "bar",
      data: { labels, datasets: [{ data: values, backgroundColor: color || "#4f46e5", borderRadius: 6, maxBarThickness: 46 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => "$" + ctx.parsed.y.toLocaleString() } } },
        scales: {
          y: { ticks: { callback: (v) => "$" + v.toLocaleString(), color: "#94a3b8" }, grid: { color: "#f1f5f9" } },

}

/* ============================== DERIVED DATA HELPERS ============================== */

function transactionSplits(t) {
  return Array.isArray(t && t.splits)
    ? t.splits.filter(part => part && part.category && Number(part.amount) > 0)
    : [];
}

function expenseCategoryAllocations(t) {
  if (!t || t.amount >= 0 || t.category === "Transfer") return [];
  const splits = transactionSplits(t);
  if (splits.length) return splits.map(part => ({ category: part.category, amount: Number(part.amount) }));
  return [{ category: t.category, amount: Math.abs(t.amount) }];
}

function transactionHasCategory(t, category) {
  if (!t || !category) return false;
  if (t.category === category) return true;
  return transactionSplits(t).some(part => part.category === category);
}

function transactionCategoryAmount(t, category) {
  if (!t) return 0;
  const splits = transactionSplits(t);
  if (splits.length) {
    return splits
      .filter(part => part.category === category)
      .reduce((sum, part) => sum + Number(part.amount || 0), 0);
  }
  return t.category === category ? Math.abs(t.amount) : 0;
}

function transactionCategoryLabel(t) {
  const splits = transactionSplits(t);
  return splits.length ? `Split: ${splits.map(part => part.category).join(" + ")}` : t.category;
}

function matchingScheduledBillIds(transaction, data) {
  if (!transaction || Number(transaction.amount) >= 0 || transaction.category === "Transfer") return [];
  const account = (data.accounts || []).find(item => item.id === transaction.accountId);
  if (!account || String(account.type || "").toLowerCase() !== "checking") return [];
  const transactionName = normalizeMerchantName(transaction.merchant || "");
  if (!transactionName) return [];
  const isNameMatch = merchant => {
    const billName = normalizeMerchantName(merchant || "");
    return billName && (billName === transactionName || (billName.length >= 5 && transactionName.includes(billName)) || (transactionName.length >= 5 && billName.includes(transactionName)));
  };
  const ids = (data.recurringBills || []).filter(item => isNameMatch(item.merchant)).map(item => item.id);
  const date = new Date(String(transaction.date || "") + "T00:00:00");
  if (Number.isFinite(date.getTime())) {
    (data.subscriptions || []).filter(item => item.active && subDueInMonth(item, date.getFullYear(), date.getMonth() + 1) && isNameMatch(item.merchant)).forEach(item => ids.push(item.id));
  }
  return [...new Set(ids.filter(Boolean))];
}

// Keep the register, Safe to Spend, and Bill Calendar on one shared paid status.
// Only explicit cleared=true transactions create an automatic checkmark; manual
// calendar checkmarks remain untouched unless they were originally created here.
function syncPaidBillsFromClearedTransactions(data) {
  const paidBills = Object.fromEntries(Object.entries(data.paidBills || {}).map(([month, values]) => [month, { ...(values || {}) }]));
  const autoPaidBills = Object.fromEntries(Object.entries(data.autoPaidBills || {}).map(([month, values]) => [month, { ...(values || {}) }]));
  const active = {};
  (data.transactions || []).filter(transaction => transaction.cleared === true).forEach(transaction => {
    const month = monthKey(transaction.date || "");
    if (!month) return;
    matchingScheduledBillIds(transaction, data).forEach(id => {
      active[month] = active[month] || {};
      active[month][id] = true;
    });
  });
  const months = new Set([...Object.keys(autoPaidBills), ...Object.keys(active)]);
  months.forEach(month => {
    paidBills[month] = { ...(paidBills[month] || {}) };
    autoPaidBills[month] = { ...(autoPaidBills[month] || {}) };
    const ids = new Set([...Object.keys(autoPaidBills[month]), ...Object.keys(active[month] || {})]);
    ids.forEach(id => {
      if (active[month] && active[month][id]) {
        paidBills[month][id] = true;
        autoPaidBills[month][id] = true;
      } else if (autoPaidBills[month][id]) {
        paidBills[month][id] = false;
        delete autoPaidBills[month][id];
      }
    });
  });
  return { ...data, paidBills, autoPaidBills };
}

function useDerived(data) {
  return useMemo(() => {
    // Checking accounts are excluded from Net Worth — they're spending/cash-flow accounts,
    // not a store of wealth, per user preference.
    const accountType = (account) => String(account?.type || "").trim().toLowerCase();
    const isChecking = (account) => accountType(account) === "checking";
    const netWorthAccounts = data.accounts.filter(account => !isChecking(account));
    const isLiability = (account) => accountType(account) === "credit" || accountType(account) === "loan";
    const netWorth = netWorthAccounts.reduce((sum, account) => (
      sum + (isLiability(account) ? -Math.abs(Number(account.balance) || 0) : (Number(account.balance) || 0))
    ), 0);
    const totalAssets = netWorthAccounts.filter(a => !isLiability(a) && a.balance > 0).reduce((s, a) => s + a.balance, 0);
    const totalDebt = data.accounts.filter(a => isLiability(a) || a.balance < 0).reduce((s, a) => s + Math.abs(Number(a.balance) || 0), 0);

    const now = new Date();
    const curMonth = todayISO().slice(0, 7);

    const monthTx = data.transactions.filter(t => monthKey(t.date) === curMonth && !t.excludeFromBudget);
    const reviewMonthIncome = data.transactions.filter(t => financialReviewMonth(t, data) === curMonth && !t.excludeFromBudget && t.category !== "Transfer" && Number(t.amount) > 0);
    const spendByCategory = {};
    const spendByPerson = { Joint: 0, Michael: 0, Cynthia: 0 };
    let monthIncome = reviewMonthIncome.reduce((sum, t) => sum + Number(t.amount || 0), 0), monthExpense = 0;
    monthTx.forEach(t => {
      if (t.category === "Transfer") return;
      if (t.amount < 0) {
        monthExpense += -t.amount;
        expenseCategoryAllocations(t).forEach(part => {
          spendByCategory[part.category] = (spendByCategory[part.category] || 0) + part.amount;
        });
        const p = t.person || "Joint";
        spendByPerson[p] = (spendByPerson[p] || 0) + (-t.amount);
      }
    });

    const savingsRate = monthIncome > 0 ? ((monthIncome - monthExpense) / monthIncome) * 100 : 0;

    // Budget alerts — categories at or above 85% of their monthly budget
    const budgetAlerts = EXPENSE_CATEGORIES
      .map(cat => ({ cat, budget: data.budgets[cat] || 0, spent: spendByCategory[cat] || 0 }))
      .filter(x => x.budget > 0 && x.spent / x.budget >= 0.85)
      .map(x => ({ ...x, pct: (x.spent / x.budget) * 100, over: x.spent > x.budget }));

    // Safe to spend — checking balance minus bills/subscriptions still due this month
    const todayDay = now.getDate();
    const paidForMonth = (data.paidBills && data.paidBills[curMonth]) || {};
    const recurringItems = [
      ...(data.recurringBills || []).map(b => ({ ...b, paid: !!paidForMonth[b.id] })),
      // Non-monthly subscriptions (Quarterly/Semi-Annual/Annual) only count toward this
      // month's bills/Safe-to-Spend when they're actually due this month — otherwise a
      // once-a-year charge would wrongly look like it's owed every single month.
      ...data.subscriptions.filter(s => s.active && subDueInMonth(s, now.getFullYear(), now.getMonth() + 1)).map(s => ({ id: s.id, merchant: s.merchant, amount: s.amount, dayOfMonth: subscriptionDayForMonth(s, now.getFullYear(), now.getMonth() + 1), person: s.person, category: s.category, paid: !!paidForMonth[s.id] })),
    ];
    const upcomingBillsRemaining = recurringItems.filter(b => b.dayOfMonth > todayDay && !b.paid).reduce((s, b) => s + b.amount, 0);
    const checkingAccount = data.accounts.find(a => a.type === "checking");
    const safeToSpend = (checkingAccount ? checkingAccount.balance : 0) - upcomingBillsRemaining;

    // Monthly category totals for trend charts
    const monthlyCategoryTotals = {};
    data.transactions.forEach(t => {
      if (t.category === "Transfer" || t.amount > 0) return;
      const mk = monthKey(t.date);
      monthlyCategoryTotals[mk] = monthlyCategoryTotals[mk] || {};
      expenseCategoryAllocations(t).forEach(part => {
        monthlyCategoryTotals[mk][part.category] = (monthlyCategoryTotals[mk][part.category] || 0) + part.amount;
      });
    });
    const trendMonths = Object.keys(monthlyCategoryTotals).sort();

    // Financial wellness score (0-100) — savings rate, budget adherence, debt-to-income, emergency fund coverage
    const clamp = (v) => Math.max(0, Math.min(100, v));
    const savingsScore = clamp((savingsRate / 20) * 100);
    const budgetableCount = EXPENSE_CATEGORIES.filter(c => (data.budgets[c] || 0) > 0).length;
    const withinBudgetCount = EXPENSE_CATEGORIES.filter(c => (data.budgets[c] || 0) > 0 && (spendByCategory[c] || 0) <= (data.budgets[c] || 0)).length;
    const budgetScore = budgetableCount > 0 ? clamp((withinBudgetCount / budgetableCount) * 100) : 100;
    const annualIncome = monthIncome * 12;
    const debtToIncome = annualIncome > 0 ? totalDebt / annualIncome : 0;
    const debtScore = clamp(100 - debtToIncome * 150);
    const savingsAccount = data.accounts.find(a => a.type === "savings");
    const monthsCovered = monthExpense > 0 ? (savingsAccount ? savingsAccount.balance : 0) / monthExpense : 0;
    const emergencyScore = clamp((monthsCovered / 6) * 100);
    const wellnessScore = Math.round(savingsScore * 0.35 + budgetScore * 0.25 + debtScore * 0.20 + emergencyScore * 0.20);
    const wellnessFactors = [
      { label: "Savings rate", score: Math.round(savingsScore), detail: `${savingsRate.toFixed(0)}% of income saved (target 20%)` },
      { label: "Budget adherence", score: Math.round(budgetScore), detail: `${withinBudgetCount}/${budgetableCount} categories within budget` },
      { label: "Debt-to-income", score: Math.round(debtScore), detail: `${(debtToIncome * 100).toFixed(0)}% of annual income owed` },
      { label: "Emergency fund", score: Math.round(emergencyScore), detail: `${monthsCovered.toFixed(1)} months of expenses saved (target 6)` },
    ];

    return {
      netWorth, totalAssets, totalDebt, curMonth, monthTx, spendByCategory, spendByPerson,
      monthIncome, monthExpense, savingsRate, budgetAlerts, recurringItems, upcomingBillsRemaining,
      safeToSpend, checkingAccount, monthlyCategoryTotals, trendMonths, wellnessScore, wellnessFactors,
    };
  }, [data]);
}

function Dashboard({ data, derived, actions }) {
  const [selectedPieCategory, setSelectedPieCategory] = useState(null);
  const spendingMonths = useMemo(() => {

    if (!months.includes(derived.curMonth)) months.unshift(derived.curMonth);
    return months;
  }, [data.transactions, derived.curMonth]);
  const [spendingMonth, setSpendingMonth] = useState(derived.curMonth);
  const handlePieSliceClick = useCallback((category) => setSelectedPieCategory(category), []);
  const currentNetWorthMonth = todayISO().slice(0, 7);
  const netWorthHistory = [...(data.netWorthHistory || []).filter(item => item && item.month && Number.isFinite(Number(item.netWorth)))];
  const currentHistoryIndex = netWorthHistory.findIndex(item => item.month === currentNetWorthMonth);
  const currentHistoryPoint = { month: currentNetWorthMonth, netWorth: derived.netWorth };
  if (currentHistoryIndex >= 0) netWorthHistory[currentHistoryIndex] = currentHistoryPoint;
  else netWorthHistory.push(currentHistoryPoint);
  const visibleNetWorthHistory = netWorthHistory.sort((a, b) => a.month.localeCompare(b.month)).slice(-7);
  const nwLabels = visibleNetWorthHistory.map(h => new Date(h.month + "-01T00:00:00").toLocaleDateString("en-US", { month: "short", year: "2-digit" }));
  const nwValues = visibleNetWorthHistory.map(h => Number(h.netWorth));

  const spendingByCategory = useMemo(() => {
    const totals = {};
    data.transactions
      .filter(t => monthKey(t.date) === spendingMonth && t.amount < 0 && !t.excludeFromBudget && t.category !== "Transfer")
      .forEach(t => {
        const splits = transactionSplits(t);
        if (splits.length) splits.forEach(part => { totals[part.category || "Other"] = (totals[part.category || "Other"] || 0) + Math.abs(Number(part.amount || 0)); });
        else totals[t.category || "Other"] = (totals[t.category || "Other"] || 0) + Math.abs(Number(t.amount || 0));
      });
    return totals;
  }, [data.transactions, spendingMonth]);
  const catEntries = Object.entries(spendingByCategory).filter(([, amount]) => amount >= 1).sort((a, b) => b[1] - a[1]);
  const catLabels = catEntries.map(e => e[0]);
  const catValues = catEntries.map(e => e[1]);
  const catColors = catLabels.map(c => categoryColor(c));
  const accountsById = Object.fromEntries(data.accounts.map(a => [a.id, a]));
  const selectedCategoryExpenses = selectedPieCategory
    ? data.transactions
        .filter(t => monthKey(t.date) === spendingMonth && t.amount < 0 && !t.excludeFromBudget)
        .map(t => ({ transaction: t, categoryAmount: transactionCategoryAmount(t, selectedPieCategory) }))
        .filter(item => item.categoryAmount > 0)
        .sort((a, b) => a.transaction.date < b.transaction.date ? 1 : -1)
    : [];
  const selectedCategoryTotal = selectedCategoryExpenses.reduce((sum, item) => sum + item.categoryAmount, 0);

  const recentTx = [...data.transactions].slice(0, 6);
  const dashboardToday = new Date(todayISO() + "T00:00:00");
  const dashboardMonth = todayISO().slice(0, 7);
  const paidThisMonth = (data.paidBills && data.paidBills[dashboardMonth]) || {};
  const nextMonthlyOccurrence = (dayOfMonth, paidCurrentMonth) => {
    let year = dashboardToday.getFullYear();
    let month = dashboardToday.getMonth() + 1;
    let day = Math.min(Number(dayOfMonth) || 1, daysInMonth(year, month));
    let candidate = new Date(year, month - 1, day);
    if (candidate < dashboardToday || paidCurrentMonth) {
      month += 1;
      if (month > 12) { month = 1; year += 1; }
      day = Math.min(Number(dayOfMonth) || 1, daysInMonth(year, month));
      candidate = new Date(year, month - 1, day);
    }
    return candidate;
  };
  const recurringBillDates = (data.recurringBills || []).map(bill => ({
    ...bill,
    nextDate: nextMonthlyOccurrence(bill.dayOfMonth, !!paidThisMonth[bill.id]),
  }));
  const detectedBillDates = detectRecurringHouseholdBills(data).map(bill => ({
    ...bill,
    nextDate: nextMonthlyOccurrence(bill.dayOfMonth, false),
  }));
  const scheduledExpenseDates = (data.paycheckItems || []).filter(item => item.type === "expense" && item.date >= todayISO()).map(item => ({
    id: item.id,
    merchant: item.label,
    category: "Scheduled expense",
    amount: Number(item.amount || 0),
    nextDate: new Date(item.date + "T00:00:00"),
  }));
  const subscriptionDates = (data.subscriptions || []).filter(s => s.active).map(subscription => {
    let nextDate = subscriptionNextChargeDate(subscription);
    if (paidThisMonth[subscription.id] && monthKey(nextDate.toISOString().slice(0, 10)) === dashboardMonth) {
      const interval = subCadence(subscription) === "Quarterly" ? 3 : subCadence(subscription) === "Semi-Annual" ? 6 : subCadence(subscription) === "Annual" ? 12 : 1;
      const probe = new Date(nextDate.getFullYear(), nextDate.getMonth() + interval, 1);
      nextDate = new Date(probe.getFullYear(), probe.getMonth(), Math.min(subscriptionDayForMonth(subscription, probe.getFullYear(), probe.getMonth() + 1), daysInMonth(probe.getFullYear(), probe.getMonth() + 1)));
    }
    return { id: subscription.id, merchant: subscription.merchant, amount: subscription.amount, category: subscription.category, nextDate };
  });
  const upcomingBills = [...recurringBillDates, ...detectedBillDates, ...scheduledExpenseDates, ...subscriptionDates]
    .filter(item => item.nextDate instanceof Date && Number.isFinite(item.nextDate.getTime()))
    .sort((a, b) => a.nextDate - b.nextDate)
    .slice(0, 6);

  const personEntries = PEOPLE.map(p => [p, derived.spendByPerson[p] || 0]).filter(([, amt]) => amt > 0);
  const personTotal = personEntries.reduce((s, [, amt]) => s + amt, 0) || 1;

  const insights = useMemo(() => buildInsights(data, derived), [data, derived]);
  const wellnessLabel = derived.wellnessScore >= 80 ? "Excellent" : derived.wellnessScore >= 60 ? "Good" : derived.wellnessScore >= 40 ? "Fair" : "Needs Attention";
  const wellnessColor = derived.wellnessScore >= 80 ? "#16a34a" : derived.wellnessScore >= 60 ? "#4f46e5" : derived.wellnessScore >= 40 ? "#f59e0b" : "#e11d48";

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">Good to see you, Michael &amp; Cynthia 👋</h1>
        <p className="text-slate-500 text-sm mt-1">Here's your financial overview for {new Date(todayISO() + "T00:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}.</p>
      </div>

      <SectionNotes section="dashboard" data={data} actions={actions} />

      {derived.budgetAlerts.length > 0 && (
        <Card className="p-4 border-amber-200 bg-amber-50/60">
          <div className="text-sm text-amber-800">
            <span className="font-semibold">⚠️ Budget watch:</span>{" "}
            {derived.budgetAlerts.map((a, i) => (
              <span key={a.cat}>{i > 0 ? ", " : " "}{a.cat} {a.over ? "is over budget" : `is at ${a.pct.toFixed(0)}%`}</span>
            ))}.
          </div>
        </Card>
      )}

      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 md:gap-5">
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Net Worth</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(derived.netWorth, { decimals: false })}</div>
          <div className="text-xs text-emerald-600 font-medium mt-1">↑ 3.8% this month</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Income (MTD)</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(derived.monthIncome, { decimals: false })}</div>
          <div className="text-xs text-slate-400 font-medium mt-1">Paychecks + deposits</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Spending (MTD)</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(derived.monthExpense, { decimals: false })}</div>
          <div className="text-xs text-slate-400 font-medium mt-1">Across all categories</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Savings Rate</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{derived.savingsRate.toFixed(0)}%</div>
          <div className="text-xs text-slate-400 font-medium mt-1">Of income kept</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Safe to Spend</div>
          <div className={"text-2xl font-bold mt-1 " + (derived.safeToSpend >= 0 ? "text-slate-800" : "text-rose-600")}>{fmtCurrency(derived.safeToSpend, { decimals: false })}</div>
          <div className="text-xs text-slate-400 font-medium mt-1">After bills left this month</div>
        </Card>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <Card className="md:col-span-2 p-6">
          <div className="flex items-center justify-between mb-2">
            <h3 className="font-semibold text-slate-700">Net Worth Trend</h3>
            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold text-slate-600">{fmtCurrency(derived.netWorth, { decimals: false })}</span>
              <Pill tone="indigo">Last 7 months</Pill>
            </div>
          </div>
          <LineChartCanvas labels={nwLabels} values={nwValues} />
        </Card>
        <div className="space-y-5">
          <Card className="p-6">
            <div className="flex items-center justify-between gap-2 mb-3">
              <h3 className="font-semibold text-slate-700">Spending by Category</h3>
              <select
                aria-label="Select spending month"
                className="text-xs border border-slate-200 rounded-lg bg-white px-2 py-1.5 text-slate-600"
                value={spendingMonth}
                onChange={e => { setSpendingMonth(e.target.value); setSelectedPieCategory(null); }}
              >
                {spendingMonths.map(month => <option key={month} value={month}>{new Date(month + "-01T00:00:00").toLocaleDateString("en-US", { month: "short", year: "numeric" })}</option>)}
              </select>
            </div>
            {catLabels.length === 0 ? (
              <div className="text-sm text-slate-400 py-10 text-center">No spending recorded for this month.</div>
            ) : (
              <React.Fragment>
                <DoughnutChartCanvas labels={catLabels} values={catValues} colors={catColors} height={170} onSliceClick={handlePieSliceClick} />
                <div className="text-[11px] text-center text-slate-400 mt-1">Tap a slice to see its expenses</div>
                <div className="mt-3 space-y-1.5">
                  {catEntries.map(([cat, amt]) => (
                    <div key={cat} className="flex items-center justify-between text-xs">
                      <span className="flex items-center gap-1.5 text-slate-600"><span className="w-2 h-2 rounded-full inline-block" style={{ background: categoryColor(cat) }}></span>{cat}</span>
                      <span className="font-medium text-slate-700">{fmtCurrency(amt)}</span>
                    </div>
                  ))}
                </div>
              </React.Fragment>
            )}
          </Card>
          <Card className="p-6">
            <h3 className="font-semibold text-slate-700 mb-3">Spending by Person</h3>
            {personEntries.length === 0 ? (
              <div className="text-sm text-slate-400 py-4 text-center">No spending yet this month.</div>
            ) : (
              <div className="space-y-3">
                {personEntries.map(([p, amt]) => (
                  <div key={p}>
                    <div className="flex items-center justify-between text-xs mb-1">
                      <span className="flex items-center gap-1.5 text-slate-600">{PEOPLE_META[p].icon} {p}</span>
                      <span className="font-medium text-slate-700">{fmtCurrency(amt, { decimals: false })}</span>
                    </div>
                    <ProgressBar pct={(amt / personTotal) * 100} color={PEOPLE_META[p].color} />
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <Card className="p-6">
          <h3 className="font-semibold text-slate-700 mb-3">Financial Health</h3>
          <div className="flex items-center gap-4">
            <div className="relative w-20 h-20 shrink-0">
              <svg viewBox="0 0 36 36" className="w-20 h-20 -rotate-90">
                <path d="M18 2.5 a 15.5 15.5 0 0 1 0 31 a 15.5 15.5 0 0 1 0 -31" fill="none" stroke="#f1f5f9" strokeWidth="3.5" />
                <path
                  d="M18 2.5 a 15.5 15.5 0 0 1 0 31 a 15.5 15.5 0 0 1 0 -31"
                  fill="none" stroke={wellnessColor} strokeWidth="3.5" strokeLinecap="round"
                  strokeDasharray={`${derived.wellnessScore}, 100`}
                />
              </svg>
              <div className="absolute inset-0 flex items-center justify-center text-lg font-bold text-slate-800">{derived.wellnessScore}</div>
            </div>
            <div>
              <div className="text-sm font-semibold" style={{ color: wellnessColor }}>{wellnessLabel}</div>
              <div className="text-xs text-slate-400">Out of 100</div>
            </div>
          </div>
          <div className="mt-4 space-y-2.5">
            {derived.wellnessFactors.map(f => (
              <div key={f.label}>
                <div className="flex items-center justify-between text-xs mb-1">
                  <span className="text-slate-600">{f.label}</span>
                  <span className="font-medium text-slate-700">{f.score}</span>
                </div>
                <ProgressBar pct={f.score} color={f.score >= 60 ? "#16a34a" : f.score >= 40 ? "#f59e0b" : "#e11d48"} />
              </div>
            ))}
          </div>
        </Card>
        <Card className="md:col-span-2 p-6">
          <h3 className="font-semibold text-slate-700 mb-3">Insights</h3>
          {insights.length === 0 ? (
            <div className="text-sm text-slate-400 py-8 text-center">No notable changes to flag right now.</div>
          ) : (
            <div className="space-y-3">
              {insights.map((ins, i) => (
                <div key={i} className="flex items-start gap-3 text-sm">
                  <span className="text-lg leading-none">{ins.icon}</span>
                  <span className="text-slate-600 pt-0.5">{ins.text}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <Card className="md:col-span-2 p-6">
          <h3 className="font-semibold text-slate-700 mb-4">Recent Transactions</h3>
          <div className="space-y-3">
            {recentTx.map(t => (
              <div key={t.id} className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 min-w-0">
                  <MerchantAvatar merchant={t.merchant} category={t.category} size={36} />
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-slate-700 truncate">{t.merchant}{t.receipt ? " 📎" : ""}</div>
                    <div className="text-xs text-slate-400 truncate">{fmtDateShort(t.date)} · {transactionCategoryLabel(t)}</div>
                  </div>
                </div>
                <div className={"text-sm font-semibold shrink-0 " + (t.amount > 0 ? "text-emerald-600" : "text-slate-700")}>
                  {t.amount > 0 ? "+" : ""}{fmtCurrency(t.amount)}
                </div>
              </div>
            ))}
          </div>
        </Card>
        <Card className="p-6">
          <h3 className="font-semibold text-slate-700 mb-4">Upcoming Bills</h3>
          <div className="space-y-3">
            {upcomingBills.map((b, i) => (
              <div key={i} className="flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-700 truncate">{b.merchant}</div>
                  <div className="text-xs text-slate-400">Due {b.nextDate.toLocaleDateString("en-US", { month: "short", day: "numeric", year: b.nextDate.getFullYear() !== dashboardToday.getFullYear() ? "numeric" : undefined })}</div>
                  {b.detected && <div className="text-[10px] text-indigo-500">Recognized from monthly transactions</div>}
                </div>
                <div className="text-sm font-semibold text-slate-700 shrink-0">{fmtCurrency(b.amount)}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      <Modal open={!!selectedPieCategory} onClose={() => setSelectedPieCategory(null)} title={`${selectedPieCategory || ""} Expenses`}>
        <div className="flex items-center justify-between rounded-xl border border-indigo-100 bg-indigo-50 px-4 py-3 mb-4">
          <span className="text-sm text-indigo-700">{selectedCategoryExpenses.length} associated expense{selectedCategoryExpenses.length === 1 ? "" : "s"}</span>
          <span className="font-bold text-indigo-800">{fmtCurrency(selectedCategoryTotal)}</span>
        </div>
        <div className="space-y-2 max-h-[55vh] overflow-y-auto pr-1">
          {selectedCategoryExpenses.map(({ transaction: t, categoryAmount }) => (
            <div key={t.id} className="rounded-xl border border-slate-200 p-3 flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="font-medium text-slate-700 truncate">{t.merchant}</div>
                <div className="text-xs text-slate-400 truncate">
                  {fmtDateShort(t.date)} · {(accountsById[t.accountId] && accountsById[t.accountId].name) || "Account"}{transactionSplits(t).length ? ` · Total transaction ${fmtCurrency(Math.abs(t.amount))}` : ""}
                </div>
              </div>
              <div className="font-semibold text-slate-700 shrink-0">{fmtCurrency(categoryAmount)}</div>
            </div>
          ))}
          {selectedCategoryExpenses.length === 0 && <div className="text-sm text-slate-400 text-center py-8">No matching expenses.</div>}
        </div>
      </Modal>
    </div>
  );
}

/* ============================== BUDGETS ============================== */

function Budgets({ data, actions, derived }) {
  const [editCat, setEditCat] = useState(null);
  const [editName, setEditName] = useState("");
  const [editVal, setEditVal] = useState("");
  const [editError, setEditError] = useState("");
  const [trendCat, setTrendCat] = useState("Groceries");
  const [selectedMonth, setSelectedMonth] = useState(derived.curMonth);
  const budgetCategories = allExpenseCategories(data);
  const monthBudget = (data.budgetPlans && data.budgetPlans[selectedMonth]) || data.budgets;
  const monthSpend = {};
  data.transactions.filter(t => monthKey(t.date) === selectedMonth && !t.excludeFromBudget && t.amount < 0 && t.category !== "Transfer").forEach(t => {
    expenseCategoryAllocations(t).forEach(part => {
      monthSpend[part.category] = (monthSpend[part.category] || 0) + part.amount;
    });
  });

  const totalBudget = Object.values(monthBudget).reduce((s, v) => s + v, 0);
  const totalSpent = Object.values(monthSpend).reduce((s, v) => s + v, 0);
  const monthAlerts = budgetCategories.map(cat => ({ cat, budget: monthBudget[cat] || 0, spent: monthSpend[cat] || 0 }))
    .filter(x => x.budget > 0 && x.spent / x.budget >= 0.85)
    .map(x => ({ ...x, pct: (x.spent / x.budget) * 100, over: x.spent > x.budget }));

  const trendLabels = derived.trendMonths.map(m => new Date(m + "-01T00:00:00").toLocaleDateString("en-US", { month: "short" }));
  const trendValues = derived.trendMonths.map(m => (derived.monthlyCategoryTotals[m] && derived.monthlyCategoryTotals[m][trendCat]) || 0);

  const openEdit = (cat) => { setEditCat(cat); setEditName(cat); setEditVal(String(monthBudget[cat] || 0)); setEditError(""); };
  const saveEdit = () => {
    const renamed = editName.trim();
    const v = parseFloat(editVal);
    if (!renamed) { setEditError("Enter a category name."); return; }
    if (renamed.toLowerCase() !== editCat.toLowerCase() && budgetCategories.some(cat => cat.toLowerCase() === renamed.toLowerCase())) { setEditError("That category already exists."); return; }
    if (renamed !== editCat) actions.renameCategory(editCat, renamed);
    if (!isNaN(v) && v >= 0) actions.setBudgetForMonth(selectedMonth, renamed, v);
    setEditCat(null);
  };
  const deleteBudget = (cat) => {
    if (!window.confirm(`Delete ${cat} from the shared Budget list and all five accounts? Existing transactions in this category will be moved to Other.`)) return;
    actions.deleteCategory(cat);
    if (trendCat === cat) setTrendCat(budgetCategories.find(c => c !== cat) || "Groceries");
  };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-slate-800">Budgets</h1>
          <p className="text-slate-500 text-sm mt-1">One shared category list keeps every account consistent. Add or delete an item once to update all five accounts.</p>
        </div>
        <div className="flex items-center gap-2 self-start sm:self-auto flex-wrap">
          <input type="month" className={inputClass + " max-w-[180px]"} value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} />
          <Button variant="secondary" className="whitespace-nowrap" onClick={() => actions.copyBudgetToMonth(selectedMonth, monthBudget)}>Save Plan</Button>
          <Card className="px-5 py-3">
            <div className="text-xs text-slate-400">Total Budget Used</div>
            <div className="text-lg font-bold text-slate-800">{fmtCurrency(totalSpent, { decimals: false })} <span className="text-sm font-normal text-slate-400">/ {fmtCurrency(totalBudget, { decimals: false })}</span></div>
          </Card>
          <AddCategoryButton data={data} actions={actions} onAdded={openEdit} />
        </div>
      </div>

      <SectionNotes section="budgets" data={data} actions={actions} />

      {monthAlerts.length > 0 && (
        <Card className="p-4 border-amber-200 bg-amber-50/60">
          <div className="text-sm text-amber-800">
            <span className="font-semibold">⚠️ Budget watch:</span>{" "}
            {monthAlerts.map((a, i) => (
              <span key={a.cat}>{i > 0 ? ", " : " "}{a.cat} {a.over ? "is over budget" : `is at ${a.pct.toFixed(0)}%`}</span>
            ))}.
          </div>
        </Card>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5">
        {budgetCategories.map(cat => {
          const budget = monthBudget[cat] || 0;
          const spent = monthSpend[cat] || 0;
          const pct = budget > 0 ? (spent / budget) * 100 : 0;
          const over = spent > budget && budget > 0;
          return (
            <Card key={cat} className="p-5">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-lg">{categoryIconOf(cat)}</span>
                  <span className="font-medium text-slate-700 text-sm">{cat}</span>
                </div>
                <span className="flex items-center gap-3">
                  <button onClick={() => openEdit(cat)} className="text-xs text-indigo-600 hover:text-indigo-800 font-medium">Edit</button>
                  <button onClick={() => deleteBudget(cat)} className="text-xs text-rose-500 hover:text-rose-700 font-medium">Delete</button>
                </span>
              </div>
              <ProgressBar pct={pct} color={over ? "#e11d48" : categoryColor(cat)} />
              <div className="flex items-center justify-between mt-2 text-xs">
                <span className={over ? "text-rose-600 font-medium" : "text-slate-500"}>{fmtCurrency(spent, { decimals: false })} spent</span>
                <span className="text-slate-400">of {fmtCurrency(budget, { decimals: false })}</span>
              </div>
              {over && <div className="mt-2"><Pill tone="red">Over budget by {fmtCurrency(spent - budget, { decimals: false })}</Pill></div>}
            </Card>
          );
        })}
      </div>

      <RolloverAndSinkingFunds data={data} actions={actions} />

      <Watchlists data={data} actions={actions} selectedMonth={selectedMonth} />

      <Card className="p-6">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-3">

function Watchlists({ data, actions, selectedMonth }) {
  const [form, setForm] = useState({ type: "merchant", query: "", target: "" });
  const add = () => {
    const target = parseFloat(form.target);
    if (!form.query.trim() || !Number.isFinite(target) || target <= 0) return;
    actions.addWatchlist({ id: uid(), type: form.type, query: form.query.trim(), target });
    setForm({ ...form, query: "", target: "" });
  };
  const spentFor = (w) => data.transactions.reduce((sum, t) => {
    if (monthKey(t.date) !== selectedMonth || t.amount >= 0 || t.excludeFromBudget) return sum;
    if (w.type === "category") {
      return sum + expenseCategoryAllocations(t)
        .filter(part => part.category.toLowerCase() === w.query.toLowerCase())
        .reduce((partSum, part) => partSum + part.amount, 0);
    }
    if (w.type === "tag" && !(t.tags || []).some(tag => tag.toLowerCase() === w.query.toLowerCase())) return sum;
    if (w.type === "merchant" && !t.merchant.toLowerCase().includes(w.query.toLowerCase())) return sum;
    return sum + Math.abs(t.amount);
  }, 0);

  return (
    <Card className="p-5 md:p-6">
      <h3 className="font-semibold text-slate-700">Spending Watchlists</h3>
      <p className="text-sm text-slate-500 mt-1 mb-4">Watch a merchant, category, or tag without creating another formal budget.</p>
      <div className="grid grid-cols-1 sm:grid-cols-[140px_1fr_140px_auto] gap-2 items-end">
        <Field label="Watch">
          <select className={inputClass} value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}>
            <option value="merchant">Merchant</option><option value="category">Category</option><option value="tag">Tag</option>
          </select>
        </Field>
        <Field label="Name">
          <input className={inputClass} placeholder="Amazon, Vacation, Dining…" value={form.query} onChange={e => setForm({ ...form, query: e.target.value })} />
        </Field>
        <Field label="Monthly target">
          <input type="number" min="1" className={inputClass} placeholder="0.00" value={form.target} onChange={e => setForm({ ...form, target: e.target.value })} />
        </Field>
        <div className="mb-3"><Button className="w-full whitespace-nowrap" onClick={add}>Add Watchlist</Button></div>
      </div>
      {(data.watchlists || []).length > 0 && (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
          {data.watchlists.map(w => {
            const spent = spentFor(w);
            return (
              <div key={w.id} className="rounded-xl border border-slate-100 p-3">
                <div className="flex justify-between gap-3 text-sm">
                  <span className="font-medium text-slate-700">{w.query} <span className="text-xs font-normal text-slate-400">({w.type})</span></span>
                  <button className="text-xs text-rose-500" onClick={() => actions.deleteWatchlist(w.id)}>Delete</button>
                </div>
                <ProgressBar pct={(spent / w.target) * 100} color={spent > w.target ? "#e11d48" : "#4f46e5"} />
                <div className="text-xs text-slate-500 mt-1">{fmtCurrency(spent)} of {fmtCurrency(w.target)}</div>
              </div>
            );
          })}
        </div>
      )}
    </Card>
  );
}

function TransactionModal({ open, onClose, onSave, initial, accounts, rules, trips, categories, defaultAccountId }) {
  const blank = { date: todayISO(), accountId: defaultAccountId || accounts[0]?.id || "", merchant: "", category: defaultAccountId === CINDY_CC_ACCOUNT_ID ? "Personal Support" : "Other", amount: "", notes: "", tags: [], tripId: "", excludeFromBudget: false, needsReview: false, person: defaultAccountId === CINDY_CC_ACCOUNT_ID ? "Cynthia" : "Joint", receipt: null };
  const [form, setForm] = useState(initial || blank);
  const [receiptBusy, setReceiptBusy] = useState(false);
  useEffect(() => { setForm(initial || blank); }, [initial, open, defaultAccountId]);

  const onMerchantChange = (val) => {
    let next = { ...form, merchant: val };
    if (!initial) {
      const match = (rules || []).find(r => val.toLowerCase().includes(r.keyword.toLowerCase()));
      if (match) next.category = match.category;
    }
    setForm(next);
  };

  const onReceiptChange = async (file) => {
    if (!file) return;
    setReceiptBusy(true);
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      setForm(f => ({ ...f, receipt: dataUrl }));
    } catch (e) {}
    setReceiptBusy(false);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.merchant || !form.amount) return;
    onSave({ ...form, amount: parseFloat(form.amount) });
  };

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Transaction" : "Add Transaction"}>
      <form onSubmit={submit}>
        <Field label="Merchant">
          <input className={inputClass} value={form.merchant} onChange={e => onMerchantChange(e.target.value)} required />
        </Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Amount ($, negative = expense)">
            <input type="number" step="0.01" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required />
          </Field>
          <Field label="Date">
            <input type="date" className={inputClass} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required />
          </Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Category">
            <select className={inputClass} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
              {(categories || Object.keys(CATEGORY_META)).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Account">
            <select className={inputClass} value={form.accountId} onChange={e => setForm({ ...form, accountId: e.target.value })}>
              {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Person">
          <select className={inputClass} value={form.person || "Joint"} onChange={e => setForm({ ...form, person: e.target.value })}>
            {PEOPLE.map(p => <option key={p} value={p}>{PEOPLE_META[p].icon} {p}</option>)}
          </select>
        </Field>
        <Field label="Trip">
          <select className={inputClass} value={form.tripId || ""} onChange={e => setForm({ ...form, tripId: e.target.value })}>
            <option value="">Not part of a trip</option>
            {(trips || []).map(trip => <option key={trip.id} value={trip.id}>{trip.name}</option>)}
          </select>
        </Field>
        <Field label="Notes (optional)">
          <input className={inputClass} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} />
        </Field>
        <Field label="Tags (optional, separated by commas)">
          <input className={inputClass} placeholder="Tax, Vacation, Reimbursable…" value={(form.tags || []).join(", ")} onChange={e => setForm({ ...form, tags: e.target.value.split(",").map(v => v.trim()).filter(Boolean) })} />
        </Field>
        <label className="flex items-start gap-2 rounded-lg bg-slate-50 p-3 mb-3 cursor-pointer">

            <div className="flex flex-wrap gap-2">
              <label className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium cursor-pointer">📷 Take Photo<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => onReceiptChange(e.target.files[0])} /></label>
              <label className="px-3 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-medium cursor-pointer">🖼 Choose Photo<input type="file" accept="image/*" className="hidden" onChange={e => onReceiptChange(e.target.files[0])} /></label>

        <div className="flex justify-end gap-2 mt-4">

  );
}

function cindyRegType(t) {
  if (t.amount > 0) return t.category === "Transfer" ? "payment" : "return";
  return "expense";
}

const CINDY_TYPE_META = {
  expense: { label: "Expense", short: "Exp", tone: "red" },
  return:  { label: "Return",  short: "Ret", tone: "green" },
  payment: { label: "Payment", short: "Pay", tone: "indigo" },
};

function RegStat({ label, value, tone }) {
  const tones = {
    rose: "bg-rose-50 text-rose-700 border-rose-100",
    emerald: "bg-emerald-50 text-emerald-700 border-emerald-100",
    indigo: "bg-indigo-50 text-indigo-700 border-indigo-100",
    slate: "bg-slate-50 text-slate-700 border-slate-200",
    amber: "bg-amber-50 text-amber-700 border-amber-100",

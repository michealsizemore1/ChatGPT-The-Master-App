function estimateMinPayment(account) {
  const enteredPayment = Number(account.monthlyPayment);

function simulatePayoff(debtAccounts, extraMonthly, strategy) {
  let bals = debtAccounts.map(d => ({ id: d.id, name: d.name, balance: Math.abs(d.balance), apr: d.apr || 0, minPayment: estimateMinPayment(d) }));
  const order = strategy === "avalanche"
    ? [...bals].sort((a, b) => b.apr - a.apr).map(d => d.id)
    : [...bals].sort((a, b) => a.balance - b.balance).map(d => d.id);

  let months = 0, totalInterest = 0;
  const schedule = [bals.reduce((s, d) => s + d.balance, 0)];
  while (bals.some(d => d.balance > 0.01) && months < 480) {
    months++;
    bals.forEach(d => {
      if (d.balance <= 0) return;
      const interest = d.balance * (d.apr / 100 / 12);
      totalInterest += interest;
      d.balance += interest;
    });
    bals.forEach(d => {
      if (d.balance <= 0) return;
      d.balance -= Math.min(d.minPayment, d.balance);
    });
    let extra = extraMonthly;
    for (const id of order) {
      if (extra <= 0) break;
      const d = bals.find(x => x.id === id);
      if (!d || d.balance <= 0) continue;
      const pay = Math.min(extra, d.balance);
      d.balance -= pay;
      extra -= pay;
    }
    schedule.push(bals.reduce((s, d) => s + Math.max(0, d.balance), 0));
  }
  return { months, totalInterest, schedule, payoffOrder: order.map(id => bals.find(d => d.id === id).name) };
}

    if (!norm) return;
    if (isKnown(norm)) return;
    groups[norm] = groups[norm] || { merchant: t.merchant, category: t.category, txns: [] };
    groups[norm].txns.push(t);
  });

  const candidates = [];
  Object.values(groups).forEach(g => {
    if (g.txns.length < 2) return;
    const months = new Set(g.txns.map(t => monthKey(t.date)));
    if (months.size < 2) return; // must recur across at least 2 different months

    const amounts = g.txns.map(t => Math.abs(t.amount));
    const avg = amounts.reduce((s, a) => s + a, 0) / amounts.length;
    const maxDiff = Math.max(...amounts.map(a => Math.abs(a - avg)));
    const consistent = maxDiff <= Math.max(1.5, avg * 0.08); // within 8% or $1.50, whichever is larger
    if (!consistent) return;

    // Require a roughly monthly cadence (20-45 days between charges on average) so we don't
    // flag coincidentally-similar one-off purchases (e.g. two unrelated Sephora trips).
    const sorted = [...g.txns].sort((a, b) => (a.date < b.date ? -1 : 1));
    const firstDate = new Date(sorted[0].date + "T00:00:00");
    const lastDateObj = new Date(sorted[sorted.length - 1].date + "T00:00:00");
    const spanDays = (lastDateObj - firstDate) / 86400000;
    const avgGapDays = spanDays / (sorted.length - 1);
    if (avgGapDays < 20 || avgGapDays > 45) return;

    const desc = [...g.txns].sort((a, b) => (a.date < b.date ? 1 : -1));
    const dayOfMonth = new Date(desc[0].date + "T00:00:00").getDate();

    candidates.push({
      id: "cand_" + normalizeMerchantName(g.merchant).replace(/\s+/g, "_"),
      merchant: g.merchant,
      category: g.category,
      amount: Math.round(avg * 100) / 100,
      dayOfMonth,
      occurrences: g.txns.length,
      months: months.size,
      lastDate: desc[0].date,
      person: desc[0].person || "Joint",
    });
  });

  return candidates.sort((a, b) => b.occurrences - a.occurrences);
}

// Recognize ordinary household bills from transaction history. This is intentionally
// narrower than general recurring-charge detection so groceries and routine shopping
// never become scheduled bills simply because the same store was visited twice.
function detectRecurringHouseholdBills(data) {
  const billCategories = new Set(["Housing", "Utilities", "Insurance", "Service", "Credit Cards and Loans", "Transportation", "Health & Fitness", "Personal Care", "Pets"]);
  const billWords = /\b(rent|mortgage|loan|electric|power|energy|gas|water|sewer|utility|utilities|internet|phone|wireless|insurance|hoa|trash|garbage)\b/i;
  const knownNames = [...(data.subscriptions || []), ...(data.recurringBills || [])].map(item => normalizeMerchantName(item.merchant));
  const isKnown = name => knownNames.some(known => known && (name.includes(known) || known.includes(name)));
  const groups = {};
  (data.transactions || []).forEach(transaction => {
    if (transaction.amount >= 0 || transaction.category === "Transfer" || transaction.category === "Income" || transaction.category === "Subscriptions") return;
    if (!billCategories.has(transaction.category) && !billWords.test(transaction.merchant || "")) return;
    const normalized = normalizeMerchantName(transaction.merchant);
    if (!normalized || isKnown(normalized)) return;
    groups[normalized] = groups[normalized] || [];
    groups[normalized].push(transaction);
  });
  return Object.entries(groups).flatMap(([normalized, transactions]) => {
    const sorted = [...transactions].sort((a, b) => a.date.localeCompare(b.date));
    const distinctMonths = new Set(sorted.map(item => monthKey(item.date)));
    if (sorted.length < 2 || distinctMonths.size < 2) return [];
    const gaps = sorted.slice(1).map((item, index) => (new Date(item.date + "T00:00:00") - new Date(sorted[index].date + "T00:00:00")) / 86400000);
    const typicalGap = median(gaps);
    if (typicalGap < 20 || typicalGap > 45) return [];
    const latest = sorted[sorted.length - 1];
    return [{
      id: "detected_bill_" + normalized.replace(/\s+/g, "_"),
      merchant: latest.merchant,
      category: latest.category,
      amount: Math.abs(Number(latest.amount || 0)),
      dayOfMonth: new Date(latest.date + "T00:00:00").getDate(),
      detected: true,
    }];
  });
}

    "Other":           { Joint: 0.7, Michael: 0.15, Cynthia: 0.15 },

  const weightedPerson = (weights) => {

    for (const [k, w] of Object.entries(weights)) { acc += w; if (r < acc) return k; }

  };

  const transactions = [];

  months.forEach(({ y, m }) => {

      if (new Date(iso) > end) return;

  transactions.sort((a, b) => (a.date < b.date ? 1 : -1));

  const netWorthHistory = [
    { month: "2026-01", netWorth: 28950 },

function normalizeBudgetData(data) {
  const normalizedSubscriptions = (data.subscriptions || []).map(subscription => {
    if (/sirius\s*xm/i.test(String(subscription.merchant || ""))) {
      return {
        ...subscription,
        cadence: "Semi-Annual",
        dayOfMonth: 6,
        billingDates: [{ month: 1, day: 6 }, { month: 7, day: 7 }],
      };
    }
    if (!/experian/i.test(String(subscription.merchant || ""))) return subscription;
    const now = new Date(todayISO() + "T00:00:00");
    let anchorYear = now.getFullYear();
    if (now < new Date(anchorYear, 9, 2)) anchorYear -= 1;
    const anchorDate = `${anchorYear}-10-02`;
    const history = Array.isArray(subscription.priceHistory) && subscription.priceHistory.length
      ? subscription.priceHistory.map((entry, index, list) => index === list.length - 1 ? { ...entry, date: anchorDate } : entry)
      : [{ date: anchorDate, amount: Number(subscription.amount) || 0 }];
    return { ...subscription, cadence: "Annual", dayOfMonth: 2, priceHistory: history };
  });
  return {
    ...data,
    accounts: data.accounts || [],
    transactions: data.transactions || [],
    budgets: data.budgets || {},
    budgetPlans: data.budgetPlans || {},
    subscriptions: normalizedSubscriptions,
    goals: data.goals || [],
    recurringBills: data.recurringBills || [],
    rules: data.rules || [],
    investments: data.investments || [],
    netWorthHistory: data.netWorthHistory || [],

function loadData() {
  let data = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data) data = generateSeedData();
  data = ensureCindyRegister(data);
  data = ensureHouseholdRegisters(data);
  data = ensureDiscoverRegister(data);
  data = ensureUserNamedSubscriptions(data);
  data = normalizeBudgetData(data);
  data = applySharedInvestmentsToBudget(data);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}

function readSharedInvestments() {
  try { return JSON.parse(localStorage.getItem(SHARED_INVESTMENT_KEY) || "null"); } catch (e) { return null; }

function applySharedInvestmentsToBudget(data, suppliedShared) {
  const shared = suppliedShared || readSharedInvestments();
  if (!shared || !shared.balances || !shared.holdings) return data;
  const investments = [...(data.investments || [])];
  const upsertInvestment = (name, value, category, aliases = []) => {
    const names = [name, ...aliases].map(v => v.toLowerCase());
    const index = investments.findIndex(item => names.includes(String(item.name || "").toLowerCase()));
    const next = { ...(index >= 0 ? investments[index] : {}), id: index >= 0 ? investments[index].id : uid(), name, category, value: Number(value) || 0 };
    if (index >= 0) investments[index] = next; else investments.push(next);
  };
  upsertInvestment("Traditional TSP", shared.balances.traditionalTsp, "US Stocks");
  upsertInvestment("Roth TSP", shared.balances.rothTsp, "US Stocks");
  upsertInvestment("SCHD", shared.holdings.SCHD, "US Stocks", ["Schwab US Dividend ETF"]);
  upsertInvestment("QQQM", shared.holdings.QQQM, "US Stocks", ["Invesco Nasdaq 100 ETF"]);
  upsertInvestment("IBIT", shared.holdings.IBIT, "US Stocks", ["iShares Bitcoin Trust"]);
  upsertInvestment("SGOV", shared.holdings.SGOV, "Bonds", ["iShares 0-3M T-Bond ETF"]);
  const accounts = [...(data.accounts || [])];
  const hysaIndex = accounts.findIndex(account => /\bhysa\b|high.?yield savings/i.test(String(account.name || "")));
  const hysaAccount = { ...(hysaIndex >= 0 ? accounts[hysaIndex] : {}), id: hysaIndex >= 0 ? accounts[hysaIndex].id : "acc_shared_hysa", name: hysaIndex >= 0 ? accounts[hysaIndex].name : "Household HYSA", institution: hysaIndex >= 0 ? accounts[hysaIndex].institution : "ICCU", type: "savings", balance: Number(shared.balances.hysa) || 0 };
  if (hysaIndex >= 0) accounts[hysaIndex] = hysaAccount; else accounts.push(hysaAccount);
  return { ...data, accounts, investments };
}

function AddCategoryButton({ data, actions, onAdded, onDeleted, showLabel, allowDelete }) {

  const [name, setName] = useState("");
  const [error, setError] = useState("");

  const save = () => {
    const trimmed = name.trim();
    if (!trimmed) { setError("Enter a category name."); return; }
    const existing = allExpenseCategories(data).map(c => c.toLowerCase());
    if (existing.includes(trimmed.toLowerCase())) { setError("That category already exists."); return; }

    setOpen(false);
    if (onAdded) onAdded(trimmed);
  };

  const remove = (category) => {

  return (
    <React.Fragment>

function transactionSplits(t) {
  return Array.isArray(t && t.splits)
    ? t.splits.filter(part => part && part.category && Number(part.amount) > 0)
    : [];
}

function expenseCategoryAllocations(t) {
  if (!t || t.amount >= 0 || t.category === "Transfer") return [];
  const splits = transactionSplits(t);
  if (splits.length) return splits.map(part => ({ category: part.category, amount: Number(part.amount) }));
  return [{ category: t.category, amount: Math.abs(t.amount) }];
}

function transactionHasCategory(t, category) {
  if (!t || !category) return false;
  if (t.category === category) return true;
  return transactionSplits(t).some(part => part.category === category);
}

function transactionCategoryAmount(t, category) {
  if (!t) return 0;
  const splits = transactionSplits(t);
  if (splits.length) {
    return splits
      .filter(part => part.category === category)
      .reduce((sum, part) => sum + Number(part.amount || 0), 0);
  }
  return t.category === category ? Math.abs(t.amount) : 0;
}

function transactionCategoryLabel(t) {
  const splits = transactionSplits(t);
  return splits.length ? `Split: ${splits.map(part => part.category).join(" + ")}` : t.category;
}

function buildFinancialContext(data, derived) {
  const lines = [];

  lines.push(`Net worth: ${fmtCurrency(derived.netWorth)} (assets ${fmtCurrency(derived.totalAssets)}, debt ${fmtCurrency(derived.totalDebt)}).`);
  lines.push(`Accounts: ${data.accounts.map(a => `${a.name} (${a.institution}, ${a.type}): ${fmtCurrency(a.balance)}`).join("; ") || "none"}.`);
  lines.push(`This month so far — income: ${fmtCurrency(derived.monthIncome, { decimals: false })}, expenses: ${fmtCurrency(derived.monthExpense, { decimals: false })}, savings rate: ${derived.savingsRate.toFixed(0)}%.`);
  const catLines = Object.entries(derived.spendByCategory).sort((a, b) => b[1] - a[1])
    .map(([cat, spent]) => `${cat}: spent ${fmtCurrency(spent, { decimals: false })}${data.budgets[cat] ? ` of ${fmtCurrency(data.budgets[cat], { decimals: false })} budget` : ""}`);
  lines.push(`Spending by category this month: ${catLines.join("; ") || "none yet"}.`);
  lines.push(`Safe to spend (checking balance minus remaining bills this month): ${fmtCurrency(derived.safeToSpend, { decimals: false })}.`);
  const activeSubs = data.subscriptions.filter(s => s.active);
  lines.push(`Active subscriptions/recurring bills (${activeSubs.length}): ${activeSubs.map(s => `${s.merchant} ${fmtCurrency(s.amount)}/mo (day ${s.dayOfMonth})`).join("; ") || "none"}.`);
  lines.push(`Financial wellness score: ${derived.wellnessScore}/100.`);

    lines.push(`Goals: ${data.goals.map(g => `${g.name}: ${fmtCurrency(g.current, { decimals: false })} of ${fmtCurrency(g.target, { decimals: false })}`).join("; ")}.`);
  }
  const searchableTransactions = [...data.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 500);
  lines.push(`Searchable transaction register (${searchableTransactions.length} transactions, newest first): ${searchableTransactions.map(t => `${t.date} | ${t.merchant} | ${fmtCurrency(t.amount)} | ${t.category}${t.person ? " | " + t.person : ""}`).join("; ")}.`);
  return lines.join("\n");
}

async function callClaude({ apiKey, model, system, messages }) {
  if (!apiKey || !apiKey.trim()) throw new Error("Add your Anthropic API key above before using Budget AI.");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model, max_tokens: 1200, system, messages }),
  });
  let payload = null;
  try { payload = await response.json(); } catch (e) {}
  if (!response.ok) {
    const detail = payload?.error?.message || `Anthropic connection failed (${response.status}).`;
    throw new Error(detail);
  }
  const text = (payload?.content || []).filter(block => block.type === "text").map(block => block.text).join("\n").trim();
  if (!text) throw new Error("Anthropic returned an empty response. Please try again.");
  return text;
}

  const changeModel = (id) => {
    setModel(id);
    try { localStorage.setItem(AI_MODEL_STORAGE, id); } catch (e) {}
  };

  const saveApiKey = (value) => {
    setApiKey(value);
    try {
      if (value.trim()) localStorage.setItem(ANTHROPIC_KEY_STORAGE, value.trim());
      else localStorage.removeItem(ANTHROPIC_KEY_STORAGE);
    } catch (e) {}
    setError("");
  };

  const runSubscriptionScan = () => {
    const dismissed = data.dismissedSubscriptionCandidates || [];
    const all = detectUnknownSubscriptions(data);
    const candidates = all.filter(c => !dismissed.includes(c.id));
    const alreadyDismissedCount = all.length - candidates.length;
    let text;
    if (candidates.length === 0) {
      text = alreadyDismissedCount > 0
        ? "I scanned your transactions and didn't find any new recurring charges — everything that looked like a subscription is already tracked or was previously ignored."
        : "I scanned your transactions and didn't find any recurring, fixed-amount charges that aren't already tracked as subscriptions.";
    } else {
      text = `I scanned your transactions and found ${candidates.length} recurring charge${candidates.length > 1 ? "s" : ""} that ${candidates.length > 1 ? "aren't" : "isn't"} tracked as a subscription yet — want me to add ${candidates.length > 1 ? "any of these" : "it"}?`;
    }
    setMessages(m => [...m, { role: "assistant", content: text, candidates: candidates.length > 0 ? candidates : undefined }]);
  };

  const send = async () => {
    const text = input.trim();
    if (!text || sending) return;
    setInput("");
    setError("");
    const nextMessages = [...messages, { role: "user", content: text }];
    setMessages(nextMessages);

    if (isSubscriptionScanIntent(text)) {
      runSubscriptionScan();
      return;
    }

    setSending(true);
    try {
      const system = "You are a helpful, concise personal finance assistant embedded in a couple's budgeting app called \"Michael & Cynthia's Money.\" Answer questions using the household financial context below. Be specific and use real numbers from the data. When the user asks for current, changing, or outside information, use web search and clearly distinguish outside information from the household's own records. Never invent transactions or balances. Keep answers brief and conversational unless asked for detail.\n\n" + buildFinancialContext(data, derived);
      const history = nextMessages
        .filter(m => !m.candidates)
        .slice(-20)
        .map(m => ({ role: m.role, content: m.content }));
      const reply = await callClaude({ apiKey, model, system, messages: history });
      setMessages(m => [...m, { role: "assistant", content: reply }]);
    } catch (e) {
      setError(e.message || "Something went wrong talking to the AI.");
    } finally {
      setSending(false);
    }
  };

  const addCandidate = (c) => {
    actions.addSubscription({
      id: uid(), merchant: c.merchant, category: c.category, amount: c.amount, cadence: "Monthly",
      dayOfMonth: c.dayOfMonth, active: true, priceHistory: [{ date: c.lastDate, amount: c.amount }], person: c.person,
    });
  };
  const ignoreCandidate = (c) => {
    actions.dismissSubscriptionCandidate(c.id);
  };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">Budget AI</h1>
        <p className="text-slate-500 text-sm mt-1">Search your household budget or ask Claude to research current information on the web.</p>
      </div>

      <SectionNotes section="ai" data={data} actions={actions} />

      <Card className="p-4">
        <div className="space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-3">
          <div className="text-sm">
            <span className="font-medium text-slate-700">External AI connection: </span>
            <span className={(apiKey.trim() ? "text-emerald-600" : "text-amber-600") + " font-medium"}>{apiKey.trim() ? "Anthropic key saved" : "Key required"}</span>
          </div>
          <select className={inputClass + " max-w-[260px]"} value={model} onChange={e => changeModel(e.target.value)}>
            {ANTHROPIC_MODELS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1.5">Anthropic API key</label>
            <div className="flex gap-2">
              <input
                type={showApiKey ? "text" : "password"}
                className={inputClass + " flex-1 min-w-0"}
                value={apiKey}
                onChange={e => saveApiKey(e.target.value)}
                placeholder="sk-ant-api03-…"
                autoComplete="off"
                spellCheck="false"
              />
              <Button variant="secondary" className="shrink-0" onClick={() => setShowApiKey(value => !value)}>{showApiKey ? "Hide" : "Show"}</Button>
              {apiKey && <Button variant="danger" className="shrink-0" onClick={() => saveApiKey("")}>Remove</Button>}
            </div>
          </div>
        </div>
        <p className="text-xs text-slate-400 mt-2">
          The key is saved only in this browser on this device and is sent directly to Anthropic when you use Budget AI. Your household budget remains stored locally.
        </p>
      </Card>

      <Card className="overflow-hidden flex flex-col" style={{ height: "60vh", minHeight: 420 }}>
        <div className="flex items-center justify-end px-4 pt-3">
          <button type="button" className="text-xs text-slate-400 hover:text-rose-500 font-medium" onClick={clearChat}>Clear chat</button>
        </div>
        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 md:p-5 space-y-4">
          {messages.map((m, i) => (
            <div key={i} className={"flex " + (m.role === "user" ? "justify-end" : "justify-start")}>
              <div className={"max-w-[85%] space-y-2"}>
                <div className={"rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap " + (m.role === "user" ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-700")}>
                  {m.content}
                </div>
                {m.candidates && (
                  <div className="space-y-2">
                    {m.candidates.map(c => (
                      <SubscriptionCandidateCard
                        key={c.id} candidate={c} status={candidateStatusFor(c)}
                        onAdd={() => addCandidate(c)} onIgnore={() => ignoreCandidate(c)}
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          ))}
          {sending && (
            <div className="flex justify-start">
              <div className="rounded-2xl px-4 py-2.5 text-sm bg-slate-100 text-slate-400">Thinking…</div>
            </div>
          )}
          {error && (
            <div className="flex justify-start">
              <div className="rounded-2xl px-4 py-2.5 text-sm bg-rose-50 text-rose-600 border border-rose-200">{error}</div>
            </div>
          )}
        </div>
        <div className="border-t border-slate-100 p-3 flex gap-2 items-center flex-wrap">
          <Button variant="secondary" className="text-xs px-3 py-2" onClick={runSubscriptionScan}>🔍 Scan for Subscriptions</Button>
          <input
            className={inputClass + " flex-1 min-w-[160px]"} placeholder="Ask about your budget or search the web…"
            value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") send(); }}
          />
          <Button className="text-xs px-4 py-2" onClick={send} disabled={sending}>Send</Button>
        </div>
      </Card>
    </div>
  );
}

/* ============================== ROLLOVERS, SINKING FUNDS & RECONCILIATION ============================== */

function RolloverAndSinkingFunds({ data, actions }) {
  const [name, setName] = useState("");
  const [target, setTarget] = useState("");
  const [monthly, setMonthly] = useState("");
  const rollovers = data.budgetRollovers || {};
  const funds = data.sinkingFunds || [];
  const previousMonth = "2026-06";

  const priorSpend = useMemo(() => {
    const totals = {};
    data.transactions.filter(t => monthKey(t.date) === previousMonth && t.amount < 0).forEach(t => {
      expenseCategoryAllocations(t).forEach(part => {
        totals[part.category] = (totals[part.category] || 0) + part.amount;
      });
    });
    return totals;
  }, [data.transactions]);

  const addFund = () => {
    const clean = name.trim();
    const goal = parseFloat(target);
    if (!clean || !goal || goal <= 0) return;
    actions.addSinkingFund({ id: uid(), name: clean, target: goal, current: 0, monthly: Math.max(0, parseFloat(monthly) || 0) });
    setName(""); setTarget(""); setMonthly("");
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">Rollover Budgets</h3>
        <p className="text-sm text-slate-500 mt-1 mb-4">Carry unused June budget into July for categories that vary month to month.</p>
        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
          {EXPENSE_CATEGORIES.map(cat => {
            const carry = Math.max(0, (data.budgets[cat] || 0) - (priorSpend[cat] || 0));
            return (
              <label key={cat} className="flex items-center justify-between gap-3 rounded-lg border border-slate-100 px-3 py-2">
                <span className="text-sm text-slate-600">{cat}</span>
                <span className="flex items-center gap-3">
                  {rollovers[cat] && <span className="text-xs font-medium text-emerald-600">+{fmtCurrency(carry, { decimals: false })}</span>}
                  <input type="checkbox" checked={!!rollovers[cat]} onChange={() => actions.toggleBudgetRollover(cat)} />
                </span>
              </label>
            );
          })}
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">Sinking Funds</h3>
        <p className="text-sm text-slate-500 mt-1 mb-4">Save gradually for irregular expenses without distorting the monthly budget.</p>
        <div className="space-y-3 mb-4">
          {funds.length === 0 && <p className="text-sm text-slate-400">No sinking funds yet.</p>}
          {funds.map(f => (
            <div key={f.id} className="rounded-xl border border-slate-100 p-3">
              <div className="flex justify-between gap-3 text-sm">
                <span className="font-medium text-slate-700">{f.name}</span>
                <span className="text-slate-500">{fmtCurrency(f.current)} / {fmtCurrency(f.target)}</span>
              </div>
              <ProgressBar pct={(f.current / f.target) * 100} color="#0ea5e9" />
              <div className="flex items-center justify-between mt-2">
                <span className="text-xs text-slate-400">{fmtCurrency(f.monthly)} planned monthly</span>
                <span className="flex gap-2">
                  <button className="text-xs text-indigo-600 font-medium" onClick={() => actions.contributeSinkingFund(f.id, f.monthly || 25)}>Add monthly</button>
                  <button className="text-xs text-rose-500 font-medium" onClick={() => actions.deleteSinkingFund(f.id)}>Delete</button>
                </span>
              </div>
            </div>
          ))}
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <input className={inputClass} placeholder="Fund name" value={name} onChange={e => setName(e.target.value)} />
          <input type="number" className={inputClass} placeholder="Target" value={target} onChange={e => setTarget(e.target.value)} />
          <input type="number" className={inputClass} placeholder="Monthly" value={monthly} onChange={e => setMonthly(e.target.value)} />
        </div>
        <Button className="mt-3" onClick={addFund}>+ Add Sinking Fund</Button>
      </Card>
    </div>
  );
}

function ReconciliationPanel({ data, actions }) {
  const [values, setValues] = useState({});
  const reconciliations = data.reconciliations || {};

  return (
    <Card className="p-4 md:p-6">
      <h3 className="font-semibold text-slate-700">Statement Reconciliation</h3>
      <p className="text-sm text-slate-500 mt-1 mb-4">Compare each tracker balance with the latest bank or card statement.</p>
      <div className="space-y-3">
        {data.accounts.map(a => {
          const entered = values[a.id] == null ? "" : values[a.id];
          const statement = entered === "" ? null : parseFloat(entered);
          const difference = statement == null || isNaN(statement) ? null : statement - a.balance;

          return (
            <div key={a.id} className="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_180px_150px_auto] gap-3 md:items-center rounded-xl border border-slate-200 p-4">
              <div className="min-w-0 pb-1 md:pb-0">
                <div className="text-sm font-medium text-slate-700">{a.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">Tracker balance: {fmtCurrency(a.balance)}</div>
                {saved && <div className="text-xs text-slate-400 mt-0.5">Last checked {fmtDateShort(saved.date)}</div>}

              <label className="block">
                <span className="block md:hidden text-xs font-medium text-slate-500 mb-1.5">Statement balance</span>
                <input type="number" step="0.01" className={inputClass + " w-full"} placeholder="0.00" value={entered} onChange={e => setValues({ ...values, [a.id]: e.target.value })} />
              </label>
              <div className="flex items-center justify-between md:block rounded-lg bg-slate-50 px-3 py-2 md:bg-transparent md:px-0 md:py-0">
                <span className="md:hidden text-xs text-slate-400">Difference</span>
                <span className={"text-sm font-medium text-right md:text-left " + (difference === 0 ? "text-emerald-600" : difference == null ? "text-slate-400" : "text-amber-600")}>
                  {difference == null ? "Enter balance" : difference === 0 ? "Matches" : `Off by ${fmtCurrency(difference)}`}
                </span>
              </div>
              <div>
                <Button className="w-full md:w-auto whitespace-nowrap" variant="secondary" disabled={difference == null} onClick={() => actions.reconcileAccount(a.id, statement, difference)}>Save Check</Button>
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

/* ============================== SETTINGS (BACKUP & RESTORE) ============================== */

const LAST_BACKUP_STORAGE = "meridian_money_last_backup";

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function isPlausibleBackup(obj) {
  const d = obj && obj.data ? obj.data : obj;
  return !!d && Array.isArray(d.accounts) && Array.isArray(d.transactions);
}

function Settings({ data, actions }) {
  const [restoreError, setRestoreError] = useState("");
  const [restoreSuccess, setRestoreSuccess] = useState("");
  const [lastBackup, setLastBackup] = useState(() => { try { return localStorage.getItem(LAST_BACKUP_STORAGE) || ""; } catch (e) { return ""; } });
  const [clearConfirmText, setClearConfirmText] = useState("");
  const fileInputRef = useRef(null);

  const handleBackup = () => {
    const envelope = { app: "Michael & Cynthia's Money", version: 1, exportedAt: new Date().toISOString(), data };
    const stamp = new Date().toISOString().slice(0, 10);
    downloadJSON(envelope, `michael-cynthia-money-backup-${stamp}.json`);
    try { localStorage.setItem(LAST_BACKUP_STORAGE, new Date().toISOString()); } catch (e) {}
    setLastBackup(new Date().toISOString());
  };

  const openFilePicker = () => { setRestoreError(""); setRestoreSuccess(""); fileInputRef.current && fileInputRef.current.click(); };

  const handleFile = (file) => {
    if (!file) return;
    setRestoreError(""); setRestoreSuccess("");
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { setRestoreError("That file isn't valid JSON — make sure you're selecting a backup exported from this app."); return; }
      if (!isPlausibleBackup(parsed)) { setRestoreError("That file doesn't look like a Michael & Cynthia's Money backup (missing accounts/transactions)."); return; }
      const restored = parsed.data ? parsed.data : parsed;
      const exportedAt = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : "an unknown date";
      if (!window.confirm(`Restore this backup from ${exportedAt}? This will replace everything currently in the app — all accounts, transactions, budgets, goals, and subscriptions. This can't be undone.`)) return;
      actions.restoreData(restored);
      setRestoreSuccess(`Restored backup from ${exportedAt}.`);
    };
    reader.onerror = () => setRestoreError("Couldn't read that file.");
    reader.readAsText(file);
  };

  const clearEverything = () => {
    if (clearConfirmText.trim().toUpperCase() !== "DELETE") return;
    if (!window.confirm("This will permanently erase EVERYTHING in this app — including your real accounts, transactions, budgets, goals, and subscriptions, not just the demo data. There is no undo unless you've downloaded a backup. Are you absolutely sure?")) return;
    actions.clearAllData();
    setClearConfirmText("");
  };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">Settings</h1>
        <p className="text-slate-500 text-sm mt-1">Back up your data, restore a previous backup, or manage your account data.</p>
      </div>

      <SectionNotes section="settings" data={data} actions={actions} />

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">💾 Backup</h3>
        <p className="text-sm text-slate-500 mt-1">Download everything in this app — accounts, transactions, budgets, goals, subscriptions, and notes — as a JSON file you can keep somewhere safe.</p>
        <div className="flex items-center gap-3 mt-3 flex-wrap">
          <Button onClick={handleBackup}>⬇ Download Backup</Button>
          {lastBackup && <span className="text-xs text-slate-400">Last backup: {new Date(lastBackup).toLocaleString()}</span>}
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">📤 Restore</h3>
        <p className="text-sm text-slate-500 mt-1">Choose a backup file you've previously downloaded to restore it. This replaces all current data in the app, so make sure you've backed up anything you want to keep first.</p>
        <div className="flex items-center gap-3 mt-3 flex-wrap">
          <input ref={fileInputRef} type="file" accept="application/json,.json" className="hidden" onChange={e => handleFile(e.target.files[0])} />
          <Button variant="secondary" onClick={openFilePicker}>📤 Choose Backup File…</Button>
        </div>
        {restoreError && <p className="text-sm text-rose-600 mt-2">{restoreError}</p>}
        {restoreSuccess && <p className="text-sm text-emerald-600 mt-2">{restoreSuccess}</p>}
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">🔒 Household Privacy</h3>
        <p className="text-sm text-slate-500 mt-1">These controls change what is visible on this device. Use a device password and regular budget backups to protect locally stored information.</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
          <Field label="Current view">
            <select className={inputClass} value={(data.privacyPrefs || {}).viewer || "Household"} onChange={e => actions.setPrivacyPrefs({ viewer: e.target.value })}>
              <option value="Household">Household — show everything</option>
              <option value="Michael">Michael — joint and Michael items</option>
              <option value="Cynthia">Cynthia — joint and Cynthia items</option>
            </select>
          </Field>
          <div>
            <div className="text-sm font-medium text-slate-600 mb-1.5">Screen privacy</div>
            <Button variant="secondary" onClick={() => actions.setPrivacyPrefs({ hideBalances: true })}>Hide financial details</Button>
          </div>
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">🔔 Budget Reminders</h3>
        <p className="text-sm text-slate-500 mt-1">Show browser reminders for overspending and upcoming bills while the app is open.</p>
        <div className="mt-3 flex items-center gap-3 flex-wrap">
          <Button variant="secondary" onClick={(data.notificationPrefs || {}).enabled ? actions.disableNotifications : actions.enableNotifications}>
            {(data.notificationPrefs || {}).enabled ? "Disable notifications" : "Enable notifications"}
          </Button>
          <span className="text-xs text-slate-400">
            {(data.notificationPrefs || {}).message || "Your browser may ask for permission. The budget will continue working if notifications are unavailable."}
          </span>
        </div>
      </Card>

      <Card className="p-5">
        <div className="flex items-center justify-between gap-3">
          <div>
            <h3 className="font-semibold text-slate-700">↶ Undo & Change History</h3>
            <p className="text-sm text-slate-500 mt-1">Undo the latest change or select a recent restore point from this session.</p>
          </div>
          <Button variant="secondary" disabled={!actions.canUndo} onClick={actions.undo}>Undo Last Change</Button>
        </div>
        {(actions.undoHistory || []).length > 0 && (
          <div className="mt-4 border border-indigo-100 rounded-xl overflow-hidden">
            <div className="px-3 py-2 bg-indigo-50 text-xs font-semibold uppercase tracking-wide text-indigo-600">Select a restore point</div>
            <div className="divide-y divide-slate-100 max-h-64 overflow-y-auto">
              {actions.undoHistory.map(item => (
                <div key={item.index} className="px-3 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div className="min-w-0">
                    <div className="text-sm text-slate-700 truncate">Before: {item.label}</div>
                    {item.at && <div className="text-xs text-slate-400">{new Date(item.at).toLocaleString()}</div>}
                  </div>
                  <Button variant="secondary" className="text-xs px-3 py-1.5 shrink-0" onClick={() => actions.restoreUndoAt(item.index)}>Restore this point</Button>
                </div>
              ))}
            </div>
          </div>
        )}
        <div className="mt-4 divide-y divide-slate-100">
          {(data.auditLog || []).slice(-8).reverse().map((entry, i) => (
            <div key={i} className="py-2 flex items-center justify-between gap-3 text-xs">
              <span className="text-slate-600">{entry.label || "Budget data updated"}</span>
              <span className="text-slate-400">{new Date(entry.at).toLocaleString()}</span>
            </div>
          ))}
          {(data.auditLog || []).length === 0 && <div className="text-sm text-slate-400 py-3">No changes recorded yet.</div>}
        </div>
      </Card>

      <Card className="p-5 border-2 border-rose-200">
        <h3 className="font-semibold text-rose-700">🗑️ Clear All Data</h3>
        <p className="text-sm text-slate-500 mt-1">
          Permanently erase <span className="font-semibold text-rose-600">everything</span> in this app — including your real accounts, transactions, budgets, goals, subscriptions, rules, and notes, not just the demo data. This can't be undone, so download a backup first if you might want any of it later.
        </p>
        <div className="mt-3 flex flex-wrap items-center gap-3">
          <input
            placeholder='Type DELETE to confirm'
            className={inputClass + " max-w-[200px]"}
            value={clearConfirmText}
            onChange={e => setClearConfirmText(e.target.value)}
          />
          <Button variant="danger" onClick={clearEverything} disabled={clearConfirmText.trim().toUpperCase() !== "DELETE"}>Clear All Data</Button>
        </div>
      </Card>
    </div>
  );
}

/* ============================== APP ROOT ============================== */

const TAB_LABELS = {
  dashboard: "Dashboard", budgets: "Budgets", transactions: "Transactions",
  checking: "Accounts & Cards",
  subscriptions: "Subscriptions & Bills", cashflow: "Cash Flow", goals: "Goals", accounts: "Accounts",
  review: "Financial Review", ai: "AI Assistant", settings: "Settings",
};

function App() {
  const [data, rawSetData] = useState(loadData);
  const undoStack = useRef([]);
  const [undoCount, setUndoCount] = useState(0);
  const [tab, setTab] = useState(() => {
    try {
      const saved = localStorage.getItem(ACTIVE_TAB_KEY);
      return VALID_TABS.includes(saved) ? saved : "dashboard";
    } catch (e) { return "dashboard"; }
  });
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  const setData = (updater, label, options = {}) => {
    rawSetData(previous => {
      const next = typeof updater === "function" ? updater(previous) : updater;
      if (next === previous) return previous;
      if (!options.skipUndo) {
        undoStack.current = [{ data: previous, label: label || "Budget data updated", at: new Date().toISOString() }, ...undoStack.current].slice(0, 25);
        setUndoCount(undoStack.current.length);
      }
      if (options.skipAudit) return next;
      return {
        ...next,
        auditLog: [...(next.auditLog || []), { label: label || "Budget data updated", at: new Date().toISOString() }].slice(-100),
      };
    });
  };

  const undo = () => {
    const item = undoStack.current.shift();
    if (!item) return;
    rawSetData(item.data);
    setUndoCount(undoStack.current.length);
  };

  const restoreUndoAt = (index) => {
    const item = undoStack.current[index];
    if (!item) return;
    if (!window.confirm(`Restore the budget to before "${item.label}"?`)) return;
    const current = data;
    const older = undoStack.current.slice(index + 1);
    rawSetData(item.data);
    undoStack.current = [{ data: current, label: "Selected history restore", at: new Date().toISOString() }, ...older].slice(0, 25);
    setUndoCount(undoStack.current.length);
  };

  useEffect(() => { saveData(data); }, [data]);
  useEffect(() => {
    const syncInvestments = event => {
      if (event && event.key !== SHARED_INVESTMENT_KEY) return;
      const shared = readSharedInvestments();
      if (shared) rawSetData(current => applySharedInvestmentsToBudget(current, shared));
    };
    window.addEventListener("storage", syncInvestments);
    return () => window.removeEventListener("storage", syncInvestments);
  }, []);
  useEffect(() => { try { localStorage.setItem(ACTIVE_TAB_KEY, tab); } catch (e) {} }, [tab]);

  const viewer = (data.privacyPrefs || {}).viewer || "Household";
  const visibleData = viewer === "Household"
    ? data
    : { ...data, transactions: data.transactions.filter(t => !t.person || t.person === "Joint" || t.person === viewer) };
  const derived = useDerived(visibleData);

  useEffect(() => {
    const month = todayISO().slice(0, 7);
    rawSetData(current => {
      const history = [...(current.netWorthHistory || [])];
      const index = history.findIndex(item => item.month === month);
      const savedValue = index >= 0 ? Number(history[index].netWorth) : null;
      if (savedValue === derived.netWorth) return current;
      const point = { month, netWorth: derived.netWorth };
      if (index >= 0) history[index] = point;
      else history.push(point);
      return { ...current, netWorthHistory: history.sort((a, b) => a.month.localeCompare(b.month)).slice(-24) };
    });
  }, [derived.netWorth]);

  useEffect(() => {
    if (!(data.notificationPrefs || {}).enabled || typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const today = new Date().toISOString().slice(0, 10);
    const key = "meridian_money_alerted_" + today;
    try {
      if (localStorage.getItem(key)) return;
    } catch (e) {}
    const messages = [];
    if (derived.budgetAlerts.length) {
      const worst = [...derived.budgetAlerts].sort((a, b) => b.pct - a.pct)[0];
      messages.push(`${worst.cat} is at ${worst.pct.toFixed(0)}% of budget.`);
    }
    const nextBill = derived.recurringItems.filter(b => !b.paid && b.dayOfMonth >= 27).sort((a, b) => a.dayOfMonth - b.dayOfMonth)[0];
    if (nextBill) messages.push(`${nextBill.merchant} is due soon for ${fmtCurrency(nextBill.amount)}.`);
    if (messages.length) {
      const showReminder = async () => {
        try {
          const options = { body: messages.join(" "), tag: "mc-money-daily-reminder" };
          let shown = false;
          if ("serviceWorker" in navigator) {
            const registration = await navigator.serviceWorker.getRegistration();
            if (registration && typeof registration.showNotification === "function") {
              await registration.showNotification("Michael & Cynthia's Money", options);
              shown = true;
            }
          }
          if (!shown) {
            try {
              new Notification("Michael & Cynthia's Money", options);
              shown = true;
            } catch (e) {
              // Some mobile browsers grant permission but do not allow the page
              // Notification constructor. Keep the app running in that case.
            }
          }
          if (shown) {
            try { localStorage.setItem(key, "1"); } catch (e) {}
          }
        } catch (e) {
          // Notification failures must never interrupt access to the budget.
        }
      };
      showReminder();
    }
  }, [data.notificationPrefs && data.notificationPrefs.enabled, JSON.stringify(derived.budgetAlerts), JSON.stringify(derived.recurringItems)]);

  const actions = {
    addTransaction: (t) => setData(d => ({ ...d, transactions: [{ ...t, needsReview: false }, ...d.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)) }), "Transaction added"),
    updateTransaction: (t) => setData(d => ({ ...d, transactions: d.transactions.map(x => x.id === t.id ? t : x) }), "Transaction updated"),
    deleteTransaction: (id) => setData(d => ({ ...d, transactions: d.transactions.filter(x => x.id !== id) }), "Transaction deleted"),
    splitTransaction: (original, parts) => setData(d => {
      const splits = parts.map(part => ({ category: part.category, amount: Number(part.amount) }));
      return {
        ...d,
        transactions: d.transactions.map(t => t.id === original.id
          ? { ...t, ...original, category: splits[0]?.category || original.category || t.category, splits, needsReview: false, isDraftSplit: undefined }
          : t),
      };
    }, "Transaction split"),
    addSplitTransactions: (original, parts) => setData(d => {
      const splits = parts.map(part => ({ category: part.category, amount: Number(part.amount) }));
      const transaction = {
        ...original,
        category: splits[0]?.category || original.category,
        splits,
        needsReview: false,
        isDraftSplit: undefined,
      };
      return {
        ...d,
        transactions: [transaction, ...d.transactions]
          .sort((a, b) => (a.date < b.date ? 1 : -1)),
      };
    }, "Split transaction added"),
    markTransactionReviewed: (id) => setData(d => ({
      ...d,
      transactions: d.transactions.map(t => t.id === id ? { ...t, needsReview: false } : t),
    }), "Transaction reviewed"),
    markAllTransactionsReviewed: () => setData(d => ({
      ...d,
      transactions: d.transactions.map(t => ({ ...t, needsReview: false })),
    }), "Transactions reviewed"),
    reassignTransactionsAccount: (ids, accountId) => setData(d => {
      const idSet = new Set(ids);
      return { ...d, transactions: d.transactions.map(t => idSet.has(t.id) ? { ...t, accountId } : t) };
    }),
    importTransactions: (arr) => setData(d => ({
      ...d,
      transactions: [...arr.map(t => ({ ...t, needsReview: true })), ...d.transactions]
        .sort((a, b) => (a.date < b.date ? 1 : -1)),
    })),

    toggleBillPaid: (monthKey, id) => setData(d => {
      const paidBills = { ...(d.paidBills || {}) };
      const monthMap = { ...(paidBills[monthKey] || {}) };
      monthMap[id] = !monthMap[id];
      paidBills[monthKey] = monthMap;
      return { ...d, paidBills };
    }),

    setBudget: (cat, val) => setData(d => ({ ...d, budgets: { ...d.budgets, [cat]: val }, hiddenBudgetCategories: (d.hiddenBudgetCategories || []).filter(item => item !== cat) })),
    setBudgetForMonth: (month, cat, val) => setData(d => {
      const plan = { ...((d.budgetPlans || {})[month] || d.budgets), [cat]: val };
      const currentMonth = new Date().toISOString().slice(0, 7);
      const hidden = (d.hiddenBudgetCategories || []).filter(item => item !== cat);
      return {
        ...d,
        budgets: month === currentMonth ? plan : d.budgets,
        budgetPlans: { ...(d.budgetPlans || {}), [month]: plan },
        hiddenBudgetCategories: hidden,
      };
    }, "Monthly budget updated"),
    deleteBudgetForMonth: (month, cat) => setData(d => {
      const plan = { ...((d.budgetPlans || {})[month] || d.budgets) };
      delete plan[cat];
      const currentMonth = new Date().toISOString().slice(0, 7);
      const budgetPlans = { ...(d.budgetPlans || {}) };
      Object.keys(budgetPlans).forEach(key => { const next = { ...(budgetPlans[key] || {}) }; delete next[cat]; budgetPlans[key] = next; });
      return {
        ...d,
        budgets: month === currentMonth ? plan : d.budgets,
        budgetPlans: { ...budgetPlans, [month]: plan },
        hiddenBudgetCategories: [...new Set([...(d.hiddenBudgetCategories || []), cat])],
      };
    }, "Monthly budget category deleted"),
    copyBudgetToMonth: (month, plan) => setData(d => ({
      ...d,
      budgetPlans: { ...(d.budgetPlans || {}), [month]: { ...plan } },
    }), "Budget plan saved"),
    deleteBudget: (cat) => setData(d => {
      const budgets = { ...d.budgets };
      delete budgets[cat];
      return {
        ...d,
        budgets,
        customCategories: (d.customCategories || []).filter(c => c !== cat),
        hiddenBudgetCategories: [...new Set([...(d.hiddenBudgetCategories || []), cat])],
      };
    }, "Budget category deleted"),
    toggleBudgetRollover: (cat) => setData(d => ({ ...d, budgetRollovers: { ...(d.budgetRollovers || {}), [cat]: !(d.budgetRollovers || {})[cat] } }), "Rollover setting changed"),
    addSinkingFund: (fund) => setData(d => ({ ...d, sinkingFunds: [...(d.sinkingFunds || []), fund] }), "Sinking fund added"),
    contributeSinkingFund: (id, amount) => setData(d => ({ ...d, sinkingFunds: (d.sinkingFunds || []).map(f => f.id === id ? { ...f, current: Math.min(f.target, f.current + amount) } : f) }), "Sinking fund contribution"),
    deleteSinkingFund: (id) => setData(d => ({ ...d, sinkingFunds: (d.sinkingFunds || []).filter(f => f.id !== id) }), "Sinking fund deleted"),

    toggleSubscription: (id) => setData(d => ({ ...d, subscriptions: d.subscriptions.map(s => s.id === id ? { ...s, active: !s.active } : s) })),
    addSubscription: (s) => setData(d => ({ ...d, subscriptions: [...d.subscriptions, s] })),
    updateSubscription: (s) => setData(d => ({ ...d, subscriptions: d.subscriptions.map(x => x.id === s.id ? s : x) })),
    deleteSubscription: (id) => setData(d => ({ ...d, subscriptions: d.subscriptions.filter(x => x.id !== id) })),
    dismissSubscriptionCandidate: (id) => setData(d => ({ ...d, dismissedSubscriptionCandidates: [...(d.dismissedSubscriptionCandidates || []), id] })),
    addRecurringBill: (bill) => setData(d => ({ ...d, recurringBills: [...(d.recurringBills || []), bill] }), "Household bill added"),
    updateRecurringBill: (bill) => setData(d => ({ ...d, recurringBills: (d.recurringBills || []).map(item => item.id === bill.id ? bill : item) }), "Household bill updated"),
    deleteRecurringBill: (id) => setData(d => ({ ...d, recurringBills: (d.recurringBills || []).filter(item => item.id !== id) }), "Household bill deleted"),

    addGoal: (g) => setData(d => ({ ...d, goals: [...d.goals, g] })),
    updateGoal: (g) => setData(d => ({ ...d, goals: d.goals.map(x => x.id === g.id ? g : x) })),
    deleteGoal: (id) => setData(d => ({ ...d, goals: d.goals.filter(x => x.id !== id) })),
    contributeToGoal: (id, amt) => setData(d => ({ ...d, goals: d.goals.map(g => g.id === id ? { ...g, current: Math.max(0, g.current + amt) } : g) })),

    addAccount: (a) => setData(d => ({ ...d, accounts: [...d.accounts, a] })),
    updateAccount: (a) => setData(d => ({ ...d, accounts: d.accounts.map(x => x.id === a.id ? a : x) })),
    // Register balances are derived from their transactions. Keep this automatic follow-up
    // inside the same undo step as the transaction that caused it.
    syncAccountBalance: (a) => setData(d => ({ ...d, accounts: d.accounts.map(x => x.id === a.id ? a : x) }), "Account balance synchronized", { skipUndo: true, skipAudit: true }),
    deleteAccount: (id) => setData(d => ({ ...d, accounts: d.accounts.filter(x => x.id !== id) })),
    reconcileAccount: (id, statementBalance, difference) => setData(d => ({
      ...d,
      reconciliations: { ...(d.reconciliations || {}), [id]: { date: new Date().toISOString().slice(0, 10), statementBalance, difference } },
    }), "Account reconciliation saved"),
    addInvestmentContribution: (contribution) => setData(d => ({
      ...d,
      investmentContributions: [...(d.investmentContributions || []), contribution],
    }), "Investment contribution added"),
    updateInvestmentContribution: (contribution) => setData(d => ({
      ...d,
      investmentContributions: (d.investmentContributions || []).map(item => item.id === contribution.id ? contribution : item),
    }), "Investment contribution updated"),
    deleteInvestmentContribution: (id) => setData(d => ({
      ...d,
      investmentContributions: (d.investmentContributions || []).filter(c => c.id !== id),
    }), "Investment contribution deleted"),
    setInvestmentStartingValue: (value) => setData(d => ({
      ...d,
      investmentStartingValue: Number(value) || 0,
    }), "Investment baseline updated"),
    setInvestmentCurrentValue: (value) => setData(d => ({
      ...d,
      investmentCurrentValue: value == null || value === "" ? null : Number(value),
    }), "Investment current value updated"),
    setInvestmentBaselineDate: (date) => setData(d => ({
      ...d,
      investmentBaselineDate: date || todayISO(),
    }), "Investment tracking start date updated"),
    addPaycheckItem: (item) => setData(d => ({
      ...d,
      paycheckItems: [...(d.paycheckItems || []), item],
    }), "Paycheck item added"),
    deletePaycheckItem: (id) => setData(d => ({
      ...d,
      paycheckItems: (d.paycheckItems || []).filter(item => item.id !== id),
    }), "Paycheck item deleted"),
    addWatchlist: (watchlist) => setData(d => ({
      ...d,
      watchlists: [...(d.watchlists || []), watchlist],
    }), "Watchlist added"),
    deleteWatchlist: (id) => setData(d => ({
      ...d,
      watchlists: (d.watchlists || []).filter(item => item.id !== id),
    }), "Watchlist deleted"),
    addCreditScore: (entry) => setData(d => ({ ...d, creditScores: [...(d.creditScores || []), entry].sort((a, b) => a.date.localeCompare(b.date)) }), "Credit score added"),
    deleteCreditScore: (id) => setData(d => ({ ...d, creditScores: (d.creditScores || []).filter(entry => entry.id !== id) }), "Credit score deleted"),

    addRule: (r) => setData(d => ({ ...d, rules: [...(d.rules || []), r] })),
    deleteRule: (id) => setData(d => ({ ...d, rules: (d.rules || []).filter(r => r.id !== id) })),
    applyRules: () => setData(d => ({
      ...d,
      transactions: d.transactions.map(t => {
        const match = (d.rules || []).find(r => t.merchant.toLowerCase().includes(r.keyword.toLowerCase()));
        return match ? { ...t, category: match.category } : t;
      }),
    })),

    restoreData: (newData) => { setData(ensureUserNamedSubscriptions(ensureDiscoverRegister(ensureHouseholdRegisters(ensureCindyRegister(newData))))); },
    // This is a genuinely blank slate, wiping the user's real imported data along with everything else.
    clearAllData: () => { setData(emptyData()); },

    addCategory: (name) => setData(d => {
      const trimmed = String(name || "").trim();
      if (!trimmed) return d;
      const hidden = new Set(d.hiddenBudgetCategories || []);
      if (hidden.has(trimmed)) {
        hidden.delete(trimmed);
        return {
          ...d,
          hiddenBudgetCategories: [...hidden],
          customCategories: EXPENSE_CATEGORIES.includes(trimmed)
            ? (d.customCategories || [])
            : [...new Set([...(d.customCategories || []), trimmed])],
        };
      }
      const existing = new Set([...EXPENSE_CATEGORIES, ...(d.customCategories || [])].map(c => c.toLowerCase()));
      if (existing.has(trimmed.toLowerCase())) return d;
      return { ...d, customCategories: [...(d.customCategories || []), trimmed] };
    }),
    deleteCategory: (category) => setData(d => {
      if (!EXPENSE_CATEGORIES.includes(category) && !(d.customCategories || []).includes(category)) return d;
      const replaceSplits = (splits) => (splits || []).map(split => split.category === category ? { ...split, category: "Other" } : split);
      const removeFromPlan = (plan) => {
        const next = { ...(plan || {}) };
        delete next[category];
        return next;
      };
      return {
        ...d,
        customCategories: (d.customCategories || []).filter(item => item !== category),
        hiddenBudgetCategories: [...new Set([...(d.hiddenBudgetCategories || []), category])],
        transactions: d.transactions.map(transaction => ({
          ...transaction,
          category: transaction.category === category ? "Other" : transaction.category,
          splits: replaceSplits(transaction.splits),
        })),
        subscriptions: (d.subscriptions || []).map(item => item.category === category ? { ...item, category: "Other" } : item),
        rules: (d.rules || []).map(rule => rule.category === category ? { ...rule, category: "Other" } : rule),
        budgets: removeFromPlan(d.budgets),
        budgetPlans: Object.fromEntries(Object.entries(d.budgetPlans || {}).map(([month, plan]) => [month, removeFromPlan(plan)])),
      };
    }, "Custom category deleted"),

    setCindyNotes: (text) => setData(d => ({ ...d, cindyRegisterNotes: text })),
    setRegisterNotes: (accountId, text) => setData(d => ({ ...d, registerNotes: { ...(d.registerNotes || {}), [accountId]: text } })),
    setSectionNotes: (section, text) => setData(d => ({ ...d, sectionNotes: { ...(d.sectionNotes || {}), [section]: text } })),
    setPrivacyPrefs: (prefs) => setData(d => ({ ...d, privacyPrefs: { ...(d.privacyPrefs || {}), ...prefs } }), "Privacy preference changed"),
    enableNotifications: async () => {
      try {
        if (typeof Notification === "undefined" || typeof Notification.requestPermission !== "function") {
          setData(d => ({ ...d, notificationPrefs: { enabled: false, message: "Notifications are not supported by this browser." } }));
          return;
        }
        const permission = await Notification.requestPermission();
        if (permission === "granted") {
          setData(d => ({ ...d, notificationPrefs: { enabled: true, message: "Notifications are enabled." } }), "Budget reminders enabled");
        } else {
          setData(d => ({
            ...d,
            notificationPrefs: {
              enabled: false,
              message: permission === "denied"
                ? "Notifications are blocked in this browser's site settings."
                : "Notification permission was not enabled.",
            },
          }));
        }
      } catch (e) {
        setData(d => ({ ...d, notificationPrefs: { enabled: false, message: "Notifications could not be enabled on this device." } }));
      }
    },
    disableNotifications: () => setData(d => ({
      ...d,
      notificationPrefs: { enabled: false, message: "Notifications are disabled." },
    }), "Budget reminders disabled"),
    undo,
    canUndo: undoCount > 0,
    undoHistory: undoStack.current.map((item, index) => ({ index, label: item.label, at: item.at })),
    restoreUndoAt,
  };

  return (
    <div className={"flex h-screen overflow-hidden " + ((data.privacyPrefs || {}).hideBalances ? "privacy-screen" : "")}>
      <Sidebar tab={tab} setTab={setTab} netWorth={derived.netWorth} mobileOpen={mobileMenuOpen} onClose={() => setMobileMenuOpen(false)} sectionNotes={data.sectionNotes} />
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div className="md:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-200 shrink-0">
          <button onClick={() => setMobileMenuOpen(true)} className="text-slate-600 text-2xl leading-none px-1" aria-label="Open menu">☰</button>
          <div className="font-semibold text-slate-800 truncate flex-1">{TAB_LABELS[tab] || "Menu"}</div>
          <div className="bg-white border border-slate-200 rounded-lg shadow-sm px-2.5 py-1 flex items-center gap-2 max-w-full">
            <span className="w-1.5 h-1.5 rounded-full shrink-0 bg-emerald-500"></span>
            <div className="text-[10px] leading-tight font-medium text-slate-700 truncate">Saved locally</div>
          </div>
        </div>
        <main className="flex-1 overflow-y-auto relative">
          <div className="hidden md:flex absolute top-6 right-8 z-20 bg-white border border-slate-200 rounded-lg shadow-sm px-2.5 py-1 items-center gap-2">
            <span className="w-1.5 h-1.5 rounded-full shrink-0 bg-emerald-500"></span>
            <div className="text-[10px] leading-tight font-medium text-slate-700">Saved locally</div>
          </div>
          {tab === "dashboard" && <Dashboard data={visibleData} derived={derived} actions={actions} />}
          {tab === "budgets" && <Budgets data={visibleData} actions={actions} derived={derived} />}
          {tab === "transactions" && <Transactions data={visibleData} actions={actions} />}
          {tab === "checking" && (
            <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-5">
              <SectionNotes section="checking" data={visibleData} actions={actions} />
              <AccountsAndCards data={visibleData} actions={actions} />
            </div>
          )}
          {tab === "subscriptions" && <Subscriptions data={visibleData} actions={actions} />}
          {tab === "cashflow" && <CashFlow data={visibleData} derived={derived} actions={actions} />}
          {tab === "goals" && <Goals data={visibleData} actions={actions} />}
          {tab === "accounts" && <Accounts data={data} actions={actions} derived={derived} />}
          {tab === "review" && <FinancialReview data={visibleData} derived={derived} actions={actions} />}
          {tab === "ai" && <AIAssistant data={data} actions={actions} derived={derived} />}
          {tab === "settings" && <Settings data={data} actions={actions} />}
        </main>
      </div>
      {(data.privacyPrefs || {}).hideBalances && (
        <button className="fixed inset-0 z-[80] bg-slate-950/80 text-white flex flex-col items-center justify-center gap-3" onClick={() => actions.setPrivacyPrefs({ hideBalances: false })}>
          <span className="text-4xl">🔒</span>
          <span className="text-lg font-semibold">Financial details hidden</span>
          <span className="text-sm text-slate-300">Click anywhere to reveal</span>
        </button>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>

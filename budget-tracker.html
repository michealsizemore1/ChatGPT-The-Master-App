const cashflowNow = new Date();
const CASHFLOW_REAL_TODAY = {
  year: cashflowNow.getFullYear(),
  month: cashflowNow.getMonth() + 1,
  day: cashflowNow.getDate(),
};

function PaycheckPlanner({ data, actions }) {
  const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 10), label: "", amount: "", type: "expense" });
  const checking = data.accounts.find(a => a.type === "checking");
  const items = [...(data.paycheckItems || [])].sort((a, b) => a.date.localeCompare(b.date));
  let running = checking?.balance || 0;
  const projected = items.map(item => {
    running += item.type === "income" ? item.amount : -item.amount;
    return { ...item, running };
  });
  const lowest = projected.length ? Math.min(checking?.balance || 0, ...projected.map(i => i.running)) : checking?.balance || 0;
  const add = () => {
    const amount = parseFloat(form.amount);
    if (!form.label.trim() || !Number.isFinite(amount) || amount <= 0) return;
    actions.addPaycheckItem({ id: uid(), ...form, label: form.label.trim(), amount });
    setForm(f => ({ ...f, label: "", amount: "" }));
  };

  return (
    <Card className="p-5 md:p-6">
      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
        <div>
          <h3 className="font-semibold text-slate-700">Paycheck Planner</h3>
          <p className="text-sm text-slate-500 mt-1">Schedule paychecks and major expenses to spot a cash shortage before it happens.</p>
        </div>
        <div className={"rounded-xl px-4 py-2 text-center " + (lowest < 0 ? "bg-rose-50 text-rose-700" : "bg-emerald-50 text-emerald-700")}>
          <div className="text-[10px] uppercase tracking-wide">Lowest projected balance</div>
          <div className="font-bold">{fmtCurrency(lowest)}</div>
        </div>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[150px_130px_1fr_140px_auto] gap-2 items-end mt-4">
        <Field label="Date"><input type="date" className={inputClass} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></Field>
        <Field label="Type"><select className={inputClass} value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}><option value="income">Paycheck</option><option value="expense">Expense</option></select></Field>
        <Field label="Description"><input className={inputClass} placeholder="Payday, mortgage…" value={form.label} onChange={e => setForm({ ...form, label: e.target.value })} /></Field>
        <Field label="Amount"><input type="number" min="0.01" step="0.01" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} /></Field>
        <div className="mb-3"><Button className="w-full whitespace-nowrap" onClick={add}>Add</Button></div>
      </div>
      {projected.length > 0 && (
        <div className="mt-3 divide-y divide-slate-100">
          {projected.map(item => (
            <div key={item.id} className="grid grid-cols-[85px_1fr_auto] sm:grid-cols-[100px_1fr_120px_120px_auto] gap-2 items-center py-2 text-sm">
              <span className="text-slate-400">{fmtDateShort(item.date)}</span>
              <span className="text-slate-700 truncate">{item.label}</span>
              <span className={"hidden sm:block text-right font-medium " + (item.type === "income" ? "text-emerald-600" : "text-rose-600")}>{item.type === "income" ? "+" : "-"}{fmtCurrency(item.amount)}</span>
              <span className={"text-right font-semibold " + (item.running < 0 ? "text-rose-600" : "text-slate-700")}>{fmtCurrency(item.running)}</span>
              <button className="text-xs text-rose-500" onClick={() => actions.deletePaycheckItem(item.id)}>×</button>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

function MonthlyClosingReport({ data }) {
  const months = [...new Set(data.transactions.flatMap(t => [monthKey(t.date), financialReviewMonth(t, data)]).filter(Boolean))].sort().reverse();
  const [selected, setSelected] = useState(months[0] || new Date().toISOString().slice(0, 7));
  const incomeTx = data.transactions.filter(t => financialReviewMonth(t, data) === selected && !t.excludeFromBudget && t.category !== "Transfer" && Number(t.amount) > 0);
  const expenseTx = data.transactions.filter(t => monthKey(t.date) === selected && !t.excludeFromBudget && t.category !== "Transfer" && Number(t.amount) < 0);
  const tx = [...incomeTx, ...expenseTx];
  const income = incomeTx.reduce((s, t) => s + Number(t.amount || 0), 0);
  const spending = expenseTx.reduce((s, t) => s + Math.abs(Number(t.amount || 0)), 0);
  const byCategory = {};
  const byMerchant = {};
  tx.filter(t => t.amount < 0).forEach(t => {
    expenseCategoryAllocations(t).forEach(part => {
      byCategory[part.category] = (byCategory[part.category] || 0) + part.amount;
    });
    byMerchant[t.merchant] = (byMerchant[t.merchant] || 0) + Math.abs(t.amount);
  });
  const topCategory = Object.entries(byCategory).sort((a, b) => b[1] - a[1])[0];
  const topMerchant = Object.entries(byMerchant).sort((a, b) => b[1] - a[1])[0];
  const contributions = (data.investmentContributions || []).filter(c => monthKey(c.date) === selected).reduce((s, c) => s + c.amount, 0);
  const plan = (data.budgetPlans && data.budgetPlans[selected]) || data.budgets;
  const planned = Object.values(plan || {}).reduce((s, v) => s + v, 0);

  return (
    <Card className="p-5 md:p-6">
      <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
        <div><h3 className="font-semibold text-slate-700">Monthly Closing Report</h3><p className="text-sm text-slate-500 mt-1">A quick month-end review of the plan and actual results.</p></div>
        <input type="month" className={inputClass + " max-w-[180px]"} value={selected} onChange={e => setSelected(e.target.value)} />
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <RegStat label="Income" value={fmtCurrency(income)} tone="emerald" />
        <RegStat label="Spending" value={fmtCurrency(spending)} tone="rose" />
        <RegStat label="Net Cash Flow" value={fmtCurrency(income - spending)} tone={income - spending >= 0 ? "emerald" : "rose"} />
        <RegStat label="Investment Contributions" value={fmtCurrency(contributions)} tone="indigo" />
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-3 text-sm">
        <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-400">Plan vs actual</div><div className="font-semibold text-slate-700 mt-1">{fmtCurrency(spending)} / {fmtCurrency(planned)}</div></div>
        <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-400">Top category</div><div className="font-semibold text-slate-700 mt-1">{topCategory ? `${topCategory[0]} · ${fmtCurrency(topCategory[1])}` : "—"}</div></div>
        <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-400">Top merchant</div><div className="font-semibold text-slate-700 mt-1">{topMerchant ? `${topMerchant[0]} · ${fmtCurrency(topMerchant[1])}` : "—"}</div></div>
      </div>
    </Card>
  );
}

function CashFlow({ data, derived, actions }) {
  const [viewYear, setViewYear] = useState(CASHFLOW_REAL_TODAY.year);
  const [viewMonth, setViewMonth] = useState(CASHFLOW_REAL_TODAY.month);
  const [selectedDay, setSelectedDay] = useState(null);

  const isCurrentMonth = viewYear === CASHFLOW_REAL_TODAY.year && viewMonth === CASHFLOW_REAL_TODAY.month;
  const todayDay = isCurrentMonth ? CASHFLOW_REAL_TODAY.day : -1;
  const viewMonthKey = `${viewYear}-${pad(viewMonth)}`;
  const dimView = daysInMonth(viewYear, viewMonth);

  // Recurring bills/subscriptions repeat every month on their day (clamped to the viewed
  // month's length), with paid status looked up per the viewed month specifically — not
  // tied to the real current month like derived.recurringItems is.
  const paidForViewMonth = (data.paidBills && data.paidBills[viewMonthKey]) || {};
  const items = [
    ...(data.recurringBills || []).map(b => ({ id: b.id, merchant: b.merchant, amount: b.amount, dayOfMonth: Math.min(b.dayOfMonth, dimView), category: b.category, paid: !!paidForViewMonth[b.id], income: false })),
    ...data.subscriptions.filter(s => s.active && subDueInMonth(s, viewYear, viewMonth)).map(s => ({ id: s.id, merchant: s.merchant, amount: s.amount, dayOfMonth: Math.min(subscriptionDayForMonth(s, viewYear, viewMonth), dimView), category: s.category, paid: !!paidForViewMonth[s.id], income: false })),
    ...data.transactions.filter(t => t.category === "Income" && monthKey(t.date) === viewMonthKey).map(t => ({ merchant: t.merchant, amount: t.amount, dayOfMonth: new Date(t.date + "T00:00:00").getDate(), income: true })),
  ];

  // "Still due this month" and Safe to Spend always reflect the real current month,
  // regardless of which month the calendar above is browsing.
  const upcoming = derived.recurringItems.filter(b => b.dayOfMonth > CASHFLOW_REAL_TODAY.day).sort((a, b) => a.dayOfMonth - b.dayOfMonth);

  // Recomputed live from `items` on every render (not a frozen snapshot), so the paid
  // checkbox in the modal stays in sync immediately after toggling.
  const selectedItems = selectedDay != null ? items.filter(it => it.dayOfMonth === selectedDay) : [];
  const openDay = (day) => setSelectedDay(day);

  const monthLabel = new Date(viewYear, viewMonth - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const goPrevMonth = () => {
    setSelectedDay(null);
    if (viewMonth === 1) { setViewMonth(12); setViewYear(y => y - 1); } else setViewMonth(m => m - 1);
  };
  const goNextMonth = () => {
    setSelectedDay(null);
    if (viewMonth === 12) { setViewMonth(1); setViewYear(y => y + 1); } else setViewMonth(m => m + 1);
  };
  const goToday = () => { setSelectedDay(null); setViewYear(CASHFLOW_REAL_TODAY.year); setViewMonth(CASHFLOW_REAL_TODAY.month); };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800">Cash Flow</h1>
        <p className="text-slate-500 text-sm mt-1">What's safe to spend before your next bills hit, and when everything is due.</p>
      </div>

      <SectionNotes section="cashflow" data={data} actions={actions} />

      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <Card className="p-6">
          <h3 className="font-semibold text-slate-700 mb-1">Safe to Spend</h3>
          <div className={"text-3xl font-bold mt-2 " + (derived.safeToSpend >= 0 ? "text-slate-800" : "text-rose-600")}>{fmtCurrency(derived.safeToSpend, { decimals: false })}</div>
          <div className="mt-4 space-y-2 text-sm border-t border-slate-100 pt-4">
            <div className="flex justify-between"><span className="text-slate-500">Checking balance</span><span className="font-medium text-slate-700">{fmtCurrency((derived.checkingAccount && derived.checkingAccount.balance) || 0, { decimals: false })}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Upcoming bills (rest of month)</span><span className="font-medium text-rose-600">-{fmtCurrency(derived.upcomingBillsRemaining, { decimals: false })}</span></div>
          </div>
          <div className="mt-4 pt-4 border-t border-slate-100">
            <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Still due this month</div>
            <div className="space-y-2 max-h-56 overflow-y-auto no-scrollbar">
              {upcoming.length === 0 && <div className="text-sm text-slate-400">Nothing left — you're all paid up! 🎉</div>}
              {upcoming.map((b, i) => (
                <label key={b.id || i} className="flex items-center justify-between gap-2 text-sm cursor-pointer">
                  <span className="flex items-center gap-2 min-w-0">
                    <input
                      type="checkbox"
                      checked={!!b.paid}
                      onChange={() => b.id && actions.toggleBillPaid(derived.curMonth, b.id)}
                      className="w-3.5 h-3.5 accent-emerald-600 shrink-0"
                    />
                    <span className={"truncate " + (b.paid ? "text-slate-400 line-through" : "text-slate-600")}>{b.merchant}</span>
                  </span>
                  <span className={"font-medium shrink-0 " + (b.paid ? "text-slate-400" : "text-slate-700")}>{fmtCurrency(b.amount)}</span>
                </label>
              ))}
            </div>
          </div>
        </Card>
        <Card className="md:col-span-2 p-6">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="font-semibold text-slate-700">{monthLabel} Bill Calendar</h3>
            <div className="flex items-center gap-1.5">
              {!isCurrentMonth && (
                <button type="button" onClick={goToday} className="text-xs text-indigo-600 font-medium mr-1">Today</button>
              )}
              <button type="button" onClick={goPrevMonth} title="Previous month" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 flex items-center justify-center">‹</button>
              <button type="button" onClick={goNextMonth} title="Next month" className="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 flex items-center justify-center">›</button>
            </div>
          </div>
          <p className="text-xs text-slate-400 -mt-1 mb-3">Tap any day to see full details and check off bills as paid.</p>
          <BillCalendar year={viewYear} month={viewMonth} items={items} todayDay={todayDay} onDayClick={openDay} />
        </Card>
      </div>

      <DayDetailModal
        open={selectedDay != null}
        onClose={() => setSelectedDay(null)}
        day={selectedDay}
        items={selectedItems}
        monthKey={viewMonthKey}
        actions={actions}
      />

      <PaycheckPlanner data={data} actions={actions} />

      <MonthlyClosingReport data={data} />
    </div>
  );
}

/* ============================== GOALS ============================== */

function GoalModal({ open, onClose, onSave, initial }) {
  const blank = { name: "", icon: "🎯", target: "", current: "0", deadline: "2027-01-01", color: "#4f46e5" };
  const [form, setForm] = useState(initial || blank);
  useEffect(() => { setForm(initial || blank); }, [initial, open]);

  const submit = (e) => {
    e.preventDefault();
    if (!form.name || !form.target) return;
    onSave({ ...form, target: parseFloat(form.target), current: parseFloat(form.current) || 0 });
  };

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Goal" : "New Goal"}>
      <form onSubmit={submit}>
        <div className="grid grid-cols-4 gap-3">
          <Field label="Icon">
            <input className={inputClass} value={form.icon} onChange={e => setForm({ ...form, icon: e.target.value })} />
          </Field>
          <div className="col-span-3">
            <Field label="Goal name">
              <input className={inputClass} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required />
            </Field>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Target amount ($)">
            <input type="number" className={inputClass} value={form.target} onChange={e => setForm({ ...form, target: e.target.value })} required />
          </Field>
          <Field label="Current amount ($)">
            <input type="number" className={inputClass} value={form.current} onChange={e => setForm({ ...form, current: e.target.value })} />
          </Field>
        </div>
        <Field label="Target date">
          <input type="date" className={inputClass} value={form.deadline} onChange={e => setForm({ ...form, deadline: e.target.value })} />
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="secondary" onClick={onClose} type="button">Cancel</Button>
          <Button type="submit">Save Goal</Button>
        </div>
      </form>
    </Modal>
  );
}

function Goals({ data, actions }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [contribTarget, setContribTarget] = useState(null);
  const [contribVal, setContribVal] = useState("");

  const openAdd = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (g) => { setEditing(g); setModalOpen(true); };
  const save = (form) => {
    if (editing) actions.updateGoal({ ...form, id: editing.id });
    else actions.addGoal({ ...form, id: uid() });
    setModalOpen(false);
  };

  const submitContribution = () => {
    const v = parseFloat(contribVal);
    if (!isNaN(v) && v !== 0) actions.contributeToGoal(contribTarget.id, v);
    setContribTarget(null); setContribVal("");
  };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-slate-800">Goals</h1>
          <p className="text-slate-500 text-sm mt-1">Track progress toward what matters.</p>
        </div>
        <Button className="self-start sm:self-auto" onClick={openAdd}>+ New Goal</Button>
      </div>

      <SectionNotes section="goals" data={data} actions={actions} />

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5">
        {data.goals.map(g => {
          const pct = g.target > 0 ? (g.current / g.target) * 100 : 0;
          const daysLeft = Math.ceil((new Date(g.deadline) - new Date("2026-07-27")) / 86400000);
          return (
            <Card key={g.id} className="p-5">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl flex items-center justify-center text-xl" style={{ background: g.color + "20" }}>{g.icon}</div>
                  <div>
                    <div className="font-semibold text-slate-700">{g.name}</div>
                    <div className="text-xs text-slate-400">{daysLeft > 0 ? `${daysLeft} days left` : "Past deadline"} · Target {fmtDate(g.deadline)}</div>
                  </div>
                </div>
                <button onClick={() => openEdit(g)} className="text-xs text-indigo-600 font-medium">Edit</button>
              </div>
              <ProgressBar pct={pct} color={g.color} />
              <div className="flex items-center justify-between mt-2 text-sm">
                <span className="font-semibold text-slate-700">{fmtCurrency(g.current, { decimals: false })}</span>
                <span className="text-slate-400">of {fmtCurrency(g.target, { decimals: false })} ({pct.toFixed(0)}%)</span>
              </div>
              <div className="mt-3 flex gap-2">
                <Button variant="secondary" className="text-xs px-3 py-1.5" onClick={() => { setContribTarget(g); setContribVal(""); }}>+ Add Funds</Button>
                <Button variant="danger" className="text-xs px-3 py-1.5" onClick={() => actions.deleteGoal(g.id)}>Delete</Button>
              </div>
            </Card>
          );
        })}
      </div>

      <GoalModal open={modalOpen} onClose={() => setModalOpen(false)} onSave={save} initial={editing} />

      <Modal open={!!contribTarget} onClose={() => setContribTarget(null)} title={"Add Funds — " + (contribTarget?.name || "")}>
        <Field label="Amount ($)">
          <input type="number" className={inputClass} value={contribVal} onChange={e => setContribVal(e.target.value)} autoFocus />
        </Field>
        <div className="flex justify-end gap-2 mt-4">
          <Button variant="secondary" onClick={() => setContribTarget(null)}>Cancel</Button>
          <Button onClick={submitContribution}>Add</Button>
        </div>
      </Modal>
    </div>
  );
}

/* ============================== INVESTMENTS & DEBT PAYOFF ============================== */

function InvestmentAllocation({ investments }) {
  if (!investments || investments.length === 0) return null;
  const byCategory = {};
  investments.forEach(h => { byCategory[h.category] = (byCategory[h.category] || 0) + h.value; });
  const total = Object.values(byCategory).reduce((s, v) => s + v, 0) || 1;
  const entries = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const colors = labels.map(l => (INVESTMENT_CATEGORY_META[l] || { color: "#64748b" }).color);

  return (
    <Card className="p-6">
      <h3 className="font-semibold text-slate-700 mb-4">Investment Allocation</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <DoughnutChartCanvas labels={labels} values={values} colors={colors} height={190} />
        <div className="space-y-2">
          {entries.map(([cat, val]) => (
            <div key={cat}>
              <div className="flex items-center justify-between text-xs mb-1">
                <span className="flex items-center gap-1.5 text-slate-600">
                  <span className="w-2 h-2 rounded-full inline-block" style={{ background: (INVESTMENT_CATEGORY_META[cat] || {}).color || "#64748b" }}></span>
                  {cat}
                </span>
                <span className="font-medium text-slate-700">{fmtCurrency(val, { decimals: false })} ({((val / total) * 100).toFixed(0)}%)</span>
              </div>
              <ProgressBar pct={(val / total) * 100} color={(INVESTMENT_CATEGORY_META[cat] || {}).color} />
            </div>
          ))}
        </div>
      </div>
    </Card>
  );
}

function InvestmentContributions({ data, actions }) {
  const targets = [
    ...(data.investments || []).map(i => ({ id: `holding:${i.id}`, name: i.name })),
    ...data.accounts.filter(a => a.type === "investment").map(a => ({ id: `account:${a.id}`, name: a.name })),
  ];
  const [form, setForm] = useState({
    id: null,
    date: todayISO(),
    targetId: targets[0]?.id || "general",
    amount: "",
    note: "",
  });
  const contributions = [...(data.investmentContributions || [])].sort((a, b) => b.date.localeCompare(a.date));
  const currentMonth = new Date().toISOString().slice(0, 7);
  const monthTotal = contributions.filter(c => c.date.slice(0, 7) === currentMonth).reduce((sum, c) => sum + c.amount, 0);
  const yearTotal = contributions.filter(c => c.date.slice(0, 4) === currentMonth.slice(0, 4)).reduce((sum, c) => sum + c.amount, 0);
  const lifetimeContributions = contributions.reduce((sum, c) => sum + c.amount, 0);
  const baselineDate = data.investmentBaselineDate || todayISO();
  const contributionsSinceBaseline = contributions.filter(c => c.date > baselineDate).reduce((sum, c) => sum + c.amount, 0);
  const hasCurrentValue = data.investmentCurrentValue != null && data.investmentCurrentValue !== "" && Number.isFinite(Number(data.investmentCurrentValue));
  const currentValue = hasCurrentValue ? Number(data.investmentCurrentValue) : 0;
  const startingValue = Number(data.investmentStartingValue) || 0;
  const marketChange = startingValue > 0 && hasCurrentValue ? currentValue - startingValue - contributionsSinceBaseline : null;

  const save = (e) => {
    e.preventDefault();
    const amount = parseFloat(form.amount);
    if (!Number.isFinite(amount) || amount <= 0) return;
    const target = targets.find(t => t.id === form.targetId);
    const contribution = {
      id: form.id || uid(),
      date: form.date,
      targetId: form.targetId,
      targetName: target?.name || "General Investments",
      amount,
      note: form.note.trim(),
    };
    if (form.id) actions.updateInvestmentContribution(contribution);
    else actions.addInvestmentContribution(contribution);
    setForm(f => ({ ...f, id: null, date: todayISO(), amount: "", note: "" }));
  };

  const editContribution = (contribution) => {
    setForm({
      id: contribution.id,
      date: contribution.date,
      targetId: contribution.targetId || "general",
      amount: String(contribution.amount),
      note: contribution.note || "",
    });
  };

  const cancelEdit = () => setForm(f => ({ ...f, id: null, date: todayISO(), amount: "", note: "" }));

  return (
    <Card className="p-5 md:p-6">
      <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-4">
        <div>
          <h3 className="font-semibold text-slate-700">Investment Contributions</h3>
          <p className="text-sm text-slate-500 mt-1">Record money you contribute without changing the investment’s current market value.</p>
        </div>
        <div className="flex gap-2 text-center">
          <div className="rounded-xl bg-indigo-50 px-3 py-2">
            <div className="text-[10px] uppercase tracking-wide text-indigo-400">This month</div>
            <div className="text-sm font-bold text-indigo-700">{fmtCurrency(monthTotal)}</div>
          </div>
          <div className="rounded-xl bg-emerald-50 px-3 py-2">
            <div className="text-[10px] uppercase tracking-wide text-emerald-500">This year</div>
            <div className="text-sm font-bold text-emerald-700">{fmtCurrency(yearTotal)}</div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 mb-4">
        <label className="rounded-xl bg-slate-50 p-3">
          <span className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Starting portfolio value</span>
          <input type="number" step="0.01" className={inputClass} placeholder="Enter baseline" value={startingValue || ""} onChange={e => actions.setInvestmentStartingValue(parseFloat(e.target.value) || 0)} />
        </label>
        <label className="rounded-xl bg-slate-50 p-3">
          <span className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Tracking start date</span>
          <input type="date" className={inputClass} value={baselineDate} onChange={e => actions.setInvestmentBaselineDate(e.target.value || todayISO())} />
        </label>
        <label className="rounded-xl bg-slate-50 p-3">
          <span className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Current holding value</span>
          <input type="number" min="0" step="0.01" className={inputClass} placeholder="Enter current value" value={hasCurrentValue ? data.investmentCurrentValue : ""} onChange={e => actions.setInvestmentCurrentValue(e.target.value === "" ? null : parseFloat(e.target.value))} />
        </label>
        <div className={"rounded-xl p-3 " + (marketChange == null ? "bg-slate-50" : marketChange >= 0 ? "bg-emerald-50" : "bg-rose-50")}>
          <div className="text-[10px] uppercase tracking-wide text-slate-400">Estimated market gain/loss</div>
          <div className={"text-lg font-bold mt-1 " + (marketChange == null ? "text-slate-400" : marketChange >= 0 ? "text-emerald-700" : "text-rose-700")}>{marketChange == null ? (startingValue > 0 ? "Add current value" : "Add baseline") : fmtCurrency(marketChange)}</div>
        </div>
      </div>
      <div className="text-xs text-slate-400 -mt-2 mb-4">Gain/loss uses contributions entered after {fmtDate(baselineDate)}. Contributions on or before the tracking start date are treated as part of the starting value.</div>

      <form onSubmit={save} className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-12 gap-x-3 gap-y-1 items-end">
        <div className="xl:col-span-2">
        <Field label="Date">
          <input type="date" className={inputClass} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required />
        </Field>
        </div>
        <div className="xl:col-span-3">
        <Field label="Investment">
          <select className={inputClass + " w-full"} value={form.targetId} onChange={e => setForm({ ...form, targetId: e.target.value })}>
            {targets.length === 0 && <option value="general">General Investments</option>}
            {targets.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </Field>
        </div>
        <div className="xl:col-span-2">
        <Field label="Contribution ($)">
          <input type="number" min="0.01" step="0.01" placeholder="0.00" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required />
        </Field>
        </div>
        <div className="xl:col-span-3">
        <Field label="Note (optional)">
          <input placeholder="401(k), IRA, brokerage…" className={inputClass} value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} />
        </Field>
        </div>
        <div className="xl:col-span-2 mb-3">
          <Button type="submit" className="w-full min-h-[42px] whitespace-nowrap">{form.id ? "Save Changes" : "Add Contribution"}</Button>
          {form.id && <button type="button" className="w-full text-xs text-slate-500 font-medium mt-2" onClick={cancelEdit}>Cancel edit</button>}
        </div>
      </form>

      {contributions.length > 0 && (
        <div className="mt-5 border-t border-slate-100 pt-4">
          <div className="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Recent contributions</div>
          <div className="space-y-2 max-h-64 overflow-y-auto">
            {contributions.slice(0, 20).map(c => (
              <div key={c.id} className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-700 truncate">{c.targetName || "General Investments"}</div>
                  <div className="text-xs text-slate-400">{fmtDate(c.date)}{c.note ? ` · ${c.note}` : ""}</div>
                </div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="text-sm font-semibold text-emerald-600">+{fmtCurrency(c.amount)}</span>
                  <button type="button" className="text-xs text-indigo-600 font-medium" onClick={() => editContribution(c)}>Edit</button>
                  <button type="button" className="text-xs text-rose-500 font-medium" onClick={() => actions.deleteInvestmentContribution(c.id)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </Card>
  );
}

function DebtPayoffPlanner({ debtAccounts }) {
  const [extra, setExtra] = useState(0);
  const [strategy, setStrategy] = useState("avalanche");

  const payable = debtAccounts.filter(a => a.apr != null);

  const result = useMemo(() => simulatePayoff(payable, extra, strategy), [JSON.stringify(payable), extra, strategy]);
  const payoffDate = useMemo(() => {
    const d = new Date(todayISO() + "T00:00:00");
    d.setMonth(d.getMonth() + result.months);
    return d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  }, [result.months]);
  const scheduleLabels = result.schedule.map((_, i) => "M" + i);

  if (payable.length === 0) return null;

  return (
    <Card className="p-6">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 className="font-semibold text-slate-700">Debt Payoff Planner</h3>
        <div className="flex gap-1 bg-slate-100 rounded-lg p-1">
          <button onClick={() => setStrategy("avalanche")} className={"text-xs px-3 py-1.5 rounded-md font-medium " + (strategy === "avalanche" ? "bg-white shadow-sm text-indigo-600" : "text-slate-500")}>Avalanche</button>
          <button onClick={() => setStrategy("snowball")} className={"text-xs px-3 py-1.5 rounded-md font-medium " + (strategy === "snowball" ? "bg-white shadow-sm text-indigo-600" : "text-slate-500")}>Snowball</button>
        </div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <Field label="Extra monthly payment ($)">
            <input type="number" className={inputClass} value={extra} onChange={e => setExtra(Math.max(0, parseFloat(e.target.value) || 0))} />
          </Field>
          <div className="space-y-2 text-sm mt-4">
            <div className="flex justify-between"><span className="text-slate-500">Debt-free by</span><span className="font-semibold text-slate-700">{payoffDate}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Months to pay off</span><span className="font-semibold text-slate-700">{result.months}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">Total interest paid</span><span className="font-semibold text-rose-600">{fmtCurrency(result.totalInterest, { decimals: false })}</span></div>
          </div>
          <div className="mt-4 pt-4 border-t border-slate-100">
            <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Payoff order ({strategy})</div>
            <ol className="text-sm text-slate-600 list-decimal list-inside space-y-1">
              {result.payoffOrder.map((name, i) => <li key={i}>{name}</li>)}
            </ol>
          </div>
        </div>
        <div className="md:col-span-2">
          <div className="text-xs text-slate-400 uppercase tracking-wide mb-2">Combined balance over time</div>
          <LineChartCanvas labels={scheduleLabels} values={result.schedule.map(v => Math.round(v))} height={220} />
        </div>
      </div>
    </Card>
  );
}

function median(values) {
  if (!values.length) return 0;
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function FinancialReview({ data, derived, actions }) {
  const months = useMemo(() => {
    const result = [...new Set(data.transactions.map(t => financialReviewMonth(t, data)).filter(Boolean))].sort().reverse();
    const current = todayISO().slice(0, 7);
    if (!result.includes(current)) result.unshift(current);
    return result;
  }, [data.transactions, data.financialReviewPrefs]);
  const [selectedMonth, setSelectedMonth] = useState(months[0] || todayISO().slice(0, 7));
  const [score, setScore] = useState("");
  const [scoreDate, setScoreDate] = useState(todayISO());

  const monthTransactions = data.transactions.filter(t => financialReviewMonth(t, data) === selectedMonth && !t.excludeFromBudget && t.category !== "Transfer");
  const income = monthTransactions.filter(t => t.amount > 0).reduce((sum, t) => sum + Number(t.amount || 0), 0);
  const spending = monthTransactions.filter(t => t.amount < 0).reduce((sum, t) => sum + Math.abs(Number(t.amount || 0)), 0);
  const savings = income - spending;
  const savingsRate = income > 0 ? (savings / income) * 100 : 0;
  const categoryTotals = {};
  monthTransactions.filter(t => t.amount < 0).forEach(t => expenseCategoryAllocations(t).forEach(part => { categoryTotals[part.category] = (categoryTotals[part.category] || 0) + part.amount; }));
  const topCategory = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1])[0];

  const anomalies = useMemo(() => {
    const expenses = data.transactions.filter(t => t.amount < 0 && t.category !== "Transfer" && !t.excludeFromBudget);
    return expenses.filter(t => monthKey(t.date) === selectedMonth).map(t => {
      const history = expenses.filter(old => old.id !== t.id && old.date < t.date && normalizeMerchantName(old.merchant) === normalizeMerchantName(t.merchant)).map(old => Math.abs(Number(old.amount || 0)));
      const usual = median(history);
      const amount = Math.abs(Number(t.amount || 0));
      return { transaction: t, usual, amount, count: history.length, unusual: history.length >= 3 && amount >= usual + 25 && amount >= usual * 1.5 };
    }).filter(item => item.unusual).sort((a, b) => (b.amount - b.usual) - (a.amount - a.usual)).slice(0, 10);
  }, [data.transactions, selectedMonth]);

  const scores = [...(data.creditScores || [])].sort((a, b) => a.date.localeCompare(b.date));
  const latestScore = scores[scores.length - 1];
  const previousScore = scores[scores.length - 2];
  const addScore = () => {
    const value = Number(score);
    if (!scoreDate || value < 300 || value > 850) return;
    actions.addCreditScore({ id: uid(), date: scoreDate, score: value, source: "Experian" });
    setScore("");
  };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div><h1 className="text-xl md:text-2xl font-bold text-slate-800">Financial Review</h1><p className="text-slate-500 text-sm mt-1">Monthly results, unusual spending, and credit-score history.</p></div>
        <select className={inputClass + " sm:max-w-[210px]"} value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>
          {months.map(month => <option key={month} value={month}>{new Date(month + "-01T00:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</option>)}
        </select>
      </div>
      <SectionNotes section="review" data={data} actions={actions} />

      <Card className="p-4 border-indigo-200 bg-indigo-50/50">
        <label className="flex items-start gap-3 cursor-pointer">
          <input type="checkbox" className="mt-1" checked={!!data.financialReviewPrefs?.earlyIncomeToNextMonth} onChange={e => actions.setFinancialReviewPrefs({ earlyIncomeToNextMonth: e.target.checked })} />
          <span><span className="block text-sm font-semibold text-slate-700">Count early month-end income in the following month</span><span className="block text-xs text-slate-500 mt-1">Income dated on or after the 27th is shown in the next month’s Financial Review. The real bank transaction date and account balance stay unchanged.</span></span>
        </label>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700 mb-4">Monthly report</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <RegStat label="Income" value={fmtCurrency(income)} tone="emerald" />
          <RegStat label="Spending" value={fmtCurrency(spending)} tone="rose" />
          <RegStat label="Net cash flow" value={fmtCurrency(savings)} tone={savings >= 0 ? "emerald" : "rose"} />
          <RegStat label="Savings rate" value={savingsRate.toFixed(1) + "%"} tone={savingsRate >= 0 ? "indigo" : "rose"} />
        </div>
        <div className="mt-4 rounded-xl bg-slate-50 p-4 text-sm text-slate-600 leading-6">
          {topCategory ? <div><span className="font-semibold">Largest category:</span> {topCategory[0]} at {fmtCurrency(topCategory[1])}.</div> : <div>No spending has been recorded for this month.</div>}
          <div><span className="font-semibold">Budget status:</span> {Object.entries(categoryTotals).filter(([category, amount]) => amount > Number(data.budgets[category] || 0) && Number(data.budgets[category] || 0) > 0).length || "No"} categor{Object.entries(categoryTotals).filter(([category, amount]) => amount > Number(data.budgets[category] || 0) && Number(data.budgets[category] || 0) > 0).length === 1 ? "y is" : "ies are"} over budget.</div>
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">Unusual spending alerts</h3>
        <p className="text-xs text-slate-400 mt-1 mb-4">Flags a purchase when it is at least 50% and $25 above your usual amount after three prior purchases at that merchant.</p>
        <div className="space-y-3">
          {anomalies.map(item => <div key={item.transaction.id} className="rounded-xl border border-amber-200 bg-amber-50/60 p-3 flex justify-between gap-3"><div><div className="text-sm font-semibold text-amber-800">{item.transaction.merchant}</div><div className="text-xs text-amber-700">{fmtDate(item.transaction.date)} · usual about {fmtCurrency(item.usual)}</div></div><div className="text-sm font-bold text-amber-800">{fmtCurrency(item.amount)}</div></div>)}
          {anomalies.length === 0 && <div className="rounded-xl bg-emerald-50 p-4 text-sm text-emerald-700">No unusual purchases detected for this month.</div>}
        </div>
      </Card>

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700">Credit score history</h3>
        <p className="text-xs text-slate-400 mt-1 mb-4">Manually record your Experian score. Your credit report remains outside this app.</p>
        {latestScore && <div className="grid grid-cols-2 gap-3 mb-4"><RegStat label="Latest score" value={String(latestScore.score)} tone="indigo" /><RegStat label="Change" value={previousScore ? ((latestScore.score - previousScore.score >= 0 ? "+" : "") + (latestScore.score - previousScore.score)) : "—"} tone={!previousScore || latestScore.score >= previousScore.score ? "emerald" : "rose"} /></div>}
        <div className="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-3 items-end">
          <Field label="Score (300–850)"><input type="number" min="300" max="850" className={inputClass} value={score} onChange={e => setScore(e.target.value)} /></Field>
          <Field label="Report date"><input type="date" className={inputClass} value={scoreDate} onChange={e => setScoreDate(e.target.value)} /></Field>
          <Button className="mb-3" onClick={addScore}>Add Score</Button>
        </div>
        {scores.length > 0 && <div className="mt-2 space-y-2">{[...scores].reverse().slice(0, 12).map(entry => <div key={entry.id} className="flex items-center justify-between border-t border-slate-100 pt-2 text-sm"><span className="text-slate-500">{fmtDate(entry.date)} · {entry.source || "Credit report"}</span><span><strong className="text-slate-700 mr-3">{entry.score}</strong><button className="text-xs text-rose-500" onClick={() => actions.deleteCreditScore(entry.id)}>Delete</button></span></div>)}</div>}
      </Card>
    </div>
  );
}

function buildFinancialContext(data, derived) {
  const lines = [];
  lines.push(`Today's date: ${new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}.`);
  lines.push(`Net worth: ${fmtCurrency(derived.netWorth)} (assets ${fmtCurrency(derived.totalAssets)}, debt ${fmtCurrency(derived.totalDebt)}).`);
  lines.push(`Accounts: ${data.accounts.map(a => `${a.name} (${a.institution}, ${a.type}): ${fmtCurrency(a.balance)}`).join("; ") || "none"}.`);
  lines.push(`This month so far — income: ${fmtCurrency(derived.monthIncome, { decimals: false })}, expenses: ${fmtCurrency(derived.monthExpense, { decimals: false })}, savings rate: ${derived.savingsRate.toFixed(0)}%.`);
  const catLines = Object.entries(derived.spendByCategory).sort((a, b) => b[1] - a[1])
    .map(([cat, spent]) => `${cat}: spent ${fmtCurrency(spent, { decimals: false })}${data.budgets[cat] ? ` of ${fmtCurrency(data.budgets[cat], { decimals: false })} budget` : ""}`);
  lines.push(`Spending by category this month: ${catLines.join("; ") || "none yet"}.`);
  lines.push(`Safe to spend (checking balance minus remaining bills this month): ${fmtCurrency(derived.safeToSpend, { decimals: false })}.`);
  const activeSubs = data.subscriptions.filter(s => s.active);
  lines.push(`Active subscriptions/recurring bills (${activeSubs.length}): ${activeSubs.map(s => `${s.merchant} ${fmtCurrency(s.amount)}/mo (day ${s.dayOfMonth})`).join("; ") || "none"}.`);
  lines.push(`Financial wellness score: ${derived.wellnessScore}/100.`);
  if (data.goals.length > 0) {
    lines.push(`Goals: ${data.goals.map(g => `${g.name}: ${fmtCurrency(g.current, { decimals: false })} of ${fmtCurrency(g.target, { decimals: false })}`).join("; ")}.`);
  }
  const searchableTransactions = [...data.transactions].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 500);
  lines.push(`Searchable transaction register (${searchableTransactions.length} transactions, newest first): ${searchableTransactions.map(t => `${t.date} | ${t.merchant} | ${fmtCurrency(t.amount)} | ${t.category}${t.person ? " | " + t.person : ""}`).join("; ")}.`);
  return lines.join("\n");
}

async function callClaude({ apiKey, model, system, messages }) {
  if (!apiKey || !apiKey.trim()) throw new Error("Add your Anthropic API key above before using Budget AI.");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey.trim(),
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model, max_tokens: 1200, system, messages }),
  });
  let payload = null;
  try { payload = await response.json(); } catch (e) {}
  if (!response.ok) {
    const detail = payload?.error?.message || `Anthropic connection failed (${response.status}).`;
    throw new Error(detail);
  }
  const text = (payload?.content || []).filter(block => block.type === "text").map(block => block.text).join("\n").trim();
  if (!text) throw new Error("Anthropic returned an empty response. Please try again.");
  return text;
}

function isSubscriptionScanIntent(msg) {
  const m = msg.toLowerCase();
  return /subscri/.test(m) && /(scan|search|check|find|look|detect)/.test(m);
}

function SubscriptionCandidateCard({ candidate, onAdd, onIgnore, status }) {
  return (
    <div className="border border-slate-200 rounded-xl p-3 flex items-center justify-between gap-3">
      <div className="flex items-center gap-2 min-w-0">
        <MerchantAvatar merchant={candidate.merchant} category={candidate.category} size={28} />
        <div className="min-w-0">
          <div className="font-medium text-slate-700 truncate">{candidate.merchant}</div>
          <div className="text-xs text-slate-400">{fmtCurrency(candidate.amount)}/mo · seen {candidate.occurrences}x across {candidate.months} months · {candidate.category}</div>
        </div>
      </div>
      {status === "added" ? (
        <span className="text-xs text-emerald-600 font-medium shrink-0">✓ Added</span>
      ) : status === "ignored" ? (
        <span className="text-xs text-slate-400 font-medium shrink-0">Ignored</span>

        <div className="flex gap-2 shrink-0">
          <button className="text-xs text-slate-500 font-medium" onClick={onIgnore}>Ignore</button>

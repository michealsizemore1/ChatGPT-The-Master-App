const IMPORT_FIELD_LABELS = {
  date: "Date", description: "Description", amount: "Amount (signed)",
  debit: "Debit / Withdrawal", credit: "Credit / Deposit", category: "Category",
};

function ImportStatementModal({ open, onClose, data, actions }) {
  const [step, setStep] = useState("upload");
  const [accountId, setAccountId] = useState((data.accounts[0] && data.accounts[0].id) || "");
  const [fileName, setFileName] = useState("");
  const [rawRows, setRawRows] = useState([]);
  const [hasHeader, setHasHeader] = useState(true);
  const [mapping, setMapping] = useState({ date: null, description: null, amount: null, debit: null, credit: null, category: null });
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [importedCount, setImportedCount] = useState(0);
  const fileInputRef = useRef(null);

  const reset = () => {
    setStep("upload"); setFileName(""); setRawRows([]); setHasHeader(true);
    setMapping({ date: null, description: null, amount: null, debit: null, credit: null, category: null });
    setRows([]); setError(""); setImportedCount(0);
  };
  const close = () => { reset(); onClose(); };

  const openPicker = () => { setError(""); fileInputRef.current && fileInputRef.current.click(); };

  const handleFile = (file) => {
    if (!file) return;
    setError("");
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = parseCSV(String(e.target.result || ""));
        if (parsed.length === 0) { setError("That file doesn't look like a CSV — no rows found."); return; }
        setRawRows(parsed);
        setHasHeader(true);
        setMapping(guessColumnMapping(parsed[0]));
        setStep("mapping");
      } catch (err) {
        setError("Couldn't read that file. Make sure it's a CSV export from your bank or card issuer.");
      }
    };
    reader.onerror = () => setError("Couldn't read that file.");
    reader.readAsText(file);
  };

  const headers = rawRows[0] || [];
  const columnCount = headers.length;
  const mappingComplete = mapping.date != null && mapping.description != null && (mapping.amount != null || mapping.debit != null || mapping.credit != null);

  const buildReview = () => {
    const dataRows = hasHeader ? rawRows.slice(1) : rawRows;
    const existing = data.transactions;
    const built = dataRows.map((r, idx) => {
      const dateRaw = mapping.date != null ? r[mapping.date] : "";
      const desc = mapping.description != null ? r[mapping.description] : "";
      let amount = null;
      if (mapping.amount != null) {
        amount = parseAmountCell(r[mapping.amount]);
      } else {
        const debit = mapping.debit != null ? parseAmountCell(r[mapping.debit]) : null;
        const credit = mapping.credit != null ? parseAmountCell(r[mapping.credit]) : null;
        if (debit != null && debit !== 0) amount = -Math.abs(debit);
        else if (credit != null && credit !== 0) amount = Math.abs(credit);
      }
      const date = parseDateCell(dateRaw);
      const merchant = String(desc || "").trim();
      const rawCategory = mapping.category != null ? String(r[mapping.category] || "").trim() : "";
      const category = CATEGORY_META[rawCategory] ? rawCategory : guessCategoryFromRules(merchant, data.rules, amount || 0);
      const valid = !!date && !!merchant && amount != null && !isNaN(amount) && amount !== 0;
      const duplicate = valid ? isDuplicateTx({ date, merchant, amount }, existing, accountId) : false;
      return {
        key: "imp_" + idx,
        date, merchant, category,
        amount: amount == null ? "" : String(Math.abs(amount).toFixed(2)),
        direction: (amount || 0) >= 0 ? "deposit" : "withdrawal",
        include: valid && !duplicate,
        valid, duplicate,
      };
    });
    setRows(built);
    setStep("review");
  };

  const updateRow = (key, patch) => setRows(rs => rs.map(r => r.key === key ? { ...r, ...patch } : r));
  const toggleAll = (val) => setRows(rs => rs.map(r => r.valid ? { ...r, include: val } : r));

  const validRows = rows.filter(r => r.valid);
  const includedCount = rows.filter(r => r.include).length;
  const duplicateCount = rows.filter(r => r.duplicate).length;
  const invalidCount = rows.length - validRows.length;

  const doImport = () => {
    const amt = (r) => parseFloat(r.amount) || 0;
    const toImport = rows.filter(r => r.include && r.valid).map(r => ({
      id: uid(), date: r.date, accountId, merchant: r.merchant.trim(), category: r.category,
      amount: r.direction === "deposit" ? Math.abs(amt(r)) : -Math.abs(amt(r)),
      person: defaultPersonForAccount(accountId), notes: "", cleared: true, receipt: null,
    }));
    if (toImport.length === 0) { setError("Select at least one transaction to import."); return; }
    actions.importTransactions(toImport);
    setImportedCount(toImport.length);
    setStep("done");
  };

  const account = data.accounts.find(a => a.id === accountId);

  return (
    <Modal open={open} onClose={close} title="⬆ Import Statement" size="xl">
      {step === "upload" && (
        <div className="space-y-4">
          <p className="text-sm text-slate-500">Upload a CSV file exported from your bank or card issuer's online statement. You'll be able to review and edit every transaction before anything is added.</p>
          <Field label="Import into account">
            <select className={inputClass} value={accountId} onChange={e => setAccountId(e.target.value)}>
              {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </Field>
          <div className="border-2 border-dashed border-slate-200 rounded-xl p-8 text-center">
            <div className="text-3xl mb-2">📄</div>
            <input ref={fileInputRef} type="file" accept=".csv,text/csv" className="hidden" onChange={e => handleFile(e.target.files[0])} />
            <Button onClick={openPicker}>Choose CSV File…</Button>
            <p className="text-xs text-slate-400 mt-3">Most banks let you export a statement or transaction range as a .csv file from their website.</p>
          </div>
          {error && <p className="text-sm text-rose-600">{error}</p>}
        </div>
      )}

      {step === "mapping" && (
        <div className="space-y-4">
          <p className="text-sm text-slate-500">
            Loaded <span className="font-semibold text-slate-700">{fileName}</span> — {rawRows.length} row{rawRows.length === 1 ? "" : "s"}, {columnCount} column{columnCount === 1 ? "" : "s"}.
            Confirm which column is which. We guessed based on your file's headers.
          </p>
          <label className="flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" checked={hasHeader} onChange={e => setHasHeader(e.target.checked)} className="w-4 h-4 accent-indigo-600" />
            First row is a header row (not a transaction)
          </label>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {Object.keys(IMPORT_FIELD_LABELS).map(field => (
              <Field key={field} label={IMPORT_FIELD_LABELS[field] + (field === "date" || field === "description" ? " *" : "")}>
                <select
                  className={inputClass}
                  value={mapping[field] == null ? "" : mapping[field]}
                  onChange={e => setMapping(m => ({ ...m, [field]: e.target.value === "" ? null : parseInt(e.target.value, 10) }))}
                >
                  <option value="">— Not in file —</option>
                  {headers.map((h, idx) => <option key={idx} value={idx}>{h && h.trim() ? h : "Column " + (idx + 1)}</option>)}
                </select>
              </Field>
            ))}
          </div>
          <p className="text-xs text-slate-400">* Required. Provide either a single signed Amount column, or separate Debit/Credit columns.</p>
          {error && <p className="text-sm text-rose-600">{error}</p>}
          <div className="flex justify-between pt-2">
            <Button variant="secondary" onClick={() => setStep("upload")}>Back</Button>
            <Button onClick={buildReview} disabled={!mappingComplete}>Continue →</Button>
          </div>
        </div>
      )}

      {step === "review" && (
        <div className="space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <p className="text-sm text-slate-500">
              Review each transaction before importing into <span className="font-semibold text-slate-700">{account ? account.name : ""}</span>.
              {duplicateCount > 0 && <span className="text-amber-600"> {duplicateCount} possible duplicate{duplicateCount === 1 ? "" : "s"} unchecked.</span>}
              {invalidCount > 0 && <span className="text-rose-500"> {invalidCount} row{invalidCount === 1 ? "" : "s"} couldn't be parsed and will be skipped.</span>}
            </p>
            <div className="flex gap-2 shrink-0">
              <button className="text-xs text-indigo-600 font-medium" onClick={() => toggleAll(true)}>Select all</button>
              <button className="text-xs text-indigo-600 font-medium" onClick={() => toggleAll(false)}>Select none</button>
            </div>
          </div>

          <div className="overflow-x-auto border border-slate-100 rounded-xl max-h-[50vh]">
            <table className="w-full text-sm min-w-[760px]">
              <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide sticky top-0">
                <tr>
                  <th className="text-left px-2 py-2 font-medium w-8"></th>
                  <th className="text-left px-2 py-2 font-medium">Date</th>
                  <th className="text-left px-2 py-2 font-medium">Description</th>
                  <th className="text-left px-2 py-2 font-medium">Category</th>
                  <th className="text-left px-2 py-2 font-medium">Type</th>
                  <th className="text-right px-2 py-2 font-medium">Amount</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.key} className={"border-t border-slate-100 " + (!r.valid ? "opacity-40" : r.duplicate ? "bg-amber-50/50" : "")}>
                    <td className="px-2 py-2">
                      <input type="checkbox" disabled={!r.valid} checked={r.include} onChange={e => updateRow(r.key, { include: e.target.checked })} className="w-4 h-4 accent-indigo-600" />
                    </td>
                    <td className="px-2 py-2">
                      <input type="date" disabled={!r.valid} className={inputClass + " min-w-[130px]"} value={r.date} onChange={e => updateRow(r.key, { date: e.target.value })} />
                    </td>
                    <td className="px-2 py-2">
                      <input disabled={!r.valid} className={inputClass + " min-w-[160px]"} value={r.merchant} onChange={e => updateRow(r.key, { merchant: e.target.value })} />
                      {r.duplicate && <div className="text-[11px] text-amber-600 mt-0.5">Possible duplicate</div>}
                    </td>
                    <td className="px-2 py-2">
                      <select disabled={!r.valid} className={inputClass + " min-w-[150px]"} value={r.category} onChange={e => updateRow(r.key, { category: e.target.value })}>
                        {Object.keys(CATEGORY_META).map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </td>
                    <td className="px-2 py-2">
                      <select disabled={!r.valid} className={inputClass + " min-w-[110px]"} value={r.direction} onChange={e => updateRow(r.key, { direction: e.target.value })}>
                        <option value="withdrawal">Withdrawal</option>
                        <option value="deposit">Deposit</option>
                      </select>
                    </td>
                    <td className="px-2 py-2 text-right">
                      <input type="number" step="0.01" min="0" disabled={!r.valid} className={inputClass + " text-right min-w-[100px]"} value={r.amount} onChange={e => updateRow(r.key, { amount: e.target.value })} />
                    </td>
                  </tr>
                ))}
                {rows.length === 0 && (
                  <tr><td colSpan="6" className="text-center py-8 text-slate-400">No rows to review.</td></tr>
                )}
              </tbody>
            </table>
          </div>

          {error && <p className="text-sm text-rose-600">{error}</p>}
          <div className="flex justify-between pt-2">
            <Button variant="secondary" onClick={() => setStep("mapping")}>Back</Button>
            <Button onClick={doImport}>Import {includedCount} Transaction{includedCount === 1 ? "" : "s"}</Button>
          </div>
        </div>
      )}

      {step === "done" && (
        <div className="text-center py-6 space-y-3">
          <div className="text-4xl">✅</div>
          <div className="text-lg font-semibold text-slate-800">Imported {importedCount} transaction{importedCount === 1 ? "" : "s"}</div>
          <p className="text-sm text-slate-500">Added to {account ? account.name : "your account"}. You can find them in the list and edit anything if needed.</p>
          <Button onClick={close}>Done</Button>
        </div>
      )}
    </Modal>
  );
}

function SplitTransactionModal({ transaction, data, onClose, onSplit }) {
  const total = Math.abs(transaction?.amount || 0);
  const [parts, setParts] = useState([]);
  useEffect(() => {
    const nextTotal = Math.abs(transaction?.amount || 0);
    const existingSplits = transactionSplits(transaction);
    if (existingSplits.length >= 2) {
      setParts(existingSplits.map(part => ({ category: part.category, amount: Number(part.amount).toFixed(2) })));
      return;
    }
    const firstHalf = nextTotal ? Math.floor(nextTotal * 100 / 2) / 100 : 0;
    setParts([
      { category: transaction?.category || "Other", amount: firstHalf ? firstHalf.toFixed(2) : "" },
      { category: "Other", amount: nextTotal ? (nextTotal - firstHalf).toFixed(2) : "" },
    ]);
  }, [transaction]);
  const enteredTotal = parts.reduce((sum, part) => sum + (parseFloat(part.amount) || 0), 0);
  const remaining = Math.round((total - enteredTotal) * 100) / 100;
  const valid = parts.length >= 2
    && parts.every(part => part.category && (parseFloat(part.amount) || 0) > 0)
    && Math.abs(remaining) < 0.005;
  const updatePart = (index, changes) => setParts(current => current.map((part, i) => i === index ? { ...part, ...changes } : part));
  const addPart = () => setParts(current => [...current, { category: "Other", amount: remaining > 0 ? remaining.toFixed(2) : "" }]);
  const removePart = (index) => setParts(current => current.filter((_, i) => i !== index));

  return (
    <Modal open={!!transaction} onClose={onClose} title={"Split Transaction — " + (transaction?.merchant || "")}>
      <p className="text-sm text-slate-500 mb-4">Divide {fmtCurrency(total)} among two or more budget categories.</p>
      <div className="space-y-3">
        {parts.map((part, index) => (
          <div key={index} className="grid grid-cols-[minmax(0,1fr)_110px_32px] gap-2 items-end">
            <Field label={`Category ${index + 1}`}>
              <select className={inputClass} value={part.category} onChange={e => updatePart(index, { category: e.target.value })}>
                {allCategoriesFull(data).map(c => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Amount">
              <input type="number" min="0.01" step="0.01" className={inputClass} value={part.amount} onChange={e => updatePart(index, { amount: e.target.value })} />
            </Field>
            <button type="button" title="Remove category" disabled={parts.length <= 2} className="h-[42px] text-rose-500 disabled:text-slate-300" onClick={() => removePart(index)}>×</button>
          </div>
        ))}
        <button type="button" className="text-sm text-indigo-600 font-medium" onClick={addPart}>+ Add another category</button>
      </div>
      <div className={"text-sm rounded-lg px-3 py-2 my-3 " + (Math.abs(remaining) < 0.005 ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700")}>
        {Math.abs(remaining) < 0.005 ? "Split total matches the transaction." : `${remaining > 0 ? "Remaining" : "Over by"}: ${fmtCurrency(Math.abs(remaining))}`}
      </div>
      <div className="flex justify-end gap-2">
        <Button variant="secondary" onClick={onClose}>Cancel</Button>
        <Button disabled={!valid} onClick={() => onSplit(parts.map(part => ({
          category: part.category,
          amount: parseFloat(part.amount),
        })))}>Save Split</Button>
      </div>
    </Modal>
  );
}

function Transactions({ data, actions }) {
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All");
  const [acctFilter, setAcctFilter] = useState("All");
  const [personFilter, setPersonFilter] = useState("All");
  const [monthFilter, setMonthFilter] = useState("All");
  const [tagFilter, setTagFilter] = useState("All");
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [limit, setLimit] = useState(40);
  const [viewingReceipt, setViewingReceipt] = useState(null);
  const [presetAccountId, setPresetAccountId] = useState(null);
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const [importOpen, setImportOpen] = useState(false);
  const [markingSub, setMarkingSub] = useState(null);
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [bulkMoveAccountId, setBulkMoveAccountId] = useState("");
  const [splitting, setSplitting] = useState(null);
  const reviewCount = data.transactions.filter(t => t.needsReview).length;

  const toggleExpand = (id) => setExpandedIds(prev => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const expandAll = (ids) => setExpandedIds(new Set(ids));
  const collapseAll = () => setExpandedIds(new Set());

  const filtered = useMemo(() => {
    return data.transactions.filter(t => {
      if (search && !t.merchant.toLowerCase().includes(search.toLowerCase())) return false;
      if (catFilter !== "All" && !transactionHasCategory(t, catFilter)) return false;
      if (acctFilter !== "All" && t.accountId !== acctFilter) return false;
      if (personFilter !== "All" && (t.person || "Joint") !== personFilter) return false;
      if (monthFilter !== "All" && monthKey(t.date) !== monthFilter) return false;
      if (tagFilter !== "All" && !(t.tags || []).includes(tagFilter)) return false;
      return true;
    });
  }, [data.transactions, search, catFilter, acctFilter, personFilter, monthFilter, tagFilter]);

  const availableMonths = useMemo(() => [...new Set(data.transactions.map(t => monthKey(t.date)).filter(Boolean))].sort().reverse(), [data.transactions]);
  const availableTags = useMemo(() => [...new Set(data.transactions.flatMap(t => t.tags || []))].sort((a, b) => a.localeCompare(b)), [data.transactions]);

  const accountsById = Object.fromEntries(data.accounts.map(a => [a.id, a]));

  const visibleIds = filtered.slice(0, limit).map(t => t.id);
  const allVisibleSelected = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
  const toggleSelectOne = (id) => setSelectedIds(prev => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const toggleSelectAllVisible = () => setSelectedIds(prev => {
    if (allVisibleSelected) {
      const next = new Set(prev);
      visibleIds.forEach(id => next.delete(id));
      return next;
    }
    return new Set([...prev, ...visibleIds]);
  });
  const clearSelection = () => setSelectedIds(new Set());
  const applyBulkMove = () => {
    if (!bulkMoveAccountId || selectedIds.size === 0) return;
    actions.reassignTransactionsAccount([...selectedIds], bulkMoveAccountId);
    setSelectedIds(new Set());
    setBulkMoveAccountId("");
  };

  const openAdd = (accountId) => { setEditing(null); setPresetAccountId(accountId || null); setModalOpen(true); };
  const openEdit = (t) => { setEditing(t); setPresetAccountId(null); setModalOpen(true); };

  const openMarkSubscription = (t) => setMarkingSub(t);
  const closeMarkSubscription = () => setMarkingSub(null);
  const markSubPrefill = markingSub ? {
    merchant: markingSub.merchant,
    category: markingSub.category === "Transfer" ? "Subscriptions" : markingSub.category,
    amount: Math.abs(markingSub.amount),
    cadence: "Monthly",
    date: markingSub.date,
    person: markingSub.person || "Joint",
    active: true,
  } : null;
  const saveMarkedSubscription = (s) => { actions.addSubscription(s); setMarkingSub(null); };

  const save = (form) => {
    if (editing) actions.updateTransaction({ ...form, id: editing.id });
    else actions.addTransaction({ ...form, id: uid() });
    setModalOpen(false);
  };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 w-full min-w-0">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div className="flex items-center gap-2 text-left">
          <div>
            <h1 className="text-xl md:text-2xl font-bold text-slate-800">Transactions</h1>
            <p className="text-slate-500 text-sm mt-1">{filtered.length} transactions</p>
          </div>
        </div>
        <div className="grid grid-cols-2 sm:flex sm:flex-row gap-2 w-full sm:w-auto">
          <Button variant="secondary" disabled={!actions.canUndo} onClick={actions.undo} className="col-span-2 w-full sm:w-auto" title={actions.canUndo && actions.undoHistory[0] ? "Undo: " + actions.undoHistory[0].label : "No transaction changes to undo"}>↶ Undo Last Transaction Change</Button>
          <Button variant="secondary" className="w-full sm:w-auto" onClick={() => setImportOpen(true)}>⬆ Import Statement</Button>
          <Button variant="secondary" className="w-full sm:w-auto" onClick={() => exportTransactionsCSV(filtered, accountsById)}>⬇ Export CSV</Button>
          <Button className="col-span-2 w-full sm:w-auto" onClick={openAdd}>+ Add Transaction</Button>
        </div>
      </div>

      <SectionNotes section="transactions" data={data} actions={actions} />

      {reviewCount > 0 && (
        <Card className="p-4 border-amber-200 bg-amber-50/60 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div className="text-sm font-semibold text-amber-800">{reviewCount} imported transaction{reviewCount === 1 ? "" : "s"} need review</div>
            <div className="text-xs text-amber-600 mt-0.5">Confirm categories before relying on monthly reports.</div>
          </div>
          <Button variant="secondary" onClick={() => actions.markAllTransactionsReviewed()}>Mark All Reviewed</Button>
        </Card>
      )}

      <ImportStatementModal open={importOpen} onClose={() => setImportOpen(false)} data={data} actions={actions} />

/* ============================== SUBSCRIPTIONS ============================== */

const CADENCE_OPTIONS = ["Monthly", "Quarterly", "Semi-Annual", "Annual"];
const CADENCE_PER_YEAR = { Monthly: 12, Quarterly: 4, "Semi-Annual": 2, Annual: 1 };
const CADENCE_SUFFIX = { Monthly: "/mo", Quarterly: "/qtr", "Semi-Annual": " (semi-annual)", Annual: "/yr" };

function subCadence(s) { return s.cadence || "Monthly"; }
function subYearlyAmount(s) { return s.amount * (CADENCE_PER_YEAR[subCadence(s)] || 12); }
function subMonthlyEquivalent(s) { return subYearlyAmount(s) / 12; }

function subscriptionDayForMonth(s, year, month) {
  const custom = (s.billingDates || []).find(date => Number(date.month) === Number(month));
  return custom ? Number(custom.day) : Number(s.dayOfMonth) || 1;
}

// Whether a subscription actually bills in a given calendar month. Monthly ones always do.
// Quarterly/Semi-Annual/Annual ones only recur every 3/6/12 months from their last billed
// date (from priceHistory), so e.g. an Annual subscription last charged in April should only
// show on the calendar in April of each year — not every month.
function subDueInMonth(s, year, month) {
  if ((s.billingDates || []).length) return s.billingDates.some(date => Number(date.month) === Number(month));
  const cadence = subCadence(s);
  if (cadence === "Monthly") return true;
  const last = s.priceHistory && s.priceHistory.length ? s.priceHistory[s.priceHistory.length - 1].date : null;
  if (!last) return true;
  const [ly, lm] = last.split("-").map(Number);
  const interval = cadence === "Quarterly" ? 3 : cadence === "Semi-Annual" ? 6 : 12;
  const monthsDiff = (year - ly) * 12 + (month - lm);
  return ((monthsDiff % interval) + interval) % interval === 0;
}

function subscriptionScheduleLabel(s) {
  const cadence = subCadence(s);
  if ((s.billingDates || []).length) {
    const dates = [...s.billingDates].sort((a, b) => Number(a.month) - Number(b.month)).map(date => new Date(2000, Number(date.month) - 1, Number(date.day)).toLocaleDateString("en-US", { month: "short", day: "numeric" })).join(" and ");
    return `Bills twice a year · ${dates} · ${s.category}`;
  }
  if (cadence === "Monthly") {
    const today = new Date(todayISO() + "T00:00:00");
    let year = today.getFullYear();
    let month = today.getMonth() + 1;
    let day = Math.min(Number(s.dayOfMonth) || 1, daysInMonth(year, month));
    if (new Date(year, month - 1, day) < today) {
      month += 1;
      if (month > 12) { month = 1; year += 1; }
      day = Math.min(Number(s.dayOfMonth) || 1, daysInMonth(year, month));
    }
    const nextCharge = new Date(year, month - 1, day).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    return `Bills monthly · next charge ${nextCharge} · ${s.category}`;
  }
  const last = s.priceHistory && s.priceHistory.length ? s.priceHistory[s.priceHistory.length - 1].date : null;
  const cadenceText = cadence === "Quarterly" ? "quarterly" : cadence === "Semi-Annual" ? "twice a year" : "yearly";
  return `Bills ${cadenceText}${last ? " · last charged " + fmtDate(last) : ""} · ${s.category}`;
}

function subscriptionNextChargeDate(s) {
  const today = new Date(todayISO() + "T00:00:00");
  for (let offset = 0; offset <= 12; offset++) {
    const probe = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const year = probe.getFullYear();
    const month = probe.getMonth() + 1;
    if (!subDueInMonth(s, year, month)) continue;
    const day = Math.min(subscriptionDayForMonth(s, year, month), daysInMonth(year, month));
    const candidate = new Date(year, month - 1, day);
    if (candidate >= today) return candidate;
  }
  return new Date(8640000000000000);
}

function deriveSubDate(src) {
  if (!src) return todayISO();
  if (src.date) return src.date;
  if (src.priceHistory && src.priceHistory.length) return src.priceHistory[src.priceHistory.length - 1].date;
  if (src.dayOfMonth) {
    const base = new Date(todayISO() + "T00:00:00");
    const day = Math.min(src.dayOfMonth, daysInMonth(base.getFullYear(), base.getMonth() + 1));
    return isoDate(base.getFullYear(), base.getMonth() + 1, day);
  }
  return todayISO();
}

function HouseholdBillModal({ open, onClose, onSave, onDelete, initial }) {
  const blank = { merchant: "", amount: "", dayOfMonth: 1, category: "Utilities", person: "Joint" };
  const [form, setForm] = useState(blank);
  useEffect(() => {
    if (!open) return;
    setForm(initial ? { ...initial, amount: String(initial.amount || "") } : blank);
  }, [open, initial]);
  const submit = event => {
    event.preventDefault();
    const amount = Number(form.amount);
    if (!form.merchant.trim() || !Number.isFinite(amount) || amount <= 0) return;
    onSave({ ...form, id: initial ? initial.id : uid(), merchant: form.merchant.trim(), amount, dayOfMonth: Math.max(1, Math.min(31, Number(form.dayOfMonth) || 1)) });
  };
  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Household Bill" : "Add Household Bill"}>
      <form onSubmit={submit}>
        <Field label="Bill name"><input className={inputClass} placeholder="Rent, car payment, power…" value={form.merchant} onChange={e => setForm({ ...form, merchant: e.target.value })} required /></Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Expected amount ($)"><input type="number" min="0.01" step="0.01" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required /></Field>
          <Field label="Due day each month"><input type="number" min="1" max="31" className={inputClass} value={form.dayOfMonth} onChange={e => setForm({ ...form, dayOfMonth: e.target.value })} required /></Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Category"><select className={inputClass} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>{allExpenseCategories({ customCategories: [] }).map(category => <option key={category}>{category}</option>)}</select></Field>
          <Field label="Person"><select className={inputClass} value={form.person || "Joint"} onChange={e => setForm({ ...form, person: e.target.value })}>{PEOPLE.map(person => <option key={person}>{PEOPLE_META[person].icon} {person}</option>)}</select></Field>
        </div>
        <p className="text-xs text-slate-400 mb-3">Use the usual or expected amount for variable bills. You can edit it whenever the new statement arrives.</p>
        <div className="flex justify-between gap-2 mt-4">
          {initial && <Button variant="danger" type="button" onClick={() => onDelete(initial.id)}>Delete</Button>}
          <div className="flex gap-2 ml-auto"><Button variant="secondary" type="button" onClick={onClose}>Cancel</Button><Button type="submit">Save Bill</Button></div>
        </div>
      </form>
    </Modal>
  );
}

function SubscriptionModal({ open, onClose, onSave, onDelete, initial, prefill }) {
  const blank = { merchant: "", category: "Subscriptions", amount: "", cadence: "Monthly", date: todayISO(), person: "Joint", active: true, cancellationStatus: "None", cancellationRequested: "", cancellationEffective: "", cancellationConfirmation: "", cancellationRefund: "" };
  const [form, setForm] = useState(blank);

  useEffect(() => {
    if (!open) return;
    const src = initial || prefill;
    setForm(src ? {
      merchant: src.merchant || "", category: src.category || "Subscriptions",
      amount: src.amount != null ? String(Math.abs(src.amount)) : "", cadence: src.cadence || "Monthly",
      date: deriveSubDate(src), person: src.person || "Joint", active: src.active !== false,
      cancellationStatus: src.cancellationStatus || "None", cancellationRequested: src.cancellationRequested || "",
      cancellationEffective: src.cancellationEffective || "", cancellationConfirmation: src.cancellationConfirmation || "",
      cancellationRefund: src.cancellationRefund == null ? "" : String(src.cancellationRefund),
    } : blank);
  }, [open, initial, prefill]);

  const submit = (e) => {
    e.preventDefault();
    if (!form.merchant || form.amount === "" || !form.date) return;
    const amount = parseFloat(form.amount) || 0;
    const dayOfMonth = Math.min(31, Math.max(1, new Date(form.date + "T00:00:00").getDate()));
    if (initial) {
      const priceHistory = initial.priceHistory && initial.priceHistory.length ? initial.priceHistory : [{ date: form.date, amount }];
      const lastIdx = priceHistory.length - 1;
      const lastEntry = priceHistory[lastIdx];
      const nextHistory = lastEntry.amount !== amount
        ? [...priceHistory, { date: form.date, amount }]
        : priceHistory.map((h, i) => i === lastIdx ? { ...h, date: form.date } : h);
      onSave({ ...initial, ...form, amount, dayOfMonth, cancellationRefund: Number(form.cancellationRefund) || 0, priceHistory: nextHistory });
    } else {
      onSave({
        id: uid(), merchant: form.merchant, category: form.category, amount, cadence: form.cadence,
        dayOfMonth, person: form.person, active: form.active, cancellationStatus: form.cancellationStatus,
        cancellationRequested: form.cancellationRequested, cancellationEffective: form.cancellationEffective,
        cancellationConfirmation: form.cancellationConfirmation, cancellationRefund: Number(form.cancellationRefund) || 0,
        priceHistory: [{ date: form.date, amount }],
      });
    }
  };

  return (
    <Modal open={open} onClose={onClose} title={initial ? "Edit Subscription" : prefill ? "Mark as Subscription" : "Add Subscription"}>
      <form onSubmit={submit}>
        <Field label="Merchant">
          <input className={inputClass} value={form.merchant} onChange={e => setForm({ ...form, merchant: e.target.value })} required />
        </Field>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Amount ($ per charge)">
            <input type="number" step="0.01" className={inputClass} value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} required />
          </Field>
          <Field label="Cadence">
            <select className={inputClass} value={form.cadence} onChange={e => setForm({ ...form, cadence: e.target.value })}>
              {CADENCE_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Category">
            <select className={inputClass} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
              {Object.keys(CATEGORY_META).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Last billed on">
            <input type="date" className={inputClass} value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} required />
          </Field>
        </div>
        <Field label="Person">
          <select className={inputClass} value={form.person} onChange={e => setForm({ ...form, person: e.target.value })}>
            {PEOPLE.map(p => <option key={p} value={p}>{PEOPLE_META[p].icon} {p}</option>)}
          </select>
        </Field>
        <Field label="Status">
          <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" checked={form.active} onChange={e => setForm({ ...form, active: e.target.checked })} />
            Active
          </label>
        </Field>
        <Card className="p-4 bg-slate-50 mb-3">
          <div className="text-sm font-semibold text-slate-700 mb-3">Cancellation tracking</div>
          <Field label="Cancellation status">
            <select className={inputClass} value={form.cancellationStatus} onChange={e => setForm({ ...form, cancellationStatus: e.target.value })}>
              {['None', 'Considering', 'Requested', 'Confirmed', 'Refund pending', 'Complete'].map(status => <option key={status}>{status}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <Field label="Requested date"><input type="date" className={inputClass} value={form.cancellationRequested} onChange={e => setForm({ ...form, cancellationRequested: e.target.value })} /></Field>
            <Field label="Effective date"><input type="date" className={inputClass} value={form.cancellationEffective} onChange={e => setForm({ ...form, cancellationEffective: e.target.value })} /></Field>
          </div>
          <Field label="Confirmation number"><input className={inputClass} value={form.cancellationConfirmation} onChange={e => setForm({ ...form, cancellationConfirmation: e.target.value })} /></Field>

function Subscriptions({ data, actions }) {
  const [sortBy, setSortBy] = useState("next-charge");
  const active = data.subscriptions.filter(s => s.active);
  const cancelled = data.subscriptions.filter(s => !s.active);
  const cadenceOrder = { Monthly: 1, Quarterly: 2, "Semi-Annual": 3, Annual: 4 };
  const sortedActive = [...active].sort((a, b) => {
    if (sortBy === "name") return String(a.merchant || "").localeCompare(String(b.merchant || ""), undefined, { sensitivity: "base" });
    if (sortBy === "amount") return Number(b.amount || 0) - Number(a.amount || 0);
    if (sortBy === "frequency") return (cadenceOrder[subCadence(a)] || 9) - (cadenceOrder[subCadence(b)] || 9) || String(a.merchant || "").localeCompare(String(b.merchant || ""));
    return subscriptionNextChargeDate(a) - subscriptionNextChargeDate(b) || String(a.merchant || "").localeCompare(String(b.merchant || ""));
  });
  const monthlyTotal = active.reduce((s, x) => s + subMonthlyEquivalent(x), 0);
  const yearlyTotal = active.reduce((s, x) => s + subYearlyAmount(x), 0);

  const priceIncreases = active.filter(s => s.priceHistory.length > 1);
  const cancelledYearlySavings = cancelled.reduce((s, x) => s + subYearlyAmount(x), 0);
  const cancelledMonthlySavings = cancelledYearlySavings / 12;
  const renewalToday = new Date(todayISO() + "T00:00:00");
  const upcomingRenewals = active.map(s => {
    const next = subscriptionNextChargeDate(s);
    return { subscription: s, next, days: Math.ceil((next - renewalToday) / 86400000) };
  }).filter(item => item.days >= 0 && item.days <= 60).sort((a, b) => a.days - b.days);

  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [billModalOpen, setBillModalOpen] = useState(false);
  const [editingBill, setEditingBill] = useState(null);
  const openAdd = () => { setEditing(null); setModalOpen(true); };
  const openEdit = (s) => { setEditing(s); setModalOpen(true); };
  const closeModal = () => setModalOpen(false);
  const saveSub = (s) => {
    if (editing) actions.updateSubscription(s);
    else actions.addSubscription(s);
    setModalOpen(false);
  };
  const deleteSub = (id) => {
    actions.deleteSubscription(id);
    setModalOpen(false);
  };
  const openAddBill = () => { setEditingBill(null); setBillModalOpen(true); };
  const openEditBill = bill => { setEditingBill(bill); setBillModalOpen(true); };
  const saveBill = bill => { if (editingBill) actions.updateRecurringBill(bill); else actions.addRecurringBill(bill); setBillModalOpen(false); };
  const deleteBill = id => { actions.deleteRecurringBill(id); setBillModalOpen(false); };

  return (
    <div className="px-2 py-4 sm:p-4 md:p-8 space-y-5 md:space-y-6 w-full min-w-0">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-slate-800">Subscriptions &amp; Bills</h1>
          <p className="text-slate-500 text-sm mt-1">Recurring charges detected across your accounts.</p>
        </div>
        <div className="grid grid-cols-2 gap-2"><Button variant="secondary" className="shrink-0" onClick={openAddBill}>+ Add Bill</Button><Button className="shrink-0" onClick={openAdd}>+ Add Subscription</Button></div>
      </div>

      <SectionNotes section="subscriptions" data={data} actions={actions} />

      <Card className="p-5">
        <div className="flex items-center justify-between gap-3 mb-1"><h3 className="font-semibold text-slate-700">Household Bills</h3><span className="text-xs text-slate-400">{(data.recurringBills || []).length} saved</span></div>
        <p className="text-xs text-slate-400 mb-4">Rent, loans, power, water, telephone, insurance, and other monthly bills shown on the Dashboard and Cash Flow calendar.</p>
        <div className="space-y-3">
          {(data.recurringBills || []).slice().sort((a, b) => Number(a.dayOfMonth) - Number(b.dayOfMonth)).map(bill => (
            <button type="button" key={bill.id} onClick={() => openEditBill(bill)} className="w-full text-left flex items-center justify-between gap-3 border-b border-slate-100 pb-3 last:border-0">
              <div className="min-w-0"><div className="text-sm font-medium text-slate-700 truncate">{bill.merchant}</div><div className="text-xs text-slate-400">Due monthly on day {bill.dayOfMonth} · {bill.category || "Other"}</div></div>
              <div className="text-sm font-semibold text-slate-700 shrink-0">{fmtCurrency(bill.amount)}</div>
            </button>
          ))}
          {(data.recurringBills || []).length === 0 && <div className="rounded-xl bg-amber-50 p-4 text-sm text-amber-700">No ordinary household bills are saved yet. Choose <strong>+ Add Bill</strong> to add rent, the car payment, and utilities.</div>}
        </div>
      </Card>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5">
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Active Subscriptions</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{active.length}</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Monthly Cost</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(monthlyTotal)}</div>
          <div className="text-xs text-slate-400 font-medium mt-1">Averaged across cadences</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Projected Yearly Cost</div>
          <div className="text-2xl font-bold text-slate-800 mt-1">{fmtCurrency(yearlyTotal, { decimals: false })}</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs font-medium text-slate-400 uppercase tracking-wide">Saved by Cancelling</div>
          <div className="text-2xl font-bold text-emerald-600 mt-1">{fmtCurrency(cancelledMonthlySavings)}/mo</div>
          <div className="text-xs text-slate-400 font-medium mt-1">{fmtCurrency(cancelledYearlySavings, { decimals: false })}/yr</div>
        </Card>
      </div>

      {priceIncreases.length > 0 && (
        <Card className="p-5 border-amber-200 bg-amber-50/50">
          <h3 className="font-semibold text-amber-800 text-sm mb-2">⚠️ Price increases detected</h3>
          {priceIncreases.map(s => {
            const prev = s.priceHistory[s.priceHistory.length - 2];
            const cur = s.priceHistory[s.priceHistory.length - 1];
            return (
              <div key={s.id} className="text-sm text-amber-700">
                {s.merchant} increased from {fmtCurrency(prev.amount)} to {fmtCurrency(cur.amount)}{CADENCE_SUFFIX[subCadence(s)]} on {fmtDate(cur.date)}.
              </div>
            );
          })}
        </Card>
      )}

      <Card className="p-5">
        <h3 className="font-semibold text-slate-700 mb-1">Upcoming renewals</h3>
        <p className="text-xs text-slate-400 mb-3">Charges expected during the next 60 days. Tap one to edit or track a cancellation.</p>
        <div className="space-y-3">
          {upcomingRenewals.map(({ subscription: s, next, days }) => (
            <button type="button" key={s.id} onClick={() => openEdit(s)} className="w-full text-left flex items-center justify-between gap-3 border-b border-slate-100 pb-3 last:border-0">
              <div className="min-w-0"><div className="text-sm font-medium text-slate-700 truncate">{s.merchant}</div><div className="text-xs text-slate-400">{next.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} · {days === 0 ? 'today' : 'in ' + days + ' days'}</div></div>
              <div className="text-sm font-semibold text-slate-700 shrink-0">{fmtCurrency(s.amount)}</div>
            </button>
          ))}
          {upcomingRenewals.length === 0 && <div className="text-sm text-slate-400">No renewals due within 60 days.</div>}
        </div>
      </Card>

      <Card className="p-6">
        <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
          <h3 className="font-semibold text-slate-700">Active</h3>
          <select className="text-xs font-medium text-indigo-600 border border-indigo-100 bg-white rounded-lg px-3 py-2" value={sortBy} onChange={event => setSortBy(event.target.value)} aria-label="Sort active subscriptions">
            <option value="next-charge">Sort: Next charge</option>
            <option value="name">Sort: Name A–Z</option>
            <option value="amount">Sort: Amount high–low</option>
            <option value="frequency">Sort: Billing frequency</option>
          </select>
        </div>
        <div className="space-y-3">
          {sortedActive.map(s => (
            <div key={s.id} className="flex items-center flex-wrap gap-y-2 justify-between border-b border-slate-50 pb-3 last:border-0 last:pb-0">
              <div className="flex items-center gap-3 min-w-0">
                <MerchantAvatar merchant={s.merchant} category={s.category} size={40} />
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-700 truncate">{s.merchant}</div>
                  <div className="text-xs text-slate-400 truncate">{subscriptionScheduleLabel(s)}</div>
                  {s.cancellationStatus && s.cancellationStatus !== 'None' && <div className="text-xs text-amber-600 mt-0.5">Cancellation: {s.cancellationStatus}{s.cancellationEffective ? ' · effective ' + fmtDate(s.cancellationEffective) : ''}</div>}
                </div>
              </div>
              <div className="flex items-center gap-4 shrink-0">
                <div className="text-sm font-semibold text-slate-700">{fmtCurrency(s.amount)}{CADENCE_SUFFIX[subCadence(s)]}</div>
                <button className="text-xs text-indigo-600 font-medium" onClick={() => openEdit(s)}>Edit</button>
                <button className="text-xs text-rose-500 font-medium" onClick={() => actions.toggleSubscription(s.id)}>Cancel</button>
              </div>
            </div>
          ))}
          {active.length === 0 && <p className="text-sm text-slate-400">No active subscriptions yet.</p>}
        </div>
      </Card>

      {cancelled.length > 0 && (
        <Card className="p-6">
          <h3 className="font-semibold text-slate-700 mb-4">Cancelled</h3>
          <div className="space-y-3">
            {cancelled.map(s => (
              <div key={s.id} className="flex items-center flex-wrap gap-y-2 justify-between opacity-60">
                <div className="flex items-center gap-3 min-w-0">
                  <MerchantAvatar merchant={s.merchant} category={s.category} size={40} />
                  <div className="text-sm font-medium text-slate-700 line-through truncate">{s.merchant}</div>
                </div>
                <div className="flex items-center gap-4 shrink-0">
                  <button className="text-xs text-indigo-600 font-medium" onClick={() => openEdit(s)}>Edit</button>
                  <button className="text-xs text-indigo-600 font-medium" onClick={() => actions.toggleSubscription(s.id)}>Reactivate</button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}

      <SubscriptionModal open={modalOpen} onClose={closeModal} onSave={saveSub} onDelete={deleteSub} initial={editing} />
      <HouseholdBillModal open={billModalOpen} onClose={() => setBillModalOpen(false)} onSave={saveBill} onDelete={deleteBill} initial={editingBill} />
    </div>
  );
}

function BillCalendar({ year, month, items, todayDay, onDayClick }) {
  const dim = daysInMonth(year, month);
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(d);
  const itemsByDay = {};
  items.forEach(it => { itemsByDay[it.dayOfMonth] = itemsByDay[it.dayOfMonth] || []; itemsByDay[it.dayOfMonth].push(it); });

  return (
    <div className="overflow-x-auto">
      <div className="grid grid-cols-7 gap-1.5 md:gap-2 text-xs min-w-[560px]">
        {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => <div key={d} className="text-center font-medium text-slate-400 pb-1">{d}</div>)}
        {cells.map((d, i) => {
          const dayItems = d ? (itemsByDay[d] || []) : [];
          return (
            <button
              key={i}
              type="button"
              disabled={!d}
              onClick={() => d && onDayClick(d, dayItems)}
              className={"min-h-[84px] rounded-lg border p-1.5 text-left align-top block w-full " + (d ? "hover:border-indigo-300 hover:shadow-sm cursor-pointer transition-all " : "cursor-default ") + (d === todayDay ? "border-indigo-400 bg-indigo-50" : "border-slate-100")}
            >
              {d && <div className={"text-[11px] font-semibold " + (d === todayDay ? "text-indigo-600" : "text-slate-400")}>{d}</div>}
              {d && dayItems.slice(0, 3).map((it, idx) => (
                <div
                  key={idx}
                  title={it.merchant + " · " + fmtCurrency(it.amount) + (it.paid ? " · Paid" : "")}
                  className={"mt-0.5 truncate rounded px-1 py-0.5 flex items-center gap-0.5 " + (it.income ? "bg-emerald-50 text-emerald-700" : it.paid ? "bg-slate-100 text-slate-400 line-through" : "bg-rose-50 text-rose-700")}
                >
                  {!it.income && it.paid && <span className="shrink-0">✓</span>}
                  <span className="truncate">{it.income ? "+" : "-"}${Math.round(Math.abs(it.amount))} {it.merchant}</span>
                </div>
              ))}
              {d && dayItems.length > 3 && (
                <div className="text-[10px] text-slate-400 mt-0.5">+{dayItems.length - 3} more — tap to see all</div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

  const bills = items.filter(it => !it.income);

  const [labelYear, labelMonth] = (monthKey || "").split("-").map(Number);
  const dateLabel = day && labelYear ? new Date(labelYear, labelMonth - 1, day).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) : "";
  return (
    <Modal open={open} onClose={onClose} title={dateLabel}>
      <div className="space-y-4">
        {items.length === 0 && <p className="text-sm text-slate-400">Nothing scheduled on this day.</p>}
        {bills.length > 0 && (
          <div>
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Bills &amp; Subscriptions</div>
            <div className="space-y-2">
              {bills.map((b, i) => (
                <label key={b.id || i} className={"flex items-center justify-between gap-3 rounded-lg border px-3 py-2.5 cursor-pointer " + (b.paid ? "border-emerald-200 bg-emerald-50/50" : "border-slate-200")}>
                  <div className="flex items-center gap-3 min-w-0">
                    <input
                      type="checkbox"

                      className="w-4 h-4 accent-emerald-600 shrink-0"

                      <div className={"text-sm font-medium truncate " + (b.paid ? "text-slate-400 line-through" : "text-slate-700")}>{b.merchant}</div>
                      {b.category && <div className="text-xs text-slate-400">{b.category}</div>}

                  <div className={"text-sm font-semibold shrink-0 " + (b.paid ? "text-slate-400" : "text-rose-600")}>{fmtCurrency(b.amount)}</div>

              ))}

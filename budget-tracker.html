function CindyCreditCardRegister({ data, actions, cindyAccount }) {
  const blankForm = { id: null, date: todayISO(), desc: "", amount: "", category: EXPENSE_CATEGORIES[0], regType: "expense", who: "Cynthia", tripId: "", tags: "", receipt: null };
  const [form, setForm] = useState(blankForm);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All");
  const [typeFilter, setTypeFilter] = useState("All");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");
  const [unclearedFirst, setUnclearedFirst] = useState(false);
  const [dateSort, setDateSort] = useState(() => localStorage.getItem("register_date_sort_" + cindyAccount.id) || "desc");
  const [descriptionSort, setDescriptionSort] = useState(null);
  const [notes, setNotes] = useState(data.cindyRegisterNotes || "");
  const [viewingReceipt, setViewingReceipt] = useState(null);
  const [splitting, setSplitting] = useState(null);
  const editFormRef = useRef(null);

  const allTx = useMemo(
    () => data.transactions.filter(t => t.accountId === cindyAccount.id || isIccuCreditTransaction(t, data.accounts)),
    [data.transactions, data.accounts, cindyAccount.id]
  );

  const applyBalance = (nextList) => {
    const bal = Math.round(nextList.reduce((s, t) => s + t.amount, 0) * 100) / 100;
    actions.syncAccountBalance({ ...cindyAccount, balance: bal });
  };

  const balanceById = useMemo(() => {
    const chron = [...allTx].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let running = 0;
    const map = {};
    chron.forEach(t => { running += -t.amount; map[t.id] = Math.round(running * 100) / 100; });
    return map;
  }, [allTx]);

  const rawAmountOwed = -allTx.reduce((s, t) => s + Number(t.amount || 0), 0);
  const totalOwed = rawAmountOwed;
  const totalCharges = allTx.filter(t => Number(t.amount || 0) < 0).reduce((s, t) => s + Math.abs(Number(t.amount || 0)), 0);
  const paymentsAndReturns = allTx.filter(t => Number(t.amount || 0) > 0).reduce((s, t) => s + Number(t.amount || 0), 0);
  const pendingBalance = -allTx.filter(t => t.cleared === false).reduce((s, t) => s + Number(t.amount || 0), 0);

  const filtered = useMemo(() => {
    return allTx.filter(t => {
      if (search && ![t.merchant, t.notes, ...(t.tags || [])].join(" ").toLowerCase().includes(search.toLowerCase())) return false;
      if (catFilter !== "All" && !transactionHasCategory(t, catFilter)) return false;
      if (typeFilter !== "All" && cindyRegType(t) !== typeFilter) return false;
      if (fromDate && t.date < fromDate) return false;
      if (toDate && t.date > toDate) return false;
      return true;
    });
  }, [allTx, search, catFilter, typeFilter, fromDate, toDate]);
  const filteredCategoryTotal = catFilter === "All"
    ? 0
    : filtered.reduce((sum, t) => sum + transactionCategoryAmount(t, catFilter), 0);
  const filteredTransactionTotal = catFilter === "All"
    ? filtered.reduce((sum, t) => sum + Math.abs(t.amount), 0)
    : filteredCategoryTotal;
  const hasActiveTransactionFilter = !!(search || catFilter !== "All" || typeFilter !== "All" || fromDate || toDate);

  const sorted = useMemo(() => {
    const byDateDesc = [...filtered].sort((a, b) => {
      if (descriptionSort) {
        const comparison = String(a.merchant || "").localeCompare(String(b.merchant || ""), undefined, { sensitivity: "base" });
        return descriptionSort === "asc" ? comparison : -comparison;
      }
      const comparison = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return dateSort === "asc" ? comparison : -comparison;
    });
    if (!unclearedFirst) return byDateDesc;
    return [...byDateDesc.filter(t => t.cleared === false), ...byDateDesc.filter(t => t.cleared !== false)];
  }, [filtered, unclearedFirst, descriptionSort, dateSort]);

  const resetForm = () => setForm(blankForm);

  const startDraftSplit = () => {
    const amt = parseFloat(form.amount);
    if (!form.desc.trim() || isNaN(amt) || amt <= 0 || !form.date) return;
    const category = form.regType === "payment" ? "Transfer" : form.category;
    const amount = form.regType === "expense" ? -Math.abs(amt) : Math.abs(amt);
    const existing = form.id ? allTx.find(t => t.id === form.id) : null;
    setSplitting({
      ...(existing || {}),
      id: existing?.id || uid(), date: form.date, merchant: form.desc.trim(), amount, category,
      accountId: cindyAccount.id, person: form.who, tripId: form.tripId || "", tags: form.tags.split(",").map(tag => tag.trim()).filter(Boolean), receipt: form.receipt || null,
      cleared: existing ? existing.cleared : false, isDraftSplit: !existing,
    });
  };

  const saveSplit = (parts) => {
    if (splitting?.isDraftSplit) {
      actions.addSplitTransactions(splitting, parts);
      applyBalance([...allTx, splitting]);
      resetForm();
    } else {
      actions.splitTransaction(splitting, parts);
      applyBalance(allTx.map(t => t.id === splitting.id ? splitting : t));
      if (form.id === splitting.id) resetForm();
    }
    setSplitting(null);
  };

  const startEdit = (t) => {
    setForm({
      id: t.id, date: t.date, desc: t.merchant, amount: String(Math.abs(t.amount)),
      category: t.category === "Transfer" ? EXPENSE_CATEGORIES[0] : t.category,
      regType: cindyRegType(t), who: t.person || "Cynthia", tripId: t.tripId || "", tags: (t.tags || []).join(", "), receipt: t.receipt || null,
    });
    if (editFormRef.current && typeof editFormRef.current.scrollIntoView === "function") editFormRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const submit = () => {
    const amt = parseFloat(form.amount);
    if (!form.desc.trim() || isNaN(amt) || amt <= 0 || !form.date) return;
    const category = form.regType === "payment" ? "Transfer" : form.category;
    const amount = form.regType === "expense" ? -Math.abs(amt) : Math.abs(amt);
    const existing = form.id ? allTx.find(t => t.id === form.id) : null;
    const payload = {
      id: form.id || uid(), date: form.date, accountId: cindyAccount.id, merchant: form.desc.trim(),
      category, amount, person: form.who, tripId: form.tripId || "", tags: form.tags.split(",").map(tag => tag.trim()).filter(Boolean), notes: existing ? (existing.notes || "") : "",
      cleared: existing ? existing.cleared : false, checkedOff: existing ? !!existing.checkedOff : false, receipt: form.receipt || null,
    };
    if (form.id) {
      actions.updateTransaction(payload);
      applyBalance(allTx.map(t => t.id === payload.id ? payload : t));
    } else {
      actions.addTransaction(payload);
      applyBalance([...allTx, payload]);
    }
    resetForm();
  };

  const toggleCleared = (t) => actions.updateTransaction({ ...t, cleared: t.cleared === false ? true : false });
  const toggleCheckedOff = (t) => actions.updateTransaction({ ...t, checkedOff: !t.checkedOff });

  const removeTx = (id) => {
    if (!window.confirm("Delete this transaction?")) return;
    actions.deleteTransaction(id);
    applyBalance(allTx.filter(t => t.id !== id));
    if (form.id === id) resetForm();
  };

  const clearAll = () => {
    if (!window.confirm(`Mark all ${allTx.length} transactions as cleared?`)) return;
    allTx.forEach(t => { if (t.cleared === false) actions.updateTransaction({ ...t, cleared: true }); });
  };

  const saveNotes = (val) => { setNotes(val); actions.setCindyNotes(val); };

  const attachReceipt = async (file) => {
    if (!file) return;
    try { const dataUrl = await fileToCompressedDataUrl(file); setForm(f => ({ ...f, receipt: dataUrl })); } catch (e) {}
  };

  const clearFilters = () => { setSearch(""); setCatFilter("All"); setTypeFilter("All"); setFromDate(""); setToDate(""); };
  const accountsById = { [cindyAccount.id]: cindyAccount };

  return (
    <Card className="overflow-hidden">
      <div className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-5 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-xl shrink-0">💳</div>
          <div>
            <div className="font-bold text-lg leading-tight">Checking, Savings &amp; Credit Registers</div>
            <div className="text-xs text-indigo-100">{cindyAccount.name} · {cindyAccount.institution}</div>
          </div>
        </div>
        <div className="text-xs text-indigo-100 uppercase tracking-wide">Transaction Register</div>
      </div>

      <div className="p-4 md:p-5 space-y-5">
        <div className="grid grid-cols-2 gap-3">
          <RegStat label="Card Balance" value={fmtCurrency(totalOwed)} tone={totalOwed < 0 ? "emerald" : "slate"} />
          <RegStat label="Charges" value={fmtCurrency(totalCharges)} tone="rose" />
          <RegStat label="Payments & Returns" value={fmtCurrency(paymentsAndReturns)} tone="indigo" />
          <RegStat label="Pending" value={fmtCurrency(pendingBalance)} tone="amber" />
        </div>

        <div ref={editFormRef} className={"border rounded-xl p-3 md:p-4 transition-colors " + (form.id ? "border-indigo-300 bg-indigo-50/40 ring-2 ring-indigo-100" : "border-slate-200")}>
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">{form.id ? "✏️ Editing Transaction" : "Add Transaction"}</div>
          <div className="grid grid-cols-2 lg:grid-cols-12 gap-3 items-start">
            <div className="col-span-2 lg:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Date</label>
              <input type="date" className={inputClass} value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
            </div>
            <div className="col-span-2 lg:col-span-4">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Description</label>
              <input placeholder="Description" className={inputClass} value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} />
              <Button variant="secondary" disabled={!form.desc.trim() || !(parseFloat(form.amount) > 0) || !form.date} className="text-xs px-3 py-2 mt-2 w-full sm:w-auto" onClick={startDraftSplit}>Split Transaction</Button>
            </div>
            <div className="col-span-1 lg:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Expense amount</label>
              <input type="number" step="0.01" min="0" placeholder="$0.00" className={inputClass} value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
            </div>
            <div className="col-span-1 lg:col-span-4">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Category</label>
              <select className={inputClass} disabled={form.regType === "payment"} value={form.regType === "payment" ? "Transfer" : form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                {(form.regType === "payment" ? ["Transfer"] : allExpenseCategories(data)).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div className="hidden sm:flex items-center gap-2 mt-2">
                <AddCategoryButton data={data} actions={actions} showLabel={true} allowDelete={true} onAdded={category => setForm(f => ({ ...f, category }))} onDeleted={category => setForm(f => ({ ...f, category: f.category === category ? "Other" : f.category }))} />
                <button type="button" title="Attach receipt" className="w-9 h-9 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 shrink-0" onClick={() => document.getElementById("cindy-receipt-input").click()}>📎</button>
                <input id="cindy-receipt-input" type="file" accept="image/*" capture="environment" className="hidden" onChange={e => attachReceipt(e.target.files[0])} />
                {form.receipt && <button type="button" className="text-xs text-indigo-600" onClick={() => setViewingReceipt(form.receipt)}>view</button>}
              </div>
            </div>
          </div>

          <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Trip</label><select className={inputClass} value={form.tripId || ""} onChange={e => setForm(f => ({ ...f, tripId: e.target.value }))}><option value="">Not part of a trip</option>{(data.trips || []).map(trip => <option key={trip.id} value={trip.id}>{trip.name}</option>)}</select></div>
            <div><label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Tags</label><input className={inputClass} placeholder="Vacation, Tax, Reimbursable" value={form.tags} onChange={e => setForm(f => ({ ...f, tags: e.target.value }))} /></div>
          </div>
          <div className="sm:hidden mt-3 flex flex-wrap items-center gap-2">
            <label className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium cursor-pointer">📷 Take Receipt Photo<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => attachReceipt(e.target.files[0])} /></label>
            <label className="px-3 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-medium cursor-pointer">🖼 Choose Photo<input type="file" accept="image/*" className="hidden" onChange={e => attachReceipt(e.target.files[0])} /></label>
            {form.receipt && <button type="button" className="text-xs text-indigo-600 font-medium" onClick={() => setViewingReceipt(form.receipt)}>View receipt</button>}
          </div>

          <div className="flex flex-wrap items-center gap-3 mt-3">
            <div className="flex w-full sm:w-auto rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              {["expense", "return", "payment"].map(rt => (
                <button
                  key={rt} type="button"
                  onClick={() => setForm(f => ({ ...f, regType: rt }))}
                  className={"flex-1 sm:flex-none px-3 py-2 " + (form.regType === rt
                    ? (rt === "expense" ? "bg-rose-600 text-white" : rt === "return" ? "bg-emerald-600 text-white" : "bg-indigo-600 text-white")
                    : "bg-white text-slate-500 hover:bg-slate-50")}
                >{CINDY_TYPE_META[rt].label.toUpperCase()}</button>
              ))}
            </div>
            <div className="flex w-full sm:w-auto rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              {[{ v: "Michael", label: "🧔 ME" }, { v: "Cynthia", label: "👩 WIFE" }, { v: "Joint", label: "🤝 JOINT" }].map(opt => (
                <button
                  key={opt.v} type="button"
                  onClick={() => setForm(f => ({ ...f, who: opt.v }))}
                  className={"flex-1 sm:flex-none px-3 py-2 " + (form.who === opt.v ? "bg-slate-800 text-white" : "bg-white text-slate-500 hover:bg-slate-50")}
                >{opt.label}</button>
              ))}
            </div>
            <div className="flex w-full sm:w-auto flex-wrap items-center justify-end gap-2 sm:ml-auto">
              {form.id && <button type="button" className="text-xs text-slate-500 font-medium" onClick={resetForm}>Cancel</button>}
              <div className="sm:hidden">
                <AddCategoryButton data={data} actions={actions} showLabel={true} allowDelete={true} onAdded={category => setForm(f => ({ ...f, category }))} onDeleted={category => setForm(f => ({ ...f, category: f.category === category ? "Other" : f.category }))} />
              </div>
              <Button className="text-xs px-4 py-2" onClick={submit}>{form.id ? "Update" : "+ Add"}</Button>
            </div>
          </div>
        </div>

        <div className="rounded-xl border border-slate-100 bg-slate-50/60 p-3">
          <div className="grid grid-cols-2 md:grid-cols-12 gap-2">
            <div className="col-span-2 md:col-span-3">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Search description</label>
              <input placeholder="Merchant or description…" className={inputClass} value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="col-span-1 md:col-span-3">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Category</label>
              <select className={inputClass} value={catFilter} onChange={e => setCatFilter(e.target.value)}>
                <option value="All">All Categories</option>
                {allExpenseCategories(data).concat(["Transfer"]).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="col-span-1 md:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Type</label>
              <select className={inputClass} value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>
                <option value="All">All Types</option>
                <option value="expense">Expense</option>
                <option value="return">Return</option>
                <option value="payment">Payment</option>
              </select>
            </div>
            <div className="col-span-1 md:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">From</label>
              <input type="date" className={inputClass} value={fromDate} onChange={e => setFromDate(e.target.value)} />
            </div>
            <div className="col-span-1 md:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">To</label>
              <input type="date" className={inputClass} value={toDate} onChange={e => setToDate(e.target.value)} />
            </div>
          </div>
          {hasActiveTransactionFilter && (
            <div className="mt-3 rounded-xl border-2 border-indigo-300 bg-indigo-50 px-4 py-3 flex items-center justify-between gap-3">
              <div>
                <div className="text-xs font-semibold uppercase tracking-wide text-indigo-500">Filtered transactions total</div>
                <div className="text-sm font-medium text-indigo-800 mt-0.5">
                  {search ? `Description: ${search}` : catFilter !== "All" ? catFilter : typeFilter !== "All" ? typeFilter : "Selected dates"} · {filtered.length} transaction{filtered.length === 1 ? "" : "s"}
                </div>
              </div>
              <div className="text-xl md:text-2xl font-bold text-indigo-800 shrink-0">{fmtCurrency(filteredTransactionTotal)}</div>
            </div>
          )}
          <div className="flex items-center justify-end gap-3 mt-3 flex-wrap">
            <div className="flex items-center gap-2 ml-auto">
              {(search || catFilter !== "All" || typeFilter !== "All" || fromDate || toDate) && (
                <button className="text-xs text-indigo-600 font-medium px-3 py-2" onClick={clearFilters}>Clear filters</button>
              )}
              <Button variant="secondary" className="text-xs px-3 py-2" onClick={() => exportTransactionsCSV(sorted, accountsById)}>⬇ Export CSV</Button>
            </div>
          </div>
        </div>

        <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs font-semibold text-amber-800">📝 NOTES</span>
            <span className="text-xs text-amber-600">auto-saved</span>
          </div>
          <textarea
            className="w-full bg-transparent text-sm text-amber-900 placeholder-amber-400 focus:outline-none resize-none"
            rows={2} placeholder="Add a note for this register..."
            value={notes} onChange={e => saveNotes(e.target.value)}
          />
        </div>

        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="text-sm font-semibold text-slate-700">Transactions <span className="text-slate-400 font-normal">({sorted.length})</span></div>
          <div className="flex gap-2 flex-wrap">
            <button
              onClick={() => setUnclearedFirst(u => !u)}
              className={"text-xs font-medium px-3 py-1.5 rounded-lg border " + (unclearedFirst ? "bg-amber-100 border-amber-300 text-amber-800" : "border-slate-200 text-slate-500 hover:bg-slate-50")}
            >⚠ Uncleared First</button>
            <button className="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" onClick={clearAll}>Clear All</button>
          </div>
        </div>

        <div className="overflow-x-auto border border-slate-100 rounded-xl">
          <table className="w-full text-sm min-w-[720px]">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
              <tr>
                <th className="text-left px-3 py-3 font-medium w-16"></th>
                <th className="text-left px-3 py-3 font-medium">
                  <button type="button" className="hover:text-indigo-600" title={dateSort === "asc" ? "Oldest transactions first" : "Newest transactions first"} onClick={() => { const next = dateSort === "desc" ? "asc" : "desc"; setDateSort(next); setDescriptionSort(null); localStorage.setItem("register_date_sort_" + cindyAccount.id, next); }}>
                    Date {descriptionSort ? "↕" : dateSort === "asc" ? "↑" : "↓"}
                  </button>
                </th>
                <th className="text-left px-3 py-3 font-medium">
                  <button type="button" className="hover:text-indigo-600" onClick={() => setDescriptionSort(current => current === "asc" ? "desc" : "asc")}>
                    Description {descriptionSort === "asc" ? "↑" : descriptionSort === "desc" ? "↓" : "↕"}
                  </button>
                </th>
                <th className="text-left px-3 py-3 font-medium">Category</th>
                <th className="text-left px-3 py-3 font-medium">Type</th>
                <th className="text-right px-3 py-3 font-medium">Balance</th>
                <th className="px-3 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(t => {
                const rt = cindyRegType(t);
                const isCleared = t.cleared !== false;
                const debtAmount = rt === "expense" ? Math.abs(t.amount) : -Math.abs(t.amount);
                return (
                  <tr key={t.id} className={"border-t border-slate-100 hover:bg-slate-50 group " + (isCleared ? "" : "bg-amber-50/40")}>
                    <td className="px-3 py-3">
                      <div className="flex items-center gap-2">
                        <input type="checkbox" checked={!!t.checkedOff} onChange={() => toggleCheckedOff(t)} title={t.checkedOff ? "Checked off" : "Check off without moving"} aria-label="Check off transaction without moving it" className="w-4 h-4 accent-emerald-600" />
                        <input type="checkbox" checked={isCleared} onChange={() => toggleCleared(t)} title={isCleared ? "Cleared" : "Uncleared"} aria-label="Cleared transaction" className="w-4 h-4 accent-indigo-600" />
                      </div>
                    </td>
                    <td className="px-3 py-3 text-slate-500 whitespace-nowrap">{fmtDateShort(t.date)}</td>
                    <td className="px-3 py-3 font-medium text-slate-700">
                      <div className="flex items-center gap-2">
                        <MerchantAvatar merchant={t.merchant} category={t.category} size={24} />
                        <div className="min-w-0 flex-1">
                          <div>{t.merchant}</div>
                          {(t.tags || []).length > 0 && <div className="text-[10px] text-indigo-500 font-medium">{t.tags.map(tag => "#" + tag).join(" ")}</div>}
                          <div className={"text-xs font-semibold " + (debtAmount > 0 ? "text-rose-600" : "text-emerald-600")}>
                            {debtAmount > 0 ? "+" : "-"}{fmtCurrency(Math.abs(debtAmount))}
                          </div>
                        </div>
                        {t.receipt && (
                          <button type="button" title="View receipt" className="w-8 shrink-0 text-center text-slate-400 hover:text-indigo-600" onClick={() => setViewingReceipt(t.receipt)}>📎</button>
                        )}
                      </div>
                    </td>
                    <td className="px-3 py-3"><Pill tone="slate">{transactionCategoryLabel(t)}</Pill></td>
                    <td className="px-3 py-3"><Pill tone={CINDY_TYPE_META[rt].tone}>{CINDY_TYPE_META[rt].short}</Pill></td>
                    <td className="px-3 py-3 text-right font-semibold text-slate-700 whitespace-nowrap">{fmtCurrency(balanceById[t.id] ?? 0)}</td>
                    <td className="px-3 py-3 text-right opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity whitespace-nowrap">
                      <button className="text-slate-400 hover:text-indigo-600 mr-2" title="Split transaction" onClick={() => setSplitting(t)}>Split</button>
                      <button className="text-slate-400 hover:text-indigo-600 mr-2" title="Edit" onClick={() => startEdit(t)}>✏️</button>
                      <button className="text-slate-400 hover:text-rose-500" title="Delete" onClick={() => removeTx(t.id)}>✕</button>
                    </td>
                  </tr>
                );
              })}
              {sorted.length === 0 && (
                <tr><td colSpan="7" className="text-center py-10 text-slate-400">No transactions match your filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={!!viewingReceipt} onClose={() => setViewingReceipt(null)} title="Receipt">
        {viewingReceipt && <img src={viewingReceipt} className="w-full rounded-lg" alt="Receipt" />}
      </Modal>
      <SplitTransactionModal
        transaction={splitting}
        data={data}
        onClose={() => setSplitting(null)}
        onSplit={saveSplit}
      />
    </Card>
  );
}

/* ============================== BANK ACCOUNT REGISTER (Checking / Savings / HYSA) ============================== */

function defaultPersonForAccount(accountId) {
  if (accountId === CHK_ACCOUNT_ID) return "Cynthia";
  if (accountId === MIKE_ACCOUNT_ID) return "Michael";
  return "Joint";
}

function BankAccountRegister({ data, actions, account }) {
  const blankForm = { id: null, date: todayISO(), desc: "", amount: "", category: "Other", direction: "withdrawal", tripId: "", tags: "", receipt: null };
  const [form, setForm] = useState(blankForm);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("All");
  const [dirFilter, setDirFilter] = useState("All");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");
  const [unclearedFirst, setUnclearedFirst] = useState(false);
  const [dateSort, setDateSort] = useState(() => localStorage.getItem("register_date_sort_" + account.id) || "desc");
  const [descriptionSort, setDescriptionSort] = useState(null);
  const [notes, setNotes] = useState((data.registerNotes && data.registerNotes[account.id]) || "");
  const [viewingReceipt, setViewingReceipt] = useState(null);
  const [splitting, setSplitting] = useState(null);
  const editFormRef = useRef(null);

  const opening = account.openingBalance || 0;
  const allTx = useMemo(() => data.transactions.filter(t => t.accountId === account.id), [data.transactions, account.id]);

  const applyBalance = (nextList) => {
    const bal = Math.round((opening + nextList.reduce((s, t) => s + t.amount, 0)) * 100) / 100;
    actions.syncAccountBalance({ ...account, balance: bal });
  };

  const balanceById = useMemo(() => {
    const chron = [...allTx].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let running = opening;
    const map = {};
    chron.forEach(t => { running += t.amount; map[t.id] = Math.round(running * 100) / 100; });
    return map;
  }, [allTx, opening]);

  const clearedDeposits = allTx.filter(t => t.cleared !== false && t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const clearedWithdrawals = allTx.filter(t => t.cleared !== false && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
  const availableBalance = Math.round((opening + allTx.filter(t => t.cleared !== false).reduce((s, t) => s + t.amount, 0)) * 100) / 100;
  const totalBalance = Math.round((opening + allTx.reduce((s, t) => s + t.amount, 0)) * 100) / 100;
  const unclearedDeposits = allTx.filter(t => t.cleared === false && t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const unclearedWithdrawals = allTx.filter(t => t.cleared === false && t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);

  const filtered = useMemo(() => {
    return allTx.filter(t => {
      if (search && ![t.merchant, t.notes, ...(t.tags || [])].join(" ").toLowerCase().includes(search.toLowerCase())) return false;
      if (catFilter !== "All" && !transactionHasCategory(t, catFilter)) return false;
      if (dirFilter !== "All" && (t.amount > 0 ? "deposit" : "withdrawal") !== dirFilter) return false;
      if (fromDate && t.date < fromDate) return false;
      if (toDate && t.date > toDate) return false;
      return true;
    });
  }, [allTx, search, catFilter, dirFilter, fromDate, toDate]);
  const filteredCategoryTotal = catFilter === "All"
    ? 0
    : filtered.reduce((sum, t) => sum + transactionCategoryAmount(t, catFilter), 0);
  const filteredTransactionTotal = catFilter === "All"
    ? filtered.reduce((sum, t) => sum + Math.abs(t.amount), 0)
    : filteredCategoryTotal;
  const hasActiveTransactionFilter = !!(search || catFilter !== "All" || dirFilter !== "All" || fromDate || toDate);

  const sorted = useMemo(() => {
    const byDateDesc = [...filtered].sort((a, b) => {
      if (descriptionSort) {
        const comparison = String(a.merchant || "").localeCompare(String(b.merchant || ""), undefined, { sensitivity: "base" });
        return descriptionSort === "asc" ? comparison : -comparison;
      }
      const comparison = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return dateSort === "asc" ? comparison : -comparison;
    });
    if (!unclearedFirst) return byDateDesc;
    return [...byDateDesc.filter(t => t.cleared === false), ...byDateDesc.filter(t => t.cleared !== false)];
  }, [filtered, unclearedFirst, descriptionSort, dateSort]);

  const resetForm = () => setForm(blankForm);

  const startDraftSplit = () => {
    const amt = parseFloat(form.amount);
    if (!form.desc.trim() || isNaN(amt) || amt <= 0 || !form.date) return;
    const amount = form.direction === "deposit" ? Math.abs(amt) : -Math.abs(amt);
    const existing = form.id ? allTx.find(t => t.id === form.id) : null;
    setSplitting({
      ...(existing || {}),
      id: existing?.id || uid(), date: form.date, merchant: form.desc.trim(), amount,
      category: form.category, accountId: account.id, tripId: form.tripId || "", tags: form.tags.split(",").map(tag => tag.trim()).filter(Boolean),
      person: defaultPersonForAccount(account.id), receipt: form.receipt || null,
      cleared: existing ? existing.cleared : false, isDraftSplit: !existing,
    });
  };

  const saveSplit = (parts) => {
    if (splitting?.isDraftSplit) {
      actions.addSplitTransactions(splitting, parts);
      applyBalance([...allTx, splitting]);
      resetForm();
    } else {
      actions.splitTransaction(splitting, parts);
      applyBalance(allTx.map(t => t.id === splitting.id ? splitting : t));
      if (form.id === splitting.id) resetForm();
    }
    setSplitting(null);
  };

  const startEdit = (t) => {
    setForm({
      id: t.id, date: t.date, desc: t.merchant, amount: String(Math.abs(t.amount)),
      category: t.category, direction: t.amount > 0 ? "deposit" : "withdrawal", tripId: t.tripId || "", tags: (t.tags || []).join(", "), receipt: t.receipt || null,
    });
    if (editFormRef.current && typeof editFormRef.current.scrollIntoView === "function") editFormRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const submit = () => {
    const amt = parseFloat(form.amount);
    if (!form.desc.trim() || isNaN(amt) || amt <= 0 || !form.date) return;
    const amount = form.direction === "deposit" ? Math.abs(amt) : -Math.abs(amt);
    const existing = form.id ? allTx.find(t => t.id === form.id) : null;
    const payload = {
      id: form.id || uid(), date: form.date, accountId: account.id, merchant: form.desc.trim(),
      category: form.category, amount, tripId: form.tripId || "", tags: form.tags.split(",").map(tag => tag.trim()).filter(Boolean), person: existing ? (existing.person || defaultPersonForAccount(account.id)) : defaultPersonForAccount(account.id),
      notes: existing ? (existing.notes || "") : "", cleared: existing ? existing.cleared : false, checkedOff: existing ? !!existing.checkedOff : false, receipt: form.receipt || null,
    };
    if (form.id) {
      actions.updateTransaction(payload);
      applyBalance(allTx.map(t => t.id === payload.id ? payload : t));
    } else {
      actions.addTransaction(payload);
      applyBalance([...allTx, payload]);
    }
    resetForm();
  };

  const toggleCleared = (t) => actions.updateTransaction({ ...t, cleared: t.cleared === false ? true : false });
  const toggleCheckedOff = (t) => actions.updateTransaction({ ...t, checkedOff: !t.checkedOff });

  const removeTx = (id) => {
    if (!window.confirm("Delete this transaction?")) return;
    actions.deleteTransaction(id);
    applyBalance(allTx.filter(t => t.id !== id));
    if (form.id === id) resetForm();
  };

  const clearAll = () => {
    if (!window.confirm(`Mark all ${allTx.length} transactions as cleared?`)) return;
    allTx.forEach(t => { if (t.cleared === false) actions.updateTransaction({ ...t, cleared: true }); });
  };

  const saveNotes = (val) => { setNotes(val); actions.setRegisterNotes(account.id, val); };

  const attachReceipt = async (file) => {
    if (!file) return;
    try { const dataUrl = await fileToCompressedDataUrl(file); setForm(f => ({ ...f, receipt: dataUrl })); } catch (e) {}
  };

  const clearFilters = () => { setSearch(""); setCatFilter("All"); setDirFilter("All"); setFromDate(""); setToDate(""); };
  const accountsById = { [account.id]: account };

  return (
    <Card className="overflow-hidden">
      <div className="bg-gradient-to-r from-teal-600 to-indigo-600 text-white p-5 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center text-xl shrink-0">{ACCOUNT_TYPE_META[account.type].icon}</div>
          <div>
            <div className="font-bold text-lg leading-tight">{account.name}</div>
            <div className="text-xs text-teal-100">{account.name} · {account.institution}</div>
          </div>
        </div>
        <div className="text-right">
          <div className="text-xs text-teal-100 uppercase tracking-wide">Balance</div>
          <div className="text-2xl font-bold">{fmtCurrency(totalBalance)}</div>
        </div>
      </div>

      <div className="p-4 md:p-5 space-y-5">
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 md:gap-3">
          <RegStat label="Cleared Deposits" value={fmtCurrency(clearedDeposits)} tone="emerald" />
          <RegStat label="Cleared Withdrawals" value={fmtCurrency(clearedWithdrawals)} tone="rose" />
          <RegStat label="Available Balance" value={fmtCurrency(availableBalance)} tone="indigo" />
          <RegStat label="Total Balance" value={fmtCurrency(totalBalance)} tone="slate" />
          <RegStat label="Uncleared Deposits" value={fmtCurrency(unclearedDeposits)} tone="sky" />
          <RegStat label="Uncleared Withdrawals" value={fmtCurrency(unclearedWithdrawals)} tone="amber" />
        </div>

        <div ref={editFormRef} className={"border rounded-xl p-3 md:p-4 transition-colors " + (form.id ? "border-indigo-300 bg-indigo-50/40 ring-2 ring-indigo-100" : "border-slate-200")}>
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">{form.id ? "✏️ Editing Transaction" : "Add Transaction"}</div>
          <div className="grid grid-cols-2 lg:grid-cols-12 gap-3 items-start">
            <div className="col-span-2 lg:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Date</label>
              <input type="date" className={inputClass} value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
            </div>
            <div className="col-span-2 lg:col-span-4">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Description</label>
              <input placeholder="Description" className={inputClass} value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} />
              <Button variant="secondary" disabled={!form.desc.trim() || !(parseFloat(form.amount) > 0) || !form.date} className="text-xs px-3 py-2 mt-2 w-full sm:w-auto" onClick={startDraftSplit}>Split Transaction</Button>
            </div>
            <div className="col-span-1 lg:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Amount</label>
              <input type="number" step="0.01" min="0" placeholder="$0.00" className={inputClass} value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} />
            </div>
            <div className="col-span-1 lg:col-span-4">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Category</label>
              <select className={inputClass} value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                {allCategoriesFull(data).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div className="hidden sm:flex items-center gap-2 mt-2">
                <AddCategoryButton data={data} actions={actions} showLabel={true} allowDelete={true} onAdded={category => setForm(f => ({ ...f, category }))} onDeleted={category => setForm(f => ({ ...f, category: f.category === category ? "Other" : f.category }))} />
                <button type="button" title="Attach receipt" className="w-9 h-9 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 shrink-0" onClick={() => document.getElementById("bank-receipt-input-" + account.id).click()}>📎</button>
                <input id={"bank-receipt-input-" + account.id} type="file" accept="image/*" capture="environment" className="hidden" onChange={e => attachReceipt(e.target.files[0])} />
                {form.receipt && <button type="button" className="text-xs text-indigo-600" onClick={() => setViewingReceipt(form.receipt)}>view</button>}
              </div>
            </div>
          </div>

          <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Trip</label><select className={inputClass} value={form.tripId || ""} onChange={e => setForm(f => ({ ...f, tripId: e.target.value }))}><option value="">Not part of a trip</option>{(data.trips || []).map(trip => <option key={trip.id} value={trip.id}>{trip.name}</option>)}</select></div>
            <div><label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Tags</label><input className={inputClass} placeholder="Vacation, Tax, Reimbursable" value={form.tags} onChange={e => setForm(f => ({ ...f, tags: e.target.value }))} /></div>
          </div>
          <div className="sm:hidden mt-3 flex flex-wrap items-center gap-2">
            <label className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium cursor-pointer">📷 Take Receipt Photo<input type="file" accept="image/*" capture="environment" className="hidden" onChange={e => attachReceipt(e.target.files[0])} /></label>
            <label className="px-3 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-medium cursor-pointer">🖼 Choose Photo<input type="file" accept="image/*" className="hidden" onChange={e => attachReceipt(e.target.files[0])} /></label>
            {form.receipt && <button type="button" className="text-xs text-indigo-600 font-medium" onClick={() => setViewingReceipt(form.receipt)}>View receipt</button>}
          </div>

          <div className="flex flex-wrap items-center gap-3 mt-3">
            <div className="flex w-full sm:w-auto rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              {["withdrawal", "deposit"].map(d => (
                <button
                  key={d} type="button"
                  onClick={() => setForm(f => ({ ...f, direction: d }))}
                  className={"flex-1 sm:flex-none px-3 py-2 " + (form.direction === d
                    ? (d === "withdrawal" ? "bg-rose-600 text-white" : "bg-emerald-600 text-white")
                    : "bg-white text-slate-500 hover:bg-slate-50")}
                >{d === "withdrawal" ? "WITHDRAWAL" : "DEPOSIT"}</button>
              ))}
            </div>
            <div className="flex w-full sm:w-auto flex-wrap items-center justify-end gap-2 sm:ml-auto">
              {form.id && <button type="button" className="text-xs text-slate-500 font-medium" onClick={resetForm}>Cancel</button>}
              <div className="sm:hidden">
                <AddCategoryButton data={data} actions={actions} showLabel={true} allowDelete={true} onAdded={category => setForm(f => ({ ...f, category }))} onDeleted={category => setForm(f => ({ ...f, category: f.category === category ? "Other" : f.category }))} />
              </div>
              <Button className="text-xs px-4 py-2" onClick={submit}>{form.id ? "Update" : "+ Add"}</Button>
            </div>
          </div>
        </div>

        <div className="rounded-xl border border-slate-100 bg-slate-50/60 p-3">
          <div className="grid grid-cols-2 md:grid-cols-12 gap-2">
            <div className="col-span-2 md:col-span-3">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Search description</label>
              <input placeholder="Merchant or description…" className={inputClass} value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="col-span-1 md:col-span-3">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Category</label>
              <select className={inputClass} value={catFilter} onChange={e => setCatFilter(e.target.value)}>
                <option value="All">All Categories</option>
                {allCategoriesFull(data).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="col-span-1 md:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">Type</label>
              <select className={inputClass} value={dirFilter} onChange={e => setDirFilter(e.target.value)}>
                <option value="All">All Types</option>
                <option value="deposit">Deposit</option>
                <option value="withdrawal">Withdrawal</option>
              </select>
            </div>
            <div className="col-span-1 md:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">From</label>
              <input type="date" className={inputClass} value={fromDate} onChange={e => setFromDate(e.target.value)} />
            </div>
            <div className="col-span-1 md:col-span-2">
              <label className="block text-[10px] uppercase tracking-wide text-slate-400 mb-1">To</label>
              <input type="date" className={inputClass} value={toDate} onChange={e => setToDate(e.target.value)} />
            </div>
          </div>
          {hasActiveTransactionFilter && (
            <div className="mt-3 rounded-xl border-2 border-indigo-300 bg-indigo-50 px-4 py-3 flex items-center justify-between gap-3">
              <div>
                <div className="text-xs font-semibold uppercase tracking-wide text-indigo-500">Filtered transactions total</div>
                <div className="text-sm font-medium text-indigo-800 mt-0.5">
                  {search ? `Description: ${search}` : catFilter !== "All" ? catFilter : dirFilter !== "All" ? dirFilter : "Selected dates"} · {filtered.length} transaction{filtered.length === 1 ? "" : "s"}
                </div>
              </div>
              <div className="text-xl md:text-2xl font-bold text-indigo-800 shrink-0">{fmtCurrency(filteredTransactionTotal)}</div>
            </div>
          )}
          <div className="flex items-center justify-end gap-3 mt-3 flex-wrap">
            <div className="flex items-center gap-2 ml-auto">
              {(search || catFilter !== "All" || dirFilter !== "All" || fromDate || toDate) && (
                <button className="text-xs text-indigo-600 font-medium px-3 py-2" onClick={clearFilters}>Clear filters</button>
              )}
              <Button variant="secondary" className="text-xs px-3 py-2" onClick={() => exportTransactionsCSV(sorted, accountsById)}>⬇ Export CSV</Button>
            </div>
          </div>
        </div>

        <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs font-semibold text-amber-800">📝 NOTES</span>
            <span className="text-xs text-amber-600">auto-saved</span>
          </div>
          <textarea
            className="w-full bg-transparent text-sm text-amber-900 placeholder-amber-400 focus:outline-none resize-none"
            rows={2} placeholder="Add a note for this register..."
            value={notes} onChange={e => saveNotes(e.target.value)}
          />
        </div>

        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="text-sm font-semibold text-slate-700">Transactions <span className="text-slate-400 font-normal">({sorted.length})</span></div>
          <div className="flex gap-2 flex-wrap">
            <button
              onClick={() => setUnclearedFirst(u => !u)}
              className={"text-xs font-medium px-3 py-1.5 rounded-lg border " + (unclearedFirst ? "bg-amber-100 border-amber-300 text-amber-800" : "border-slate-200 text-slate-500 hover:bg-slate-50")}
            >⚠ Uncleared First</button>
            <button className="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50" onClick={clearAll}>Clear All</button>
          </div>
        </div>

        <div className="overflow-x-auto border border-slate-100 rounded-xl">
          <table className="w-full text-sm min-w-[720px]">
            <thead className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
              <tr>
                <th className="text-left px-3 py-3 font-medium w-16"></th>
                <th className="text-left px-3 py-3 font-medium">
                  <button type="button" className="hover:text-indigo-600" title={dateSort === "asc" ? "Oldest transactions first" : "Newest transactions first"} onClick={() => { const next = dateSort === "desc" ? "asc" : "desc"; setDateSort(next); setDescriptionSort(null); localStorage.setItem("register_date_sort_" + account.id, next); }}>
                    Date {descriptionSort ? "↕" : dateSort === "asc" ? "↑" : "↓"}
                  </button>
                </th>
                <th className="text-left px-3 py-3 font-medium">
                  <button type="button" className="hover:text-indigo-600" onClick={() => setDescriptionSort(current => current === "asc" ? "desc" : "asc")}>
                    Description {descriptionSort === "asc" ? "↑" : descriptionSort === "desc" ? "↓" : "↕"}
                  </button>
                </th>
                <th className="text-left px-3 py-3 font-medium">Category</th>
                <th className="text-left px-3 py-3 font-medium">Type</th>
                <th className="text-right px-3 py-3 font-medium">Balance</th>
                <th className="px-3 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(t => {
                const isCleared = t.cleared !== false;
                const isDeposit = t.amount > 0;
                return (
                  <tr key={t.id} className={"border-t border-slate-100 hover:bg-slate-50 group " + (isCleared ? "" : "bg-amber-50/40")}>
                    <td className="px-3 py-3">
                      <div className="flex items-center gap-2">
                        <input type="checkbox" checked={!!t.checkedOff} onChange={() => toggleCheckedOff(t)} title={t.checkedOff ? "Checked off" : "Check off without moving"} aria-label="Check off transaction without moving it" className="w-4 h-4 accent-emerald-600" />
                        <input type="checkbox" checked={isCleared} onChange={() => toggleCleared(t)} title={isCleared ? "Cleared" : "Uncleared"} aria-label="Cleared transaction" className="w-4 h-4 accent-indigo-600" />
                      </div>
                    </td>
                    <td className="px-3 py-3 text-slate-500 whitespace-nowrap">{fmtDateShort(t.date)}</td>
                    <td className="px-3 py-3 font-medium text-slate-700">
                      <div className="flex items-center gap-2">
                        <MerchantAvatar merchant={t.merchant} category={t.category} size={24} />
                        <div className="min-w-0 flex-1">
                          <div>{t.merchant}</div>
                          {(t.tags || []).length > 0 && <div className="text-[10px] text-indigo-500 font-medium">{t.tags.map(tag => "#" + tag).join(" ")}</div>}
                          <div className={"text-xs font-semibold " + (isDeposit ? "text-emerald-600" : "text-rose-600")}>
                            {isDeposit ? "+" : "-"}{fmtCurrency(Math.abs(t.amount))}
                          </div>
                        </div>
                        {t.receipt && (
                          <button type="button" title="View receipt" className="w-8 shrink-0 text-center text-slate-400 hover:text-indigo-600" onClick={() => setViewingReceipt(t.receipt)}>📎</button>
                        )}
                      </div>
                    </td>
                    <td className="px-3 py-3"><Pill tone="slate">{transactionCategoryLabel(t)}</Pill></td>
                    <td className="px-3 py-3"><Pill tone={isDeposit ? "green" : "red"}>{isDeposit ? "Deposit" : "Withdrawal"}</Pill></td>
                    <td className="px-3 py-3 text-right font-semibold text-slate-700 whitespace-nowrap">{fmtCurrency(balanceById[t.id] ?? 0)}</td>
                    <td className="px-3 py-3 text-right opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity whitespace-nowrap">
                      <button className="text-slate-400 hover:text-indigo-600 mr-2" title="Split transaction" onClick={() => setSplitting(t)}>Split</button>
                      <button className="text-slate-400 hover:text-indigo-600 mr-2" title="Edit" onClick={() => startEdit(t)}>✏️</button>
                      <button className="text-slate-400 hover:text-rose-500" title="Delete" onClick={() => removeTx(t.id)}>✕</button>
                    </td>
                  </tr>
                );
              })}
              {sorted.length === 0 && (
                <tr><td colSpan="7" className="text-center py-10 text-slate-400">No transactions match your filters.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={!!viewingReceipt} onClose={() => setViewingReceipt(null)} title="Receipt">
        {viewingReceipt && <img src={viewingReceipt} className="w-full rounded-lg" alt="Receipt" />}
      </Modal>
      <SplitTransactionModal
        transaction={splitting}
        data={data}
        onClose={() => setSplitting(null)}
        onSplit={saveSplit}
      />
    </Card>
  );
}

/* ============================== ACCOUNTS & CARDS TAB SWITCHER ============================== */

function AccountsAndCards({ data, actions }) {
  const [activeTab, setActiveTab] = useState("cc");
  const [tripName, setTripName] = useState("");

  const ccAccount = data.accounts.find(a => a.id === CINDY_CC_ACCOUNT_ID) || data.accounts.find(isIccuCreditAccount);
  const chkAccount = data.accounts.find(a => a.id === CHK_ACCOUNT_ID);
  const mikeAccount = data.accounts.find(a => a.id === MIKE_ACCOUNT_ID);
  const savingsAccount = data.accounts.find(a => a.id === SAVINGS_ACCOUNT_ID);
  const hysaAccount = data.accounts.find(a => a.id === HYSA_ACCOUNT_ID);
  const discoverAccount = data.accounts.find(a => a.id === DISCOVER_ACCOUNT_ID || a.name === DISCOVER_ACCOUNT_NAME);

  const knownTabs = [
    { key: "cc", label: "💳 Credit Card", account: ccAccount, kind: "credit" },
    { key: "chk", label: "🏦 Cindy's Checking", account: chkAccount, kind: "bank" },
    { key: "mike", label: "🏦 Mike's Checking", account: mikeAccount, kind: "bank" },
    { key: "savings", label: "🐷 Savings", account: savingsAccount, kind: "bank" },
    { key: "hysa", label: "💰 HYSA", account: hysaAccount, kind: "bank" },
    { key: "discover", label: "💳 Discovercard", account: discoverAccount, kind: "bank" },
  ].filter(t => t.account);
  const knownIds = new Set(knownTabs.map(t => t.account.id));
  const otherTabs = data.accounts
    .filter(account => !knownIds.has(account.id))
    .map(account => ({
      key: "account_" + account.id,
      label: (account.type === "credit" ? "💳 " : "🏦 ") + account.name,
      account,
      kind: "bank",
    }));
  const allowedIds = new Set([CINDY_CC_ACCOUNT_ID, ccAccount?.id, CHK_ACCOUNT_ID, MIKE_ACCOUNT_ID, SAVINGS_ACCOUNT_ID, HYSA_ACCOUNT_ID].filter(Boolean));
  const requestedLabels = {
    chk: "Cindy's Checking Account",
    hysa: "HYSA",
    cc: "ICCU Credit Card",
    mike: "Mike's Checking Account",
    savings: "Savings",
  };
  const requestedOrder = ["cc", "chk", "mike", "hysa", "savings"];
  const tabs = [...knownTabs, ...otherTabs]
    .filter(t => allowedIds.has(t.account.id))
    .map(t => ({ ...t, label: requestedLabels[t.key] || t.label }))
    .sort((a, b) => requestedOrder.indexOf(a.key) - requestedOrder.indexOf(b.key));
  const cindyCheckingBalance = chkAccount ? Number(chkAccount.balance) || 0 : 0;
  const iccuTransactions = data.transactions.filter(t => isIccuCreditTransaction(t, data.accounts));
  const iccuRegisterBalance = iccuTransactions.reduce((sum, t) => sum + Number(t.amount || 0), 0);
  const iccuStoredBalance = Number(ccAccount?.balance || 0);
  const iccuTotalOwed = ccAccount
    ? (iccuTransactions.length ? -iccuRegisterBalance : -iccuStoredBalance)
    : 0;
  const afterIccuPayoff = cindyCheckingBalance - iccuTotalOwed;

  if (tabs.length === 0) return null;
  const active = tabs.find(t => t.key === activeTab) || tabs[0];

  return (
    <div className="space-y-3">
      <div>
        <h2 className="text-lg md:text-xl font-bold text-slate-800">🗂️ Accounts &amp; Cards</h2>
        <p className="text-sm text-slate-500 mt-0.5">All household registers together — credit card, both checking accounts, savings, and HYSA.</p>
      </div>
      <Card className={"p-4 md:p-5 " + (afterIccuPayoff >= 0 ? "border-emerald-300" : "border-rose-300")}>
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div className="text-xs font-semibold uppercase tracking-wide text-slate-400">Cindy’s Checking after ICCU payoff</div>
            <div className={"text-2xl md:text-3xl font-bold mt-1 " + (afterIccuPayoff >= 0 ? "text-emerald-700" : "text-rose-600")}>
              {fmtCurrency(afterIccuPayoff)}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3 text-sm">
            <div className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
              <div className="text-xs text-slate-400">Checking balance</div>
              <div className="font-semibold text-slate-700">{fmtCurrency(cindyCheckingBalance)}</div>
            </div>
            <div className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
              <div className="text-xs text-slate-400">ICCU card balance</div>
              <div className="font-semibold text-rose-600">{fmtCurrency(iccuTotalOwed)}</div>
            </div>
          </div>
        </div>
      </Card>
      <Card className="p-4 md:p-5 border-sky-200 bg-sky-50/40">
        <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-4">
          <div>
            <div className="text-xs font-semibold uppercase tracking-wide text-sky-600">✈️ Trip spending</div>
            <h3 className="text-lg font-bold text-slate-800 mt-1">Trips across all accounts</h3>
            <p className="text-xs text-slate-500 mt-1">Assign transactions to a trip and spending is combined across all five accounts.</p>
          </div>
          <div className="flex gap-2 w-full sm:w-auto">
            <input className={inputClass + " min-w-0 sm:w-[220px]"} placeholder="Trip name" value={tripName} onChange={e => setTripName(e.target.value)} />
            <Button onClick={() => { const name = tripName.trim(); if (!name) return; actions.addTrip({ id: uid(), name, createdAt: todayISO() }); setTripName(""); }}>Add Trip</Button>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {(data.trips || []).map(trip => {
            const purchases = data.transactions.filter(t => t.tripId === trip.id && Number(t.amount) < 0);
            const total = purchases.reduce((sum, t) => sum + Math.abs(Number(t.amount) || 0), 0);
            const accountCount = new Set(purchases.map(t => t.accountId)).size;
            const categoryTotals = purchases.reduce((totals, transaction) => {
              expenseCategoryAllocations(transaction).forEach(part => { totals[part.category] = (totals[part.category] || 0) + part.amount; });
              return totals;
            }, {});
            return <div key={trip.id} className="rounded-xl border border-sky-200 bg-white p-4">
              <div className="flex justify-between gap-2"><strong className="text-slate-800">{trip.name}</strong><button className="text-xs text-rose-500" onClick={() => { if (window.confirm(`Delete the ${trip.name} trip? Transactions will remain but will no longer be assigned to it.`)) actions.deleteTrip(trip.id); }}>Delete</button></div>
              <div className="text-2xl font-bold text-sky-700 mt-2">{fmtCurrency(total)}</div>
              <div className="text-xs text-slate-400 mt-1">{purchases.length} purchase{purchases.length === 1 ? "" : "s"} · {accountCount} account{accountCount === 1 ? "" : "s"}</div>
              {Object.keys(categoryTotals).length > 0 && <div className="mt-3 pt-3 border-t border-sky-100 space-y-1">
                {Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]).map(([category, amount]) => <div key={category} className="flex items-center justify-between gap-3 text-xs"><span className="text-slate-600">{categoryIconOf(category)} {category}</span><strong className="text-slate-700">{fmtCurrency(amount)}</strong></div>)}
              </div>}
            </div>;
          })}
          {(data.trips || []).length === 0 && <div className="text-sm text-slate-400 py-3">Add a trip to begin tracking its spending.</div>}
        </div>
      </Card>
      <div className="grid grid-cols-2 sm:flex sm:flex-wrap gap-2">
        {tabs.map(t => (
          <button
            key={t.key} onClick={() => setActiveTab(t.key)}
            className={"w-full sm:w-auto text-xs font-semibold px-3 py-2 sm:py-1.5 rounded-xl sm:rounded-full border transition-colors " + (t.key === "cc" ? "col-span-2 sm:col-span-1 " : "") + (active.key === t.key ? "bg-indigo-600 text-white border-indigo-600" : "border-slate-200 text-slate-500 hover:bg-slate-50")}
          >{t.label}</button>
        ))}
      </div>
      {active.kind === "credit"
        ? <CindyCreditCardRegister data={data} actions={actions} cindyAccount={active.account} />
